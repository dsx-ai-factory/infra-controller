## =============================================================================
## Prereqs secrets: Vault token and AppRole (vault.enabled only), SSH host key,
## site credentials
## ESO handles: nico-roots (CA) via nico-roots-eso ClusterExternalSecret
## ESO handles: DB credentials via nico-db-eso ClusterExternalSecret
## PKI certs come from the vault-nico-issuer ClusterIssuer while vault.enabled,
## and from the site-issuer ClusterIssuer on a site installed without Vault.
## =============================================================================
{{- $sshPrivKey := include "prereqs.sshPrivateKey" . }}
{{- if and .Values.vault.enabled .Values.vault.approleSecret.create }}
---
## nico-vault-approle-tokens: placeholder — vault-config-job (post-install hook)
## patches this secret with real role-id and secret-id fetched from Vault after
## AppRole auth is configured. The placeholder values here are overwritten before
## any nico-api or nico-bmc-proxy pod reads them. Every upgrade re-applies this
## stringData, so a sync that leaves the Job out (setup.sh --skip-vault while a
## consumer still references Vault) supplies the live values through
## vault.approleSecret.roleId and secretId instead of resetting them.
apiVersion: v1
kind: Secret
metadata:
  name: nico-vault-approle-tokens
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  VAULT_ROLE_ID: {{ .Values.vault.approleSecret.roleId | quote }}
  VAULT_SECRET_ID: {{ .Values.vault.approleSecret.secretId | quote }}
{{- end }}
{{- if and .Values.vault.enabled .Values.vault.tokenSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nico-vault-token
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  token: {{ .Values.vault.token | quote }}
{{- end }}
{{- if .Values.siteCredentials.enabled }}
---
## Site-wide BMC root and site-default UEFI credentials in nico-api's
## credential-file format; mounted through
## nico-api.credentials.file.existingSecret in the Core values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.siteCredentials.secretName | quote }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  credentials.yaml: {{ include "prereqs.siteCredentialsFile" . | quote }}
{{- end }}
{{- if .Values.azureSSOClientSecretSecret.create }}
---
## azure-sso-nico-web-client-secret: Azure SSO client secret for nico-web.
## Set azureSSOClientSecret in values or patch this secret before starting nico-web
## if Azure SSO is enabled at your site. Leave empty if not using Azure SSO.
apiVersion: v1
kind: Secret
metadata:
  name: azure-sso-nico-web-client-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  client_secret: {{ .Values.azureSSOClientSecret | default "" | quote }}
{{- end }}
{{- if .Values.sshHostKey.create }}
---
## SSH host key for nico-ssh-console-rs
## Supplied explicitly or generated inline by Helm — no Job, no network dependency.
## A supplied key overrides lookup/generation; the generated fallback is PKCS8 ed25519.
## Without an override, upgrades reuse the existing private key.
apiVersion: v1
kind: Secret
metadata:
  name: ssh-host-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  ssh_host_ed25519_key: |
{{ $sshPrivKey | indent 4 }}
  ssh_host_ed25519_key_pub: {{ .Values.sshHostKey.publicKey | quote }}
{{- end }}
