## =============================================================================
## ConfigMaps referenced by the nico-api Deployment env:
##   vault-cluster-info               — Vault connection info; vault.enabled only
##   nico-system-nico-database-config — database host, port, and name; always
##                                      rendered, with or without Vault
## =============================================================================
{{- if and .Values.postgresql.enabled (or (ne (toString .Values.postgresql.port) "5432") (ne .Values.postgresql.database "nico_system_nico")) }}
{{- fail "Non-default postgresql.port or postgresql.database requires postgresql.enabled=false" }}
{{- end }}
{{- if .Values.vault.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-cluster-info
  namespace: {{ .Values.namespace }}
data:
  VAULT_SERVICE: {{ .Values.vault.address | quote }}
  {{- with .Values.vault.namespace }}
  VAULT_NAMESPACE: {{ . | quote }}
  {{- end }}
  NICO_VAULT_MOUNT: {{ .Values.vault.kvMount | quote }}
  NICO_VAULT_PKI_MOUNT: {{ .Values.vault.pkiMount | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nico-system-nico-database-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.postgresql.host | quote }}
  DB_PORT: {{ .Values.postgresql.port | quote }}
  DB_NAME: {{ .Values.postgresql.database | quote }}
