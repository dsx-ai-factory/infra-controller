## =============================================================================
## nico-prereqs — default values
## See NICO_PREREQS.md for full documentation.
## =============================================================================

## Site identifier - injected into postgres pods as TMP_SITE env var via
## the nico-pg-cluster-env ConfigMap.
## Override per site: --set siteName=<sitename>
## REQUIRED: set your short site identifier (preflight fails while empty/TMP_SITE).
siteName: ""

## Target namespace — must match the namespace used for helm install nico
namespace: nico-system

## Operator namespaces — must match the namespaces used in helmfile.yaml
certManagerNamespace: cert-manager
vaultNamespace: vault
vaultServiceIP: ""    # injected by setup.sh — vault ClusterIP for IP SAN in TLS cert
esoNamespace: external-secrets
postgresNamespace: postgres

## ---------------------------------------------------------------------------
## Kubernetes API server URL for ESO ClusterSecretStore (Kubernetes provider).
## Default empty = ESO uses kubernetes.default (DNS). Set to ClusterIP on clusters
## where NodeLocal DNSCache is missing (e.g. bare-metal without DNS DaemonSet).
## Detected automatically by setup.sh via kubectl get svc kubernetes -n default.
clusterApiServer: ""

## ---------------------------------------------------------------------------
## Vault connection (used by vault-pki-config Job and vault-nico-issuer)
## Vault address uses vaultNamespace above: vault.<vaultNamespace>.svc.cluster.local
## ---------------------------------------------------------------------------
vault:
  address: "https://vault.vault.svc.cluster.local:8200"
  ## Optional Vault Enterprise/HCP Vault Dedicated namespace. This is not a Kubernetes namespace.
  namespace: ""
  ## setup.sh/helmfile supplies this dynamically from vaultroottoken.
  ## Direct Helm users should set this when tokenSecret.create=true, or
  ## pre-create nico-system/nico-vault-token and set tokenSecret.create=false.
  token: ""
  tokenSecret:
    create: true
  approleSecret:
    create: true
  configJob:
    enabled: true
    vaultImage: "hashicorp/vault:1.17"
    kubectlImage: "bitnami/kubectl:latest"
  tls:
    create: true
  pkiMount: "nicoca"
  pkiRole: "nico-cluster"
  nicoCliClientRole:
    enabled: true                # create the admin-cli PKI client role at install
    name: "nico-cli-client"
    ## SubjectOU stamped on issued CLI client certs. nico-api maps it to the
    ## ExternalUser "group" (authz identifier "external-role/<ou>"), but the
    ## admin-CLI RBAC rules accept any ExternalUser regardless of group — what
    ## actually gates authorization is the ISSUER: the site CA's CN must be
    ## listed in nico-api auth.additionalIssuerCns (e.g. ["site-root"]).
    ## Empty = use `name`. Do NOT set "Invalid": it was a placeholder copied
    ## from a never-compared constant in the authz code (see issue #3662).
    ou: ""                       # empty = `name` (nico-cli-client)
    organization: ""
  ## Kubernetes auth role for nico-api to read and manage Vault KV
  ## credentials used by SiteExplorer and related credential flows.
  ## Required by the carbide-api binary — without this role, SiteExplorer
  ## cannot authenticate to Vault and BMC credential lookups fail every cycle.
  nicoApiK8sAuth:
    enabled: true
    serviceAccountName: "nico-api"
    tokenTTL: "1h"
  kvMount: "secrets"
  ## Seed KV-v2 entries written after the KV mount is enabled. Mirrors the
  ## publicly-documented DPU factory defaults that the Terraform path
  ## (forged/terraform/v2/modules/vault) writes via vault_kv_secret_v2.
  ## Set kvSeeds: [] to disable seeding.
  kvSeeds:
    ## Legacy catch-all DPU BMC factory default (DpuModel::Unknown → path segment "root").
    ## Used when no model-specific entry is configured or the DPU model cannot be identified.
    - path: "machines/all_dpus/factory_default/bmc-metadata-items/root"
      data:
        UsernamePassword:
          username: "root"
          password: "0penBmc"
    ## Per-model DPU BMC factory-default entries.
    ##
    ## site-explorer checks a model-specific entry, then the catch-all above,
    ## then its per-model code fallback. A standard BF4 site therefore needs
    ## the `bf4` entry below; uncomment this block to seed it with the shown
    ## factory credentials.
    ## Change the values only when a site's BF4 DPUs ship with non-standard
    ## factory credentials.
    # - path: "machines/all_dpus/factory_default/bmc-metadata-items/bf4"
    #   data:
    #     UsernamePassword:
    #       username: "admin"
    #       password: "0penBmc"
    - path: "machines/all_dpus/factory_default/uefi-metadata-items/auth"
      data:
        UsernamePassword:
          username: ""
          password: "bluefield"
    ## site_default UEFI creds — seed these so site-explorer finds them. Without these,
    ## `credential add-uefi` only writes Vault metadata (not the value) and preingestion
    ## logs "Missing credential machines/all_{dpus,hosts}/site_default/uefi-metadata-items/auth".
    ## SITE-SPECIFIC SECRET: blank the passwords before committing/MR; operator populates per site.
    - path: "machines/all_dpus/site_default/uefi-metadata-items/auth"
      data:
        UsernamePassword:
          username: ""
          password: ""          # SITE SECRET: your DPU UEFI password — populate per site
    - path: "machines/all_hosts/site_default/uefi-metadata-items/auth"
      data:
        UsernamePassword:
          username: ""
          password: ""          # SITE SECRET: your host UEFI password — populate per site

certManager:
  siteRoot:
    create: true
  vaultAuthServiceAccount:
    create: true
  vaultIssuer:
    create: true

externalSecrets:
  enabled: true

sshHostKey:
  create: true

azureSSOClientSecret: ""
azureSSOClientSecretSecret:
  create: true

## ---------------------------------------------------------------------------
## Image pull secrets — NGC API keys
## Set via --set or export before running setup.sh
## ---------------------------------------------------------------------------
imagePullSecrets:
  ngcCarbidePull: ""     # nvcr.io/0837451325059433/carbide-dev
  ngcNvidianKey: ""      # nvcr.io/nvidian/nvforge (optional, for unbound)

## ---------------------------------------------------------------------------
## rest — NICo REST API database prerequisites.
##
## When enabled, creates a dedicated postgres user (nico-rest.nico) and database
## (nico_rest) on nico-pg-cluster, and an ESO ClusterExternalSecret that syncs
## the Zalando-generated credentials into the rest namespace as the
## `nico-rest-pg-creds` Secret. setup.sh reads this secret and injects the
## credentials into nico-rest-common.secrets.dbCreds at helm install time.
##
## Enable when deploying nico-rest against the shared nico-pg-cluster.
## Disable only when nico-rest uses its own external Postgres instance.
## ---------------------------------------------------------------------------
rest:
  enabled: true
  ## Namespace the nico-rest helm release deploys into.
  ## ESO targets this namespace when syncing the nico-rest-pg-creds secret.
  namespace: nico-rest

## ---------------------------------------------------------------------------
## flow — NICo Flow task, policy, and automation service.
##
## This toggle controls only the helm-prereqs side of Flow:
##   - the Flow database on nico-pg-cluster
##   - the ClusterExternalSecret that syncs its credentials into the flow
##     namespace (eso-external-secrets.yaml)
##
## The flow Deployment itself ships as a separate helm release from
## helm/charts/nico-flow, installed by setup.sh phase 7h. That phase is NOT
## driven by this value — it is unconditionally invoked unless setup.sh is
## passed --skip-flow. If you set flow.enabled=false here you should also
## pass --skip-flow on the setup.sh command line, otherwise phase 7h will
## try to install a chart whose database credentials are missing and fail.
## ---------------------------------------------------------------------------
## ---------------------------------------------------------------------------
## rms — NVIDIA Rack Manager Service (rack-manager chart) prerequisites.
##
## This toggle controls only the helm-prereqs side of RMS:
##   - the rms database and rms.nico user on nico-pg-cluster (postgresql.yaml)
##   - the rms-db-eso ClusterExternalSecret that syncs the credentials into
##     the rack-manager namespace (eso-external-secrets.yaml)
##
## The rack-manager chart itself is installed by setup.sh phase 5c, by
## DEFAULT (opt out with --skip-rms). Deliberately NOT driven by that flag:
## --skip-rms skips only the chart install and never deprovisions these
## prerequisites — removing them would strand a running rack-manager release
## (same contract as --skip-flow). To skip the prerequisites too, set
## enabled: false here, paired with --skip-rms.
## ---------------------------------------------------------------------------
rms:
  enabled: true

flow:
  enabled: true
  ## Namespace flow runs in — must match the helm install -n flag for the
  ## flow release. ESO targets this namespace.
  namespace: flow

## ---------------------------------------------------------------------------
## temporal / keycloak — opt-in Temporal/Keycloak database consolidation onto
## nico-pg-cluster (the shared, HA Zalando-managed cluster), instead of each
## staying on the legacy standalone postgres.postgres StatefulSet. Disabled
## by default; both targets are supported side by side, and existing sites
## need no changes.
##
## Full story (what gets provisioned, migration steps, namespace caveats):
## see "Consolidating Temporal/Keycloak onto nico-pg-cluster" in README.md.
## ---------------------------------------------------------------------------
temporal:
  useHaPostgres: false

keycloak:
  useHaPostgres: false
  ## Namespace Keycloak deploys into — must stay in sync with
  ## values/nico-rest.yaml's nico-rest-api.config.keycloak.baseURL host.
  ## See README.md.
  namespace: nico-rest

## ---------------------------------------------------------------------------
## PostgreSQL — Zalando postgres-operator HA cluster (3-node Patroni)
## Credentials are generated by the operator and distributed via ESO.
## ---------------------------------------------------------------------------
postgresql:
  enabled: true
  instances: 3
  ## Patroni synchronous replication. Set false for single-instance clusters
  ## (for development or simulation) — strict sync mode with no replicas
  ## blocks all writes.
  synchronousMode: true
  volumeSize: "10Gi"
  storageClass: "local-path-persistent"
  ## DB_HOST in nico-system-nico-database-config ConfigMap.
  ## Points at the operator-managed Service in the postgres namespace.
  host: "nico-pg-cluster.postgres.svc.cluster.local"
  ## Resource limits for each postgres instance.
  ##
  ## SIZE THIS TO THE FLEET. Postgres running out of memory does not degrade
  ## gracefully: the kernel OOM-kills a backend, the postmaster performs a full
  ## crash-recovery, and every open connection is dropped with in-flight
  ## transactions rolled back. Downstream that looks like unrelated defects --
  ## stalled machine readiness, controller panics, deadlocks -- so the real
  ## cause is easy to miss.
  ##
  ## Measured on a 4,500-host (13,500 machine) ingestion:
  ##   4Gi limit  -> 99.96% memory, 531 OOM kills, 112 crash-recoveries,
  ##                 ingestion unable to complete
  ##   24Gi limit -> ~8.7GiB peak, zero OOM kills, full fleet ingested and
  ##                 every machine reaching ready
  ##
  ## Rough guidance (limits.memory), assuming ~3 machines per host:
  ##   up to   500 hosts   4Gi
  ##   up to 1,500 hosts   8Gi
  ##   up to 5,000 hosts  16Gi   <- default below
  ##   beyond              32Gi, and measure
  ##
  ## To check a running cluster:
  ##   kubectl exec -n postgres <pod> -c postgres -- sh -c \
  ##     'cat /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; \
  ##      grep oom_kill /sys/fs/cgroup/memory.events'
  ## A non-zero and rising oom_kill count means everything downstream is a
  ## symptom of this.
  ##
  ## NOTE: teardown deletes the postgres namespace, so a resize applied before
  ## a reinstall is silently reverted. Change it here, not on the live cluster.
  resources:
    limits:
      cpu: "8"
      memory: "16Gi"
    requests:
      cpu: "2"
      memory: "4Gi"
