# =============================================================================
# machine-a-tron-scale-4500.yaml — 4,500 hosts × 2 DPUs across 3 MAT pods
# (Controller Mode). Derived from machine-a-tron-scale.yaml.
#
# Example: a /18 ServiceCIDR gives 16,384 IPs. 4,500 hosts × 3 BMCs =
# 13,500 per-BMC ClusterIP Services. Cluster services live in the low range,
# so each pod gets its own carved segment from the upper space (NICo has a
# one-IPv4-prefix-per-segment constraint → one segment per pod):
#
#   mat-0: 10.233.16.0/20 (4,094 IPs) → 1,350 hosts (4,050 BMCs)
#   mat-1: 10.233.32.0/19 (8,190 IPs) → 2,700 hosts (8,100 BMCs)
#   mat-2: 10.233.8.0/21  (2,046 IPs) →   450 hosts (1,350 BMCs)
#                                        4,500 hosts / 13,500 BMCs total
#
# NICo siteConfig needs (added for the E7-v6 run):
#   allow_insecure_discovery = true
#   [networks.mat-bmc-0] type=underlay prefix=10.233.16.0/20 gateway=10.233.16.1
#   [networks.mat-bmc-1] type=underlay prefix=10.233.32.0/19 gateway=10.233.32.1
#   [networks.mat-bmc-2] type=underlay prefix=10.233.8.0/21 gateway=10.233.8.1
# =============================================================================

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

global:
  imagePullSecrets:
    - name: machine-a-tron-pull

certificate:
  uris:
    - "spiffe://nico.local/nico-system/sa/machine-a-tron"

machineATron:
  nicoApiUrl: "https://nico-api.nico-system.svc.cluster.local:1079"
  configureBmcProxyHost: ""
  registerExpectedMachines: true

macAddressPool:
  enabled: true
  basePrefix: "02:00"

hwMacAddressRanges:
  enabled: true
  basePrefix: "02:01"

mat-k8s-controller:
  enabled: true
  # The subchart defaults to a bare local image name with no registry; pin the
  # published build or the controller ImagePullBackOffs and no BMC Services
  # are ever created (so exploration finds nothing).
  image:
    # Set to your registry's mat-k8s-controller image. The subchart default is a
    # bare local name with no registry, which ImagePullBackOffs on any real
    # cluster -- and with no controller there are no per-BMC Services, so
    # exploration finds nothing and the run reports zeros with no obvious cause.
    #   MAT_K8S_CONTROLLER_IMAGE=<registry>/mat-k8s-controller
    #   MAT_K8S_CONTROLLER_TAG=<tag>
    repository: ""
    tag: ""
  imagePullSecrets:
    - name: machine-a-tron-pull
  config:
    insecureSkipVerify: true

# Init at thousands of hosts binds the redfish port only after registering
# every expected machine; give probes a long bring-up window (see #4298).
livenessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 10

readinessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 5
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 5

resources:
  limits:
    cpu: "8"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 2Gi

pods:
  default: null
  mat-0:
    machines:
      # the chart's own mat-0 example deep-merges in without this
      rack-machines: null
      compute:
        hwType: dell_poweredge_r750
        hostCount: 1350
        dpuPerHostCount: 2
        dpuRebootDelay: 1
        hostRebootDelay: 1
        scoutRunInterval: "300s"
        runIntervalWorking: "5s"
        runIntervalIdle: "60s"
        networkStatusRunInterval: "120s"
        bmcDhcpRelayAddress: "10.233.16.1"
        underlayDhcpRelayAddress: "10.104.0.1"
        dpusInNicMode: false
  mat-1:
    machines:
      compute:
        hwType: dell_poweredge_r750
        hostCount: 2700
        dpuPerHostCount: 2
        dpuRebootDelay: 1
        hostRebootDelay: 1
        scoutRunInterval: "300s"
        runIntervalWorking: "5s"
        runIntervalIdle: "60s"
        networkStatusRunInterval: "120s"
        bmcDhcpRelayAddress: "10.233.32.1"
        underlayDhcpRelayAddress: "10.104.0.1"
        dpusInNicMode: false
  mat-2:
    machines:
      compute:
        hwType: dell_poweredge_r750
        hostCount: 450
        dpuPerHostCount: 2
        dpuRebootDelay: 1
        hostRebootDelay: 1
        scoutRunInterval: "300s"
        runIntervalWorking: "5s"
        runIntervalIdle: "60s"
        networkStatusRunInterval: "120s"
        bmcDhcpRelayAddress: "10.233.8.1"
        underlayDhcpRelayAddress: "10.104.0.1"
        dpusInNicMode: false

extraEnv:
  - name: RUST_LOG
    value: "info"
