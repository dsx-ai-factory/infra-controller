# =============================================================================
# machine-a-tron.yaml - site values template
#
# Copy this file and fill in the site-specific values before deploying.
# See docs/development/machine-a-tron-deployment.md for the full guide.
#
# Deployment mode: Override Mode (nginxBmcProxy.enabled: false)
#   site-explorer's Redfish calls are redirected to machine-a-tron's mock BMC.
#   Not compatible with real hardware. Use only on simulation-only clusters.
#
# IMPORTANT: the redirect is driven by nico-core, not this chart. nico-core's
# site_explorer config must contain (note the CROSS-NAMESPACE FQDN):
#   [site_explorer]
#   bmc_proxy = "nico-machine-a-tron-default-bmc-mock.nico-mat.svc.cluster.local:1266"
# (Field is `bmc_proxy`, a single "host:port" string. The older
#  override_target_ip/override_target_port fields are DEPRECATED, and
#  override_target_host was never a valid field.) Set it in the nico-core
#  values (nico-api.siteConfig.nicoApiSiteConfig), not in the live ConfigMap,
#  so a Core upgrade keeps it. The FQDN is REQUIRED: site-explorer runs in
#  nico-system and cannot resolve the bare service name (which resolves
#  against its own namespace) - a bare name yields a Redfish "connection
#  refused". Setting bmc_proxy at launch also makes allow_changing_bmc_proxy
#  default to true, which is what lets configureBmcProxyHost (below) work at
#  runtime.
# =============================================================================

## REQUIRED: the machine-a-tron image. Set it here or on the command line with
## --set image.repository=<registry>/machine-a-tron --set image.tag=<tag>.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

global:
  imagePullSecrets:
    - name: machine-a-tron-pull

# Override the SPIFFE URI so nico-api can authorize machine-a-tron calls.
# nico-api recognizes paths under /nico-system/sa/ and the RBAC rule for
# Machineatron expects SpiffeServiceIdentifier("machine-a-tron").  Without
# this override the cert-manager-issued cert uses the deployment namespace
# (/nico-mat/sa/nico-machine-a-tron) which is not in nico-api's trusted
# service_base_paths list and results in a 403 on every API call.
certificate:
  uris:
    - "spiffe://nico.local/nico-system/sa/machine-a-tron"

machineATron:
  nicoApiUrl: "https://nico-api.nico-system.svc.cluster.local:1079"
  # When set, machine-a-tron calls nico-api set_dynamic_config to point
  # site_explorer.bmc_proxy at "<host>:<service.bmcMock.port>" at runtime.
  # This ONLY succeeds if nico-core has allow_changing_bmc_proxy=true (which is
  # the default once nico-core launches with bmc_proxy set). It is a
  # belt-and-suspenders companion to the nico-core bmc_proxy setting, harmless
  # when both are set to the same target.
  # MUST be the cross-namespace FQDN (site-explorer is in nico-system and cannot
  # resolve the bare name). Update the ".nico-mat." segment if you deploy to a
  # different namespace.
  # Name comes from templates/service.yaml: "<release>-<pod key>-bmc-mock".
  # The pod key below is `default`, so the Service is
  # nico-machine-a-tron-default-bmc-mock -- omitting the key resolves to
  # nothing and every endpoint fails with ConnectionRefused.
  configureBmcProxyHost: "nico-machine-a-tron-default-bmc-mock.nico-mat.svc.cluster.local"
  # Auto-register each mock host as an expected_machine (matched by BMC MAC).
  # REQUIRED for end-to-end: site-explorer's MachineCreator refuses to create a
  # managed host when no expected_machines row matches the discovered BMC MAC
  # ("Refusing to create managed host, expected machines entry not found").
  registerExpectedMachines: true
  # Leave the mocks at their factory passwords so site-explorer exercises the
  # credential rotation flow (seed the host factory default in Vault, see the
  # kvSeeds comment in helm-prereqs/values.yaml). Drop this block to pin the
  # mocks to the site root from the site credentials Secret like the scale
  # profiles do.
  siteCredentialsSecret:
    name: ""

pods:
  # The chart's own values.yaml ships a mat-0 pod. Null it, or this file's
  # default pod makes the render multi-pod, which the chart rejects unless
  # mat-k8s-controller is enabled.
  mat-0: null
  default:
    machines:
      # disable the chart-default example group (deep-merge would keep it)
      rack-machines: null
      dell-hosts:
        hwType: dell_poweredge_r750
        # SIZING: one BMC address per host and per DPU, so the OOB network
        # needs hostCount x (1 + dpuPerHostCount) addresses, the admin network
        # the same, and the underlay network hostCount x dpuPerHostCount plus
        # one per switch. Usable addresses per prefix = 2^(32 - mask) -
        # reserve_first - 1. Overflow shows as "No IP addresses left in
        # prefix ..." and machines never register.
        #   e.g. a /28 with a gateway and reserve_first = 2 yields 13 usable:
        #   hostCount 3 x (1 + 2) = 9 fits; 5 x (1 + 2) = 15 does not.
        hostCount: 3
        dpuPerHostCount: 2
        dpuRebootDelay: 1
        hostRebootDelay: 1
        scoutRunInterval: "60s"
        runIntervalWorking: "1s"
        runIntervalIdle: "10s"
        networkStatusRunInterval: "20s"
        # Gateway of the [networks.<oob>] stanza of the nico-core site config
        # (simulated-oob in values/nico-core-simulation.yaml); relay for BMC DHCP.
        bmcDhcpRelayAddress: "FILL_IN"
        # Gateway of the [networks.<underlay>] stanza that serves DPU OOB and
        # switch NVOS DHCP (simulated-underlay in values/nico-core-simulation.yaml).
        underlayDhcpRelayAddress: "FILL_IN"
        dpusInNicMode: false

extraEnv:
  - name: RUST_LOG
    value: "info"
