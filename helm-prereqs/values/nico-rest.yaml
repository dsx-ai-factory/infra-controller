# =============================================================================
# nico-rest.yaml — values for: helm upgrade --install nico-rest <chart>
#
# Image registry and tag are injected at install time via --set flags:
#   --set global.image.repository=<your-registry>
#   --set global.image.tag=<tag>
# In setup.sh these come from NICO_IMAGE_REGISTRY and NICO_IMAGE_TAG.
# =============================================================================

global:
  image:
    repository: ""    # set via --set global.image.repository (NICO_IMAGE_REGISTRY env var)
    tag: ""           # set via --set global.image.tag (NICO_IMAGE_TAG env var)
    pullPolicy: IfNotPresent

nico-rest-api:
  replicaCount: 3
  nodePort:
    # Set false when enabling ingress; the chart rejects exposing plaintext
    # NodePort alongside TLS ingress.
    enabled: true
    port: 30388
  # To expose REST through the optional Contour/Envoy controller, run setup.sh
  # with --install-contour, set nodePort.enabled false above, and uncomment the
  # block below. The ingress routes to the chart-managed ClusterIP Service on
  # service.port. hosts is the only place the DNS name goes: the chart derives
  # the ingress spec.tls entry and the certificate dnsNames and common name from
  # it, so a rename here cannot leave the host served over plaintext HTTP.
  # ingress:
  #   enabled: true
  #   className: contour
  #   hosts:
  #     - host: api.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   certificate:
  #     enabled: true
  #     secretName: api-example-com-tls
  config:
    keycloak:
      enabled: true
      # Hostname must match helm-prereqs/values.yaml::keycloak.namespace
      # (default "nico-rest") — that value is not propagated here
      # automatically, so update both together if you change it.
      baseURL: "http://keycloak.nico-rest:8082"
      externalBaseURL: "http://keycloak.nico-rest:8082"
      realm: "nico"
      clientID: "nico-rest"
      serviceAccount: true

nico-rest-cert-manager:
  replicaCount: 3

nico-rest-site-manager:
  replicaCount: 3

nico-rest-workflow:
  cloudWorker:
    replicaCount: 3
  siteWorker:
    replicaCount: 3
