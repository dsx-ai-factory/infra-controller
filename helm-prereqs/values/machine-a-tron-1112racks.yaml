# machine-a-tron-1112racks.yaml - 1,112 GB200 NVL72 racks (20,016 hosts) on 45
# pods (Controller Mode with the protocol gateway and per-pod Services).
#
# mat-0 to mat-12 simulate 24 racks each (rack-001 to rack-312) and mat-13 to
# mat-44 simulate 25 racks each (rack-313 to rack-1112), so every pod stays at
# or under the 25 racks the chart's default startupProbe covers. Each rack
# expands to 18 compute trays (one host with 2 DPUs each), 9 NVLink switch
# trays, and 8 power shelves: 71 BMCs and 54 NICo machines per rack. A 24-rack
# pod serves 1,704 BMCs and 1,296 machines, a 25-rack pod 1,775 and 1,350.
#
# BMC DHCP relay plan: 78,952 BMC leases exceed one /16 (65,534 usable),
# so the pods split between the two BMC segments of nico-core-20k-hosts.yaml:
# mat-0 to mat-22 relay to 10.200.0.1 (simulated-oob 10.200.0.0/16, 562
# racks, 39,902 leases) and mat-23 to mat-44 to 10.202.0.1 (simulated-oob-b
# 10.202.0.0/16, 550 racks, 39,050 leases). nico-api serves a DHCP
# request from the segment whose prefix contains the relay address, so each
# relay must lie in exactly one declared segment. DPU OOB and switch NVOS
# leases relay to 10.201.0.1 from every pod (simulated-underlay 10.201.0.0/16,
# 50,040 leases).
#
# Per-pod Services (mat-k8s-controller.config.serviceGranularity: pod) replace
# the per-BMC Services of machine-a-tron-250racks.yaml.
# The controller publishes two Services per simulator pod, one carrying the
# pod's BMC addresses and one its switch NVOS addresses as externalIPs: 90
# Services instead of 88,960, so the cluster ServiceCIDR no longer caps the
# fleet. A device whose Redfish port pair differs from its pod's keeps a
# per-device Service and the controller logs a warning. The BMC and NVOS
# networks must still lie outside the ServiceCIDR, pod CIDR, and node
# network. helm-prereqs/check-mat-service-cidr.py checks the ServiceCIDR
# only. The protocol gateway serves one RMS mock and one UFM API for all 45
# pods.
#
# kube-proxy in IPVS mode keeps every Service externalIP and port in one
# ipset per node, and that ipset holds at most 65,536 entries, a limit
# compiled into kube-proxy. This fleet publishes 98,968 entries (89 per
# rack: 71 BMC addresses on one port and 9 NVOS addresses on two ports), so
# a stock kube-proxy silently drops part of the fleet above about 736 racks.
# The runbook names the kube-proxy rebuild the measured runs used and the
# calico-node probe override that goes with a fleet of this size.
#
# Install order:
#   1. nico-core with helm-prereqs/values/nico-core-20k-hosts.yaml. Its two
#      BMC segments (simulated-oob and simulated-oob-b, both /16, 78,952 BMC
#      leases) and simulated-underlay (/16, 50,040 DPU OOB and switch NVOS
#      leases) are the relay targets below, and its nico-api.rms.apiUrl is the
#      gateway Service (refer to docs/development/machine-a-tron-rms-mock.md):
#      https://nico-machine-a-tron-mat-k8s-controller-gateway.nico-mat.svc.cluster.local:8443
#   2. The labeled nico-mat namespace and the machine-a-tron-pull Secret
#      (Cluster Prerequisites in docs/development/machine-a-tron-deployment.md).
#   3. helm upgrade --install nico-machine-a-tron helm/charts/nico-machine-a-tron \
#        -n nico-mat --qps 15 --burst-limit 30 --set createNamespace=false \
#        -f helm-prereqs/values/machine-a-tron-1112racks.yaml
#
# The site BMC root password comes from the site credentials Secret, not this
# file. Expect in NICo: 1,112 racks, 20,016 hosts, 40,032 DPUs, 10,008 switches,
# and 8,896 power shelves (78,952 BMCs, 60,048 machines), each BMC reachable
# on the address of its BMC segment. Each pod is limited to 4 CPUs and 12Gi of
# memory (requests 1 CPU, 4Gi). The runbook is the 20,000-Host Simulated
# Fleet section of docs/development/machine-a-tron-scale-testing.md.
#
# Each pod declares an expected rack group (protocol NVLINK_V5, topology
# gb200_nvl72r1_c2g4) for a rack no group declares yet, before its expected
# rack, and nico-api derives the rack profile GB200_NVL72R1_C2G4_WIWYNN from
# that declaration. An existing group is used as is. rack_profile_id must
# name the profile derived from the rack's group, which machine-a-tron checks
# at startup. The nico-api chart ships that profile.

# REQUIRED: the machine-a-tron image. Set it here or on the command line with
# --set image.repository=<registry>/machine-a-tron --set image.tag=<tag>.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

global:
  # Pre-created with the nico.nvidia.com/managed label (install step 2).
  namespaceOverride: nico-mat
  imagePullSecrets:
    - name: machine-a-tron-pull

certificate:
  uris:
    - spiffe://nico.local/nico-system/sa/machine-a-tron

machineATron:
  configureBmcProxyHost: ""  # Not used in controller mode
  # The chart reads the site root password from the site credentials Secret
  # and pins every mock BMC to it. hostBmcPassword/dpuBmcPassword override it.
  nicoApiUrl: https://nico-api.nico-system.svc.cluster.local:1079
  registerExpectedMachines: true
  # Per-pod Services publish only the Redfish and NVOS ports, so the SSH mock
  # would be unreachable (chart README, Per-pod Services).
  mockBmcSshServer: false

# One simulator pod per node as far as the skew allows (45 pods on 3 nodes:
# 15 each). Chart defaults for the rest: maxSkew 1, topologyKey
# kubernetes.io/hostname, whenUnsatisfiable DoNotSchedule.
topologySpread:
  enabled: true

# Per-pod MAC pools: the chart numbers pods by their position in the sorted
# pod list, so 45 pods get 45 distinct third bytes under 02:00 and 02:01, and
# MACs and the UFM inventory id derived from the range base stay unique.
macAddressPool:
  enabled: true
  basePrefix: "02:00"

hwMacAddressRanges:
  enabled: true
  basePrefix: "02:01"

# Controller mode at pod granularity: two Services per simulator pod (BMC and
# NVOS address lists as externalIPs), plus the protocol gateway in the
# controller pod fronting all 45 instances.
mat-k8s-controller:
  enabled: true
  # REQUIRED: the mat-k8s-controller image, which also carries the gateway
  # binary. Set it here or on the command line with
  #   --set mat-k8s-controller.image.repository=<registry>/mat-k8s-controller
  #   --set mat-k8s-controller.image.tag=<tag>
  image:
    repository: ""
    tag: ""
  config:
    insecureSkipVerify: true  # For self-signed certs
    # pod: two Services per simulator pod. device (the default) restores one
    # Service per BMC and per NVOS endpoint, 88,960 at this fleet size.
    serviceGranularity: pod
  # Controller container: polls /machines/status of 45 pods every 30 s, each
  # answer about 1,700 BMCs, and reconciles 90 Services. The controller pod,
  # controller and gateway together, peaked at 0.23 cores and 0.33 GiB over a
  # 14-hour run of this fleet, so the 556-rack limits stay.
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  gateway:
    enabled: true
    # 45 sources to poll and route, and up to 3,300 switches polling their
    # certificate jobs at once: the 556-rack sizing, well within the measured
    # use above.
    resources:
      limits:
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 1Gi

# The chart's default startupProbe (120 x 30s, 60 min) covers 25 racks per
# pod at the chart's 2 s per record rule with about 10 pods registering at
# once: one rack registers 36 records, 25 x 36 = 900 records, 30 min. Here
# 45 pods register 40,032 records against one nico-api at deploy, so the
# window is doubled to 240 x 30s = 2 h. A pod killed mid-registration
# restarts and repeats its registration, while a longer window only delays
# hang detection. On the second measured run all 45 pods were Ready within
# 14 minutes of helm upgrade.
startupProbe:
  tcpSocket:
    port: redfish
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 10

# A restart discards the mock state and repeats registration, so the kubelet
# tolerates a stalled redfish port for 240 x 30s = 2 h before it restarts the
# pod.
livenessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 10

# Up to 25 racks (1,775 BMCs, 1,350 machines) per pod. On the two completed
# runs of this fleet the 45 pods together used 9 cores mean and 14 at peak,
# and 53 to 76 GiB of working set, under 2 GiB per pod. The limit stays at
# 12Gi because pods of this fleet rose to 7 GiB median and 9.4 GiB peak once
# every BMC address became reachable and the mocks worked through the backlog,
# and an OOM kill restarts the pod and discards its mock state. The chart
# applies this block to every pod.
resources:
  limits:
    cpu: "4"
    memory: 12Gi
  requests:
    cpu: "1"
    memory: 4Gi

# Rack groups use the chart's snake_case keys. bmc_dhcp_relay_address is the
# gateway of the pod's BMC segment (10.200.0.1 for mat-0 to mat-22, 10.202.0.1
# for mat-23 to mat-44). underlay_dhcp_relay_address is the simulated-underlay
# gateway: NICo predicts DPU OOB on an underlay segment, so DPU OOB and switch
# NVOS DHCP relay there (all three segments in nico-core-20k-hosts.yaml).
# mat-1 to mat-44 declare only racks. A pod with no machine groups still gets
# the bare [machines] table the binary requires (chart configmap template).
