# kube-prometheus-stack — Prometheus + Grafana for a NICo site. The release name MUST be `obs`:
# the rendered resource names (obs-grafana, obs-prometheus, ...) are referenced by the install
# script, clean.sh, and the docs. Fully self-contained: nothing leaves the site.
#
# Per-site values (site label, Grafana exposure) are applied by install-observability.sh as
# `helm --set-string` overrides — do NOT edit this file per site.
fullnameOverride: obs
# Several prometheus-operator CRDs (monitoring.coreos.com) already exist on a helm-prereqs
# cluster (setup.sh applies operators/crds/ at Phase 2); install-observability.sh server-side
# applies whichever ones are missing. Letting the chart manage its own copies would hit a
# server-side-apply field-ownership conflict on the shared CRDs, so only the operator +
# workloads come from this chart.
crds:
  enabled: false
prometheusOperator:
  enabled: true          # most NICo site clusters run no shared operator. If your cluster already
                         # runs prometheus-operator, install with PROMETHEUS_OPERATOR=false.
prometheus:
  prometheusSpec:
    # Select ServiceMonitors/PodMonitors/Rules CLUSTER-WIDE, not just those carrying this
    # release's helm labels. This is what discovers the NICo charts' own ServiceMonitors
    # (nico-api, nico-dhcp, nico-pxe, ...) with zero label coordination. NOTE: those
    # ServiceMonitors only exist when the Core values set serviceMonitor.enabled=true per
    # subchart — see values-nico-servicemonitors.yaml + the README.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 15d
    externalLabels:
      forge_site: nico-site     # overridden per site by install-observability.sh (OTEL_SITE_NAME)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path-persistent
          resources:
            requests:
              storage: 50Gi
    # Scrape the DPU metrics the optional OTLP gateway re-exports on :9999 (a static target so it
    # works even before the gateway exists; the target just stays down until WITH_DPU installs it).
    additionalScrapeConfigs:
      - job_name: otel-collector-gateway
        static_configs:
          - targets: ["otel-collector-gateway.otel.svc.cluster.local:9999"]
alertmanager:
  enabled: false          # not needed for the collection goal; enable later if you want alerting
kubeEtcd:
  enabled: false          # kubespray-built clusters bind etcd metrics to 127.0.0.1:2381 -> the
                          # scrape target would always be DOWN. controller-manager/scheduler bind
                          # 0.0.0.0 so those stay UP. Re-enable on clusters whose etcd listens
                          # on a routable address.
grafana:
  # NO AUTH by default: anonymous users land straight in as Admin, login form disabled. This
  # matches the rest of the stack (Loki auth_enabled:false, collectors auth-free) and is meant
  # for INTERNAL-ONLY site clusters reached over a VIP/tunnel. If your Grafana is reachable
  # beyond the site's management network, install with GRAFANA_ANONYMOUS=false and set an
  # admin password (see README "Securing Grafana").
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_role: Admin
    # With basic auth off, Grafana's admin API (including the provisioning-reload endpoint the
    # datasource sidecar would call) is unreachable — which is why the datasources below are
    # provisioned statically instead of through the sidecar (see `datasources:`).
    auth.basic:
      enabled: false
    users:
      allow_sign_up: false
  # ClusterIP by default so the bundle works on any cluster (reach it with
  # `kubectl -n monitoring port-forward svc/obs-grafana 3000:80`). Passing GRAFANA_VIP to
  # install-observability.sh switches this to LoadBalancer with a MetalLB address annotation.
  service:
    type: ClusterIP
  # Datasources are provisioned STATICALLY (a file mounted into the pod, read at startup) rather
  # than through the chart's datasource sidecar: the sidecar delivers datasources by calling
  # Grafana's admin provisioning-reload API, which requires basic auth — disabled above. The
  # static route needs no API call and cannot race Grafana's startup.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://obs-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 30s        # the Prometheus scrape interval, so $__rate_interval resolves
        - name: Loki
          type: loki
          uid: loki                # referenced by the Tempo datasource's tracesToLogsV2 link
          access: proxy
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            httpHeaderName1: X-Scope-OrgID
          secureJsonData:
            httpHeaderValue1: forge      # auth_enabled=false ignores this, but set it for the future
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo.tempo.svc.cluster.local:3200   # Tempo query API is :3200 (3100 is Loki's)
          jsonData:
            # Jump from a span straight to the pod's logs in Loki over the trace window.
            # (The reverse, Loki->Tempo derived fields, is NOT wired: NICo logfmt lines carry
            # span_id but no trace_id, so there is nothing to regex-match on.)
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              filterByTraceID: false     # NICo log lines carry span_id, not trace_id — must stay false
              filterBySpanID: false
              tags:
                # span attribute -> Loki stream label (the agent's k8sattributes processor puts
                # k8s.pod.name on spans; the loki exporter renders it as label k8s_pod_name)
                - key: k8s.pod.name
                  value: k8s_pod_name
  sidecar:
    datasources:
      enabled: false                     # static provisioning above replaces this sidecar
      defaultDatasourceEnabled: false    # ... including the chart's own default Prometheus entry
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
      # The dashboard file provider rescans its folder on a timer, so the sidecar's optional
      # "reload now" API call is unnecessary — and it would fail anyway with basic auth off.
      skipReload: true
# The NICo umbrella chart can additionally publish its own dashboards (helm/values.yaml
# grafanaDashboards.enabled) as grafana_dashboard-labelled ConfigMaps; this sidecar auto-loads
# them when that toggle is on and the ConfigMap lands in ns monitoring.
