suite: Site Credentials Secret
templates:
  - templates/secrets.yaml
tests:
  - it: renders no site credentials Secret by default
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: nico-site-credentials
          namespace: nico-system
        not: true

  - it: renders the credential file with the BMC root and both UEFI site defaults
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: NicoSiteRoot1
      siteCredentials.uefi.dpu.password: DpuUefiSecret1
      siteCredentials.uefi.host.password: HostUefiSecret1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.namespace
          value: nico-system
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"NicoSiteRoot1","username":"root"},"dpu_uefi_site_default":{"password":"DpuUefiSecret1","username":""},"host_uefi_site_default":{"password":"HostUefiSecret1","username":""}}'

  - it: honours the Secret name and usernames, and escapes the passwords
    documentSelector:
      path: metadata.name
      value: site-creds
    set:
      siteCredentials.enabled: true
      siteCredentials.secretName: site-creds
      siteCredentials.bmcRoot.username: ""
      siteCredentials.bmcRoot.password: 'p@ss"word\$1'
      siteCredentials.uefi.dpu.username: admin
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"p@ss\"word\\$1","username":""},"dpu_uefi_site_default":{"password":"bluefield","username":"admin"},"host_uefi_site_default":{"password":"bluefield","username":""}}'

  - it: fails when a password is missing
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: NicoSiteRoot1
      siteCredentials.uefi.dpu.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: siteCredentials.uefi.host.password must be set

  - it: fails when a whole entry is null
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot: null
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: siteCredentials.bmcRoot.password must be set

  - it: fails when a password is not a quoted string
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: 0123
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: siteCredentials.bmcRoot.password must be a quoted string
