suite: Site Credentials Secret
templates:
  - templates/secrets.yaml
tests:
  - it: renders no site credentials Secret by default
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: nico-site-credentials
          namespace: nico-system
        not: true

  - it: renders the credential file with the BMC root and both UEFI site defaults
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: NicoSiteRoot1
      siteCredentials.uefi.dpu.password: DpuUefiSecret1
      siteCredentials.uefi.host.password: HostUefiSecret1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.namespace
          value: nico-system
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"NicoSiteRoot1","username":"root"},"dpu_uefi_site_default":{"password":"DpuUefiSecret1","username":""},"host_uefi_site_default":{"password":"HostUefiSecret1","username":""}}'

  - it: honours the Secret name and usernames, and escapes the passwords
    documentSelector:
      path: metadata.name
      value: site-creds
    set:
      siteCredentials.enabled: true
      siteCredentials.secretName: site-creds
      siteCredentials.bmcRoot.username: ""
      siteCredentials.bmcRoot.password: 'p@ss"word\$1'
      siteCredentials.uefi.dpu.username: admin
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"p@ss\"word\\$1","username":""},"dpu_uefi_site_default":{"password":"bluefield","username":"admin"},"host_uefi_site_default":{"password":"bluefield","username":""}}'

  - it: generates a missing password and keeps the explicit ones
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: NicoSiteRoot1
      siteCredentials.uefi.dpu.password: bluefield
    asserts:
      - matchRegex:
          path: stringData["credentials.yaml"]
          pattern: '^\{"bmc_site_wide_root":\{"password":"NicoSiteRoot1","username":"root"\},"dpu_uefi_site_default":\{"password":"bluefield","username":""\},"host_uefi_site_default":\{"password":"[A-Za-z0-9]{32}","username":""\}\}$'

  - it: generates the password of a null entry with an empty username
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot: null
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - matchRegex:
          path: stringData["credentials.yaml"]
          pattern: '^\{"bmc_site_wide_root":\{"password":"[A-Za-z0-9]{32}","username":""\},"dpu_uefi_site_default":\{"password":"bluefield","username":""\},"host_uefi_site_default":\{"password":"bluefield","username":""\}\}$'

  - it: keeps the passwords of the existing Secret for empty values
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
    kubernetesProvider: &existingSecret
      scheme: &secretScheme
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # prereqs.siteCredentialsFile output with the passwords ExistingBmc1, ExistingDpu1, ExistingHost1
            credentials.yaml: eyJibWNfc2l0ZV93aWRlX3Jvb3QiOnsicGFzc3dvcmQiOiJFeGlzdGluZ0JtYzEiLCJ1c2VybmFtZSI6InJvb3QifSwiZHB1X3VlZmlfc2l0ZV9kZWZhdWx0Ijp7InBhc3N3b3JkIjoiRXhpc3RpbmdEcHUxIiwidXNlcm5hbWUiOiIifSwiaG9zdF91ZWZpX3NpdGVfZGVmYXVsdCI6eyJwYXNzd29yZCI6IkV4aXN0aW5nSG9zdDEiLCJ1c2VybmFtZSI6IiJ9fQ==
    asserts:
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"ExistingBmc1","username":"root"},"dpu_uefi_site_default":{"password":"ExistingDpu1","username":""},"host_uefi_site_default":{"password":"ExistingHost1","username":""}}'

  - it: prefers an explicit password over the existing Secret
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: NicoSiteRoot1
    kubernetesProvider: *existingSecret
    asserts:
      - equal:
          path: stringData["credentials.yaml"]
          value: '{"bmc_site_wide_root":{"password":"NicoSiteRoot1","username":"root"},"dpu_uefi_site_default":{"password":"ExistingDpu1","username":""},"host_uefi_site_default":{"password":"ExistingHost1","username":""}}'

  - it: fails when the existing Secret is not a credential file
    set:
      siteCredentials.enabled: true
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # "not a credential file"
            credentials.yaml: bm90IGEgY3JlZGVudGlhbCBmaWxl
    asserts:
      - failedTemplate:
          errorPattern: Secret nico-system/nico-site-credentials has a credentials.yaml that does not parse

  - it: fails when an entry of the existing Secret is malformed
    set:
      siteCredentials.enabled: true
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # {"bmc_site_wide_root":"just a string","dpu_uefi_site_default":{"password":123,"username":""},"host_uefi_site_default":{"password":"","username":""}}
            credentials.yaml: eyJibWNfc2l0ZV93aWRlX3Jvb3QiOiJqdXN0IGEgc3RyaW5nIiwiZHB1X3VlZmlfc2l0ZV9kZWZhdWx0Ijp7InBhc3N3b3JkIjoxMjMsInVzZXJuYW1lIjoiIn0sImhvc3RfdWVmaV9zaXRlX2RlZmF1bHQiOnsicGFzc3dvcmQiOiIiLCJ1c2VybmFtZSI6IiJ9fQ==
    asserts:
      - failedTemplate:
          errorPattern: Secret nico-system/nico-site-credentials holds a malformed bmc_site_wide_root entry

  - it: generates only the entries the existing Secret lacks
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      siteCredentials.enabled: true
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # {"bmc_site_wide_root":{"password":"ExistingBmc1","username":"root"}}
            credentials.yaml: eyJibWNfc2l0ZV93aWRlX3Jvb3QiOnsicGFzc3dvcmQiOiJFeGlzdGluZ0JtYzEiLCJ1c2VybmFtZSI6InJvb3QifX0=
    asserts:
      - matchRegex:
          path: stringData["credentials.yaml"]
          pattern: '^\{"bmc_site_wide_root":\{"password":"ExistingBmc1","username":"root"\},"dpu_uefi_site_default":\{"password":"[A-Za-z0-9]{32}","username":""\},"host_uefi_site_default":\{"password":"[A-Za-z0-9]{32}","username":""\}\}$'

  - it: fails when a password is not a quoted string
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: 0123
      siteCredentials.uefi.dpu.password: bluefield
      siteCredentials.uefi.host.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: siteCredentials.bmcRoot.password must be a quoted string

  - it: fails when a password is a falsy non-string
    set:
      siteCredentials.enabled: true
      siteCredentials.bmcRoot.password: 0
    asserts:
      - failedTemplate:
          errorPattern: siteCredentials.bmcRoot.password must be a quoted string
