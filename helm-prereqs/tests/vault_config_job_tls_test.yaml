suite: Vault bootstrap CA verification
templates:
  - templates/vault-config-job.yaml
tests:
  - it: preserves the existing bootstrap when no CA Secret is selected
    documentIndex: 3
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: VAULT_SKIP_VERIFY, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: VAULT_SKIP_VERIFY, value: "true"}
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'vault status -tls-skip-verify -format=json'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '--no-check-certificate'

  - it: verifies Vault and uses the existing Kubernetes client to read the signing CA
    documentIndex: 3
    set:
      namespace: custom-nico
      certManagerNamespace: custom-cert-manager
      vault.configJob.caSecretName: vault-ca
      vault.configJob.kubectlImage: example.test/kubectl:1.34.4
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-ca
            secret:
              secretName: vault-ca
              items: [{key: ca.crt, path: ca.crt}]
      - contains:
          path: spec.template.spec.volumes
          content: {name: site-root, emptyDir: {medium: Memory}}
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: VAULT_SKIP_VERIFY, value: "false"}
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: VAULT_CACERT, value: /vault-ca/ca.crt}
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: {name: vault-ca, mountPath: /vault-ca, readOnly: true}
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'tls-skip-verify'
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: example.test/kubectl:1.34.4
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: 'kubectl get secret site-root -n "custom-cert-manager"'
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: 'insecure|skip.tls|no-check-certificate'
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: VAULT_SKIP_VERIFY, value: "false"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: VAULT_CACERT, value: /vault-ca/ca.crt}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: vault-ca, mountPath: /vault-ca, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: site-root, mountPath: /site-root, readOnly: true}
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'no-check-certificate|wget'
      - lengthEqual:
          path: spec.template.spec.containers[1].volumeMounts
          count: 1

  - it: rejects plaintext Vault when CA verification is requested
    set:
      vault.address: http://vault.example:8200
      vault.configJob.caSecretName: vault-ca
    asserts:
      - failedTemplate:
          errorMessage: vault.configJob.caSecretName requires an https:// vault.address

  - it: does not render a disabled bootstrap Job
    set:
      vault.configJob.enabled: false
      vault.configJob.caSecretName: vault-ca
    asserts:
      - hasDocuments:
          count: 0
