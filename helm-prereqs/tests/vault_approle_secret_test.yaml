# nico-vault-approle-tokens renders the chart's empty placeholders by default
# (the vault-pki-config Job patches the real credentials in after each install
# or upgrade) and the supplied values when setup.sh --skip-vault carries the
# live credentials across a sync that leaves the Job out.
suite: nico-vault-approle-tokens contents
templates:
  - templates/secrets.yaml
tests:
  - it: renders empty placeholders by default
    documentSelector:
      path: metadata.name
      value: nico-vault-approle-tokens
    asserts:
      - equal:
          path: stringData.VAULT_ROLE_ID
          value: ""
      - equal:
          path: stringData.VAULT_SECRET_ID
          value: ""

  - it: renders the supplied AppRole credentials
    set:
      vault.approleSecret.roleId: 11111111-2222-3333-4444-555555555555
      vault.approleSecret.secretId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    documentSelector:
      path: metadata.name
      value: nico-vault-approle-tokens
    asserts:
      - equal:
          path: stringData.VAULT_ROLE_ID
          value: 11111111-2222-3333-4444-555555555555
      - equal:
          path: stringData.VAULT_SECRET_ID
          value: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
