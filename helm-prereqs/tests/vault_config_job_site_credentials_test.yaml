suite: Vault configuration job site credential seeds
templates:
  - templates/vault-config-job.yaml
  - templates/secrets.yaml
tests:
  - it: does not seed site credentials by default
    asserts:
      - template: templates/vault-config-job.yaml
        documentIndex: 3
        notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: machines/bmc/site/root
      - template: templates/vault-config-job.yaml
        documentIndex: 3
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_CREDENTIAL_BMC_ROOT
          any: true
      - template: templates/secrets.yaml
        containsDocument:
          apiVersion: v1
          kind: Secret
          name: nico-site-credentials
          namespace: nico-system
        not: true

  - it: renders the BMC root and UEFI site defaults into the nico-site-credentials Secret
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: NicoSiteRoot1
      vault.siteCredentials.uefi.dpu.password: bluefield
      vault.siteCredentials.uefi.host.password: bluefield
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.namespace
          value: nico-system
      - equal:
          path: stringData.bmc_site_root
          value: '{"UsernamePassword":{"password":"NicoSiteRoot1","username":"root"}}'
      - equal:
          path: stringData.uefi_dpu_site_default
          value: '{"UsernamePassword":{"password":"bluefield","username":"admin"}}'
      - equal:
          path: stringData.uefi_host_site_default
          value: '{"UsernamePassword":{"password":"bluefield","username":"admin"}}'

  - it: injects the Secret through env vars and keeps the passwords out of the Job spec
    template: templates/vault-config-job.yaml
    documentIndex: 3
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: NicoSiteRoot1
      vault.siteCredentials.uefi.dpu.password: DpuUefiSecret1
      vault.siteCredentials.uefi.host.password: HostUefiSecret1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_CREDENTIAL_BMC_ROOT
            valueFrom:
              secretKeyRef:
                name: nico-site-credentials
                key: bmc_site_root
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_CREDENTIAL_UEFI_DPU
            valueFrom:
              secretKeyRef:
                name: nico-site-credentials
                key: uefi_dpu_site_default
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_CREDENTIAL_UEFI_HOST
            valueFrom:
              secretKeyRef:
                name: nico-site-credentials
                key: uefi_host_site_default
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: |-
            printf '%s\\n' "\$SITE_CREDENTIAL_BMC_ROOT" \\
            \s+\| vault kv put secrets/machines/bmc/site/root -
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: |-
            printf '%s\\n' "\$SITE_CREDENTIAL_UEFI_DPU" \\
            \s+\| vault kv put secrets/machines/all_dpus/site_default/uefi-metadata-items/auth -
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: |-
            printf '%s\\n' "\$SITE_CREDENTIAL_UEFI_HOST" \\
            \s+\| vault kv put secrets/machines/all_hosts/site_default/uefi-metadata-items/auth -
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: NicoSiteRoot1|DpuUefiSecret1|HostUefiSecret1

  - it: seeds site credentials after the kvSeeds list
    template: templates/vault-config-job.yaml
    documentIndex: 3
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: NicoSiteRoot1
      vault.siteCredentials.uefi.dpu.password: bluefield
      vault.siteCredentials.uefi.host.password: bluefield
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: (?s)all_hosts/site_default/uefi-metadata-items/auth - <<'KVSEED'\n\{"UsernamePassword":\{"password":"","username":""\}\}.*"\$SITE_CREDENTIAL_UEFI_HOST" \\\n\s+\| vault kv put secrets/machines/all_hosts/site_default/uefi-metadata-items/auth -

  - it: honours the KV mount and configured usernames
    set:
      vault.kvMount: kv
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.username: admin
      vault.siteCredentials.bmcRoot.password: p1
      vault.siteCredentials.uefi.dpu.username: ""
      vault.siteCredentials.uefi.dpu.password: p2
      vault.siteCredentials.uefi.host.password: p3
    asserts:
      - template: templates/vault-config-job.yaml
        documentIndex: 3
        matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: vault kv put kv/machines/bmc/site/root -
      - template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: nico-site-credentials
        equal:
          path: stringData.bmc_site_root
          value: '{"UsernamePassword":{"password":"p1","username":"admin"}}'
      - template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: nico-site-credentials
        equal:
          path: stringData.uefi_dpu_site_default
          value: '{"UsernamePassword":{"password":"p2","username":""}}'

  - it: writes numeric and boolean YAML scalars as JSON strings
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: 12345
      vault.siteCredentials.uefi.dpu.password: true
      vault.siteCredentials.uefi.host.username: 0
      vault.siteCredentials.uefi.host.password: 1.5
    asserts:
      - equal:
          path: stringData.bmc_site_root
          value: '{"UsernamePassword":{"password":"12345","username":"root"}}'
      - equal:
          path: stringData.uefi_dpu_site_default
          value: '{"UsernamePassword":{"password":"true","username":"admin"}}'
      - equal:
          path: stringData.uefi_host_site_default
          value: '{"UsernamePassword":{"password":"1.5","username":"0"}}'

  - it: escapes quotes, backslashes and dollar signs in the payload
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: nico-site-credentials
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: 'p"a\s$w'
      vault.siteCredentials.uefi.dpu.password: bluefield
      vault.siteCredentials.uefi.host.password: bluefield
    asserts:
      - equal:
          path: stringData.bmc_site_root
          value: '{"UsernamePassword":{"password":"p\"a\\s$w","username":"root"}}'

  - it: fails when enabled with an empty BMC root password
    template: templates/secrets.yaml
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.uefi.dpu.password: bluefield
      vault.siteCredentials.uefi.host.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: vault.siteCredentials.bmcRoot.password must be set when vault.siteCredentials.enabled is true

  - it: fails when enabled with an empty BMC root username
    template: templates/secrets.yaml
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.username: ""
      vault.siteCredentials.bmcRoot.password: NicoSiteRoot1
      vault.siteCredentials.uefi.dpu.password: bluefield
      vault.siteCredentials.uefi.host.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: vault.siteCredentials.bmcRoot.username must be set when vault.siteCredentials.enabled is true

  - it: fails when enabled with an empty host UEFI password
    template: templates/secrets.yaml
    set:
      vault.siteCredentials.enabled: true
      vault.siteCredentials.bmcRoot.password: NicoSiteRoot1
      vault.siteCredentials.uefi.dpu.password: bluefield
    asserts:
      - failedTemplate:
          errorPattern: vault.siteCredentials.uefi.host.password must be set when vault.siteCredentials.enabled is true
