suite: Vault ConfigMap namespace propagation
templates:
  - templates/configmaps.yaml
tests:
  - it: exposes the namespace when set
    documentIndex: 0
    set:
      vault.namespace: admin/nico
    asserts:
      - equal:
          path: data.VAULT_NAMESPACE
          value: admin/nico

  - it: omits the optional namespace by default
    documentIndex: 0
    asserts:
      - notExists:
          path: data.VAULT_NAMESPACE

  - it: preserves the established Core database defaults
    documentIndex: 1
    asserts:
      - equal:
          path: data.DB_PORT
          value: "5432"
      - equal:
          path: data.DB_NAME
          value: nico_system_nico
  - it: carries an externally managed database endpoint to Core
    documentIndex: 1
    set:
      postgresql.enabled: false
      postgresql.host: other-db.test.svc
      postgresql.port: 5433
      postgresql.database: other_database
    asserts:
      - equal:
          path: data
          value:
            DB_HOST: other-db.test.svc
            DB_PORT: "5433"
            DB_NAME: other_database

  - it: rejects a connection override inconsistent with the provisioned database
    set:
      postgresql.database: other_database
    asserts:
      - failedTemplate:
          errorMessage: Non-default postgresql.port or postgresql.database requires postgresql.enabled=false
