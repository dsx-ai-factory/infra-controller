# =============================================================================
# operators/values/kamaji.yaml — Kamaji static values
#
# DPF prerequisite (installed by default; skip with --skip-dpf).
# Based on the Kamaji values from the pinned NVIDIA/doca-platform release.
#
# Chart: oci://ghcr.io/nvidia/charts/kamaji 1.4.0
# =============================================================================

# Kamaji configuration
# Number of Kamaji controller replicas for High Availability. The chart key is
# `replicaCount` (templates/controller.yaml renders `replicas: .Values.replicaCount`,
# default 1) — a top-level `replicas:` is silently ignored, so HA needs this key.
# The controller runs --leader-elect, so 2 replicas give active/standby failover;
# there is no pod anti-affinity, so this never blocks scheduling on a small cluster.
replicaCount: 2
resources: null
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "node-role.kubernetes.io/master"
              operator: Exists
        - matchExpressions:
            - key: "node-role.kubernetes.io/control-plane"
              operator: Exists
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
kamaji-etcd:
  selfSignedCertificates:
    enabled: true
  certManager:
    enabled: false
  persistentVolumeClaim:
    storageClassName: local-path
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "node-role.kubernetes.io/master"
                operator: Exists
          - matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  jobs:
    cfssl:
      tag: v1.6.5@sha256:c9018c2ddf0b1f8dbef166057cc751d1becd5c3b0b7014cb9fe06972f725106f
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "node-role.kubernetes.io/master"
                  operator: Exists
            - matchExpressions:
                - key: "node-role.kubernetes.io/control-plane"
                  operator: Exists
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  datastore:
    enabled: true
    annotations:
      helm.sh/resource-policy: keep
    name: default
image:
  repository: ghcr.io/nvidia/kamaji
  tag: v1.36.0-26.6.4
  pullPolicy: Always
