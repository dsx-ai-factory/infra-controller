# Disposable CI cluster: all databases are discarded with the container.
# https://www.postgresql.org/docs/15/non-durability.html
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
archive_mode = off

# Avoid frequent checkpoints while cloning the migrated test template.
max_wal_size = '4GB'
checkpoint_timeout = '1h'

# Short-lived test databases do not need background vacuum or JIT compilation.
autovacuum = off
jit = off

# Cargo can run several SQLx-backed test binaries concurrently.
max_connections = 1000
