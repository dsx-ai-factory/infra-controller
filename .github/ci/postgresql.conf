# This CI cluster is discarded with the container and needs no crash recovery.
# https://www.postgresql.org/docs/15/non-durability.html
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
archive_mode = off

# Preserve the CI connection limit for concurrent SQLx-backed tests.
max_connections = 1000
