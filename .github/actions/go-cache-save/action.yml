name: Save Go caches
description: >-
  Saves GOCACHE and GOMODCACHE under the key go-cache-restore computed, only on
  main and only when that exact key missed.

inputs:
  key:
    description: The key output of go-cache-restore.
    required: true
  cache-hit:
    description: The cache-hit output of go-cache-restore.
    required: true

runs:
  using: composite
  steps:
    # Only main saves. Other refs restore main's entry, but anything they save
    # is a private copy no other ref can read.
    #
    # Worth saving when the job failed too: the compiled dependencies are no
    # less valid after a red run, and they are most of what the entry holds.
    # !cancelled() rather than always(), so a superseded run that CI just
    # cancelled stops promptly instead of lingering to bank a cache nobody
    # asked for. Callers have to repeat this, otherwise a failed job skips the
    # step that invokes this action and none of these conditions are reached.
    - name: Locate Go caches
      id: go
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.cache-hit != 'true' }}
      shell: bash
      run: |
        {
          echo "gocache=$(go env GOCACHE)"
          echo "gomodcache=$(go env GOMODCACHE)"
        } >> "$GITHUB_OUTPUT"

    - name: Save Go caches
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.go.outputs.gocache }}
          ${{ steps.go.outputs.gomodcache }}
        key: ${{ inputs.key }}
