name: Helm Charts

on:
  workflow_call:
    inputs:
      ngc_path:
        required: false
        type: string
        default: ''
      app_version:
        description: "Application version for Helm chart appVersion"
        required: true
        type: string
      chart_version:
        description: "Helm chart version (SemVer-strict, derived from git describe). Aligned with core's helm_version."
        required: true
        type: string
    secrets:
      NVCR_STG_TOKEN:
        required: true
      NICO_NGC_TOKEN:
        required: false

jobs:
  validate-charts:
    name: Validate Helm Charts
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        include:
          - chart: helm/rest/nico-rest
            valueOverrides: '["nico-rest-api.config.keycloak.enabled=true","nico-rest-api.config.keycloak.baseURL=http://keycloak:8082","nico-rest-api.config.keycloak.realm=test","nico-rest-api.config.keycloak.clientID=test"]'
          - chart: helm/rest/nico-rest-site-agent
            valueOverrides: '[]'
          - chart: helm/rest/nico-mcp
            valueOverrides: '[]'
          - chart: helm/nico-flow
            valueOverrides: '[]'
          - chart: rest-api/temporal-helm/temporal
            valueOverrides: '[]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Helm chart
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-validate@94bde998f5d7965576b0c663db7d5d709c918167
        with:
          chart-path: ${{ matrix.chart }}
          lint: 'true'
          template: 'true'
          valueOverrides: ${{ matrix.valueOverrides }}

      - name: Test Temporal chart addresses
        if: matrix.chart == 'rest-api/temporal-helm/temporal'
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-unittest@fdc2fa4b5f14ae570f290218f102f9b4aad3b26e
        with:
          plugin-oci-ref: oci://nvcr.io/0837451325059433/carbide-dev/unittest:1.1.2
          registry-password: ${{ secrets.NVCR_STG_TOKEN }}
          charts: rest-api/temporal-helm/temporal

  verify-securitycontext-configurable:
    name: Verify pod securityContext is overridable
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Assert podSecurityContext override is honored
        # Regression guard: every nico-rest workload must let the operator
        # replace the chart's default pod securityContext (e.g. drop the
        # hardcoded runAsUser/fsGroup so OpenShift can inject a range UID).
        # Rendering each subchart with its podSecurityContext set to null must
        # leave zero runAsUser in the output; a chart that hardcodes it
        # instead of using `{{- with .Values.podSecurityContext }}` fails here.
        # Subcharts are rendered directly: Helm's coalescing keeps a subchart's
        # own values.yaml default when the parent nulls the key from the
        # umbrella (--set nico-rest-api.podSecurityContext=null has no effect),
        # so the umbrella cannot exercise this contract.
        run: |
          set -euo pipefail
          cd helm/rest/nico-rest/charts
          for chart in nico-rest-api nico-rest-workflow nico-rest-site-manager nico-rest-cert-manager nico-rest-db; do
            sets=(--set podSecurityContext=null)
            if [ "${chart}" = "nico-rest-api" ]; then
              # The api ConfigMap refuses to render without an auth issuer.
              sets+=(
                --set config.keycloak.enabled=true
                --set config.keycloak.baseURL=http://keycloak:8082
                --set config.keycloak.realm=test
                --set config.keycloak.clientID=test
              )
            fi
            rendered="$(helm template t "${chart}" "${sets[@]}")"
            count="$(printf '%s\n' "${rendered}" | grep -c 'runAsUser' || true)"
            if [ "${count}" -ne 0 ]; then
              echo "::error::${chart}: podSecurityContext is not overridable — found ${count} runAsUser entries after --set podSecurityContext=null."
              printf '%s\n' "${rendered}" | grep -n 'runAsUser' || true
              exit 1
            fi
            echo "OK: ${chart} renders no runAsUser when podSecurityContext is nulled."
          done

  push-charts:
    name: Push Helm Charts
    needs:
      - validate-charts
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.validate-charts.result == 'success' && !contains(github.ref, 'pull-request/') }}
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        chart:
          - helm/rest/nico-rest
          - helm/rest/nico-rest-site-agent
          - helm/rest/nico-mcp
          - helm/nico-flow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install yq for umbrella packaging
        if: matrix.chart == 'helm/rest/nico-rest' && inputs.ngc_path != ''
        uses: dcarbone/install-yq-action@64b1b9eb28920bb1a4c13c05321df284f9a8f940 # v1.1.1
        with:
          version: v4.35.1

      # This matrix also publishes the standalone nico-rest-site-agent, nico-mcp,
      # and nico-flow charts, and may gain more; only the nico-rest umbrella has
      # bundled subcharts to rewrite.
      - name: Prepare umbrella chart versions
        if: matrix.chart == 'helm/rest/nico-rest' && inputs.ngc_path != ''
        id: prepare-umbrella
        env:
          APP_VERSION: ${{ inputs.app_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          prepared_chart_dir="${RUNNER_TEMP}/nico-rest-chart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          .github/ci/prepare-rest-umbrella-chart.sh \
            helm/rest/nico-rest \
            "${CHART_VERSION}" \
            "${APP_VERSION}" \
            "${prepared_chart_dir}"
          echo "chart_path=${prepared_chart_dir}" >> "${GITHUB_OUTPUT}"

      - name: Package and push Helm chart to NGC
        id: publish_helm
        continue-on-error: true
        if: ${{ inputs.ngc_path != '' }}
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-package-push@0fb54ee0cb478221430623b878faa133a4706069 # v1.27.8
        with:
          chart-path: ${{ steps.prepare-umbrella.outputs.chart_path || matrix.chart }}
          chart-version: ${{ inputs.chart_version }}
          app-version: ${{ inputs.app_version }}
          lint: 'false'
          ngc-key: ${{ secrets.NICO_NGC_TOKEN || secrets.NVCR_STG_TOKEN }}
          ngc-path: ${{ inputs.ngc_path }}
          ngc-duplicate: verify

      - name: Retry package and push Helm chart to NGC
        if: ${{ steps.publish_helm.outcome == 'failure' }}
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-package-push@0fb54ee0cb478221430623b878faa133a4706069 # v1.27.8
        with:
          chart-path: ${{ steps.prepare-umbrella.outputs.chart_path || matrix.chart }}
          chart-version: ${{ inputs.chart_version }}
          app-version: ${{ inputs.app_version }}
          lint: 'false'
          ngc-key: ${{ secrets.NICO_NGC_TOKEN || secrets.NVCR_STG_TOKEN }}
          ngc-path: ${{ inputs.ngc_path }}
          ngc-duplicate: verify
