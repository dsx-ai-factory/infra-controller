name: Helm Charts

on:
  workflow_call:
    inputs:
      ngc_path:
        required: false
        type: string
        default: ''
      app_version:
        description: "Application version for Helm chart appVersion"
        required: true
        type: string
      chart_version:
        description: "Helm chart version (SemVer-strict, derived from git describe). Aligned with core's helm_version."
        required: true
        type: string
    secrets:
      NVCR_STG_TOKEN:
        required: true
      NICO_NGC_TOKEN:
        required: false

jobs:
  validate-charts:
    name: Validate Helm Charts
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        include:
          - chart: helm/rest/nico-rest
            valueOverrides: '["nico-rest-api.config.keycloak.enabled=true","nico-rest-api.config.keycloak.baseURL=http://keycloak:8082","nico-rest-api.config.keycloak.realm=test","nico-rest-api.config.keycloak.clientID=test"]'
          - chart: helm/rest/nico-rest-site-agent
            valueOverrides: '[]'
          - chart: helm/rest/nico-mcp
            valueOverrides: '[]'
          - chart: helm/charts/nico-flow
            valueOverrides: '[]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Helm chart
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-validate@94bde998f5d7965576b0c663db7d5d709c918167
        with:
          chart-path: ${{ matrix.chart }}
          lint: 'true'
          template: 'true'
          valueOverrides: ${{ matrix.valueOverrides }}

  verify-securitycontext-configurable:
    name: Verify pod securityContext is overridable
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Assert podSecurityContext override is honored
        # Regression guard: every nico-rest workload must let the operator
        # replace the chart's default pod securityContext (e.g. drop the
        # hardcoded runAsUser/fsGroup so OpenShift can inject a range UID).
        # Rendering with each subchart's podSecurityContext set to null must
        # leave zero runAsUser in the output; a chart that hardcodes it
        # instead of using `{{- with .Values.podSecurityContext }}` fails here.
        run: |
          set -euo pipefail
          cd helm/rest/nico-rest
          helm dependency build
          rendered="$(helm template t . \
            --set nico-rest-api.config.keycloak.enabled=true \
            --set nico-rest-api.config.keycloak.baseURL=http://keycloak:8082 \
            --set nico-rest-api.config.keycloak.realm=test \
            --set nico-rest-api.config.keycloak.clientID=test \
            --set nico-rest-api.podSecurityContext=null \
            --set nico-rest-workflow.podSecurityContext=null \
            --set nico-rest-site-manager.podSecurityContext=null \
            --set nico-rest-cert-manager.podSecurityContext=null \
            --set nico-rest-db.podSecurityContext=null)"
          count="$(printf '%s\n' "$rendered" | grep -c 'runAsUser' || true)"
          if [ "$count" -ne 0 ]; then
            echo "::error::podSecurityContext is not overridable: found $count hardcoded runAsUser entries after nulling every subchart's podSecurityContext."
            printf '%s\n' "$rendered" | grep -n 'runAsUser' || true
            exit 1
          fi
          echo "OK: no hardcoded runAsUser remains when podSecurityContext is overridden."

  push-charts:
    name: Push Helm Charts
    needs:
      - validate-charts
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.validate-charts.result == 'success' && !contains(github.ref, 'pull-request/') }}
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        chart:
          - helm/rest/nico-rest
          - helm/rest/nico-rest-site-agent
          - helm/rest/nico-mcp
          - helm/charts/nico-flow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package and push Helm chart to NGC
        if: ${{ inputs.ngc_path != '' }}
        uses: dsx-ai-factory/dsx-github-actions/.github/actions/helm-package-push@7de619729962a6bd5e8355b6fb3582a22517d7e5
        with:
          chart-path: ${{ matrix.chart }}
          chart-version: ${{ inputs.chart_version }}
          app-version: ${{ inputs.app_version }}
          lint: 'false'
          ngc-key: ${{ secrets.NICO_NGC_TOKEN || secrets.NVCR_STG_TOKEN }}
          ngc-path: ${{ inputs.ngc_path }}
          ngc-duplicate: fail
