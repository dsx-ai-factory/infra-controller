# Validates Fern docs configuration on pull requests.
#
# Fork PRs: do not run on untrusted head (copy-pr-bot FAQ). Same-repo PRs run
# on pull_request. After /ok-to-test, copy-pr-bot pushes pull-request/<n>;
# we run on that push like NICo Core CI (see ci.yaml).

name: Fern docs (check)

on:
  pull_request:
    paths:
      - 'fern/**'
      - 'docs/**'
      - 'rest-api/openapi/spec.yaml'
      - 'tools/generate/**'
      - 'RELEASE.md'
      - '.github/workflows/fern-docs-ci.yml'
  push:
    branches:
      - 'pull-request/[0-9]+'
    paths:
      - 'fern/**'
      - 'docs/**'
      - 'rest-api/openapi/spec.yaml'
      - 'tools/generate/**'
      - 'RELEASE.md'
      - '.github/workflows/fern-docs-ci.yml'

permissions:
  contents: read

jobs:
  check:
    name: Fern Check
    # Same-repo PR only, or trusted copy-pr-bot branch after maintainer ok-to-test
    if: >-
      (github.event_name == 'push' && contains(github.ref, 'refs/heads/pull-request/'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install Fern CLI
        run: npm install -g fern-api@$(node -e "console.log(require('./fern/fern.config.json').version)")

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Generate Ansible module docs
        # Module doc pages are build artifacts (gitignored); generate them so
        # fern check validates the complete docs including the Module
        # Reference navigation. The committed navigation must match the
        # regeneration — fern check alone would validate the regenerated
        # file, letting a stale navigation pass and fail only after merge.
        run: |
          pip install pyyaml
          make ansible
          git diff --exit-code -- docs/index.yml \
            || { echo "ERROR: the docs/index.yml Module Reference navigation is stale."; \
                 echo "Run 'make ansible' and commit the regenerated file."; exit 1; }

      - name: Validate Fern configuration
        run: fern check
