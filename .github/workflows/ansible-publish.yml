name: Publish Ansible Collection

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish nvidia.infra_controller to Ansible Galaxy
    runs-on: linux-amd64-cpu4
    # NICo tags pre-release builds with suffixes (v2.4.0-rc.1, v2.5.0-pr).
    # Only final vX.Y.Z tags publish; pre-release tags skip this job.
    if: ${{ !contains(github.ref_name, '-') }}
    environment: ansible-galaxy-publish
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml ansible-core

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing collection version $TAG"

      - name: Validate version is strict semver
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "ERROR: tag must be strict semver (vX.Y.Z), got: $VERSION"; exit 1; }

      - name: Stamp release version in galaxy.yml and CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: $VERSION/" ansible/galaxy.yml
          sed -i "s/^## Unreleased.*/## v$VERSION/" ansible/CHANGELOG.md

      - name: Generate Ansible collection modules
        run: |
          python3 tools/generate/generate.py \
            --backend ansible \
            --spec rest-api/openapi/spec.yaml \
            --output ansible/plugins/modules \
            --root .

      - name: Build collection tarball
        working-directory: ansible
        run: ansible-galaxy collection build --output-path ../dist/

      - name: Create GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" > /dev/null 2>&1 \
            || gh release create "$TAG_NAME" \
                 --title "$TAG_NAME" \
                 --notes "Release $TAG_NAME" \
                 --draft=false

      - name: Upload tarball as release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" dist/*.tar.gz --clobber

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ansible-galaxy collection publish "dist/nvidia-infra_controller-${VERSION}.tar.gz" \
            --api-key "$GALAXY_KEY"

