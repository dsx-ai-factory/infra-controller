name: Publish Ansible Collection

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish nvidia.infra_controller to Ansible Galaxy
    runs-on: linux-amd64-cpu4
    environment: ansible-galaxy-publish
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml ansible-core

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing collection version $TAG"

      - name: Validate version is strict semver
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "ERROR: tag must be strict semver (vX.Y.Z), got: $VERSION"; exit 1; }

      - name: Set collection version in galaxy.yml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: $VERSION/" ansible/galaxy.yml

      - name: Generate Ansible collection modules and docs
        run: |
          python3 tools/generate/generate.py \
            --backend ansible \
            --spec rest-api/openapi/spec.yaml \
            --output ansible/plugins/modules \
            --docs-output docs/automation/ansible/modules

      - name: Upload generated docs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ansible-module-docs
          path: docs/automation/ansible/modules/
          retention-days: 1

      - name: Build collection tarball
        working-directory: ansible
        run: ansible-galaxy collection build --output-path ../dist/

      - name: Create GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" > /dev/null 2>&1 \
            || gh release create "$TAG_NAME" \
                 --title "$TAG_NAME" \
                 --notes "Release $TAG_NAME" \
                 --draft=false

      - name: Upload tarball as release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" dist/*.tar.gz --clobber

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ansible-galaxy collection publish "dist/nvidia-infra_controller-${VERSION}.tar.gz" \
            --api-key "$GALAXY_KEY"

  update-docs:
    name: Publish generated module docs to main
    needs: [publish]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: main

      - name: Clear stale module doc pages
        run: |
          find docs/automation/ansible/modules/ -name '*.md' -not -name 'index.md' -delete

      - name: Download generated docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansible-module-docs
          path: docs/automation/ansible/modules/

      - name: Commit generated docs
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/automation/ansible/modules/
          git diff --cached --quiet || git commit -s -m "docs(ansible): regenerate module reference for $TAG_NAME"
          git push origin HEAD:main
