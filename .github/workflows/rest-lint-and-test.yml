name: Lint and Test

on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: rest-api

env:
  GO_VERSION: "1.26.4"

jobs:
  style:
    name: Style Check
    runs-on: linux-amd64-cpu4
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rest-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download dependencies
        run: go mod download

      - name: Run revive
        run: |
          pkgs=$(go list ./... | grep -v $(go env GOMODCACHE))
          go list $pkgs | grep -v $(go env GOMODCACHE) | xargs -L1 go tool revive -config .revive.toml -set_exit_status

      - name: Run go fmt
        run: |
          pkgs=$(go list ./... | grep -v $(go env GOMODCACHE))
          go fmt $pkgs > /dev/null 2>&1
          if git diff --quiet; then
            echo "go fmt was clean"
          else
            echo "::error::go fmt was unclean on the following files:"
            git -P diff --name-only
            exit 1
          fi

      - name: Check REST command bundle contract
        run: make check-command-bundle

  lint-go:
    name: Lint Go
    runs-on: linux-amd64-cpu8
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rest-api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=10m --issues-exit-code=0 ./...
          working-directory: rest-api

  lint-openapi:
    name: Lint OpenAPI
    runs-on: linux-amd64-cpu4
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Run OpenAPI lint
        run: redocly lint ./openapi/spec.yaml --format=github-actions

  openapi-breaking-changes:
    name: OpenAPI Breaking Changes Check
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve OpenAPI comparison base
        id: openapi-base
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base HEAD origin/main)"

          echo "merge_base=${MERGE_BASE}" >> "${GITHUB_OUTPUT}"
          echo "Comparing OpenAPI changes against merge-base ${MERGE_BASE}"

      - name: Check OpenAPI breaking changes
        uses: oasdiff/oasdiff-action/breaking@a8c7f0e5649d20d623edb5b38446d3ab3d82d43c
        with:
          base: '${{ steps.openapi-base.outputs.merge_base }}:rest-api/openapi/spec.yaml'
          revision: ':rest-api/openapi/spec.yaml'
          fail-on: ERR
          # Allowlist reviewed one-time API contract corrections; see the
          # referenced ignore file for each accepted breaking-change report.
          err-ignore: 'rest-api/openapi/oasdiff-breaking-changes-ignore.txt'

  check-generated-files:
    name: Check Generated Files
    runs-on: linux-amd64-cpu4
    continue-on-error: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # The SDK is verified by regeneration in check-generated-sdk. Diffing the Redoc
      # bundle would cost a doc toolchain install, so it stays a path heuristic.
      - name: Check OpenAPI docs are up to date
        run: |
          BASE="origin/main"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "Base branch $BASE not found, skipping check."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          if echo "$CHANGED" | grep -q '^rest-api/openapi/spec.yaml$'; then
            if ! echo "$CHANGED" | grep -q '^rest-api/docs/index.html$'; then
              echo "::error::rest-api/openapi/spec.yaml was modified but rest-api/docs/index.html was not updated. Please run: make publish-openapi"
              exit 1
            fi
            echo "✓ rest-api/openapi/spec.yaml changed and rest-api/docs/index.html was also updated."
          else
            echo "✓ rest-api/openapi/spec.yaml not changed, skipping docs check."
          fi

  check-generated-sdk:
    name: Check Generated SDK
    runs-on: linux-amd64-cpu4
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rest-api/go.sum

      # The generator version itself is pinned in rest-api/Makefile.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # generate-sdk applies source headers with a Python script.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate SDK
        run: make generate-sdk

      - name: Check for uncommitted changes
        run: >-
          bash ../scripts/check-repo-clean.sh "REST SDK generation"
          "make rest-api/generate-sdk (from the repository root)"

  check-protobuf-generated:
    name: Check Protobuf Generated Code
    runs-on: linux-amd64-cpu4
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rest-api/go.sum

      - name: Regenerate protobuf code
        run: make core-proto

      - name: Check for uncommitted changes
        run: >-
          bash ../scripts/check-repo-clean.sh "REST protobuf generation"
          "make sync-protobuf (from the repository root)"

  test:
    name: Test (${{ matrix.module }})
    runs-on: linux-amd64-cpu8
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        module:
          - api
          - auth
          - cert-manager
          - common
          - db
          - flow
          - ipam
          - nvswitch-manager
          - powershelf-manager
          - proto
          - sdk-simple
          - site-agent
          - site-manager
          - site-workflow
          - workflow

    env:
      # db/pkg/util/testing.go uses 'postgres' hostname when CI=true (GitLab convention); force localhost.
      CI: "false"
      DB_NAME: nicotest
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 30432
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: rest-api/go.sum

      - name: Run unit tests for ${{ matrix.module }}
        working-directory: .
        run: make rest-api/test-${{ matrix.module }}
