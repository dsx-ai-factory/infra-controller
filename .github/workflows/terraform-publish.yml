name: Publish Terraform Provider

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  generate-and-pr:
    name: Generate Terraform provider Go files and open PR
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout infra-controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: pip install pyyaml

      - name: Resolve and validate version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s\n' "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Ref '${GITHUB_REF}' does not produce a valid semver version ('${TAG}'). Aborting."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generating provider for version $TAG"

      - name: Checkout terraform-provider-nvidia-infra-controller
        uses: actions/checkout@v4
        with:
          repository: dsx-ai-factory/terraform-provider-nvidia-infra-controller
          path: provider-repo
          token: ${{ secrets.PROVIDER_REPO_TOKEN }}

      - name: Generate Terraform provider Go files
        run: |
          python tools/generate/generate.py \
            --backend terraform \
            --spec rest-api/openapi/spec.yaml \
            --output provider-repo/internal/provider

      - name: Open or update PR in provider repo
        working-directory: provider-repo
        env:
          GH_TOKEN: ${{ secrets.PROVIDER_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BRANCH="generated/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset the branch
          if git ls-remote --exit-code origin "$BRANCH" > /dev/null 2>&1; then
            git checkout "$BRANCH"
            git reset --hard origin/main
          else
            git checkout -b "$BRANCH"
          fi

          git add internal/provider/
          git diff --cached --quiet && echo "No changes to generated files." && exit 0

          git commit -s \
            -m "chore: regenerate provider Go files for NICo v${VERSION}" \
            -m "Generated from dsx-ai-factory/infra-controller@${COMMIT_SHA} using tools/generate/generate.py --backend terraform."

          git push --force-with-lease origin "$BRANCH"

          # Create PR if none exists for this branch, otherwise update the existing one
          EXISTING_PR=$(gh pr list \
            --repo dsx-ai-factory/terraform-provider-nvidia-infra-controller \
            --head "$BRANCH" --json number -q '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --repo dsx-ai-factory/terraform-provider-nvidia-infra-controller \
              --base main \
              --head "$BRANCH" \
              --title "chore: regenerate provider Go files for NICo v${VERSION}" \
              --body "Automated regeneration from [\`infra-controller@${COMMIT_SHA}\`](https://github.com/dsx-ai-factory/infra-controller/commit/${COMMIT_SHA}) triggered by release tag \`v${VERSION}\`."
          fi
