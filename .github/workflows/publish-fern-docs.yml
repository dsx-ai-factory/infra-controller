# Publishes the Fern documentation site on push to main when a Fern input or this
# workflow file changes, or when manually triggered from the Actions tab.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'docs/**'
      - 'fern/**'
      - 'helm-prereqs/**'
      - 'rest-api/flow/docs/**'
      - 'rest-api/openapi/**'
      - 'RELEASE.md'
      - '.github/ci/fern-docs-paths.yml'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/fern-docs-*.yml'
      - '.github/workflows/publish-fern-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/fern-docs-ci.yml
    with:
      artifact: fern-publish

  publish:
    needs: build
    runs-on: linux-amd64-cpu4
    steps:
      - name: Download validated Fern inputs
        uses: actions/download-artifact@v4
        with:
          name: fern-publish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install Fern CLI
        run: npm install -g "fern-api@$(node -p 'require("./fern/fern.config.json").version')"

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./fern
        run: |
          set -o pipefail
          fern generate --docs 2>&1 | tee "$RUNNER_TEMP/fern-publish.log"
          grep -oE 'Published docs to https?://[^[:space:]()]+' "$RUNNER_TEMP/fern-publish.log" >> "$GITHUB_STEP_SUMMARY"
