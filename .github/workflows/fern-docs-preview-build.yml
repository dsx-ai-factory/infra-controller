name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'docs/**'
      - 'fern/**'
      - 'helm-prereqs/**'
      - 'rest-api/flow/docs/**'
      - 'rest-api/openapi/**'
      - 'RELEASE.md'
      - '.github/ci/fern-docs-paths.yml'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/fern-docs-*.yml'
      - '.github/workflows/publish-fern-docs.yml'

permissions:
  contents: read

jobs:
  preview:
    # Forks use the maintainer-approved copy-pr-bot push in Core CI.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/fern-docs-ci.yml
    with:
      artifact: fern-preview
