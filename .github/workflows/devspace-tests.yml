# Advisory only: keep this check out of required checks and publishing workflows.
# Load the PR job guard from the trusted base workflow. Fork PRs run on the
# copy-pr-bot branch after maintainer approval, not through PR events.
name: DevSpace regression tests (advisory)

on:
  pull_request_target:
    paths:
      - 'devspace.yaml'
      - 'dev/deployment/devspace/**'
      - 'pxe/scout-firmware-scripts/nvidia/dgxh100/cx7/metadata.toml'
      - 'pxe/mkosi.conf'
      - 'pxe/mkosi.extra/**'
      - 'pxe/mkosi.profiles/**'
      - 'pxe/common_files/forge-scout-network.sh'
      - 'pxe/common_files/scout-loader-rclocal'
      - 'crates/scout/misc/forge-scout.service'
      - '.github/workflows/devspace-tests.yml'
      - '.github/ci/test_devspace_workflow.py'
  push:
    branches:
      - 'pull-request/[0-9]+'
    paths:
      - 'devspace.yaml'
      - 'dev/deployment/devspace/**'
      - 'pxe/scout-firmware-scripts/nvidia/dgxh100/cx7/metadata.toml'
      - 'pxe/mkosi.conf'
      - 'pxe/mkosi.extra/**'
      - 'pxe/mkosi.profiles/**'
      - 'pxe/common_files/forge-scout-network.sh'
      - 'pxe/common_files/scout-loader-rclocal'
      - 'crates/scout/misc/forge-scout.service'
      - '.github/workflows/devspace-tests.yml'
      - '.github/ci/test_devspace_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devspace-advisory-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  devspace-tests:
    name: DevSpace regressions (advisory)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/'))
      || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install regression test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml jq git coreutils gnupg gpgv

      - name: Check advisory workflow boundaries
        run: /usr/bin/python3 -B .github/ci/test_devspace_workflow.py

      - name: Run DevSpace regression tests
        run: /usr/bin/python3 -B -m unittest discover -s dev/deployment/devspace/tests -t dev/deployment/devspace -v

      - name: Test real VM lab configuration and lifecycle
        run: /usr/bin/python3 -B -m unittest discover -s dev/deployment/devspace/vm-hosts -p 'test_*.py'

      - name: Test vfkit launcher and isolated lab lifecycle
        run: /usr/bin/python3 -B -m unittest discover -s dev/deployment/devspace/vfkit/tests -t dev/deployment/devspace/vfkit -p 'test_*.py'
