name: Terraform Provider CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'
    paths:
      - 'rest-api/openapi/spec.yaml'
      - 'tools/generate/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.run_attempt == '1' && startsWith(github.ref, 'refs/heads/pull-request/') && format('terraform-pr-{0}', github.ref_name) || format('terraform-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == '1' && startsWith(github.ref, 'refs/heads/pull-request/') }}

jobs:
  terraform-generate-check:
    name: Validate Terraform provider generator
    runs-on: linux-amd64-cpu4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: pip install pyyaml

      - name: Dry-run Terraform generator and report resource count
        run: |
          output=$(python tools/generate/generate.py \
            --backend terraform \
            --spec rest-api/openapi/spec.yaml \
            --output /tmp/tf-provider \
            --dry-run 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep "Generated" | tee -a "$GITHUB_STEP_SUMMARY"
