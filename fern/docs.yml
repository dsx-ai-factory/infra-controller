# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

global-theme: nvidia

instances:
  - url: nvidia-ncx-infra-controller.docs.buildwithfern.com/infra-controller
    custom-domain: docs.nvidia.com/infra-controller
    multi-source: true

title: NVIDIA Infra Controller

announcement:
  message: "🔔 Infra Controller's GitHub repository has moved to [dsx-ai-factory/infra-controller](https://github.com/dsx-ai-factory/infra-controller). Existing links redirect; update integrations that reference NVIDIA/infra-controller."

metadata:
  canonical-host: "docs.nvidia.com/infra-controller"

check:
  rules:
    broken-links: error

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/infra-controller

products:
  - display-name: NVIDIA Infra Controller
    slug: /
    path: ../docs/index.yml
    # versions:
    #   - display-name: v2.0
    #     path: ../docs/index.yml

redirects:
  - source: "/infra-controller/index.html"
    destination: "/infra-controller/"
  - source: "/infra-controller/dev/index.html"
    destination: "/infra-controller/dev/"
  - source: "/infra-controller/documentation/architecture/state-machines/rack-state-machine"
    destination: "/infra-controller/documentation/architecture/state-machines/on-demand-rack-maintenance"
  - source: "/infra-controller/documentation/getting-started/building-ni-co-containers"
    destination: "/infra-controller/documentation/getting-started/building-nico-containers"
  - source: "/infra-controller/documentation/getting-started/site-setup"
    destination: "/infra-controller/documentation/getting-started/quick-start-guide"
  - source: "/infra-controller/documentation/introduction"
    destination: "/infra-controller/documentation/overview/what-is-nico"
  - source: "/infra-controller/documentation/operations-day-2/firmware-updates"
    destination: "/infra-controller/documentation/operations-day-2/firmware-updates/overview"
  - source: "/infra-controller/documentation/operations-day-2/observability/core-metrics"
    destination: "/infra-controller/documentation/operations-day-2/observability/core-metrics-list"
  - source: "/infra-controller/documentation/provisioning-day-0/boot-interfaces-and-dpu-modes"
    destination: "/infra-controller/documentation/provisioning-day-0/boot-interfaces-and-dpu-policies"
  - source: "/infra-controller/documentation/reference/release-notes"
    destination: "/infra-controller/documentation/release-notes"
