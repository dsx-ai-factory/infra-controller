suite: scale-test ServiceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: names the ServiceAccount from the release so two releases stay distinct
    release:
      name: run-a
      namespace: scale-ns
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: run-a-scale-test
      - equal:
          path: metadata.namespace
          value: scale-ns
      - equal:
          path: automountServiceAccountToken
          value: true
