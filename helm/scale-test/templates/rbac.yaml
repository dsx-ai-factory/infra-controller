apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scale-test.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-test.labels" . | nindent 4 }}
rules:
  # Fixtures claim, read, swap and remove a Lease in this namespace only. No
  # list/watch, no ClusterRole, no Secret access. Later suites add their own.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  {{- if dig "result" "enabled" false .Values.suites }}
  # The result suite claims, swaps and removes a result ConfigMap in this
  # namespace only. Delete is for fixture cleanup; the production run never
  # removes a result ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scale-test.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scale-test.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "scale-test.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-test.fullname" . }}
    namespace: {{ .Release.Namespace }}
