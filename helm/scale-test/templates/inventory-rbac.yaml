{{- if or (dig "inventory" "enabled" false .Values.suites) (dig "fleetup" "enabled" false .Values.suites) }}
{{- $ns := required "inventory.namespace is required when the inventory or fleetup suite is enabled" .Values.inventory.namespace }}
{{/* The Role lives in the MAT namespace, so its name hashes the full runner
     identity (namespace and release name) under a bounded display prefix, so
     two releases sharing a prefix or namespace do not collide there. */}}
{{- $hash := printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 10 -}}
{{- $name := printf "%s-inv-%s" (include "scale-test.fullname" . | trunc 45 | trimSuffix "-") $hash -}}
# The test SA (in the release namespace) may list Pods/Services in the target MAT namespace only. No ClusterRole, watch, write or Secret read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "scale-test.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "scale-test.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scale-test.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
