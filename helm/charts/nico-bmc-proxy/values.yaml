## =============================================================================
## nico-bmc-proxy - Authenticating HTTP proxy for BMC's
## =============================================================================

global:
  certificate:
    duration: 720h0m0s
    renewBefore: 360h0m0s
    privateKey:
      algorithm: ECDSA
      size: 384
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io
  spiffe:
    trustDomain: nico.local
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: site-controller

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

namespaceOverride: ""

replicas: 2
automountServiceAccountToken: true
annotations:
  configmap.reloader.stakater.com/reload: '{{ include "nico-bmc-proxy.name" . }}-config-files, {{ include "nico-bmc-proxy.name" . }}-site-config-files'

resources:
  limits:
    cpu: 4
    memory: 2Gi
  requests:
    cpu: 1
    memory: 512Mi

service:
  proxy:
    port: 1079
  metrics:
    port: 1080

certificate:
  serviceName: ""
  spiffeServiceName: ""
  identityNamespace: ""
  ## Fully override the auto-generated dnsNames/uris. When empty, dnsNames and
  ## uris are generated from serviceName + namespace (extraDnsNames/extraUris
  ## are appended to the generated list).
  dnsNames: []
  uris: []
  extraDnsNames: []
  extraUris: []

command:
  - /bin/sh
  - -c
  - |
    if [ -x /opt/nico/nico-bmc-proxy ]; then
      exec /opt/nico/nico-bmc-proxy --config-path /etc/nico/nico-bmc-proxy/nico-bmc-proxy.toml
    else
      exec /opt/carbide/carbide-bmc-proxy --config-path /etc/forge/carbide-bmc-proxy/carbide-bmc-proxy.toml
    fi

env:
  VAULT_PKI_ROLE_NAME: "nico-cluster"
  RUST_BACKTRACE: "full"
  RUST_LIB_BACKTRACE: "0"

extraEnv: []

envFrom:
  vaultApproleTokens:
    secretName: nico-vault-approle-tokens
  vaultToken:
    secretName: nico-vault-token
  vaultClusterInfo:
    configMapName: vault-cluster-info
  databaseCredentials:
    secretName: nico-system.nico.nico-pg-cluster.credentials
  databaseConfig:
    configMapName: nico-system-nico-database-config

livenessProbe:
  httpGet:
    port: 1080
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 20
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 20

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 25s

auth:
  ## Namespace component accepted in SPIFFE service/machine IDs. Empty = deploy ns.
  namespace: ""
  ## SPIFFE service-id of the API allowed full access (allowed_principals + ACL).
  apiPrincipal: nico-api

## nico-api Service the default config dials,
## configFiles.nicoBmcProxyConfig replaces the default config
apiServiceName: nico-api

configFiles:
  nicoBmcProxyConfig: ""

bmcProxy:
  listen: "[::]:1079"
  allowedPrincipals: []
  ## Redirect handling mode: follow_same_origin (default) or return_to_client (experimental).
  redirectMode: follow_same_origin

## The proxy's own client certificate for switches whose NVUE REST API
## requires one (NVUE mTLS), and the CA a switch's certificate must chain to.
## Enabled, the chart asks cert-manager for the certificate, mounts its Secret
## read-only at mountPath, and sets all four keys of the proxy's [tls.switch]
## through NICO_BMC_PROXY__TLS__SWITCH__* environment variables, which take
## precedence over any [tls.switch] in configFiles.nicoBmcProxyConfig.
## Disabled, the chart sets none of them: the proxy reaches a switch as it
## reaches a BMC, presenting no client certificate and accepting any server
## certificate, unless configFiles.nicoBmcProxyConfig has a [tls.switch].
switchTls:
  enabled: false
  ## The site's switch issuer: the CA behind it must be the one the switches
  ## trust for client certificates.
  issuerRef:
    kind: ClusterIssuer
    name: vault-nico-issuer
    group: cert-manager.io
  name: nico-bmc-proxy-switch-client-certificate
  secretName: nico-bmc-proxy-switch-client-certificate
  mountPath: /var/run/secrets/switch-client
  duration: 720h0m0s
  renewBefore: 360h0m0s
  ## At least one URI SAN is required when enabled: the identity the
  ## switches' client policy allows the proxy. The issuer and any cert-manager
  ## approver policy must allow it too.
  uris: []
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  ## PEM CA bundle a switch's certificate must chain to. The default is the
  ## site root the chart mounts from Secret/nico-roots.
  caCertPath: /var/run/secrets/nico-roots/ca.crt
  ## DNS name every switch's certificate carries, when they share one instead
  ## of carrying their IPs. Empty checks each switch's certificate against
  ## its IP, whatever name configFiles.nicoBmcProxyConfig gives.
  tlsServerName: ""

vaultClusterInfo: {}

databaseConfig: {}

externalService:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations: {}
