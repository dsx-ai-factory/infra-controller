suite: hardware-health resources
templates:
  - templates/deployment.yaml
tests:
  - it: leaves resources empty by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value: {}

  - it: allows resource requests and limits
    set:
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
