{{- $shutdownTimeout := "20s" }}
{{- if and (kindIs "map" .Values.env) (hasKey .Values.env "CARBIDE_HEALTH__SHUTDOWN_TIMEOUT") }}
{{- $shutdownTimeout = toString (index .Values.env "CARBIDE_HEALTH__SHUTDOWN_TIMEOUT") }}
{{- end }}
{{- if and (regexMatch "^[0-9]+s$" $shutdownTimeout) (le (int .Values.terminationGracePeriodSeconds) (int (trimSuffix "s" $shutdownTimeout))) }}
{{- fail (printf "terminationGracePeriodSeconds (%v) must exceed hardware-health's shutdown_timeout (%s)" .Values.terminationGracePeriodSeconds $shutdownTimeout) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nico-hardware-health.name" . }}
  namespace: {{ include "nico-hardware-health.namespace" . }}
  labels:
    {{- include "nico-hardware-health.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nico-hardware-health.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nico-hardware-health.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nico-hardware-health.name" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "nico-hardware-health.name" . }}
          image: "{{ include "nico-hardware-health.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
          command:
            - /bin/sh
            - -c
            - |
              {{- $fdLimit := 65536 }}
              {{- if not (kindIs "invalid" .Values.fileDescriptorLimit) }}
              {{- $fdLimit = .Values.fileDescriptorLimit | int }}
              {{- end }}
              {{- if le $fdLimit 0 }}
              {{- fail "fileDescriptorLimit must be a positive integer" }}
              {{- end }}
              FD_LIMIT={{ $fdLimit }}
              FD_REQUESTED="$FD_LIMIT"
              FD_HARD="$(ulimit -Hn)"
              if [ "$FD_HARD" != "unlimited" ] && [ "$FD_LIMIT" -gt "$FD_HARD" ]; then
                echo "fileDescriptorLimit ${FD_LIMIT} exceeds the hard limit ${FD_HARD}; clamping" >&2
                FD_LIMIT="$FD_HARD"
              fi
              ulimit -Sn "$FD_LIMIT" || { echo "ulimit -Sn ${FD_LIMIT} failed (requested ${FD_REQUESTED}, hard limit ${FD_HARD})" >&2; exit 1; }
              if [ -x /opt/nico/nico-hw-health ]; then
                exec /opt/nico/nico-hw-health
              else
                exec /opt/carbide/forge-hw-health
              fi
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: "/var/run/secrets/spiffe.io"
              name: spiffe
              readOnly: true
        {{- range $index, $entry := .Values.extraContainers }}
        {{- $container := omit $entry "repository" "tag" }}
        {{- $_ := set $container "image" (include "nico.containerImage" (dict "container" $entry "path" (printf "%s.extraContainers[%d]" $.Chart.Name $index))) }}
        {{- toYaml (list $container) | nindent 8 }}
        {{- end }}
      volumes:
        - name: spiffe
          secret:
            secretName: {{ include "nico-hardware-health.name" . }}-certificate
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
