suite: External PXE Service address families
templates:
  - external-service.yaml
tests:
  - it: keeps cluster defaults when family settings are omitted
    set:
      nameOverride: custom-pxe
      externalService:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: custom-pxe
      - notExists:
          path: spec.ipFamilyPolicy
      - notExists:
          path: spec.ipFamilies

  - it: selects IPv6 for every external Service
    set:
      externalService:
        enabled: true
        ipFamilyPolicy: SingleStack
        ipFamilies: [IPv6]
        annotations:
          metallb.io/loadBalancerIPs: "2001:db8::1"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.ipFamilyPolicy
          value: SingleStack
      - equal:
          path: spec.ipFamilies
          value: [IPv6]

  - it: preserves the requested primary family for dual-stack allocation
    set:
      externalService:
        enabled: true
        ipFamilyPolicy: RequireDualStack
        ipFamilies: [IPv6, IPv4]
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.ipFamilyPolicy
          value: RequireDualStack
      - equal:
          path: spec.ipFamilies
          value: [IPv6, IPv4]
