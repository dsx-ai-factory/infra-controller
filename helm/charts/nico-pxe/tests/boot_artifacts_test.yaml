suite: boot artifact init containers
templates:
  - deployment.yaml
tests:
  - it: should mount writable boot-artifacts storage without init containers
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - contains:
          path: spec.template.spec.volumes
          content:
            name: boot-artifacts
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal

  - it: should render boot artifact init containers with auto-injected volume mount
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
        - name: boot-artifacts-aarch64
          image: registry.example.com/boot-artifacts-aarch64:latest
          command: ["sh", "-c", "cp -r /aarch64 /apt /firmware /forge-boot-artifacts/blobs/internal"]
    asserts:
      - exists:
          path: spec.template.spec.initContainers
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: boot-artifacts-x86-64
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.runAsNonRoot

  - it: should build image from repository + tag when provided (new fields win)
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          repository: registry.example.com/boot-artifacts-x86_64
          tag: v1.2.3
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/boot-artifacts-x86_64:v1.2.3

  - it: should ignore combined image when repository + tag are also set (new fields win)
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          repository: registry.example.com/boot-artifacts-x86_64
          tag: v1.2.3
          image: legacy.example.com/should-be-ignored:old
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/boot-artifacts-x86_64:v1.2.3

  - it: should add boot-artifacts volume and mount on main container
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: boot-artifacts
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal

  - it: should use configurable serve path
    set:
      bootArtifacts:
        servePath: /custom-boot-path
    asserts:
      # The container runs a shell binary-picker, so the serve path is rendered
      # into the command script as `-s <path>` rather than into container args.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '-s /custom-boot-path'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /custom-boot-path/blobs/internal

  - it: should default serve path to /forge-boot-artifacts
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '-s /forge-boot-artifacts'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal

  - it: should merge bootArtifactContainers and initContainers
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
      initContainers:
        - name: custom-init
          image: busybox:latest
          command: ["sh", "-c", "echo hello"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: boot-artifacts-x86-64
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: custom-init
