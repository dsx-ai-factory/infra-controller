suite: boot artifact init containers
templates:
  - deployment.yaml
tests:
  - it: should preserve image-bundled boot artifacts without init containers
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: boot-artifacts
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
          any: true

  - it: should render boot artifact init containers with auto-injected volume mount
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
        - name: boot-artifacts-aarch64
          image: registry.example.com/boot-artifacts-aarch64:latest
          command: ["sh", "-c", "set -e; cp -r /aarch64 /apt /forge-boot-artifacts/blobs/internal; chgrp -R 10001 /forge-boot-artifacts/blobs/internal/aarch64 /forge-boot-artifacts/blobs/internal/apt; chmod -R g+rX /forge-boot-artifacts/blobs/internal/aarch64 /forge-boot-artifacts/blobs/internal/apt"]
    asserts:
      - exists:
          path: spec.template.spec.initContainers
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 3
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: boot-artifacts-x86-64
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.runAsNonRoot
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: boot-artifacts-permissions
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.capabilities.add
          value: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: 'chmod -R g\+rX /forge-boot-artifacts/blobs/internal'

  - it: should build image from repository + tag when provided (new fields win)
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          repository: registry.example.com/boot-artifacts-x86_64
          tag: v1.2.3
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/boot-artifacts-x86_64:v1.2.3

  - it: should ignore combined image when repository + tag are also set (new fields win)
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          repository: registry.example.com/boot-artifacts-x86_64
          tag: v1.2.3
          image: legacy.example.com/should-be-ignored:old
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.example.com/boot-artifacts-x86_64:v1.2.3

  - it: should add boot-artifacts volume and mount on main container
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: boot-artifacts
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /forge-boot-artifacts/blobs/internal

  - it: should use configurable serve path
    set:
      bootArtifactContainers:
        - name: boot-artifacts
          image: registry.example.com/boot-artifacts:latest
      bootArtifacts:
        servePath: /custom-boot-path
    asserts:
      # The container runs a shell binary-picker, so the serve path is rendered
      # into the command script as `-s <path>` rather than into container args.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '-s /custom-boot-path'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: boot-artifacts
            mountPath: /custom-boot-path/blobs/internal

  - it: should default serve path to /forge-boot-artifacts
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '-s /forge-boot-artifacts'

  - it: should merge bootArtifactContainers and initContainers
    set:
      bootArtifactContainers:
        - name: boot-artifacts-x86-64
          image: registry.example.com/boot-artifacts-x86_64:latest
          command: ["sh", "-c", "cp -r /x86_64 /forge-boot-artifacts/blobs/internal"]
      initContainers:
        - name: custom-init
          image: busybox:latest
          command: ["sh", "-c", "echo hello"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 3
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: boot-artifacts-x86-64
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: custom-init
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: boot-artifacts-permissions

  - it: should reject empty split and fallback images
    set:
      bootArtifactContainers:
        - name: empty-image
          repository: registry.example.com/boot-artifacts
          tag: ""
          image: ""
    asserts:
      - failedTemplate:
          errorMessage: "nico-pxe.bootArtifactContainers[0] requires either non-empty repository and tag or a non-empty image"
