{{/*
Legacy name alias — ExternalName Service enabled by default that makes the legacy
"carbide-pxe.<alias-namespace>.svc.cluster.local" hostname resolve to
this chart's nico-pxe Service.

Why: pre-rename binaries (DPU agents, host PXE loaders) hardcode the
legacy URL. Rather than rebuild every consumer, the chart provides the
alias so both the modern and legacy names resolve simultaneously,
pointing at the same pods.

Note: this template only creates Services; nico-pxe has no createNamespace
option. setup.sh prepares missing alias namespaces after Core deployment is
accepted. Direct Helm/GitOps installs must prepare them separately or share a
namespace explicitly created by an API alias with createNamespace: true.
Enabling API aliases alone does not create namespaces; that option defaults
to false. Without the namespace, applying this Service fails.
*/}}
{{- if and .Values.legacyAlias .Values.legacyAlias.enabled }}
{{- range $alias := .Values.legacyAlias.aliases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $alias.name }}
  namespace: {{ $alias.namespace }}
  labels:
    {{- include "nico-pxe.labels" $ | nindent 4 }}
    nico.nvidia.com/legacy-alias-of: {{ include "nico-pxe.name" $ }}
spec:
  type: ExternalName
  externalName: {{ include "nico-pxe.name" $ }}.{{ include "nico-pxe.namespace" $ }}.svc.cluster.local
  ports:
    - name: http
      port: {{ $.Values.service.port | default 8080 }}
      protocol: TCP
{{- end }}
{{- end }}
