{{- if .Values.externalService.enabled }}
{{- $annotations := include "nico.sharedIpAnnotations" (dict "service" .Values.externalService "group" (include "nico-pxe.name" .) "annotations" .Values.externalService.annotations) | fromYaml }}
{{- $rawPort := toString (.Values.externalService.port | default 8080) }}
{{- if not (regexMatch "^[1-9][0-9]{0,4}$" $rawPort) }}
{{- fail (printf "nico-pxe: externalService.port must be a port number, got %q" $rawPort) }}
{{- end }}
{{- $port := int $rawPort }}
{{- /* An absent alternatePort keeps port 80, which DPU agents use; an explicit 0 omits the Service. */}}
{{- $alternatePort := 80 }}
{{- if hasKey .Values.externalService "alternatePort" }}
{{- $rawAlternate := toString .Values.externalService.alternatePort }}
{{- if not (regexMatch "^[0-9]{1,5}$" $rawAlternate) }}
{{- fail (printf "nico-pxe: externalService.alternatePort must be a port number or 0, got %q" $rawAlternate) }}
{{- end }}
{{- $alternatePort = int $rawAlternate }}
{{- end }}
{{- if and $alternatePort (eq $alternatePort $port) }}
{{- fail (printf "nico-pxe: externalService.port and externalService.alternatePort are both %d; use different ports or set alternatePort to 0" $alternatePort) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nico-pxe.name" . }}-external
  namespace: {{ include "nico-pxe.namespace" . }}
  {{/* Keep the external Service's part-of value without duplicating the helper's key. */}}
  labels:
    {{- omit (include "nico-pxe.labels" . | fromYaml) "app.kubernetes.io/part-of" | toYaml | nindent 4 }}
    app.kubernetes.io/part-of: {{ include "nico-pxe.name" . }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.externalService.type | default "LoadBalancer" }}
  {{- with .Values.externalService.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.externalService.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.externalService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.externalService.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "nico-pxe.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ $port }}
      targetPort: 8080
      name: http
      protocol: TCP
{{- if $alternatePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nico-pxe.name" . }}-external-80
  namespace: {{ include "nico-pxe.namespace" . }}
  {{/* Keep the external Service's part-of value without duplicating the helper's key. */}}
  labels:
    {{- omit (include "nico-pxe.labels" . | fromYaml) "app.kubernetes.io/part-of" | toYaml | nindent 4 }}
    app.kubernetes.io/part-of: {{ include "nico-pxe.name" . }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.externalService.type | default "LoadBalancer" }}
  {{- with .Values.externalService.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.externalService.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.externalService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.externalService.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "nico-pxe.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ $alternatePort }}
      targetPort: 8080
      name: http
      protocol: TCP
{{- end }}
{{- end }}
