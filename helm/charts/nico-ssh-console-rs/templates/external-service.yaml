{{- if .Values.externalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nico-ssh-console-rs.name" . }}-external
  namespace: {{ include "nico-ssh-console-rs.namespace" . }}
  labels:
    {{- include "nico-ssh-console-rs.labels" . | nindent 4 }}
  {{- with .Values.externalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.externalService.type | default "LoadBalancer" }}
  {{- with .Values.externalService.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.externalService.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "nico-ssh-console-rs.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.externalService.port | default 22 }}
      targetPort: 22
      name: ssh
      protocol: TCP
{{- end }}
