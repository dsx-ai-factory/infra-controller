apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-ssh-console-rs.name" . }}-config-files
  namespace: {{ include "nico-ssh-console-rs.namespace" . }}
  labels:
    {{- include "nico-ssh-console-rs.labels" . | nindent 4 }}
data:
  config.toml: |
    {{- if .Values.configFiles.config }}
    {{- .Values.configFiles.config | nindent 4 }}
    {{- else }}
    {{- /* Replace hardcoded nico-system namespace with actual global.namespace */ -}}
    {{- $config := .Files.Get "files/ssh-console-rs-config.toml" | replace "nico-system" (include "nico-ssh-console-rs.namespace" .) | replace "nico.local" .Values.global.spiffe.trustDomain | replace "/sa/nico-api" (printf "/sa/%s" .Values.apiServiceName) | replace "https://nico-api." (printf "https://%s." .Values.apiServiceName) -}}
    {{- /* Operator certificate auth. Substitutes the empty placeholders in the packaged
           config so a deployment can set just these two without restating the whole file.
           Left unset, the placeholders stand and certificate auth stays disabled. */ -}}
    {{- $sshConsole := .Values.sshConsole | default dict -}}
    {{- with $sshConsole.opensshCertificateCaFingerprints | default list -}}
    {{- $config = $config | replace "openssh_certificate_ca_fingerprints = []" (printf "openssh_certificate_ca_fingerprints = %s" (toJson .)) -}}
    {{- end -}}
    {{- with $sshConsole.adminCertificateRole | default "" -}}
    {{- $config = $config | replace "admin_certificate_role = \"\"" (printf "admin_certificate_role = %s" (quote .)) -}}
    {{- end -}}
    {{- /* BMC connection pool. Each key is prepended only when set, so unset values keep the
           binary defaults and the rendered file is unchanged. */ -}}
    {{- $bmcPool := $sshConsole.bmcPool | default dict -}}
    {{- $poolConfig := "" -}}
    {{- if not (kindIs "invalid" $bmcPool.maxConnections) -}}
    {{- if le (int $bmcPool.maxConnections) 0 -}}
    {{- fail "sshConsole.bmcPool.maxConnections must be a positive integer" -}}
    {{- end -}}
    {{- $poolConfig = printf "%smax_bmc_connections = %d\n" $poolConfig (int $bmcPool.maxConnections) -}}
    {{- end -}}
    {{- with $bmcPool.onDemandIdleTimeout | default "" -}}
    {{- $poolConfig = printf "%son_demand_bmc_idle_timeout = %s\n" $poolConfig (quote .) -}}
    {{- end -}}
    {{- if not (kindIs "invalid" $bmcPool.maxConcurrentProbes) -}}
    {{- if le (int $bmcPool.maxConcurrentProbes) 0 -}}
    {{- fail "sshConsole.bmcPool.maxConcurrentProbes must be a positive integer" -}}
    {{- end -}}
    {{- $poolConfig = printf "%smax_concurrent_bmc_probes = %d\n" $poolConfig (int $bmcPool.maxConcurrentProbes) -}}
    {{- end -}}
    {{- if $poolConfig -}}
    {{- $config = printf "## BMC connection pool (sshConsole.bmcPool)\n%s\n%s" $poolConfig $config -}}
    {{- end -}}
    {{- $config | nindent 4 }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-ssh-console-rs.name" . }}-otelcol-config
  namespace: {{ include "nico-ssh-console-rs.namespace" . }}
  labels:
    {{- include "nico-ssh-console-rs.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.configFiles.otelcolConfig }}
    {{- .Values.configFiles.otelcolConfig | nindent 4 }}
    {{- else }}
    {{- .Files.Get "files/otelcol-config.yaml" | nindent 4 }}
    {{- end }}
