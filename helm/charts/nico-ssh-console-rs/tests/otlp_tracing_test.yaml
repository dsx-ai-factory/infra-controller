suite: OTLP span export endpoint
templates:
  - deployment.yaml
tests:
  - it: renders no env block when no collector endpoint is configured
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: treats an empty endpoint as unconfigured rather than rendering an empty value
    set:
      otlpEndpoint: ""
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: exports spans to the configured collector
    set:
      otlpEndpoint: http://opentelemetry-collector.otel.svc.cluster.local:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://opentelemetry-collector.otel.svc.cluster.local:4317

  - it: lets env override the span level alongside the endpoint
    set:
      otlpEndpoint: http://opentelemetry-collector.otel.svc.cluster.local:4317
      env:
        NICO_TRACES_SPAN_LEVEL: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NICO_TRACES_SPAN_LEVEL
            value: debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://opentelemetry-collector.otel.svc.cluster.local:4317
