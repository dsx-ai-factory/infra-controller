{{- $dhcp := default (dict) .Values.dhcp -}}
{{- $env := deepCopy .Values.env -}}
{{- with .Values.otlpEndpoint -}}
{{- $_ := set $env "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT" . -}}
{{- end -}}
{{- if $dhcp.v6Enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nico-dhcp.name" . }}6
  namespace: {{ include "nico-dhcp.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "nico-dhcp.name" . }}6
    app.kubernetes.io/component: dhcp
  annotations:
    configmap.reloader.stakater.com/reload: '{{ include "nico-dhcp.name" . }}6-config'
spec:
  replicas: 1
  # Pod-local memfiles do not support concurrent active writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nico-dhcp.name" . }}6
      app.kubernetes.io/component: dhcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nico-dhcp.name" . }}6
        app.kubernetes.io/component: dhcp
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-v6.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "nico-dhcp.name" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "nico-dhcp.name" . }}6
          image: "{{ include "nico-dhcp.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            {{- with .Values.containerSecurityContext }}
            {{- $ctxOverrides := omit . "allowPrivilegeEscalation" }}
            {{- with $ctxOverrides }}
            {{- toYaml $ctxOverrides | nindent 12 }}
            {{- end }}
            {{- end }}
          command:
            - sh
            - -ec
            - |
              # /var/run/kea and /var/lib/kea are emptyDir mounts (see volumes
              # below) so a non-root UID or a read-only root filesystem can
              # still write the runtime config and PID file. The emptyDir
              # survives container restarts, so clear any stale PID file —
              # Kea restarts as PID 1, sees the recorded PID as live, and
              # exits repeatedly otherwise.
              rm -f /var/run/kea/*.pid
              # Interface-only Kea selectors bind link-local sockets; relay VIPs need the pod's routable IPv6.
              address="$(ip -6 -o addr show dev "$DHCP_INTERFACE" scope global | awk '{split($4, address, "/"); print address[1]; exit}')"
              test -n "$address" || { echo "DHCPv6 requires a routable IPv6 address on $DHCP_INTERFACE" >&2; exit 1; }
              sed "s/__NICO_DHCPV6_ADDRESS__/$address/g" /tmp/kea_config6.json > /var/run/kea/kea_config6.json
              exec /sbin/kea-dhcp6 -c /var/run/kea/kea_config6.json
          env:
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DHCP_INTERFACE
              value: {{ default "eth0" $dhcp.interface | quote }}
          ports:
            - name: dhcp6
              containerPort: 547
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          startupProbe:
            exec:
              command: ['sh', '-ec', 'ss -H -6 -lun "sport = :547" | grep -q .']
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['sh', '-ec', 'ss -H -6 -lun "sport = :547" | grep -q . && curl --noproxy "*" -fsS --max-time 2 http://[::1]:{{ .Values.metrics.port }}/ready']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          volumeMounts:
            - name: spiffe
              mountPath: /var/run/secrets/spiffe.io
              readOnly: true
            - name: config
              mountPath: /tmp
              readOnly: true
            - name: kea-run
              mountPath: /var/run/kea
            - name: kea-lib
              mountPath: /var/lib/kea
      volumes:
        - name: spiffe
          secret:
            secretName: {{ include "nico-dhcp.name" . }}-certificate
        - name: kea-run
          emptyDir: {}
        - name: kea-lib
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "nico-dhcp.name" . }}6-config
{{- end }}
