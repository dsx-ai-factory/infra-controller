{{- if .Values.imagePullSecret.create }}
## Pull Secret created when imagePullSecret.create is set; reference it from
## global.imagePullSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: image-pull-secret
  namespace: {{ include "nico-machine-a-tron.namespace" . }}
  labels:
    {{- include "nico-machine-a-tron.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
