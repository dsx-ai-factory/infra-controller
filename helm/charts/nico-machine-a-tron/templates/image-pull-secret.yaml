{{- if .Values.imagePullSecret.create }}
## Docker registry pull Secret; reference it from global.imagePullSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: machine-a-tron-pull
  namespace: {{ include "nico-machine-a-tron.namespace" . }}
  labels:
    {{- include "nico-machine-a-tron.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ required "imagePullSecret.dockerconfigjson must be set when imagePullSecret.create is true" .Values.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
