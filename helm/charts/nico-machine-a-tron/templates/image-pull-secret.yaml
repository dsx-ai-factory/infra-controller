{{- if .Values.imagePullSecret.create }}
## Docker registry pull Secret for the machine-a-tron namespace, created only
## when imagePullSecret.create is set. Reference it from
## global.imagePullSecrets so the Deployments use it.
##
## An ordinary release resource, not a pre-install hook: hooks run before any
## release manifest is applied, so a hook Secret would target the Namespace
## from namespace.yaml before it exists. Helm's install order creates the
## Namespace, then this Secret, then the Deployments that pull with it.
apiVersion: v1
kind: Secret
metadata:
  name: image-pull-secret
  namespace: {{ include "nico-machine-a-tron.namespace" . }}
  labels:
    {{- include "nico-machine-a-tron.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
