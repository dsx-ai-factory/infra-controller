{{- if and .Values.global.namespaceOverride .Values.createNamespace }}
## Labeled nico.nvidia.com/managed=true so the nico-roots ClusterExternalSecret
## in helm-prereqs syncs the site CA into this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "nico-machine-a-tron.namespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "nico-machine-a-tron.labels" . | nindent 4 }}
    nico.nvidia.com/managed: "true"
{{- end }}
