{{- if .Values.persistence.enabled }}
{{- $root := . }}
{{- $namespace := include "nico-machine-a-tron.namespace" . }}
{{- $baseName := include "nico-machine-a-tron.name" . }}

{{- range $podName, $podConfig := .Values.pods }}
{{/* Skip unconfigured pods */}}
{{- if not (include "nico-machine-a-tron.podConfigured" $podConfig) }}
{{- continue }}
{{- end }}

{{- $name := printf "%s-%s" $baseName $podName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ $namespace }}
  labels:
    {{- include "nico-machine-a-tron.labels" $root | nindent 4 }}
    nvidia-infra-controller/pod-name: {{ $podName | quote }}
spec:
  accessModes:
    {{- toYaml $root.Values.persistence.accessModes | nindent 4 }}
  {{- if $root.Values.persistence.storageClass }}
  storageClassName: {{ $root.Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $root.Values.persistence.size }}
{{- end }}
{{- end }}
