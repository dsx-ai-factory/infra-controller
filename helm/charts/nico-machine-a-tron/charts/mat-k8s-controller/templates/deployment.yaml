{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mat-k8s-controller.fullname" . }}
  namespace: {{ include "mat-k8s-controller.namespace" . }}
  labels:
    {{- include "mat-k8s-controller.labels" . | nindent 4 }}
spec:
  # Namespace-scoped controller without leader election: one replica always
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mat-k8s-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mat-k8s-controller.selectorLabels" . | nindent 8 }}
    spec:
      # Controller mode creates one Service per BMC (thousands); the default
      # service-link env injection then breaks exec in ALL new namespace pods
      # with E2BIG ("argument list too long").
      enableServiceLinks: false
      serviceAccountName: {{ include "mat-k8s-controller.serviceAccountName" . }}
      {{- $global := .Values.global | default dict }}
      {{- with (.Values.imagePullSecrets | default $global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --namespace={{ include "mat-k8s-controller.namespace" . }}
            - --discovery-selector={{ include "mat-k8s-controller.discoverySelector" . }}
            - --sync-interval={{ .Values.config.syncInterval }}
            - --insecure-skip-verify={{ .Values.config.insecureSkipVerify }}
            - --log-level={{ .Values.config.logLevel }}
            - --target-selector={{ include "mat-k8s-controller.targetSelector" . }}
            - --enable-state-annotations={{ .Values.config.enableStateAnnotations }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
{{- end }}
