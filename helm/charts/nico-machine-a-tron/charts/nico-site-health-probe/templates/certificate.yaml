{{/*
The SPIFFE client cert exists only for the nico-api gRPC probe. Gating it on
that probe keeps REST-only deployments independent of the core cert issuer —
otherwise the pod would wait forever on a TLS secret no issuer will mint.
*/}}
{{- if .Values.probes.grpcMachines.enabled }}
{{- $name := include "nico-site-health-probe.name" . }}
{{- $namespace := include "nico-site-health-probe.namespace" . }}
{{/* Guarded so `helm lint`/`helm template` of the bare subchart directory
     (no parent-provided globals) render instead of nil-pointering. */}}
{{- $global := .Values.global | default dict }}
{{- $cert := $global.certificate | default dict }}
{{- $key := $cert.privateKey | default dict }}
{{- $issuer := $cert.issuerRef | default dict }}
{{- $spiffe := $global.spiffe | default dict }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-certificate
  namespace: {{ $namespace }}
  labels:
    {{- include "nico-site-health-probe.labels" . | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  duration: {{ $cert.duration }}
  renewBefore: {{ $cert.renewBefore }}
  commonName: {{ printf "%s.%s.svc.cluster.local" $name $namespace }}
  dnsNames:
    - {{ printf "%s.%s.svc.cluster.local" $name $namespace }}
  uris:
    # The identity nico-api's internal RBAC grants read access to. nico-api
    # accepts SPIFFE paths under its own namespace (plus /default/sa/), so the
    # namespace segment follows the release namespace unless a site whose
    # nico-api lives elsewhere overrides identityNamespace.
    - {{ printf "spiffe://%s/%s/sa/%s" $spiffe.trustDomain (.Values.certificate.identityNamespace | default $namespace) .Values.certificate.spiffeServiceName }}
  privateKey:
    algorithm: {{ $key.algorithm }}
    size: {{ $key.size }}
  issuerRef:
    kind: {{ $issuer.kind }}
    name: {{ $issuer.name }}
    group: {{ $issuer.group }}
{{- end }}
