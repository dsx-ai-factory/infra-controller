{{- $name := include "nico-site-health-probe.name" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  namespace: {{ include "nico-site-health-probe.namespace" . }}
  labels:
    {{- include "nico-site-health-probe.labels" . | nindent 4 }}
    app.kubernetes.io/metrics: nico-site-health-probe
spec:
  ipFamilyPolicy: PreferDualStack
  # With state readers on, the pod turns ready only after every reader's
  # first complete sweep. Scrapes must not wait for that: Prometheus records
  # the sweeps before it too, failed ones included.
  publishNotReadyAddresses: true
  selector:
    {{- include "nico-site-health-probe.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
