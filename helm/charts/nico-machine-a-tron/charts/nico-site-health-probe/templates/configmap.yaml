{{- include "nico-site-health-probe.validateState" . }}
{{- $restCaPath := "" }}
{{- if .Values.restCa.existingSecret.name }}
{{- $restCaPath = printf "/var/secrets/rest-ca/%s" (required "restCa.existingSecret.key is required when restCa.existingSecret.name is set" .Values.restCa.existingSecret.key) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-site-health-probe.name" . }}-config
  namespace: {{ include "nico-site-health-probe.namespace" . }}
  labels:
    {{- include "nico-site-health-probe.labels" . | nindent 4 }}
data:
  config.yaml: |
    metrics_listen: ":{{ .Values.metrics.port }}"
    api_listen: ":{{ .Values.api.port }}"
    probes:
      grpc_machines:
        {{- with .Values.probes.grpcMachines }}
        enabled: {{ .enabled }}
        target: {{ .target | quote }}
        interval: {{ .interval | quote }}
        timeout: {{ .timeout | quote }}
        page_size: {{ .pageSize }}
        tls:
          ca: /var/run/secrets/spiffe.io/ca.crt
          cert: /var/run/secrets/spiffe.io/tls.crt
          key: /var/run/secrets/spiffe.io/tls.key
        {{- end }}
      rest_machines:
        {{- with .Values.probes.restMachines }}
        enabled: {{ .enabled }}
        target: {{ .target | quote }}
        interval: {{ .interval | quote }}
        timeout: {{ .timeout | quote }}
        org: {{ .org | quote }}
        auth:
          token_url: {{ .auth.tokenUrl | quote }}
          client_id: {{ .auth.clientId | quote }}
          client_secret_path: /var/secrets/keycloak-machines/{{ if .enabled }}{{ required "probes.restMachines.auth.existingSecret.key is required when the probe is enabled" .auth.existingSecret.key }}{{ else }}{{ .auth.existingSecret.key }}{{ end }}
        {{- end }}
        {{- with $restCaPath }}
        ca: {{ . | quote }}
        {{- end }}
      rest_instances:
        {{- with .Values.probes.restInstances }}
        enabled: {{ .enabled }}
        target: {{ .target | quote }}
        interval: {{ .interval | quote }}
        timeout: {{ .timeout | quote }}
        org: {{ .org | quote }}
        auth:
          token_url: {{ .auth.tokenUrl | quote }}
          client_id: {{ .auth.clientId | quote }}
          client_secret_path: /var/secrets/keycloak-instances/{{ if .enabled }}{{ required "probes.restInstances.auth.existingSecret.key is required when the probe is enabled" .auth.existingSecret.key }}{{ else }}{{ .auth.existingSecret.key }}{{ end }}
        {{- end }}
        {{- with $restCaPath }}
        ca: {{ . | quote }}
        {{- end }}
    {{- with .Values.state }}
    {{- /* The latency probes call through the caps' gates with state off too. */}}
    state:
      enabled: {{ .enabled }}
      caps:
        calls_per_second: {{ .caps.callsPerSecond }}
        call_timeout: {{ .caps.callTimeout | quote }}
        max_backoff: {{ .caps.maxBackoff | quote }}
    {{- if .enabled }}
    {{- $tlsDir := include "nico-site-health-probe.stateTlsDir" $ }}
    {{- $selector := .metricsStore.selector }}
    {{- if not $selector }}
    {{- $selector = dict "job" (printf "%s-metrics" (include "nico-site-health-probe.name" $)) "namespace" (include "nico-site-health-probe.namespace" $) }}
    {{- end }}
      site_id: {{ .siteId | quote }}
      nico_api:
        target: {{ .nicoApi.target | quote }}
        host_read: {{ .nicoApi.hostRead }}
        batch_size: {{ .nicoApi.batchSize }}
        max_decoding_message_size: {{ int64 .nicoApi.maxDecodingMessageSize }}
        tls:
          ca: {{ $tlsDir }}/ca.crt
          cert: {{ $tlsDir }}/tls.crt
          key: {{ $tlsDir }}/tls.key
      rest:
        target: {{ .rest.target | quote }}
        {{- with $restCaPath }}
        ca: {{ . | quote }}
        {{- end }}
        provider:
          org: {{ .rest.provider.org | quote }}
          auth:
            {{- include "nico-site-health-probe.restAuth" (dict "auth" .rest.provider.auth "dir" "/var/secrets/state-provider") | nindent 12 }}
      readers:
        {{- range $name, $key := dict "devices" "devices" "restInventory" "rest_inventory" }}
        {{- $reader := index $.Values.state.readers $name }}
        {{ $key }}:
          enabled: {{ $reader.enabled }}
          interval: {{ $reader.interval | quote }}
          timeout: {{ $reader.timeout | quote }}
        {{- end }}
      metrics_store:
        url: {{ .metricsStore.url | quote }}
        selector:
          {{- range $label, $value := $selector }}
          {{ $label }}: {{ $value | quote }}
          {{- end }}
        max_window: {{ .metricsStore.maxWindow | quote }}
        summary_deadline: {{ .metricsStore.summaryDeadline | quote }}
        scrape_interval: {{ $.Values.serviceMonitor.interval | quote }}
      paging:
        keep_seconds: {{ .paging.keepSeconds }}
        max_kept_snapshots: {{ .paging.maxKeptSnapshots }}
    {{- end }}
    {{- end }}
