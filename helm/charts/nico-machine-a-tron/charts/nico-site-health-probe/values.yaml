## nico-site-health-probe — synthetic monitoring for NICo APIs (issue #5360).
##
## Runs read-only probes against nico-api (gRPC) and nico-rest-api (REST) on
## fixed intervals and exposes latency/outcome metrics for the standard
## collector to scrape. Designed as a probe FRAMEWORK: new probe kinds are
## added to this component, not as new tooling.
##
## TODO(#5360-followup): active lifecycle probes — machine_count parameter
## (1 = production canary, all = scale test) with blast-radius guards.
## TODO(#5360-followup): progress reporting — p50/p95/p99 of machine progress
## (e.g. created→ready) during scale tests.

## Toggled by the parent chart's `nico-site-health-probe.enabled` condition.
## Off by default: the probe needs a site-provided image (the default
## repository has no registry prefix) before it can run anywhere real.
enabled: false

## Container image.
##
## IMPORTANT: deployments must override these defaults — the default
## repository has no registry prefix and will not resolve in real clusters.
##   nico-site-health-probe:
##     image:
##       repository: <registry>/site-health-probe
##       tag: "<version>"
image:
  repository: site-health-probe
  tag: "0.1.0"
  pullPolicy: IfNotPresent

## Sized for the state readers at full scale (snapshots of every host, DPU
## and instance, kept for paging clients).
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

## Metrics endpoint (also serves /health and /ready).
metrics:
  port: 9009

## The /v1 site state API, served with `state.enabled` on its own Service,
## <name>-api.
api:
  port: 9010

serviceMonitor:
  enabled: false
  ## A Prometheus duration. Empty is Prometheus's global interval, or 5s
  ## with state on. With state on, two intervals must fit in the fastest
  ## enabled reader interval, so every sweep lands in at least two scrapes.
  interval: ""

## nico-api client certificate (ca.crt, tls.crt, tls.key) for the state
## readers. Required while a nico-api reader is on. The certificate must
## map to an external user through a trusted issuer.
nicoApiClientCert:
  existingSecret: ""

## SPIFFE client certificate for nico-api mTLS. nico-api accepts SPIFFE URIs
## under its own deploy/auth namespace (plus /default/sa/), so the identity
## namespace defaults to the release namespace; set identityNamespace only
## when nico-api runs in a different namespace than this probe. The service
## name must stay "nico-site-health-probe" — nico-api's internal RBAC grants
## exactly this identity read access to FindMachineIds, FindMachinesByIds
## FindHostStatesByIds, GetDesiredFirmwareVersions and ListHostFirmware.
certificate:
  identityNamespace: ""
  spiffeServiceName: nico-site-health-probe

## CA bundle for verifying nico-rest-api's TLS (its certs come from the REST
## stack's own issuer, not system roots). Required when a REST probe is
## enabled and the target is https. Points at an existing Secret.
restCa:
  existingSecret:
    name: ""
    key: "ca.crt"

## Probe configuration, rendered into the pod's config.yaml.
probes:
  ## Read-only gRPC probes against nico-api (works on every NICo site).
  grpcMachines:
    enabled: true
    target: "nico-api.nico-system.svc.cluster.local:1079"
    interval: 10s
    timeout: 5s
    pageSize: 50
  ## Read-only REST probes against nico-rest-api. Disabled by default because
  ## they need site-specific inputs: the org, a Keycloak service-account
  ## client, and its secret. Enable per site once those exist.
  restMachines:
    enabled: false
    target: "https://nico-rest-api.nico-rest.svc.cluster.local:8388"
    interval: 10s
    timeout: 5s
    org: ""
    auth:
      tokenUrl: ""
      clientId: "nico-site-health-probe"
      ## Existing Secret holding the Keycloak client secret.
      existingSecret:
        name: ""
        key: "client-secret"
  restInstances:
    enabled: false
    target: "https://nico-rest-api.nico-rest.svc.cluster.local:8388"
    interval: 10s
    timeout: 5s
    org: ""
    auth:
      tokenUrl: ""
      clientId: "nico-site-health-probe"
      existingSecret:
        name: ""
        key: "client-secret"

## Site state readers and the /v1 API: counts, units and config for scale
## tests. Off by default.
state:
  enabled: false
  ## The REST site ID of this NICo site.
  siteId: ""
  ## Per API: at most one call in flight, this many calls per second, a
  ## deadline per call, and back-off on pushback.
  caps:
    callsPerSecond: 2
    callTimeout: 5s
    maxBackoff: 30s
  nicoApi:
    target: "nico-api.nico-system.svc.cluster.local:1079"
    ## auto: the compact host read (FindHostStatesByIds), or FindMachinesByIds
    ## for the life of the pod when nico-api does not implement it, and for
    ## 10 sweeps at a time when it denies it. full and compact pin one read.
    hostRead: auto
    batchSize: 100
    maxDecodingMessageSize: 67108864
  ## nico-rest-api, GET only. Each identity uses client credentials
  ## (tokenUrl, clientId and a client secret in existingSecret), a bearer
  ## token in existingSecret (no tokenUrl), or a token file path.
  rest:
    target: ""
    provider:
      org: ""
      auth:
        tokenUrl: ""
        clientId: ""
        tokenFile: ""
        existingSecret:
          name: ""
          key: client-secret
    tenant:
      org: ""
      tenantId: ""
      instanceType: ""
      auth:
        tokenUrl: ""
        clientId: ""
        tokenFile: ""
        existingSecret: {name: "", key: token}
  ## Reader schedules. A sweep may outlast its interval; the next tick is
  ## then skipped. The REST reader is off until the site provides the
  ## `state.rest` inputs (see the README for a complete example).
  readers:
    nicoConfig: {enabled: false, interval: 60s, timeout: 120s}
    devices:
      enabled: true
      interval: 120s
      timeout: 600s
    restInventory:
      enabled: false
      interval: 120s
      timeout: 600s
      ## false skips the machine, rack and tray totals (the site check and
      ## tenant reads stay), for a site whose REST API cannot answer them.
      totals: true
  ## /v1/config names the stored series for clients that read them back:
  ## a selector and the scrape cadence. With serviceMonitor.enabled the
  ## cadence is serviceMonitor.interval, and the selector defaults to the
  ## scrape job (the metrics Service) and the release namespace. Override it
  ## only when the store relabels them, for example {job: site-probe,
  ## cluster: c1}. For another scraper, set scrapeInterval (a quoted
  ## Prometheus duration) and the selector its series carry. Labels starting
  ## with __ and the probe's own series labels (type, family, ...) are
  ## refused.
  metrics:
    selector: {}
    scrapeInterval: ""
  ## A replaced snapshot that a /v1/units cursor points into stays readable
  ## this long for the paging client. Others are dropped when replaced.
  paging:
    keepSeconds: 300
    maxKeptSnapshots: 6
