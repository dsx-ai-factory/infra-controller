suite: image pull secret tests
tests:
  - it: should not create the pull Secret by default
    templates:
      - image-pull-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the pull Secret in the chart namespace when enabled
    templates:
      - image-pull-secret.yaml
    set:
      global:
        namespaceOverride: nico-mat
      imagePullSecret:
        create: true
        dockerconfigjson: "eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlIjp7fX19"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: machine-a-tron-pull
      - equal:
          path: metadata.namespace
          value: nico-mat
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: data[".dockerconfigjson"]
          value: "eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlIjp7fX19"
