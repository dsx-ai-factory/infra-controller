suite: image pull secret tests
tests:
  - it: should not create the pull Secret by default
    templates:
      - image-pull-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the pull Secret in the chart namespace when enabled
    templates:
      - image-pull-secret.yaml
    set:
      global:
        namespaceOverride: nico-mat
      imagePullSecret:
        create: true
        dockerconfigjson: "eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlIjp7fX19"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: image-pull-secret
      - equal:
          path: metadata.namespace
          value: nico-mat
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: data[".dockerconfigjson"]
          value: "eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlIjp7fX19"
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: should reference the pull Secret from the Deployment via global.imagePullSecrets
    templates:
      - deployment.yaml
    set:
      global:
        imagePullSecrets:
          - name: image-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: image-pull-secret
