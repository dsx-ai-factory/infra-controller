suite: certificate tests
templates:
  - certificate.yaml
tests:
  - it: should create a certificate with default values
    release:
      namespace: nico-system
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-mat-0-certificate
      - equal:
          path: spec.secretName
          value: nico-machine-a-tron-mat-0-tls
      - contains:
          path: spec.dnsNames
          content: mat-mock.nvidia.com
      - contains:
          path: spec.dnsNames
          content: nico-machine-a-tron-mat-0-bmc-mock.nico-system.svc.cluster.local

  - it: should use custom certificate settings
    set:
      certificate:
        serviceName: custom-service
        extraDnsNames:
          - extra.example.com
    asserts:
      - isKind:
          of: Certificate
      - contains:
          path: spec.dnsNames
          content: extra.example.com
      - notContains:
          path: spec.dnsNames
          content: mat-mock.nvidia.com

  - it: should create per-pod certificates in multi-pod mode
    set:
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
        mat-1:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.secretName
          value: nico-machine-a-tron-mat-0-tls
        documentIndex: 0
      - equal:
          path: spec.secretName
          value: nico-machine-a-tron-mat-1-tls
        documentIndex: 1
