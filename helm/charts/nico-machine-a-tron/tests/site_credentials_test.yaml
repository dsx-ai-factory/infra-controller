suite: site credentials lookup tests
templates:
  - configmap.yaml
tests:
  - it: should pin both BMC passwords to the site root from the Secret
    kubernetesProvider: &siteCredentialsSecret
      scheme: &secretScheme
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # bmc_site_wide_root: {username: root, password: FromSecret1}
            credentials.yaml: Ym1jX3NpdGVfd2lkZV9yb290OgogIHVzZXJuYW1lOiByb290CiAgcGFzc3dvcmQ6IEZyb21TZWNyZXQxCg==
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'host_bmc_password = "FromSecret1"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'dpu_bmc_password = "FromSecret1"'

  - it: should read the JSON credential file that helm-prereqs writes
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: nico-site-credentials
            namespace: nico-system
          data:
            # prereqs.siteCredentialsFile output with bmc_site_wide_root.password FromSecret1
            credentials.yaml: eyJibWNfc2l0ZV93aWRlX3Jvb3QiOnsicGFzc3dvcmQiOiJGcm9tU2VjcmV0MSIsInVzZXJuYW1lIjoicm9vdCJ9LCJkcHVfdWVmaV9zaXRlX2RlZmF1bHQiOnsicGFzc3dvcmQiOiJEcHVVZWZpMSIsInVzZXJuYW1lIjoiIn0sImhvc3RfdWVmaV9zaXRlX2RlZmF1bHQiOnsicGFzc3dvcmQiOiJIb3N0VWVmaTEiLCJ1c2VybmFtZSI6IiJ9fQ==
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'host_bmc_password = "FromSecret1"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'dpu_bmc_password = "FromSecret1"'

  - it: should omit both password lines without the Secret
    kubernetesProvider:
      scheme: *secretScheme
      objects: []
    asserts:
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: bmc_password

  - it: should prefer an explicit host password over the Secret
    set:
      machineATron:
        hostBmcPassword: Explicit1
    kubernetesProvider: *siteCredentialsSecret
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'host_bmc_password = "Explicit1"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'dpu_bmc_password = "FromSecret1"'

  - it: should disable the lookup when the Secret name is empty
    set:
      machineATron:
        siteCredentialsSecret:
          name: ""
    kubernetesProvider: *siteCredentialsSecret
    asserts:
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: bmc_password
