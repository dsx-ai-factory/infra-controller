## =============================================================================
## nico-machine-a-tron - Mock machine simulator for NICo testing
## =============================================================================
##
## DEPLOYMENT MODES:
##
## 1. OVERRIDE MODE (Development)
##    - NICo Site-Explorer redirects ALL Redfish calls to machine-a-tron
##    - Simple setup, single pod
##    - INCOMPATIBLE with real hardware
##
## 2. CONTROLLER MODE (Large-Scale Testing) - mat-k8s-controller.enabled: true
##    - Controller dynamically creates ClusterIP Services per BMC
##    - Supports multi-pod deployments via `pods` configuration
##    - Compatible with real hardware
##
## See README.md for detailed setup instructions.
##
## =============================================================================

global:
  ## Namespace override (propagates to subcharts). Required when mat-k8s-controller is enabled.
  ## Example: --set global.namespaceOverride=nico-system
  namespaceOverride: ""
  certificate:
    duration: 720h0m0s
    renewBefore: 360h0m0s
    privateKey:
      algorithm: ECDSA
      size: 384
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io
  spiffe:
    trustDomain: nico.local
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: site-controller

image:
  ## Container image repository. When empty, uses global.image.repository or defaults to nico:latest
  repository: ""
  ## Container image tag. Defaults to chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

## Create namespace when global.namespaceOverride is set
createNamespace: true

automountServiceAccountToken: false

## Graceful shutdown timeout (seconds)
terminationGracePeriodSeconds: 60

annotations:
  configmap.reloader.stakater.com/reload: '{{ include "nico-machine-a-tron.name" . }}-config-files'

resources:
  limits:
    cpu: 4
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

service:
  bmcMock:
    port: 1266
  ssh:
    port: 22
    targetPort: 2222
  metrics:
    port: 9090

## =============================================================================
## DHCP Relay Mode
## =============================================================================
## When enabled, machine-a-tron obtains IP addresses through UDP relay to a
## DHCP server instead of the Carbide API. This exercises the real DHCP packet
## path in Kubernetes deployments.
##
## Prerequisites:
##   - nico-dhcp must be deployed (default: nico-system namespace)
##   - A dedicated K8s ServiceCIDR for relay IPs (e.g., mat-dhcp-services)
##
## Each pod gets a unique ClusterIP Service for receiving DHCP replies:
##   - Pod 0 (mat-0): baseIP + 0 (e.g., 10.96.127.10)
##   - Pod 1 (mat-1): baseIP + 1 (e.g., 10.96.127.11)
##
## WARNING: Kubernetes ClusterIP addresses are immutable. Changing baseIP
## after initial deployment requires deleting and recreating the Services.
##
dhcpRelay:
  ## Base IP address for DHCP relay Services. Setting this enables relay mode.
  ## Each pod's ClusterIP = baseIP + podIndex.
  ## Must be from a ServiceCIDR available to the cluster.
  ## Leave empty to use API mode (default).
  baseIP: ""

  ## UDP port for receiving DHCP replies. Must match the DHCP server's
  ## relay response port (typically 67).
  listenPort: 67

  ## DHCP server address (host:port). Default: nico-dhcp.nico-system.svc.cluster.local:67
  ## Override if nico-dhcp is deployed in a different namespace or uses a non-standard port.
  serverAddress: ""

certificate:
  serviceName: ""
  spiffeServiceName: ""
  identityNamespace: ""
  dnsNames: []
  uris: []
  extraDnsNames: []
  extraUris: []

command:
  - /opt/machine-a-tron/bin/machine-a-tron

env:
  RUST_BACKTRACE: "full"
  RUST_LIB_BACKTRACE: "0"

extraEnv: []

envFrom:
  vaultApproleTokens:
    secretName: nico-vault-approle-tokens
  vaultToken:
    secretName: nico-vault-token
  vaultClusterInfo:
    configMapName: vault-cluster-info

# startupProbe gates the livenessProbe until MAT has bound its redfish port.
# MAT binds the port only after registering all expected machines via the API,
# which can take a while for large deployments (time scales with host count).
# Without a startupProbe the kubelet kills the pod mid-registration (exit 137)
# Scale the failureThreshold to cover your largest deployment:
#   hosts=2300  → default (20 * 30s = 10 min)
#   hosts=4500  → failureThreshold: 60  (30 min)
#   hosts=13500 → failureThreshold: 1200 (10 h, see machine-a-tron-scale.yaml)
startupProbe:
  tcpSocket:
    port: redfish
  periodSeconds: 30
  failureThreshold: 20
  successThreshold: 1
  timeoutSeconds: 10

livenessProbe:
  tcpSocket:
    port: redfish
  periodSeconds: 30
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 10

readinessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 5

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 25s

## UFM-compatible API mock hosted by each machine-a-tron process on its existing
## HTTPS listener. Disable it for simulations that do not need InfiniBand.
ufmMock:
  enabled: true
  ## Use an existing Secret with a `token` key. When unset, the chart creates
  ## a Secret with a random token and preserves it across Helm upgrades.
  existingAuthSecret: ""

## =============================================================================
## Machine-a-tron Core Settings (shared across all pods)
## =============================================================================
machineATron:
  nicoApiUrl: "https://nico-api.nico-system.svc.cluster.local:1079"
  logFile: ""
  # Kubernetes log collectors consume structured logs from stdout.
  logFormat: "logfmt"
  mockBmcSshServer: true
  mockBmcSshPort: 2222
  configureBmcProxyHost: ""
  persistDir: "/tmp/machine-a-tron-data"
  cleanupOnQuit: false
  enableIpmiSimulation: false
  registerExpectedMachines: true
  hostBmcPassword: ""
  dpuBmcPassword: ""
  apiRefreshInterval: "2s"

## =============================================================================
## Machine Defaults - Shared settings for all machine groups
## =============================================================================
## These defaults apply to all machine groups in all pods.
## Override per-group by specifying the value in pods.*.machines.*.
##
machineDefaults:
  dpuRebootDelay: 1
  hostRebootDelay: 1
  ## Positive multiplier applied after timing overrides. Default 1.0; values below 1 speed up the simulation.
  accelerationFactor: 1.0
  scoutRunInterval: "60s"
  ## Delay after a failed DiscoverMachine call; the default matches the production DPU agent.
  discoveryRetryInterval: "60s"
  runIntervalWorking: "1s"
  runIntervalIdle: "10s"
  networkStatusRunInterval: "20s"
  dpusInNicMode: false
  ## Host firmware upgrade simulation. Set initial BMC/UEFI versions here to
  ## apply to all machine groups. Override per-group in pods.*.machines.*.
  ## When set, NICo detects version delta and triggers the upgrade flow.
  # hostFirmwareVersions:
  #   bmc: "24.08.00"
  #   uefi: "01.04.00"

## =============================================================================
## MAC Address Pool - Standalone MACs for BMC and management interfaces
## =============================================================================
## Allocates individual MACs for simulated machine interfaces:
##   - Host BMC MAC (bmc_mac_address)
##   - DPU BMC MAC (per DPU)
##   - DPU Host MAC (representor interface, per DPU)
##   - DPU OOB MAC (out-of-band management, per DPU)
##   - NVOS MACs (for switches)
##
## Example: GB200 host with 2 DPUs needs ~7 MACs from this pool.
##
## Each pod gets a unique base to avoid collisions in multi-pod deployments.
##
## Format: 02:00:PP:XX:XX:XX
##   - 02:00 = Locally administered prefix (required for virtual MACs)
##   - PP    = Pod index (0x00, 0x01, 0x02, ...)
##   - XX    = Host bits (allocated sequentially)
##
## Scale with hostBits=16:
##   - 65K MACs per pod
##   - Supports up to 256 pods
##
macAddressPool:
  ## Enable auto-generation of per-pod MAC address pools.
  ## Default: false (uses binary defaults from machine-a-tron: 02:00:00:00:00:00/24)
  ## Set to true for multi-pod deployments to avoid MAC collisions.
  enabled: false
  ## Base prefix (first 2 bytes). Pod index added to byte 3.
  basePrefix: "02:00"
  ## Number of host bits per pod (16 = ~65K MACs per pod)
  hostBits: 16

## =============================================================================
## HW MAC Address Ranges - Contiguous MAC blocks for network interface cards
## =============================================================================
## Allocates contiguous MAC address ranges for NICs that require sequential MACs:
##   - ConnectX NICs (e.g., CX-8 needs 10 consecutive MACs)
##   - Storage NICs (multiple MACs for storage interfaces)
##   - Management NICs
##
## Real hardware has contiguous MAC blocks assigned at manufacturing.
## This pool simulates that by allocating 256-MAC blocks (rangeHostBits=8).
##
## Each pod gets a unique range base derived from pod index.
##
## Format: 02:01:PP:XX:XX:XX where PP = pod index
##
hwMacAddressRanges:
  ## Enable auto-generation of per-pod HW MAC ranges.
  ## Default: false (uses binary defaults from machine-a-tron: 06:00:00:00:00:00/32/8)
  ## Set to true for multi-pod deployments to avoid MAC collisions.
  enabled: false
  ## Base prefix (first 2 bytes). Pod index added to byte 3.
  basePrefix: "02:01"
  ## Total host bits (24 = 16M addresses in the range pool)
  hostBits: 24
  ## Bits per allocated range (8 = 256 MACs per range allocation)
  rangeHostBits: 8

##   - N ClusterIP BMC services (when mat-k8s-controller.enabled)
##
##
## BMC count per GB200 NVL72 rack: 71
##   - Compute trays: 18 × 3 = 54
##   - NVLink switches: 9 × 1 = 9
##   - Power shelves: 8 × 1 = 8
##
## Per-machine group, only these fields are typically needed:
##   - hwType: Hardware type (required)
##   - hostCount: Number of hosts (required)
##   - dpuPerHostCount: DPUs per host (default: 0)
##   - oobDhcpRelayAddress: OOB network gateway
##   - adminDhcpRelayAddress: Admin network gateway
##
## All other settings inherit from machineDefaults above.
##
pods:
  ## Pod names become Kubernetes resource suffixes: nico-machine-a-tron-<podName>
  ## Use consistent naming: mat-0 for single-pod, mat-0/mat-1/mat-2 for multi-pod
  ## Names must be valid K8s label values (alphanumeric, -, _, ., max 63 chars)
  mat-0:

    # racks:
    #   gb200:
    #     type: wiwynn_gb200_nvl72
    #     rack_profile_id: NVL72
    #     ids:
    #       - rack-001
    #     dpu_reboot_delay: 20
    #     host_reboot_delay: 10
    #     oob_dhcp_relay_address: "192.168.192.1"
    #     admin_dhcp_relay_address: "192.168.176.1"

    ## Machine groups for this pod
    machines:
      rack-machines:
        hwType: wiwynn_gb200_nvl
        hostCount: 10
        dpuPerHostCount: 2
        oobDhcpRelayAddress: "192.168.192.1"
        adminDhcpRelayAddress: "192.168.176.1"
        ## Host firmware upgrade simulation (optional).
        ## Set initial versions older than the API's desired versions to trigger
        ## the upgrade flow: version detection -> upload -> task polling ->
        ## power-cycle -> inventory verification.
        ## Supported platforms: DGX H100, Wiwynn GB200, Lenovo GB300, Dell R750/R760.
        # hostFirmwareVersions:
        #   bmc: "24.08.00"
        #   uefi: "01.04.00"

## =============================================================================
## Multi-Pod Example (mat-k8s-controller.enabled is required)
## =============================================================================
## Uncomment and customize for large-scale deployments:
##
#  mat-0:
#    machines:
#      compute:
#        hwType: wiwynn_gb200_nvl
#        hostCount: 252       # 18 trays × 14 racks
#        dpuPerHostCount: 2   # 2 BF3 per tray
#        oobDhcpRelayAddress: "10.96.64.1"
#        adminDhcpRelayAddress: "192.168.176.1"
#      switches:
#        hwType: nvidia_switch_nd5200_ld
#        hostCount: 126       # 9 switches × 14 racks
#        oobDhcpRelayAddress: "10.96.64.1"
#        adminDhcpRelayAddress: "192.168.176.1"
#      power:
#        hwType: liteon_power_shelf
#        hostCount: 112       # 8 shelves × 14 racks
#        oobDhcpRelayAddress: "10.96.64.1"
#        adminDhcpRelayAddress: "192.168.176.1"
#
#  mat-1:
#    machines:
#      compute:
#        hwType: wiwynn_gb200_nvl
#        hostCount: 252
#        dpuPerHostCount: 2
#        oobDhcpRelayAddress: "10.96.64.1"
#        adminDhcpRelayAddress: "192.168.176.1"
#      # ... same pattern

## Persistence volume for machine state
persistence:
  enabled: false
  storageClass: ""
  size: 1Gi
  accessModes:
    - ReadWriteOnce

externalService:
  enabled: false
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations: {}

configFiles:
  ## Override mat.toml per pod (optional)
  ## Key = pod name, value = full config content
  ## When set, this completely replaces the auto-generated config for that pod.
  ##
  ## Example - simple single-pod config:
  # matConfigs:
  #   default: |
  #     carbide_api_url = "https://nico-api.nico-system.svc.cluster.local:1079"
  #     log_format = "logfmt"
  #     bmc_mock_port = 1266
  #     mock_bmc_ssh_server = true
  #     mock_bmc_ssh_port = 2222
  #     cleanup_on_quit = false
  #     register_expected_machines = true
  #     api_refresh_interval = "2s"
  #
  #     [machines.compute]
  #     hw_type = "supermicro_gb300_nvl"
  #     host_count = 10
  #     dpu_per_host_count = 2
  #     oob_dhcp_relay_address = "10.96.64.1"
  #     admin_dhcp_relay_address = "192.168.176.1"
  #
  #     [machines.switches]
  #     hw_type = "nvidia_switch_nd5200_ld"
  #     host_count = 5
  #     dpu_per_host_count = 0
  #     oob_dhcp_relay_address = "10.96.64.1"
  #     admin_dhcp_relay_address = "192.168.176.1"
  matConfigs: {}

## =============================================================================
## Machine-a-tron Kubernetes Controller
## =============================================================================
## Discovers machine-a-tron pods and creates K8s Services for each mock BMC.
## Enable for multi-pod deployments to dynamically manage BMC Services.
##
## Auto-discovered:
##   - Finds bmc-mock Services via label: nvidia-infra-controller/mat-service=true
##   - Polls /machines/status from each discovered instance
##
## for ClusterIP assignment. See README troubleshooting for ClusterIP conflicts.
##
mat-k8s-controller:
  enabled: false
  ## The controller deploys to the same namespace as nico-machine-a-tron.

  image:
    repository: mat-k8s-controller
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  config:
    syncInterval: "30s"
    insecureSkipVerify: false
    logLevel: "info"

## nico-site-health-probe — synthetic monitoring for NICo APIs (#5360).
## Enabled by default: wherever machine-a-tron is deployed (test sites), the
## probe ships with it. Override the image (no registry prefix by default):
##   nico-site-health-probe:
##     image:
##       repository: <registry>/site-health-probe
##       tag: "<version>"
## REST probes stay off until the site provides org + Keycloak client secrets —
## see the subchart's values.yaml.
nico-site-health-probe:
  enabled: true
