suite: DNS dual-stack Service defaults
templates:
  - service.yaml
tests:
  - it: prefers dual-stack addresses and exposes DNS over TCP and UDP
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
      - contains:
          path: spec.ports
          content:
            port: 53
            name: tcp
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            port: 53
            name: udp
            protocol: UDP
