suite: ConfigMap input changes roll nico-api
templates:
  - deployment.yaml
tests:
  - it: hashes the default config inputs
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 35d066f2975f1354724f6723a2365548a6a5ccbbcf90ebd101cee26b74b8c28f
  - it: changes the checksum when the BMC credential source changes
    set:
      credentials.bmcSiteWideRootSource: local
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 35d066f2975f1354724f6723a2365548a6a5ccbbcf90ebd101cee26b74b8c28f
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[a-f0-9]{64}$'
  - it: changes the checksum when the machine state controller concurrency changes
    set:
      machineStateController.maxConcurrency: 80
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 35d066f2975f1354724f6723a2365548a6a5ccbbcf90ebd101cee26b74b8c28f
  - it: changes the checksum when the SSH console address changes
    set:
      sshConsole.port: 1080
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 35d066f2975f1354724f6723a2365548a6a5ccbbcf90ebd101cee26b74b8c28f
