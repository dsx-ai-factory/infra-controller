suite: API admission control
templates:
  - configmap.yaml
tests:
  - it: renders the binary default when unset
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^\[api_admission_control\]\nenabled = true$'

  - it: renders the configured value
    documentIndex: 0
    set:
      apiAdmissionControl.enabled: false
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^\[api_admission_control\]\nenabled = false$'

  - it: rejects a value that is not a boolean
    set:
      apiAdmissionControl.enabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: apiAdmissionControl.enabled must be true or false

  - it: raises the execution deadline to cover a long cert-manager timeout
    documentIndex: 0
    set:
      global.certificate.useCertManager: true
      machineCertificates.requestTimeoutSecs: 151
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^max_execution_time = "302s"$'

  - it: keeps the binary default deadline when it covers cert-manager
    documentIndex: 0
    set:
      global.certificate.useCertManagerUfm: true
      machineCertificates.requestTimeoutSecs: 150
    asserts:
      - notMatchRegex:
          path: data["nico-api-config.toml"]
          pattern: '(?m)^max_execution_time ='
