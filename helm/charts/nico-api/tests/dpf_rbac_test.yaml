suite: DPF RBAC
templates:
  - dpf-rbac.yaml
tests:
  - it: permits credential Secret lifecycle while restricting shared Secret patches
    documentIndex: 0
    set:
      dpf.rbacCreate: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "create", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["bmc-shared-password"]
            verbs: ["get", "patch"]
      - lengthEqual:
          path: rules
          count: 17
