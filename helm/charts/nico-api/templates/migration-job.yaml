apiVersion: batch/v1
kind: Job
metadata:
  # The release revision is part of the name because a Job's pod template is
  # immutable: a fixed name cannot be re-applied on upgrade. Helm removes the
  # previous revision's Job, which is what a hook delete policy used to do.
  # Under Argo CD the revision is always 1, and the hook annotations below
  # handle replacement there instead.
  name: {{ include "nico-api.name" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ include "nico-api.namespace" . }}
  labels:
    {{- include "nico-api.labels" . | nindent 4 }}
    app: {{ include "nico-api.name" . }}-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # The datastore may not be serving yet when this is applied. restartPolicy
  # OnFailure plus a backoff limit is the wait: the Job retries until the
  # migration connects, rather than assuming an ordering Helm does not give.
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      name: {{ include "nico-api.name" . }}-migrate-{{ .Release.Revision }}
      labels:
        {{- include "nico-api.labels" . | nindent 8 }}
        app: {{ include "nico-api.name" . }}-migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "nico-api.name" . }}-migrate
          image: "{{ include "nico-api.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              {{- include "nico-api.databaseUrlScript" . | nindent 14 }}
              if [ -x /opt/nico/nico-api ]; then BIN=/opt/nico/nico-api; else BIN=/opt/carbide/carbide-api; fi
              exec "$BIN" migrate --datastore="${DATASTORE_URL}?sslmode={{ .Values.migrationJob.sslMode }}"
          env:
            - name: DATASTORE_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ .Values.envFrom.databaseCredentials.secretName }}
            - name: DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.envFrom.databaseCredentials.secretName }}
            - name: DATASTORE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_HOST
            - name: DATASTORE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_PORT
            - name: DATASTORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_NAME
