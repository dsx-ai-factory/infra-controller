apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nico-api.name" . }}
  namespace: {{ include "nico-api.namespace" . }}
  labels:
    {{- include "nico-api.labels" . | nindent 4 }}
  annotations:
    {{- tpl (toYaml .Values.annotations) . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "nico-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nico-api.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: {{ include "nico-api.name" . }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      serviceAccountName: {{ include "nico-api.name" . }}
      {{- /*
        Scheduling. `affinity` is a plain pass-through for operators who want
        full control. `databaseAffinity` is a convenience on top of it: a SOFT
        preference to land on the same node as the PostgreSQL primary.

        Soft is deliberate. nico-api holds the admin-segment advisory lock
        across application round trips, so much of that lock's hold time is
        network latency to the database rather than query time. Co-located and
        cross-node runs of the same 4,500-host ingestion measured a 1.32x
        throughput difference (local RTT 0.073ms vs 0.473ms). Worth preferring;
        never worth blocking on -- `preferred...` lets the scheduler place
        nico-api anywhere if the primary's node is full, cordoned or gone.

        Also `...IgnoredDuringExecution`: a Patroni failover moves the
        `spilo-role=master` label to another pod, and nico-api deliberately does
        NOT get evicted to chase it. Staying up beats the 1.32x.
      */}}
      {{- if and .Values.databaseAffinity.enabled (not .Values.affinity) }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.databaseAffinity.weight }}
              podAffinityTerm:
                topologyKey: {{ .Values.databaseAffinity.topologyKey }}
                {{- with .Values.databaseAffinity.namespaces }}
                namespaces:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                labelSelector:
                  matchLabels:
                    {{- toYaml .Values.databaseAffinity.matchLabels | nindent 20 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.initContainers .Values.bootArtifactContainers }}
      initContainers:
        {{- range .Values.bootArtifactContainers }}
        - name: {{ .name }}
          image: {{ if and .repository .tag }}{{ .repository }}:{{ .tag }}{{ else }}{{ .image }}{{ end }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          volumeMounts:
            - name: boot-artifacts
              mountPath: /forge-boot-artifacts/blobs/internal
            {{- with .volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "nico-api.name" . }}
          image: "{{ include "nico-api.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
          command:
            - /bin/sh
            - -c
            - |
              {{- /* Native Kubernetes ulimits support: https://github.com/kubernetes/kubernetes/pull/137023 */ -}}
              {{- $fdLimit := 65536 }}
              {{- if not (kindIs "invalid" .Values.fileDescriptorLimit) }}
              {{- $fdLimit = .Values.fileDescriptorLimit | int }}
              {{- end }}
              {{- if le $fdLimit 0 }}
              {{- fail "fileDescriptorLimit must be a positive integer" }}
              {{- end }}
              FD_LIMIT={{ $fdLimit }}
              FD_REQUESTED="$FD_LIMIT"
              FD_HARD="$(ulimit -Hn)"
              if [ "$FD_HARD" != "unlimited" ] && [ "$FD_LIMIT" -gt "$FD_HARD" ]; then
                echo "fileDescriptorLimit ${FD_LIMIT} exceeds the hard limit ${FD_HARD}; clamping" >&2
                FD_LIMIT="$FD_HARD"
              fi
              ulimit -Sn "$FD_LIMIT" || { echo "ulimit -Sn ${FD_LIMIT} failed (requested ${FD_REQUESTED}, hard limit ${FD_HARD})" >&2; exit 1; }
              {{ .Values.command | nindent 14 }}
          env:
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envFrom.vaultApproleTokens.secretName }}
                  key: VAULT_ROLE_ID
                  optional: true
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envFrom.vaultApproleTokens.secretName }}
                  key: VAULT_SECRET_ID
                  optional: true
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envFrom.vaultToken.secretName }}
                  key: token
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.vaultClusterInfo.configMapName }}
                  key: VAULT_SERVICE
            - name: VAULT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.vaultClusterInfo.configMapName }}
                  key: VAULT_NAMESPACE
                  optional: true
            - name: VAULT_KV_MOUNT_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.vaultClusterInfo.configMapName }}
                  key: NICO_VAULT_MOUNT
            - name: VAULT_PKI_MOUNT_LOCATION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.vaultClusterInfo.configMapName }}
                  key: NICO_VAULT_PKI_MOUNT
            - name: VAULT_PKI_ROLE_NAME
              value: {{ .Values.env.VAULT_PKI_ROLE_NAME | quote }}
            - name: DATASTORE_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ .Values.envFrom.databaseCredentials.secretName }}
            - name: DATASTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.envFrom.databaseCredentials.secretName }}
            - name: DATASTORE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_HOST
            - name: DATASTORE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_PORT
            - name: DATASTORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.databaseConfig.configMapName }}
                  key: DB_NAME
            # Set both CARBIDE_* (carbide image) and NICO_* (nico image) names so the
            # chart works with either image variant; binary reads only its expected name.
            - name: CARBIDE_API_DATABASE_URL
              value: "postgres://$(DATASTORE_USER):$(DATASTORE_PASSWORD)@$(DATASTORE_HOST):$(DATASTORE_PORT)/$(DATASTORE_NAME)"
            - name: NICO_API_DATABASE_URL
              value: "postgres://$(DATASTORE_USER):$(DATASTORE_PASSWORD)@$(DATASTORE_HOST):$(DATASTORE_PORT)/$(DATASTORE_NAME)"
            - name: CARBIDE_WEB_PRIVATE_COOKIEJAR_KEY
              value: "$(DATASTORE_PASSWORD)"
            - name: NICO_WEB_PRIVATE_COOKIEJAR_KEY
              value: "$(DATASTORE_PASSWORD)"
            - name: CARBIDE_WEB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.nicoWebHostname.configMapName }}
                  key: hostname
            - name: NICO_WEB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.envFrom.nicoWebHostname.configMapName }}
                  key: hostname
            {{- if ne (include "nico-api.webAuth.hasModeOverride" .) "true" }}
            - name: CARBIDE_WEB_AUTH_TYPE
              value: {{ include "nico-api.webAuth.configuredMode" . | quote }}
            {{- end }}
            {{- if eq (include "nico-api.webAuth.renderBasicSecret" .) "true" }}
            - name: CARBIDE_WEB_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nico-api.webAuth.basicSecretName" . }}
                  key: {{ include "nico-api.webAuth.basicSecretKey" . }}
            {{- end }}
            - name: RUST_BACKTRACE
              value: {{ .Values.env.RUST_BACKTRACE | quote }}
            - name: RUST_LIB_BACKTRACE
              value: {{ .Values.env.RUST_LIB_BACKTRACE | quote }}
            {{- with .Values.dsxExchangeEventBusConfig }}
            - name: CARBIDE_API_DSX_EXCHANGE_EVENT_BUS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
            - name: metrics
              containerPort: {{ .Values.service.metrics.port }}
            {{- if include "nico-api.perObjectStateMetricsActive" . }}
            - name: object-metrics
              containerPort: {{ .Values.service.perObjectStateMetrics.port }}
            {{- end }}
            - name: profiler
              containerPort: {{ .Values.service.profiler.port }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            # Mount config + secrets at both legacy /etc/forge,/var/run/secrets/forge-roots,/opt/carbide
            # and renamed /etc/nico,/var/run/secrets/nico-roots,/opt/nico paths so the chart works
            # whether the binary inside the image looks up its files under forge/carbide or nico names.
            - name: {{ include "nico-api.name" . }}-config-files
              mountPath: /etc/forge/carbide-api
            - name: {{ include "nico-api.name" . }}-config-files
              mountPath: /etc/nico/nico-api
            - name: {{ include "nico-api.name" . }}-site-config-files
              mountPath: /etc/forge/carbide-api/site
            - name: {{ include "nico-api.name" . }}-site-config-files
              mountPath: /etc/nico/nico-api/site
            {{- if .Values.credentials.file.existingSecret.name }}
            - name: credentials-file
              mountPath: {{ required "nico-api.credentials.file.mountPath is required when credentials.file.existingSecret.name is set" .Values.credentials.file.mountPath | quote }}
              readOnly: true
            {{- end }}
            - name: persistence
              mountPath: /mnt/persistence
            - name: spiffe
              mountPath: "/var/run/secrets/spiffe.io"
              readOnly: true
            {{- if .Values.nvSwitchTls.nicoClient.enabled }}
            - name: nvswitch-nico-client
              mountPath: {{ .Values.nvSwitchTls.nicoClient.mountPath }}
              readOnly: true
            {{- end }}
            - name: nico-roots
              mountPath: "/var/run/secrets/forge-roots"
              readOnly: true
            - name: nico-roots
              mountPath: "/var/run/secrets/nico-roots"
              readOnly: true
            - name: firmware
              mountPath: "/opt/carbide/firmware"
              readOnly: true
            - name: firmware
              mountPath: "/opt/nico/firmware"
              readOnly: true
            {{- if .Values.bootArtifactContainers }}
            - name: boot-artifacts
              mountPath: /forge-boot-artifacts/blobs/internal
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: {{ include "nico-api.name" . }}-config-files
          configMap:
            name: {{ include "nico-api.name" . }}-config-files
        - name: {{ include "nico-api.name" . }}-site-config-files
          configMap:
            name: {{ include "nico-api.name" . }}-site-config-files
        {{- if .Values.credentials.file.existingSecret.name }}
        - name: credentials-file
          secret:
            secretName: {{ .Values.credentials.file.existingSecret.name | quote }}
            items:
              - key: {{ required "nico-api.credentials.file.existingSecret.key is required when credentials.file.existingSecret.name is set" .Values.credentials.file.existingSecret.key | quote }}
                path: credentials.yaml
        {{- end }}
        - name: persistence
          emptyDir: {}
        - name: spiffe
          secret:
            secretName: {{ include "nico-api.name" . }}-certificate
        {{- if .Values.nvSwitchTls.nicoClient.enabled }}
        - name: nvswitch-nico-client
          secret:
            secretName: {{ .Values.nvSwitchTls.nicoClient.secretName }}
        {{- end }}
        - name: nico-roots
          secret:
            secretName: nico-roots
        - name: firmware
          emptyDir: {}
        {{- if .Values.bootArtifactContainers }}
        - name: boot-artifacts
          emptyDir: {}
        {{- end }}
