suite: MQTT credential source
templates:
  - deployment.yaml
release:
  namespace: nico-system
set:
  global.image.repository: registry.example.com/nvmetal-carbide
  global.image.tag: test
tests:
  - it: configures no credential file and no Vault by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_CREDENTIALS_FILE_ENABLED
            value: "true"
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: credentials
          any: true

  - it: mounts the Secret directory and points the file source at the key
    set:
      credentials:
        secretName: dsx-consumer-credentials
        key: credentials.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_CREDENTIALS_FILE_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_CREDENTIALS_FILE_PATH
            value: /var/run/secrets/nico-credentials/credentials.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /var/run/secrets/nico-credentials
            name: credentials
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: dsx-consumer-credentials

  - it: quotes a Secret name that looks like a number
    set:
      credentials:
        secretName: "2026"
        key: credentials.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: "2026"

  - it: rejects a Secret name without a key
    set:
      credentials:
        secretName: dsx-consumer-credentials
    asserts:
      - failedTemplate:
          errorMessage: credentials.key is required when credentials.secretName is set

  - it: rejects a key without a Secret name
    set:
      credentials:
        key: credentials.yaml
    asserts:
      - failedTemplate:
          errorMessage: credentials.secretName is required when credentials.key is set

  - it: passes extra environment for a Vault-backed source
    set:
      extraEnv:
        - name: VAULT_ADDR
          value: https://vault.example:8200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_ADDR
            value: https://vault.example:8200
