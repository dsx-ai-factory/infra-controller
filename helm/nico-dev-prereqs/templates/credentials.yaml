{{- if .Values.localConfig.database }}
{{- range $component := list "rest" "keycloak" "temporal" }}
{{- $database := required (printf "localConfig.database.%s is required" $component) (index $.Values.localConfig.database $component) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ if eq $component "rest" }}nico-rest-db-user{{ else }}{{ $component }}-db-user{{ end }}
  namespace: {{ $.Values.coreNamespace | quote }}
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $database.user | quote }}
  password: {{ $database.password | quote }}
{{- if eq $component "temporal" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: {{ $.Values.localConfig.temporalNamespace | quote }}
  labels:
    app.kubernetes.io/part-of: temporal
type: Opaque
stringData:
  password: {{ $database.password | quote }}
{{- end }}
{{- end }}
{{- end }}
