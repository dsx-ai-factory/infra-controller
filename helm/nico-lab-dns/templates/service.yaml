apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "nico-lab-dns.labels" . | nindent 4 }}
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv6]
  selector:
    {{- include "nico-lab-dns.labels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
