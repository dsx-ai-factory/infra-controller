apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "nico-lab-dns.labels" . | nindent 4 }}
data:
  Corefile: |
    .:53 {
      errors
      health :8080
      ready :8181
      # Compatibility names are still used by the boot artifacts.
      rewrite name exact carbide-api.forge {{ .Values.apiService }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}
      rewrite name exact carbide-pxe.forge {{ .Values.pxeService }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}
      rewrite name exact carbide-static-pxe.forge {{ .Values.pxeService }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}
      forward . /etc/resolv.conf
      cache 10
    }
