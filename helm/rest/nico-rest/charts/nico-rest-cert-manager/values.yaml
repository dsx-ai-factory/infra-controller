nameOverride: ""
namespaceOverride: ""

podAnnotations: {}

image:
  name: nico-rest-cert-manager

replicaCount: 1

config:
  caCommonName: "NICo Local Dev CA"
  caOrganization: "NVIDIA"
  caCertFile: "/etc/pki/ca/tls.crt"
  caKeyFile: "/etc/pki/ca/tls.key"
  tlsPort: 8000
  insecurePort: 8001
  caBaseDns: "nico.local"
  # -- Fully override the SANs stamped on the HTTPS listener's certificate.
  # When empty, they are generated from the Service name and namespace (plus
  # localhost). Any hostname a client dials must appear here, or that client's
  # TLS hostname verification fails; the nico-rest parent chart enforces that
  # for nico-rest-site-manager, which is the one in-tree client.
  dnsNames: []
  debug: false

secrets:
  # -- Name of the Secret containing the CA signing cert and key (tls.crt / tls.key).
  # This Secret must exist before deploying this chart — it is NOT created by any sub-chart.
  # In production it is typically provisioned by Vault agent injection.
  # For local dev, it is created by make kind-reset-infra (setup-local.sh).
  caSigningSecret: ca-signing-secret

service:
  type: ClusterIP
  httpsPort: 8000
  httpPort: 8001

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

# -- Extra container environment, name->value. Mainly for OTEL_* variables:
# the binary exports traces when OTEL_EXPORTER_OTLP_ENDPOINT (or the traces
# specific endpoint) is set and otherwise only forwards trace context.
extraEnv: {}
