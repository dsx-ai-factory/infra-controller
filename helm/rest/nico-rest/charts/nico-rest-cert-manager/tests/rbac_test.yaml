suite: Certificate Manager has no Kubernetes API credentials
templates:
  - rbac.yaml
tests:
  - it: creates only a service account with token mounting disabled
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: automountServiceAccountToken
          value: false
