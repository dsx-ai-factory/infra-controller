{{- if not (has .Values.authorization.mode (list "AUDIT" "ENFORCE")) }}
{{- fail "authorization.mode must be AUDIT or ENFORCE" }}
{{- end }}
{{- if hasKey .Values.extraEnv "CERT_AUTH_MODE" }}
{{- fail "configure CERT_AUTH_MODE through chart values, not extraEnv" }}
{{- end }}
{{- if hasKey .Values.extraEnv "CERT_AUTH_ALLOWED_IDENTITIES" }}
{{- fail "configure CERT_AUTH_ALLOWED_IDENTITIES through chart values, not extraEnv" }}
{{- end }}
{{- if hasKey .Values.extraEnv "CERT_AUTH_CLIENT_CA_FILE" }}
{{- fail "configure CERT_AUTH_CLIENT_CA_FILE through chart values, not extraEnv" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-rest-cert-manager
  namespace: {{ include "nico-rest-cert-manager.namespace" . }}
  labels:
    {{- include "nico-rest-cert-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nico-rest-cert-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nico-rest-cert-manager.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      serviceAccountName: nico-rest-cert-manager
      terminationGracePeriodSeconds: 5
      # 1000 is the `nvs` user the image declares. The image states it by name,
      # which the kubelet cannot verify, so runAsNonRoot needs the numeric UID
      # spelled out here. fsGroup makes the tmp volume below writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cert-manager
          image: "{{ include "nico-rest-cert-manager.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --ca-common-name={{ .Values.config.caCommonName }}
            - --ca-organization={{ .Values.config.caOrganization }}
            - --ca-cert-file={{ .Values.config.caCertFile }}
            - --ca-key-file={{ .Values.config.caKeyFile }}
            - --tls-port={{ .Values.config.tlsPort }}
            - --insecure-port={{ .Values.config.insecurePort }}
            - --ca-base-dns={{ .Values.config.caBaseDns }}
            {{- range include "nico-rest-cert-manager.dnsNames" . | fromYamlArray }}
            - --dns-name={{ . }}
            {{- end }}
            {{- if .Values.config.debug }}
            - --debug
            {{- end }}
          ports:
            - containerPort: {{ .Values.config.tlsPort }}
              name: https
            - containerPort: {{ .Values.config.insecurePort }}
              name: http
          env:
            - name: CERT_AUTH_MODE
              value: {{ .Values.authorization.mode | quote }}
            - name: CERT_AUTH_ALLOWED_IDENTITIES
              value: {{ include "nico-rest-cert-manager.allowedIdentities" . | fromYamlArray | join "," | quote }}
            - name: CERT_AUTH_CLIENT_CA_FILE
              value: {{ .Values.authorization.clientCaFile | quote }}
          {{- with .Values.extraEnv }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: ca-signing-secret
              mountPath: /etc/pki/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.config.insecurePort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.config.insecurePort }}
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: ca-signing-secret
          secret:
            secretName: {{ .Values.secrets.caSigningSecret }}
        - name: tmp
          emptyDir: {}
