{{- $tag := .Values.global.image.tag | default "latest" | replace "." "-" | replace "+" "-" }}
{{- with .Values.db.sslMode }}
{{- if not (has . (list "disable" "allow" "prefer" "require" "verify-ca" "verify-full")) }}
{{- fail (printf "invalid db.sslMode %q: must be one of disable, allow, prefer, require, verify-ca, verify-full" .) }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nico-rest-db.name" . }}-migration-{{ $tag }}
  namespace: {{ include "nico-rest-db.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "nico-rest-db.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "nico-rest-db.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 1000 is the `nvs` user the migrations image declares. `pg_isready` in
      # the init container is a client binary that writes nothing, so it runs
      # under the same UID without needing anything from its own image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: {{ if and .Values.waitForPostgres.repository .Values.waitForPostgres.tag }}{{ .Values.waitForPostgres.repository }}:{{ .Values.waitForPostgres.tag }}{{ else }}{{ .Values.waitForPostgres.image }}{{ end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if or .Values.db.sslMode .Values.db.caCertSecret }}
          env:
            {{- with .Values.db.sslMode }}
            - name: PGSSLMODE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.db.caCertSecret }}
            - name: PGSSLROOTCERT
              value: /etc/nico-rest-db/ca-certificate/{{ .Values.db.caCertKey }}
            {{- end }}
          {{- end }}
          {{- if .Values.db.caCertSecret }}
          volumeMounts:
            - name: ca-certificate
              mountPath: /etc/nico-rest-db/ca-certificate
              readOnly: true
          {{- end }}
          command:
            - pg_isready
            - -h
            - {{ .Values.db.host }}
            - -p
            - {{ .Values.db.port | quote }}
            - -U
            - {{ .Values.db.user }}
      containers:
        - name: migrations
          image: "{{ include "nico-rest-db.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
              value: {{ .Values.db.host }}
            - name: PGPORT
              value: {{ .Values.db.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.db.name }}
            - name: PGUSER
              value: {{ .Values.db.user }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.dbCreds }}
                  key: password
            {{- with .Values.db.sslMode }}
            - name: PGSSLMODE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.db.caCertSecret }}
            - name: PGSSLROOTCERT
              value: /etc/nico-rest-db/ca-certificate/{{ .Values.db.caCertKey }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.db.caCertSecret }}
            - name: ca-certificate
              mountPath: /etc/nico-rest-db/ca-certificate
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Scratch space for the read-only root filesystem. Go puts temp files
        # under /tmp.
        - name: tmp
          emptyDir: {}
        {{- if .Values.db.caCertSecret }}
        # CA bundle for PGSSLROOTCERT when db.sslMode verifies the server
        # certificate (verify-ca, verify-full). Only the configured key is
        # projected so other keys in the Secret are not exposed.
        - name: ca-certificate
          secret:
            secretName: {{ .Values.db.caCertSecret }}
            defaultMode: 0444
            items:
              - key: {{ .Values.db.caCertKey }}
                path: {{ .Values.db.caCertKey }}
        {{- end }}
