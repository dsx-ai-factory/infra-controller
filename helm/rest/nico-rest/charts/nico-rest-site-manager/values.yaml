replicaCount: 1

nameOverride: ""
namespaceOverride: ""

podAnnotations: {}

image:
  name: nico-rest-site-manager

## Pod-level security context. 1000 is the `nvs` user the image declares; the
## image names it rather than giving a UID, which the kubelet cannot verify, so
## runAsNonRoot needs the number spelled out here. Override for OpenShift, where
## the restricted SCC assigns UIDs from the namespace range and rejects fixed
## numeric UIDs:
## Keep runAsNonRoot: true and null only the fixed UID/GID so the SCC assigns
## them from the range while the non-root assertion is preserved:
##   podSecurityContext:
##     runAsNonRoot: true
##     runAsUser: null
##     fsGroup: null
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

service:
  type: ClusterIP
  port: 8100

args:
  listenPort: 8100
  credsManagerUrl: "https://nico-rest-cert-manager.nico-rest:8000"
  tlsCertPath: /etc/tls/tls.crt
  tlsKeyPath: /etc/tls/tls.key
  debug: true

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

certificate:
  enabled: true
  secretName: site-manager-tls
  duration: 2160h
  renewBefore: 360h
  commonName: nico-rest-site-manager
  # -- Fully override the certificate dnsNames. When empty, dnsNames are
  # generated from the chart name and namespace (plus localhost).
  dnsNames: []
  # -- SPIFFE/SAN URIs for the certificate. When empty, no uris are set.
  uris: []
  subject:
    # -- List of organizations for the certificate subject
    organizations: []
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

rbac:
  create: true
