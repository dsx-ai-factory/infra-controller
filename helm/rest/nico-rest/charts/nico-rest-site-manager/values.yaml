replicaCount: 1

nameOverride: ""
namespaceOverride: ""

podAnnotations: {}

image:
  name: nico-rest-site-manager

service:
  type: ClusterIP
  port: 8100

args:
  listenPort: 8100
  # -- Fully override the nico-rest-cert-manager endpoint. When empty, it is
  # generated from the release namespace, which is where that subchart lands
  # unless it carries its own namespaceOverride. Set this explicitly in that
  # case. The hostname has to be one of the SANs on that service's certificate
  # (nico-rest-cert-manager.config.dnsNames). Deploying through the nico-rest
  # parent chart fails rendering when either of those settings would invalidate
  # the generated endpoint and this is left empty.
  credsManagerUrl: ""
  tlsCertPath: /etc/tls/tls.crt
  tlsKeyPath: /etc/tls/tls.key
  # -- CA bundle used to verify nico-rest-cert-manager, read from the
  # credsManagerCa mount below. Point it elsewhere only if you also arrange for
  # a bundle to exist at that path.
  credsManagerCaPath: /etc/credsmgr-ca/ca.crt
  debug: true

# -- CA that signs nico-rest-cert-manager's HTTPS listener, which is what Site
# Manager has to trust to verify it. This is deliberately not the issuer of
# Site Manager's own serving certificate: global.certificate.issuerRef and
# nico-rest-cert-manager.secrets.caSigningSecret are independent settings, so
# the chart cannot assume one vouches for the other. Only the certificate is
# projected; the signing key stays in the Secret. The Secret has to exist in
# the namespace this chart deploys into, and has to be the one
# nico-rest-cert-manager.secrets.caSigningSecret names; the nico-rest parent
# chart fails rendering when that is overridden and this is left at the default.
credsManagerCa:
  secretName: ca-signing-secret
  key: tls.crt

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "250m"

certificate:
  enabled: true
  secretName: site-manager-tls
  duration: 2160h
  renewBefore: 360h
  commonName: nico-rest-site-manager
  # -- Fully override the certificate dnsNames. When empty, dnsNames are
  # generated from the chart name and namespace (plus localhost).
  dnsNames: []
  # -- SPIFFE/SAN URIs for the certificate. When empty, no uris are set.
  uris: []
  subject:
    # -- List of organizations for the certificate subject
    organizations: []
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

rbac:
  create: true

# -- Extra container environment, name->value. Mainly for OTEL_* variables:
# the binary exports traces when OTEL_EXPORTER_OTLP_ENDPOINT (or the traces
# specific endpoint) is set and otherwise only forwards trace context.
extraEnv: {}
