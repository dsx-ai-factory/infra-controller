apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-rest-cloud-worker
  namespace: {{ include "nico-rest-workflow.namespace" . }}
  labels:
    {{- include "nico-rest-workflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloud-worker
spec:
  replicas: {{ .Values.cloudWorker.replicaCount }}
  selector:
    matchLabels:
      app: nico-rest-cloud-worker
      app.kubernetes.io/name: nico-rest-workflow
      app.kubernetes.io/component: cloud-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nico-rest-cloud-worker
        app.kubernetes.io/name: nico-rest-workflow
        app.kubernetes.io/component: cloud-worker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nico-rest-cloud-worker
          image: "{{ include "nico-rest-workflow.image" . }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.metrics.port }}
              name: metrics
          env:
            - name: CONFIG_FILE_PATH
              value: /app/config.yaml
            - name: TEMPORAL_NAMESPACE
              value: cloud
            {{- range $k, $v := .Values.extraEnv }}
            {{- if has $k (list "CONFIG_FILE_PATH" "TEMPORAL_NAMESPACE" "TEMPORAL_QUEUE") }}
            {{- fail (printf "extraEnv must not override chart-managed variable %s" $k) }}
            {{- end }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: TEMPORAL_QUEUE
              value: cloud
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: temporal-encryption-key
              mountPath: /var/secrets/temporal
              readOnly: true
            - name: temporal-tls-certs
              mountPath: /var/secrets/temporal/certs
              readOnly: true
            {{- include "nico-rest-workflow.dbCredsVolumeMount" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8899
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8899
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.cloudWorker.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # 1000 is the `nvs` user the image declares. The image names it rather
      # than giving a UID, which the kubelet cannot verify, so runAsNonRoot
      # needs the number spelled out here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        # Scratch space for the read-only root filesystem. Go puts temp files
        # under /tmp.
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "nico-rest-workflow.name" . }}-config
        - name: temporal-encryption-key
          secret:
            secretName: {{ .Values.secrets.temporalEncryptionKey }}
            items:
              - key: temporal-encryption-key
                path: encryption-key
        - name: temporal-tls-certs
          secret:
            secretName: {{ .Values.secrets.temporalClientCerts }}
        {{- include "nico-rest-workflow.dbCredsVolume" . | nindent 8 }}
