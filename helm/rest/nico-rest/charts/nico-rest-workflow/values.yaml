nameOverride: ""
namespaceOverride: ""

podAnnotations: {}

image:
  name: nico-rest-workflow

cloudWorker:
  replicaCount: 1
  # -- Extra environment for the cloud worker only, merged over extraEnv with
  # these keys winning. Use it for OTEL_SERVICE_NAME when the cloud worker
  # needs its own service identity.
  extraEnv: {}
  # -- Cloud worker resources. limits.memory also sets GOMEMLIMIT. Refer to
  # the top-level extraEnv.
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

siteWorker:
  replicaCount: 1
  # -- Extra environment for the site worker only, merged over extraEnv with
  # these keys winning. Use it for OTEL_SERVICE_NAME when the site worker
  # needs its own service identity.
  extraEnv: {}
  # -- Site worker resources. limits.memory also sets GOMEMLIMIT. Refer to
  # the top-level extraEnv. Site worker pods share the inventory of every
  # site. On one simulated site of 1,112 racks (20,016 hosts) with a 3-minute
  # inventory schedule, one pod with these limits finished every cycle.
  # Memory should cover a recovery start: a pod that started with a whole
  # cycle open peaked at about 1.4 to 1.7 GiB here. For sizing, refer to
  # "Worker resources and sizing" in rest-api/deploy/INSTALLATION.md.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

secrets:
  temporalEncryptionKey: temporal-encryption-key
  temporalClientCerts: temporal-client-cloud-certs
  # -- Secret containing DB password at key "password". When set, db.password is ignored
  # and the password is read from /var/secrets/db/password (supports live rotation).
  dbCreds: ""

config:
  env:
    dev: true
  log:
    level: debug
  db:
    host: postgres.postgres
    port: 5432
    name: nico
    user: nico
    # -- Plain-text password. Ignored when secrets.dbCreds is set.
    password: nico
  # -- Temporal worker tuning. The cloud worker and the site worker read the same config.
  # worker:
  #   # Concurrent activity task pollers, 1 to 20. Default 10.
  #   maxConcurrentActivityPollers: 10
  #   # Activities one worker pod executes at once, 1 to 1000. Default 128 on
  #   # both workers.
  #   maxConcurrentActivityExecutionSize: 128
  temporal:
    host: temporal-frontend.temporal
    port: 7233
    serverName: server.temporal.local
    namespace: cloud
    queue: cloud
    tls:
      enabled: true
      certPath: /var/secrets/temporal/certs/tls.crt
      keyPath: /var/secrets/temporal/certs/tls.key
      caPath: /var/secrets/temporal/certs/ca.crt
      disableHostVerification: false
    encryptionKeyPath: /var/secrets/temporal/encryption-key
    # Only the site worker reads these, since it serves the `site` namespace.
    siteNamespace:
      # Retention the site worker applies to the `site` namespace on startup. It covers every
      # closed workflow, so it's how long failed, canceled, terminated, and timed out runs are kept.
      # `0` leaves the namespace retention unchanged.
      retention: 72h
      # How long a successful inventory workflow is kept before the site worker deletes it. It has
      # to be shorter than a nonzero `retention`, otherwise the cloud and site workers exit on
      # startup. `0` keeps it for the full `retention`.
      successfulInventoryRetention: 24h
  # Site Manager endpoint the cloud worker calls to rotate Site Agent Temporal certificates.
  siteManager:
    svcEndpoint: "https://nico-rest-site-manager:8100/v1/site"
  ngc:
    api:
      baseUrl: ""
  notifications:
    slack:
      webhookURL: ""
  metrics:
    enabled: true
    port: 9360
  tracing:
    enabled: true
    serviceName: nico-rest-workflow

# -- Extra container environment shared by both workers, name->value. Mainly
# for OTEL_* variables; cloudWorker.extraEnv and siteWorker.extraEnv override
# it per worker. The chart sets GOMEMLIMIT on each worker to 85 percent of its
# resources.limits.memory, rounded down to whole MiB, only when that limit is a
# whole number of Mi or Gi. A GOMEMLIMIT key here or in the worker's extraEnv
# replaces it. Write that value as a quoted string, for example "1500MiB", or
# "off" for no limit.
extraEnv: {}
