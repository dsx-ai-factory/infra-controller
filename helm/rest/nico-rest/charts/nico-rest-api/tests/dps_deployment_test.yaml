suite: REST API direct DPS secret mount
templates:
  - configmap.yaml
  - deployment.yaml
set:
  global.image.repository: example.test
  global.image.tag: latest
  # The Deployment's config checksum renders configmap.yaml, which needs an auth source.
  config.issuers:
    - name: test-idp
      origin: custom
      jwks: https://idp.example.test/.well-known/jwks.json
      issuer: https://idp.example.test
tests:
  - it: does not mount DPS credentials when DPS is disabled
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dps-creds
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: dps-creds

  - it: mounts DPS credentials when DPS is enabled
    template: deployment.yaml
    set:
      config.powerProvisioning.dps.enabled: true
      config.powerProvisioning.dps.endpoint: dps.example.test:443
      secrets.dpsCreds: nico-dps-client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dps-creds
            mountPath: /var/secrets/dps
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dps-creds
            secret:
              secretName: nico-dps-client
              items:
                - key: token
                  path: token
                - key: ca.crt
                  path: ca.crt
