{{- if .Values.caBundle }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-rest-api.name" . }}-ca-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nico-rest-api.labels" . | nindent 4 }}
data:
  ca-bundle.crt: |
    {{- .Values.caBundle | nindent 4 }}
{{- end }}
