replicaCount: 1

nameOverride: ""
namespaceOverride: ""

podAnnotations: {}

image:
  name: nico-rest-api

service:
  type: ClusterIP
  port: 8388
  metricsPort: 9360

nodePort:
  # -- Expose the API over plaintext NodePort. Cannot be enabled with ingress.
  enabled: false
  port: 30388

ingress:
  enabled: false
  className: contour
  annotations: {}
  # -- Ingress routes to the chart-managed Service on service.port.
  # ClusterIP is sufficient for normal ingress controller traffic.
  hosts:
    - host: nico-rest-api.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nico-rest-api-ingress-tls
      hosts:
        - nico-rest-api.local
  certificate:
    # -- Create a cert-manager Certificate for the ingress TLS Secret when ingress is enabled.
    # Set false when ingress.tls points at a pre-existing Secret.
    enabled: true
    secretName: nico-rest-api-ingress-tls
    duration: 2160h
    renewBefore: 360h
    commonName: nico-rest-api.local
    # -- Fully override the certificate dnsNames. When empty, dnsNames are
    # generated from ingress.hosts.
    dnsNames: []
    # -- SPIFFE/SAN URIs for the certificate. When empty, no uris are set.
    uris: []
    subject:
      # -- List of organizations for the certificate subject
      organizations: []
    privateKey:
      algorithm: RSA
      encoding: PKCS1
      size: 2048

  # Example: use an existing TLS Secret for a fully qualified domain instead of cert-manager Certificate
  # className: contour
  # certificate:
  #   enabled: false
  # hosts:
  #   - host: api.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls:
  #   - secretName: api-example-com-tls
  #     hosts:
  #       - api.example.com

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

secrets:
  temporalEncryptionKey: temporal-encryption-key
  temporalClientCerts: temporal-client-cloud-certs
  # -- Only required when keycloak is enabled
  keycloakClientSecret: keycloak-client-secret
  # -- Secret containing DB password at key "password". When set, db.password is ignored
  # and the password is read from /var/secrets/db/password (supports live rotation).
  # Created by nico-prereqs ESO (nico-rest-db-eso) when rest.enabled=true.
  dbCreds: db-creds
  # -- Name of the existing Kubernetes Secret mounted when direct DPS integration
  # is enabled. The Secret must contain the keys "token" and "ca.crt". NICo does
  # not create or renew the token.
  dpsCreds: ""

config:
  env:
    dev: true
    disconnected: true
  api:
    name: nico
    route:
      version: v2
  log:
    level: debug
    sentry:
      dsn: ""
  db:
    host: nico-pg-cluster.postgres.svc.cluster.local
    port: 5432
    name: nico_rest
    user: nico-rest.nico
    # -- Plain-text password. Ignored when secrets.dbCreds is set.
    password: ""
  temporal:
    host: temporal-frontend.temporal
    port: 7233
    serverName: server.temporal.local
    namespace: cloud
    queue: cloud
    tls:
      enabled: true
      certPath: /var/secrets/temporal/certs/tls.crt
      keyPath: /var/secrets/temporal/certs/tls.key
      caPath: /var/secrets/temporal/certs/ca.crt
      disableHostVerification: false
    encryptionKeyPath: /var/secrets/temporal/encryption-key
  siteManager:
    enabled: true
    svcEndpoint: "https://nico-rest-site-manager:8100/v1/site"
  metrics:
    enabled: true
    port: 9360
  tracing:
    # Gates the otelecho middleware and the Temporal client interceptor.
    enabled: true
    serviceName: nico-rest-api
  powerProvisioning:
    dps:
      # -- Whether NICo makes direct calls to DPS. Disabled by default.
      enabled: false
      # -- DPS gRPC endpoint. Required when DPS integration is enabled.
      endpoint: ""
      # -- Overall deadline applied independently to each DPS RPC.
      requestTimeout: 15s
      tokenPath: /var/secrets/dps/token
      tls:
        caPath: /var/secrets/dps/ca.crt
        # -- Optional TLS server-name override. Empty uses the endpoint host.
        serverName: ""
  # -- JWT issuers for authentication (mutually exclusive with keycloak)
  # When keycloak is disabled, at least one issuer must be configured.
  # Example:
  #   issuers:
  #     - name: my-idp
  #       origin: custom
  #       jwks: https://my-idp.example.com/.well-known/jwks.json
  #       issuer: "my-idp.example.com"
  issuers: []
  # -- Keycloak authentication (mutually exclusive with issuers)
  keycloak:
    enabled: false
    baseURL: ""
    externalBaseURL: ""
    realm: ""
    clientID: ""
    clientSecretPath: /var/secrets/keycloak/client-secret
    serviceAccount: false
  rateLimiter:
    enabled: false
    rate: 10.0
    burst: 30
    expiresIn: 180

# -- Extra container environment, name->value. Mainly for OTEL_* variables.
extraEnv: {}
