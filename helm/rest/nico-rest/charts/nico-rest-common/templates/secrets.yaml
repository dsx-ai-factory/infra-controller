{{- if .Values.secrets.create }}
{{- $temporalEncryptionKey := .Values.secrets.temporalEncryptionKey.value }}
{{- if not $temporalEncryptionKey }}
  {{- $existingSecret := lookup "v1" "Secret" (include "nico-rest-common.namespace" .) "temporal-encryption-key" }}
  {{- $existingKey := dig "data" "temporal-encryption-key" "" $existingSecret }}
  {{- if $existingKey }}
    {{- $temporalEncryptionKey = $existingKey | b64dec }}
  {{- else if .Release.IsInstall }}
    {{- $temporalEncryptionKey = randBytes 32 }}
  {{- else }}
    {{- fail "nico-rest-common requires an existing or explicitly configured Temporal encryption key on upgrade" }}
  {{- end }}
{{- end }}
# db-creds and image-pull-secret are annotated as pre-install / pre-upgrade
# hooks (weight -10) because the nico-rest-db migration Job runs as its own
# pre-install hook at weight -5 and needs both to exist before it starts.
# Without the hook annotations these were regular resources applied during
# main install, AFTER the migration Job pod had already tried to start —
# leading to "imagePullSecrets references image-pull-secret which does not
# exist" → kubelet anonymous pull → 403 on private registries.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: {{ include "nico-rest-common.namespace" . }}
  labels:
    {{- include "nico-rest-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  username: {{ .Values.secrets.dbCreds.username | quote }}
  password: {{ .Values.secrets.dbCreds.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-client-secret
  namespace: {{ include "nico-rest-common.namespace" . }}
  labels:
    {{- include "nico-rest-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret.value | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-encryption-key
  namespace: {{ include "nico-rest-common.namespace" . }}
  labels:
    {{- include "nico-rest-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  temporal-encryption-key: {{ $temporalEncryptionKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: image-pull-secret
  namespace: {{ include "nico-rest-common.namespace" . }}
  labels:
    {{- include "nico-rest-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.secrets.imagePullSecret.dockerconfigjson | quote }}
{{- end }}
