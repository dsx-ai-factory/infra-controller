{{/*
nico-rest-site-manager has to reach nico-rest-cert-manager over verified TLS,
which needs the hostname it dials and the CA it trusts to agree with how that
subchart is actually deployed. nico-rest-api and nico-rest-workflow in turn
have to reach nico-rest-site-manager. A subchart cannot read a sibling's
values, so none of them can keep itself in step. This chart is the only scope
that sees all of them. Each failure names the setting to adjust.
*/}}
{{- $certManager := (index .Values "nico-rest-cert-manager") | default dict -}}
{{- $siteManager := (index .Values "nico-rest-site-manager") | default dict -}}
{{- if and $certManager.enabled $siteManager.enabled -}}

{{/*
Trust anchor. Overriding the signing Secret on one side only leaves Site
Manager mounting a Secret that either does not exist, which makes it
unschedulable, or holds an unrelated CA, which fails every verification. Only
enforced while Site Manager still carries the chart default, since an operator
who set both has deliberately pointed trust at another copy of the same CA.
*/}}
{{- $signingSecret := ($certManager.secrets | default dict).caSigningSecret -}}
{{- $trustedSecret := ($siteManager.credsManagerCa | default dict).secretName | default ($siteManager.certManagerCa | default dict).secretName -}}
{{- if and $signingSecret (eq $trustedSecret "ca-signing-secret") (ne $signingSecret $trustedSecret) -}}
{{- fail (printf "nico-rest-cert-manager.secrets.caSigningSecret is %q, but nico-rest-site-manager.certManagerCa.secretName is still the default %q, so Site Manager would not trust the CA that signs the endpoint it verifies. Set nico-rest-site-manager.certManagerCa.secretName to %q." $signingSecret $trustedSecret $signingSecret) -}}
{{- end -}}

{{/*
Renaming the Secret is only one way the two sides drift. cert-manager signs
with whatever config.caCertFile and config.caKeyFile resolve to, and the
binary's own defaults are Vault agent paths, so pointing those values off the
/etc/pki/ca mount this chart provides leaves the listener signed by a CA the
chart never sees while Site Manager still trusts the mounted Secret. The
condition below mirrors NewNativeCertificateIssuer: the primary pair is used
only when both are set, and anything else falls back to the alternate paths,
which are the mount. Nothing here can discover the real signer, so Site
Manager's trust has to have been aimed deliberately.
*/}}
{{- $certManagerConfig := $certManager.config | default dict -}}
{{- $siteManagerArgs := $siteManager.args | default dict -}}
{{- $primaryCaCert := $certManagerConfig.caCertFile | default "" -}}
{{- $primaryCaKey := $certManagerConfig.caKeyFile | default "" -}}
{{- $signerIsUnknown := and (ne $primaryCaCert "") (ne $primaryCaKey "") (not (and (eq $primaryCaCert "/etc/pki/ca/tls.crt") (eq $primaryCaKey "/etc/pki/ca/tls.key"))) -}}
{{- $trustIsDefault := and (eq $trustedSecret "ca-signing-secret") (eq ($siteManagerArgs.credsManagerCaPath | default $siteManagerArgs.certManagerCaPath | default "") "/etc/credsmgr-ca/ca.crt") -}}
{{- if and $signerIsUnknown $trustIsDefault -}}
{{- fail (printf "nico-rest-cert-manager signs its listener from %q, outside the /etc/pki/ca mount this chart populates from nico-rest-cert-manager.secrets.caSigningSecret, so the signing CA is one the chart cannot see. nico-rest-site-manager still trusts the mounted Secret and every certificate request would fail with \"certificate signed by unknown authority\". Point Site Manager at the real signer: set nico-rest-site-manager.certManagerCa.secretName to a Secret holding it, or nico-rest-site-manager.args.certManagerCaPath to a bundle injected into that pod." $primaryCaCert) -}}
{{- end -}}

{{/*
Endpoint. Site Manager derives it from the release namespace and the fixed
Service name, so settings that move the Service or restrict its SANs invalidate
that derivation. Both are satisfied by setting args.certManagerUrl explicitly.
*/}}
{{- if not ($siteManagerArgs.credsManagerUrl | default $siteManagerArgs.certManagerUrl) -}}

{{- $overrideNamespace := $certManager.namespaceOverride | default "" -}}
{{- if and $overrideNamespace (ne $overrideNamespace .Release.Namespace) -}}
{{- fail (printf "nico-rest-cert-manager.namespaceOverride is %q, so its Service is not in the release namespace %q that nico-rest-site-manager derives its endpoint from. Set nico-rest-site-manager.args.certManagerUrl to the real endpoint." $overrideNamespace .Release.Namespace) -}}
{{- end -}}

{{- $dnsNames := ($certManager.config | default dict).dnsNames -}}
{{- $endpointHost := printf "nico-rest-cert-manager.%s" .Release.Namespace -}}
{{/*
Go accepts a wildcard only as the whole leftmost label, matching exactly one
label, so "*.<namespace>" is the single wildcard form that can cover a
two-label endpoint host. A bare "*", a trailing "*", and any deeper wildcard
are rejected by x509.VerifyHostname and so are not accepted here either.
*/}}
{{- $wildcardHost := printf "*.%s" .Release.Namespace -}}
{{- if and $dnsNames (not (has $endpointHost $dnsNames)) (not (has $wildcardHost $dnsNames)) -}}
{{- fail (printf "nico-rest-cert-manager.config.dnsNames covers neither %q, the host nico-rest-site-manager dials, nor %q, so its TLS hostname verification would fail. Add one of those names, or set nico-rest-site-manager.args.certManagerUrl to a host the list does cover." $endpointHost $wildcardHost) -}}
{{- end -}}

{{- end -}}
{{- end -}}

{{/*
Site Manager endpoint. nico-rest-api and nico-rest-workflow call Site Manager
at config.siteManager.svcEndpoint. Its default names the Site Manager Service
by its chart name on port 8100 in the caller's own namespace. Renaming or
moving that Service, or changing its port, leaves the default pointing at a
Service that doesn't exist. Only enforced while an endpoint still carries the
default, since an operator who set it has aimed it deliberately.
*/}}
{{- if $siteManager.enabled -}}
{{- $defaultSiteManagerEndpoint := "https://nico-rest-site-manager:8100/v1/site" -}}
{{- $siteManagerName := $siteManager.nameOverride | default "nico-rest-site-manager" | trunc 63 | trimSuffix "-" -}}
{{- $siteManagerNamespace := $siteManager.namespaceOverride | default .Release.Namespace | trunc 63 | trimSuffix "-" -}}
{{- $siteManagerPort := ($siteManager.service | default dict).port | default 8100 | int -}}
{{- range $caller := list "nico-rest-api" "nico-rest-workflow" -}}
{{- $callerValues := (index $.Values $caller) | default dict -}}
{{- $callerSiteManager := ($callerValues.config | default dict).siteManager | default dict -}}
{{/* nico-rest-workflow has no enabled flag. It always calls Site Manager. */}}
{{- $callsSiteManager := ternary $callerSiteManager.enabled true (hasKey $callerSiteManager "enabled") -}}
{{- $callerNamespace := $callerValues.namespaceOverride | default $.Release.Namespace | trunc 63 | trimSuffix "-" -}}
{{- $endpointIsDefault := eq ($callerSiteManager.svcEndpoint | default "") $defaultSiteManagerEndpoint -}}
{{- $defaultIsWrong := or (ne $siteManagerName "nico-rest-site-manager") (ne $siteManagerNamespace $callerNamespace) (ne $siteManagerPort 8100) -}}
{{- if and $callerValues.enabled $callsSiteManager $endpointIsDefault $defaultIsWrong -}}
{{- $host := ternary $siteManagerName (printf "%s.%s" $siteManagerName $siteManagerNamespace) (eq $siteManagerNamespace $callerNamespace) -}}
{{- fail (printf "%s.config.siteManager.svcEndpoint is still the default %q, but the nico-rest-site-manager Service is %q in namespace %q on port %d. Set %s.config.siteManager.svcEndpoint to %q." $caller $defaultSiteManagerEndpoint $siteManagerName $siteManagerNamespace $siteManagerPort $caller (printf "https://%s:%d/v1/site" $host $siteManagerPort)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
