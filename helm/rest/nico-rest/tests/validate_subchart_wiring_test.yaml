suite: cross-subchart Site Manager wiring
templates:
  - validate-subchart-wiring.yaml
release:
  namespace: nico-rest
tests:
  - it: accepts the defaults, where both subcharts agree
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a signing Secret override that Site Manager was not told about
    set:
      nico-rest-cert-manager.secrets.caSigningSecret: site-ca
    asserts:
      - failedTemplate:
          errorPattern: 'caSigningSecret is "site-ca".*still the default "ca-signing-secret"'

  - it: accepts a signing Secret override once Site Manager trusts it
    set:
      nico-rest-cert-manager.secrets.caSigningSecret: site-ca
      nico-rest-site-manager.credsManagerCa.secretName: site-ca
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a Vault-signed listener that Site Manager was not told about
    set:
      nico-rest-cert-manager.config.caCertFile: /vault/secrets/vault-root-ca-certificate/certificate
      nico-rest-cert-manager.config.caKeyFile: /vault/secrets/vault-root-ca-private-key/privatekey
    asserts:
      - failedTemplate:
          errorPattern: 'signs its listener from "/vault/secrets/vault-root-ca-certificate/certificate".*cannot see'

  - it: accepts a Vault-signed listener once Site Manager trusts a matching bundle
    set:
      nico-rest-cert-manager.config.caCertFile: /vault/secrets/vault-root-ca-certificate/certificate
      nico-rest-cert-manager.config.caKeyFile: /vault/secrets/vault-root-ca-private-key/privatekey
      nico-rest-site-manager.args.credsManagerCaPath: /vault/secrets/vault-root-ca-certificate/certificate
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores a half-configured primary pair, which falls back to the mount
    set:
      nico-rest-cert-manager.config.caCertFile: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves a deliberately separate trust Secret alone
    set:
      nico-rest-cert-manager.secrets.caSigningSecret: site-ca
      nico-rest-site-manager.credsManagerCa.secretName: site-ca-bundle
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects relocating cert-manager while site-manager derives its endpoint
    set:
      nico-rest-cert-manager.namespaceOverride: nico-rest-staging
    asserts:
      - failedTemplate:
          errorPattern: 'namespaceOverride is "nico-rest-staging".*release namespace "nico-rest"'

  - it: rejects SANs that omit the host site-manager dials
    set:
      nico-rest-cert-manager.config.dnsNames:
        - credsmgr.override.example.com
    asserts:
      - failedTemplate:
          errorPattern: 'covers neither "nico-rest-cert-manager.nico-rest".*nor "\*.nico-rest"'

  - it: accepts overridden SANs that keep that host
    set:
      nico-rest-cert-manager.config.dnsNames:
        - nico-rest-cert-manager.nico-rest
        - localhost
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a wildcard SAN that x509.VerifyHostname would honour
    set:
      nico-rest-cert-manager.config.dnsNames:
        - '*.nico-rest'
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a wildcard too deep to match, as Go would
    set:
      nico-rest-cert-manager.config.dnsNames:
        - '*.nico-rest.svc'
    asserts:
      - failedTemplate:
          errorPattern: 'covers neither "nico-rest-cert-manager.nico-rest".*nor "\*.nico-rest"'

  - it: accepts an explicit endpoint, which is the documented escape hatch
    set:
      nico-rest-cert-manager.namespaceOverride: nico-rest-staging
      nico-rest-cert-manager.config.dnsNames:
        - credsmgr.override.example.com
      nico-rest-site-manager.args.credsManagerUrl: https://credsmgr.override.example.com:8000
    asserts:
      - hasDocuments:
          count: 0

  - it: stays quiet when cert-manager is not deployed by this release
    set:
      nico-rest-cert-manager.enabled: false
      nico-rest-cert-manager.namespaceOverride: nico-rest-staging
      nico-rest-cert-manager.secrets.caSigningSecret: site-ca
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects moving Site Manager while the API keeps the default endpoint
    set:
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://nico.local/nico-rest-sm/sa/nico-rest-site-manager
      nico-rest-site-manager.namespaceOverride: nico-rest-sm
    asserts:
      - failedTemplate:
          errorPattern: 'nico-rest-api.config.siteManager.svcEndpoint is still the default.*Set nico-rest-api.config.siteManager.svcEndpoint to "https://nico-rest-site-manager.nico-rest-sm:8100/v1/site"'

  - it: rejects renaming the Site Manager Service while the API keeps the default endpoint
    set:
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://nico.local/nico-rest/sa/site-manager
      nico-rest-site-manager.nameOverride: site-manager
    asserts:
      - failedTemplate:
          errorPattern: 'Set nico-rest-api.config.siteManager.svcEndpoint to "https://site-manager:8100/v1/site"'

  - it: checks the workflow endpoint when the API doesn't call Site Manager
    set:
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://nico.local/nico-rest-sm/sa/nico-rest-site-manager
      nico-rest-site-manager.namespaceOverride: nico-rest-sm
      nico-rest-api.config.siteManager.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'nico-rest-workflow.config.siteManager.svcEndpoint is still the default'

  - it: accepts a moved Site Manager once both callers point at it
    set:
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://nico.local/nico-rest-sm/sa/nico-rest-site-manager
      nico-rest-site-manager.namespaceOverride: nico-rest-sm
      nico-rest-api.config.siteManager.svcEndpoint: https://nico-rest-site-manager.nico-rest-sm:8100/v1/site
      nico-rest-workflow.config.siteManager.svcEndpoint: https://nico-rest-site-manager.nico-rest-sm:8100/v1/site
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a Site Manager URI missing from the allowlist
    set:
      nico-rest-site-manager.clientCertificate.spiffeID: spiffe://custom.test/site-manager
    asserts:
      - failedTemplate:
          errorPattern: 'Site Manager client SPIFFE ID.*missing from.*allowedIdentities'

  - it: accepts a deliberately configured identity on both sides
    set:
      nico-rest-site-manager.clientCertificate.spiffeID: spiffe://custom.test/site-manager
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://custom.test/site-manager
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects relocating Site Manager without adjusting its allowed identity
    set:
      nico-rest-site-manager.namespaceOverride: registration
    asserts:
      - failedTemplate:
          errorPattern: 'spiffe://nico.local/registration/sa/nico-rest-site-manager.*missing'

  - it: validates an explicit allowlist against the client URI in a custom trust domain
    set:
      global.spiffe.trustDomain: example.test
      nico-rest-cert-manager.authorization.allowedIdentities:
        - spiffe://example.test/nico-rest/sa/nico-rest-site-manager
    asserts:
      - hasDocuments:
          count: 0

  - it: validates an explicit client URI against the allowlist in a custom trust domain
    set:
      global.spiffe.trustDomain: example.test
      nico-rest-site-manager.clientCertificate.spiffeID: spiffe://example.test/nico-rest/sa/nico-rest-site-manager
    asserts:
      - hasDocuments:
          count: 0
