suite: Site Agent probes
templates:
  - statefulset.yaml
release:
  namespace: nico-rest
tests:
  - it: probes liveness and readiness on the status server port
    set:
      service:
        port: 9080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: 9080
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: 9080
