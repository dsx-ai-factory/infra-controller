{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nico-rest-site-agent.name" . }}
  namespace: {{ include "nico-rest-site-agent.namespace" . }}
  labels:
    {{- include "nico-rest-site-agent.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nico-rest-site-agent.name" . }}
  namespace: {{ include "nico-rest-site-agent.namespace" . }}
  labels:
    {{- include "nico-rest-site-agent.labels" . | nindent 4 }}
rules:
  # Secret volumes are mounted by the kubelet without pod RBAC. The Site Agent
  # API client only gets and updates the configured registration and Temporal
  # Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.secrets.siteRegistration | quote }}
      - {{ .Values.secrets.temporalClientCerts | quote }}
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nico-rest-site-agent.name" . }}
  namespace: {{ include "nico-rest-site-agent.namespace" . }}
  labels:
    {{- include "nico-rest-site-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nico-rest-site-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nico-rest-site-agent.name" . }}
    namespace: {{ include "nico-rest-site-agent.namespace" . }}
{{- end }}
