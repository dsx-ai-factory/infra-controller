apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-rest-site-agent.name" . }}-config
  namespace: {{ include "nico-rest-site-agent.namespace" . }}
  labels:
    {{- include "nico-rest-site-agent.labels" . | nindent 4 }}
data:
  {{- /* The probes, containerPorts, and Service use these ports, so envConfig can't override them. */}}
  ESA_PORT: {{ .Values.service.port | quote }}
  METRICS_PORT: {{ .Values.service.metricsPort | quote }}
  {{- range $key, $value := omit .Values.envConfig "ESA_PORT" "METRICS_PORT" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
