# The chart must preserve the binary's listener defaults and explicit site binds.
suite: Listener defaults and explicit overrides
templates:
  - charts/nico-dsx-exchange-consumer/templates/deployment.yaml
  - charts/nico-hardware-health/templates/deployment.yaml
  - charts/nico-pxe/templates/deployment.yaml
set:
  global.image.repository: example.invalid/core
  global.image.tag: test-revision
tests:
  # Listener defaults belong to the binaries; the chart must not inject overrides.
  - it: does not inject IPv6 listener overrides by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.invalid/core:test-revision
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_DSX_CONSUMER__METRICS__ENDPOINT
          any: true
        template: charts/nico-dsx-exchange-consumer/templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_HEALTH__METRICS__ENDPOINT
          any: true
        template: charts/nico-hardware-health/templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PXE_BIND_ADDRESS
          any: true
        template: charts/nico-pxe/templates/deployment.yaml

  # Explicit operator binds must override the binary's listener defaults.
  - it: preserves explicitly configured listener addresses
    set:
      nico-dsx-exchange-consumer.env.CARBIDE_DSX_CONSUMER__METRICS__ENDPOINT: "127.0.0.1:9009"
      nico-hardware-health.env.CARBIDE_HEALTH__METRICS__ENDPOINT: "127.0.0.1:9009"
      nico-pxe.env.PXE_BIND_ADDRESS: "127.0.0.1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_DSX_CONSUMER__METRICS__ENDPOINT
            value: "127.0.0.1:9009"
        template: charts/nico-dsx-exchange-consumer/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CARBIDE_HEALTH__METRICS__ENDPOINT
            value: "127.0.0.1:9009"
        template: charts/nico-hardware-health/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PXE_BIND_ADDRESS
            value: "127.0.0.1"
        template: charts/nico-pxe/templates/deployment.yaml
