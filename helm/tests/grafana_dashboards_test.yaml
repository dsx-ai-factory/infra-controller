suite: packaged Grafana dashboards
templates:
  - templates/grafana-dashboards.yaml
release:
  name: test-nico
  namespace: nico-system
tests:
  - it: does not install dashboards by default
    asserts:
      - hasDocuments:
          count: 0

  - it: packages one ConfigMap per dashboard
    set:
      grafanaDashboards.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - isKind:
          of: ConfigMap

  - it: packages the overview dashboard for the default Grafana sidecar
    set:
      grafanaDashboards.enabled: true
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-overview
    asserts:
      - equal:
          path: metadata.namespace
          value: nico-system
      - equal:
          path: metadata.labels["grafana_dashboard"]
          value: "1"
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: observability
      - equal:
          path: metadata.annotations["grafana_folder"]
          value: NICo
      - isNotEmpty:
          path: data["nico-overview.json"]
      - notExists:
          path: data["nico-lifecycle.json"]

  - it: keeps each dashboard in its own ConfigMap
    set:
      grafanaDashboards.enabled: true
    asserts:
      - exists:
          path: data["nico-lifecycle.json"]
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-lifecycle
      - exists:
          path: data["nico-api-performance.json"]
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-api-performance
      - exists:
          path: data["nico-bmc-performance.json"]
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-bmc-performance
      - exists:
          path: data["nico-fleet.json"]
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-fleet
      - exists:
          path: data["nico-site-detail.json"]
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-site-detail

  - it: stores each dashboard as parseable JSON
    set:
      grafanaDashboards.enabled: true
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-overview
    asserts:
      - matchRegex:
          path: data["nico-overview.json"]
          pattern: '^\{'

  - it: makes extension services selectable in the lifecycle dashboard
    set:
      grafanaDashboards.enabled: true
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-lifecycle
    asserts:
      - matchRegex:
          path: data["nico-lifecycle.json"]
          pattern: '"query": "([^"]*,)?extension_services(,[^"]*)?"'
      - matchRegex:
          path: data["nico-lifecycle.json"]
          pattern: '"text": "extension_services", "value": "extension_services"'

  - it: keeps the site and fleet dashboards focused on NICo services
    set:
      grafanaDashboards.enabled: true
    asserts:
      - notMatchRegex:
          path: data["nico-site-detail.json"]
          pattern: '"name":\s*"(job|namespace)"|\$\{?(job|namespace)\b|\b(job|namespace)\s*(=|!=|!~)|\b(kube_|container_)'
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-site-detail
      - notMatchRegex:
          path: data["nico-fleet.json"]
          pattern: '"name":\s*"(job|namespace)"|\$\{?(job|namespace)\b|\b(job|namespace)\s*(=|!=|!~)|\b(kube_|container_)'
        documentSelector:
          path: metadata.name
          value: nico-system-test-nico-nico-fleet

  - it: selects a site across NICo services while defaulting to all sites and unlabeled metrics
    set:
      grafanaDashboards.enabled: true
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-site-detail
    asserts:
      - matchRegex:
          path: data["nico-site-detail.json"]
          pattern: '(?s)"allValue": "\.\*",\s*"current": \{\s*"selected": true,\s*"text": "All",\s*"value": "\$__all".*?"includeAll": true,\s*"label": "Site",\s*"multi": false,\s*"name": "site"'
      - matchRegex:
          path: data["nico-site-detail.json"]
          pattern: 'label_values\(\{__name__=~\\"\$\{metric_prefix\}_\.\+\|ssh_console_\.\+\\"\}, forge_site\)'
      - matchRegex:
          path: data["nico-site-detail.json"]
          pattern: 'max\(\$\{metric_prefix\}_api_ready\{forge_site=~\\"\$site\\"\}\) or vector\(0\)'
      - matchRegex:
          path: data["nico-site-detail.json"]
          pattern: '\$\{metric_prefix\}_machines_total\{forge_site=~\\"\$site\\",fresh=\\"true\\"\}'
      - matchRegex:
          path: data["nico-site-detail.json"]
          pattern: 'max\(ssh_console_healthy_machines\{forge_site=~\\"\$site\\"\}\) / clamp_min\(max\(ssh_console_grpc_total_machines\{forge_site=~\\"\$site\\"\}\), 1\)'

  - it: supports a Grafana namespace and sidecar-specific metadata
    values:
      - fixtures/grafana-custom-values.yaml
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-overview
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels["sidecar.example.com/dashboard"]
          value: "true"
      - notExists:
          path: metadata.labels["grafana_dashboard"]
      - equal:
          path: metadata.annotations["sidecar.example.com/folder"]
          value: Infrastructure/NICo
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: sre

  - it: can omit the folder annotation
    set:
      grafanaDashboards.enabled: true
      grafanaDashboards.folderAnnotation: ""
    documentSelector:
      path: metadata.name
      value: nico-system-test-nico-nico-overview
    asserts:
      - notExists:
          path: metadata.annotations
