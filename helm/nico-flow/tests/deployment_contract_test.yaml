suite: Flow deployment contract
templates:
  - configmap.yaml
  - deployment.yaml
tests:
  - it: deploys only the Flow container
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: flow
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-port=9360
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9360
      - equal:
          path: spec.selector.matchLabels
          value:
            app: flow
            app.kubernetes.io/name: flow
      - equal:
          path: spec.template.metadata.labels.app
          value: flow
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: flow
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PSM_API_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NSM_API_URL
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: psm-firmware
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nsm-scratch

  - it: mounts flowconfig.yaml from the config ConfigMap and rolls on change
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: flow-config-files
            mountPath: /etc/flow
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: flow-config-files
            configMap:
              name: flow-config-files
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: merges custom pod annotations without replacing chart-owned annotations
    template: deployment.yaml
    set:
      podAnnotations:
        instrumentation.opentelemetry.io/inject-sdk: dsx-obs/default-instrumentation
        sidecar.opentelemetry.io/inject: dsx-obs/default-sidecar
        kubectl.kubernetes.io/default-container: overridden
    asserts:
      - equal:
          path: spec.template.metadata.annotations["instrumentation.opentelemetry.io/inject-sdk"]
          value: dsx-obs/default-instrumentation
      - equal:
          path: spec.template.metadata.annotations["sidecar.opentelemetry.io/inject"]
          value: dsx-obs/default-sidecar
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: flow
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
