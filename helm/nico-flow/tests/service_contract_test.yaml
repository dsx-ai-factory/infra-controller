suite: Flow Service contract
templates:
  - service-grpc.yaml
tests:
  - it: exposes Flow gRPC and Prometheus metrics
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: flow
      - contains:
          path: spec.ports
          content:
            port: 50051
            targetPort: grpc
            name: grpc
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            port: 9360
            targetPort: metrics
            name: metrics
            protocol: TCP
