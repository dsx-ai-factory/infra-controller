{{- $cfg := include "nico-flow.flowConfig" . | fromYaml -}}
{{- $tracing := .Values.tracing | default dict -}}
{{- if and (hasKey $tracing "enabled") (not (kindIs "invalid" $tracing.enabled)) (not (kindIs "bool" $tracing.enabled)) -}}
{{- fail "tracing.enabled must be a boolean (true or false)" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-config-files
  namespace: {{ include "nico-flow.namespace" . }}
  labels:
    {{- include "nico-flow.labels" . | nindent 4 }}
data:
  ## Keys mirror the yaml tags in rest-api/flow/internal/config/config.go.
  flowconfig.yaml: |
    inventory_run_frequency: {{ include "nico-flow.flowConfigInterval" (dict "key" "inventoryRunFrequency" "value" $cfg.inventoryRunFrequency) }}
    disable_inventory: {{ include "nico-flow.flowConfigBool" (dict "key" "disableInventory" "value" $cfg.disableInventory) }}
    leak_detection_interval: {{ include "nico-flow.flowConfigInterval" (dict "key" "leakDetectionInterval" "value" $cfg.leakDetectionInterval) }}
    disable_leak_detection: {{ include "nico-flow.flowConfigBool" (dict "key" "disableLeakDetection" "value" $cfg.disableLeakDetection) }}
    tracing:
      enabled: {{ $tracing.enabled | default false }}
