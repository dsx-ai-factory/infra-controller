syntax = "proto3";

package carbide.codegen.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // Fully qualified protobuf message used for this field by Rust generators.
  // The replacement must be wire-compatible with the declared field type.
  string field_rust_type = 51105;
}

extend google.protobuf.MethodOptions {
  // Fully qualified protobuf message used as this RPC's Rust request type.
  // The replacement must be wire-compatible with the declared request type.
  string method_rust_input_type = 51106;

  // Fully qualified protobuf message used as this RPC's Rust response type.
  // The replacement must be wire-compatible with the declared response type.
  string method_rust_output_type = 51107;
}
