[package]
name = "carbide-rpc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "rpc"

[features]
sqlx = ["dep:sqlx"]
cli = ["dep:clap", "dep:prettytable-rs", "dep:serde_yaml", "dep:csv"]
model = [
  "dep:carbide-api-model",
  "dep:once_cell",
  "dep:itertools",
  "dep:itertools",
  "dep:regex",
  "dep:base64",
]
test-support = ["dep:carbide-prost-builder"]

[dependencies]
carbide-instrument = { path = "../instrument" }

# [local-dependencies]
carbide-api-model = { path = "../api-model", optional = true }
carbide-http-connector = { path = "../http-connector" }
carbide-ipxe-renderer = { path = "../ipxe-renderer" }
carbide-tls = { path = "../tls" }
trace-propagation = { path = "../trace-propagation" }
carbide-health-report = { path = "../health-report" }
carbide-libmlx-model = { path = "../libmlx-model" }
carbide-measured-boot = { path = "../measured-boot", default-features = false }
carbide-prost-builder = { path = "../prost-builder", optional = true }
carbide-secrets = { path = "../secrets" }
carbide-network = { path = "../network" }
carbide-utils = { path = "../utils" }
config-version = { path = "../config-version" }
tonic-client-wrapper = { path = "../tonic-client-wrapper", default-features = false }
dns-record = { path = "../dns-record" }
carbide-uuid = { path = "../uuid" }

chrono = { features = ["serde"], workspace = true }
const_format = { workspace = true }
eyre = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
p256 = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-rustls = { workspace = true, features = ["http2"] }
hyper-util = { features = [
  "server",
  "http1",
  "http2",
  "tokio",
  "client",
  "client-legacy",
], workspace = true }
mac_address = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { features = ["sync"], workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
uuid = { features = ["v4", "serde"], workspace = true }
x509-parser = { workspace = true }
log = { workspace = true }
hickory-resolver = { workspace = true }
resolv-conf = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tonic-prost = { workspace = true }
tonic-prost-build = { workspace = true }
tryhard = { workspace = true }
rustls = { workspace = true }
async-trait = { workspace = true }
nonempty = { workspace = true }
clap = { features = ["derive"], optional = true, workspace = true }
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "mac_address",
  "ipnetwork",
  "uuid",
  "migrate",
  "postgres",
  "chrono",
  "macros",
  "json",
], optional = true }
prettytable-rs = { optional = true, default-features = false, features = [
  "csv",
], workspace = true }
serde_yaml = { optional = true, workspace = true }
data-encoding = { workspace = true }
sha2 = { workspace = true }
ipnetwork = { workspace = true, features = ["serde"] }
csv = { optional = true, workspace = true }

once_cell = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
carbide-api-model = { path = "../api-model", features = ["test-support"] }
carbide-libmlx-model = { path = "../libmlx-model", features = ["test-support"] }
carbide-test-support = { path = "../test-support" }
criterion = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "machine_convert"
harness = false
required-features = ["model"]

[build-dependencies]
carbide-proto-compiler = { path = "../proto-compiler" }
tonic-prost-build = "0.14"
tonic-client-wrapper = { path = "../tonic-client-wrapper" }

[lints]
workspace = true
