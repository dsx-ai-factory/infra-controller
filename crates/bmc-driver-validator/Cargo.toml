[package]
name = "bmc-driver-validator"
version = "0.1.0"
description = "Validates the compiled BMC drivers against a real BMC through bmc-runtime"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "bmc-validate"
path = "src/main.rs"

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bmc-drivers = { path = "../bmc-drivers" }
bmc-explorer = { path = "../bmc-explorer" }
bmc-platform = { path = "../bmc-platform" }
bmc-runtime = { path = "../bmc-runtime" }
carbide-ipmi = { path = "../ipmi" }
carbide-redfish = { path = "../redfish" }
carbide-secrets = { path = "../secrets", default-features = false }
carbide-uuid = { path = "../uuid" }
clap = { workspace = true }
colored = { workspace = true }
futures = { workspace = true, features = ["std"] }
libc = { workspace = true }
mac_address = { workspace = true }
nv-redfish = { features = [
    "accounts",
    "bmc-http",
    "computer-systems",
    "secure-boot",
    "storages",
], workspace = true }
rand = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { features = ["env-filter"], workspace = true }

[dev-dependencies]
tokio = { features = ["test-util"], workspace = true }

[lints]
workspace = true
