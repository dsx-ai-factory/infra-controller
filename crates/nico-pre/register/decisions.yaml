    `nras_jwks_url`, `validate_jwt_expiry` (`crates/api-core/src/cfg/README.md`; `docs/design/attestation/attestation-profiles.md`);
    `nico-admin-cli attestation spdm {list,get,trigger,cancel,coverage,profile}`'
  options:
  - name: 'Off'
    text: 'Off: `[spdm] enabled = false`, no device attestation'
