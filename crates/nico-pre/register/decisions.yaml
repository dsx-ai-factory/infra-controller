  - name: Your own Keycloak
    text: 'Your own Keycloak: `keycloak.enabled: true` pointed at the provider''s Keycloak over HTTPS'
  - name: Generic OIDC issuers
    text: 'Generic OIDC issuers: `keycloak.enabled: false` and one or more `issuers` entries with JWKS
