    text: 'Disabled: `[machine_identity] enabled = false`, the per-org identity APIs return 503 and IMDS
      has no identity endpoint'
  default: Enabled
  check: 'Enabled: `nico-pre-config`: `current_encryption_key_id` set, allowlists parse, `token_endpoint_http_proxy`
    well-formed when set; `nico-pre-platform`: the credential `machine_identity.encryption_keys.<id>`
    resolves from the configured chain, the proxy answers when set, and the REST tenant-identity endpoint
    returns 404 rather than 503. Disabled: `nico-pre-config`: `enabled = false`, reported as a tenant-visible
    limitation'
- id: rest-api-auth
