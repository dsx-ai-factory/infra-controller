# The decision register nico-pre compiles in: every decision a site makes, its options (by
# the short `name` a site definition states, with the register's full `text`), its default,
# whether it is `stated` in site-def.yaml or derived from a collateral named in `source`, and
# the check that proves it. Edit here, in the same PR as the checks that read it.
decisions:
- id: staging-host
  title: Staging host
  section: Utility hosts (per provider, decided before anything else)
  stated: true
  source: Site Planning Document; NICo setup environment for the mirror knobs named below
  options:
  - name: Connected
    text: 'Connected: the staging host reaches the internet, and the build host can be the same machine'
  - name: Air-gapped with a transfer path
    text: 'Air-gapped with a transfer path: nothing inside the site reaches the internet, but the staging
      host is reachable by scp from outside through the jumphost'
  - name: Strictly air-gapped
    text: 'Strictly air-gapped: the staging host is disconnected and is fed from physical media'
  check: '`nico-pre-stage` (new, stage 1c), run on the staging host before stage 2: tools present at usable
    versions; the infra-controller checkout, its nv-rms submodule, and the doca-platform clone present
    at the pinned tag and commit; helmfile installed; chart sources answer, a mirror when air-gapped or
    the upstream repositories when connected; SSH to every site controller and its BMC; the registry host
    reachable. In either air-gapped mode, also every item of the package above present at the pinned version,
    against an scp-delivered or media-delivered manifest: images by tag in the registry, charts in the
    mirror or as archives, the clone at its tag, the submodule, the helmfile binary, the BFB or ISO and
    DOCA files. The connectivity mode selects which source checks run'
- id: external-registry-access
  title: External registry access
  section: Utility hosts (per provider, decided before anything else)
  stated: true
  source: Site Planning Document; the provider's containerd drop-in on each site controller (`/etc/systemd/system/containerd.service.d/*.conf`),
    `HTTPS_PROXY` in the staging host shell; with DPF the `[dpf.proxy]` table in the NICo TOML file
  options:
  - name: Direct
    text: 'Direct: the site controllers and the staging host reach nvcr.io, ghcr.io, quay.io, docker.io,
      registry.k8s.io and the Helm hosts without a proxy'
  - name: Proxied
    text: 'Proxied: through the datacenter egress proxy, which the provider configures on every site controller''s
      containerd and in the staging host shell'
  - name: Not applicable
    text: 'Not applicable: air-gapped, every external image and chart is mirrored into the provider registry'
  default: Direct
  check: 'Direct, run first because a wrong answer blocks everything after it: `nico-pre-stage`, before
    any chart or image is fetched, each external registry and Helm host answers directly from the staging
    host; `nico-pre-host`, over SSH on every site controller before setup.sh phase 1, the same hosts answer
    directly and containerd''s drop-ins carry no proxy environment. Proxied: `nico-pre-host`: every site
    controller carries a containerd drop-in naming the same proxy, with `no_proxy` covering the provider
    registry, the cluster and service CIDRs and `.cluster.local`; `nico-pre-stage`: `HTTPS_PROXY` set
    in the staging shell and each external registry and Helm host answers through the proxy from both
    vantage points; `nico-pre-config`, with DPF enabled: the `[dpf.proxy]` table is present with `https_proxy`
    in a scheme containerd accepts and `no_proxy` covering the registry host, the DPU cluster VIP, the
    host API VIP and `.cluster.local`, before the first start with DPF enabled. Not applicable: no external
    reach is attempted; the mirrored set is checked by the Source of the NICo images and Staging host
    entries. With DPF, every option, `nico-pre-fabric` from the DPU network: the provider registry host
    answers, the TLS handshake succeeds with the trust the DPUs will carry, and each of the four NICo
    `docker_repo_url` serves its tag; Direct: every external registry in the resolved service config and
    the system-component image set answers directly from the DPU network, `[dpf.proxy]` absent; Proxied:
    the proxy answers from the DPU network and forwards to every external registry; Not applicable, or
    a connected site whose dts and doca_hbn `docker_repo_url` sit under the provider registry: `[dpf.proxy]`
    absent, `DPFOperatorConfig` carries image overrides for every system component pointing at the provider
    registry, the mirrored images are present there at the versions the operator pin expects, and the
    tool reports any resolved image that still points outside the site'
- id: source-of-the-nico-images
  title: Source of the NICo images
  section: Utility hosts (per provider, decided before anything else)
  stated: false
  source: 'NICo setup environment: `NICO_IMAGE_REGISTRY` (no scheme; the Core image is `<registry>/nvmetal-carbide`,
    REST, Flow, and the site agent use the registry root), `NICO_CORE_IMAGE_TAG`, `NICO_REST_IMAGE_TAG`
    (Flow reuses it), `NICO_RMS_IMAGE_REPO`; NICo Helm values: `bootArtifactContainers` in `values/nico-core.yaml`,
    one init container per architecture naming `<registry>/boot-artifacts-x86_64:<tag>` and `boot-artifacts-aarch64:<tag>`,
    plus the machine-validation image; for Pulled from NGC also the keys `REGISTRY_PULL_SECRET`, `NICO_RMS_NGC_API_KEY`,
    `NICO_DPF_NGC_API_KEY`, `NICO_DPF_NICO_NGC_API_KEY`, each defaulting to the one before it; for Pulled
    from a local registry with DPF also `NICO_DPF_HELM_REPO_CARBIDE` and, in the NICo TOML file, a `[dpf.services.<svc>]`
    block per NICo DPUService (`dpu_agent`, `dhcp_server`, `fmds`, `otel`) with `helm_repo_url`, `helm_chart`,
    `helm_version`, `docker_repo_url`, `docker_image_tag`, `docker_image_pull_secret` (`helm-prereqs/README.md`
    "DPF images and registries", `dpf.md` §3.5)'
  options:
  - name: Pulled from a local registry
    text: 'Pulled from a local registry: a provider-run registry inside the site holds the image set,
      built from infra-controller and nv-rms on the provider''s build host'
  - name: Pulled from NGC
    text: 'Pulled from NGC: NVIDIA-internal only; NICo publishes no assets, so this needs a key entitled
      to the NICo org''s private spaces'
  default: Pulled from a local registry
  check: 'Pulled from NGC, `nico-pre-build`: log in to nvcr.io and test pull access to every repository
    of the image set at the chosen tags, boot artifacts included, reporting entitlement per artifact.
    Pulled from a local registry: the build-side checks belong to the Build host entry; `nico-pre-install`
    verifies every item of the image set is present in the registry at the chosen tags: Core `nvmetal-carbide`,
    the REST image set (REST, Flow, site agent), `boot-artifacts-x86_64` and `boot-artifacts-aarch64`,
    the machine-validation image, `rms-api` when RMS is in-cluster, and with DPF the four DPUService images
    `forge-dpu-agent`, `forge-dhcp-server`, `carbide-fmds`, `otelcol-contrib` plus the four charts `nico-dpu-agent`,
    `nico-dhcp-server`, `nico-fmds`, `nico-otelcol` at the versions the TOML names, in an OCI or HTTPS
    Helm repository; and that `bootArtifactContainers` is not empty. With DPF, `nico-pre-config`: a `[dpf.services.<svc>]`
    block exists for all four NICo services with `docker_repo_url` and `helm_repo_url` under the provider''s
    registry, non-empty `helm_version` and `docker_image_tag`, `docker_image_pull_secret` naming the registry
    Secret when the registry is private, and `NICO_DPF_HELM_REPO_CARBIDE` equal to that `helm_repo_url`;
    `nico-pre-platform`: an Argo CD repository Secret in `dpf-operator-system` exists whose `url` equals
    each `helm_repo_url`, with `enableOCI=true` for an `oci://` URL, and its credentials fetch the chart
    index. Gap: setup.sh creates the repository Secrets only when `NICO_DPF_NGC_API_KEY` is set, always
    with user `$oauthtoken` and the NGC key, so a provider registry never gets a usable one from setup.sh;
    candidate issue. Either way, `nico-pre-ingest` fetches one x86_64 and one aarch64 boot artifact from
    the nico-pxe VIP under `/public/blobs/internal` and fails on a 404, before any host is ingested. The
    answer selects which source branch runs'
- id: build-host
  title: Build host
  section: Utility hosts (per provider, decided before anything else)
  stated: true
  source: 'Site Planning Document (ref: `scripts/control-plane-dpu/README.md` Part 2)'
  options:
  - name: 'Yes'
    text: 'Yes: validate the build host; `nico-pre-build` runs on it and checks the toolchains, checkouts,
      artifact access, disk space, and push access to the registry host'
  - name: 'No'
    text: 'No: the provider builds the CP-DPU ISO and any images on its own responsibility; `nico-pre-build`
      is skipped and the build-host questions below do not apply'
  default: 'Yes'
  check: 'Yes: `nico-pre-build` (stage 1a), run on the build host: CP-DPU toolchain present with the right
    flavours; image toolchain present, the Rust toolchain pinned by `rust-toolchain.toml`, Go 1.26.x,
    cargo-make, Docker; with DPF also the DPU service toolchain from `bluefield/`: the aarch64 cross-build
    container builds and Docker runs an arm64 image through binfmt, and helm is present at a version that
    packages and pushes OCI charts; artifact URLs answer with the credentials at hand; disk space against
    artifact sizes; DOCA, HBN, and BFB form one supported combination. Registry: the registry CA is trusted
    by Docker and helm on the build host, Docker login succeeds, and a scratch tag pushes to and deletes
    from the registry host; with DPF a scratch chart pushes to the chart repository, OCI or HTTPS, with
    the credentials `[dpf.services.*]` will rely on. The build host emits a manifest of what it produced,
    the image set from the Source of the NICo images entry plus, with DPF, the five DPU images (`forge-dpu-agent`,
    `forge-dhcp-server`, `carbide-fmds`, `forge-dpu-otel-agent`, `otelcol-contrib`) and the four charts,
    and `nico-pre-stage` verifies it arrived in the registry. No skips the stage'
- id: registry-host
  title: Registry host
  section: Utility hosts (per provider, decided before anything else)
  stated: false
  source: 'NICo setup environment: `NICO_IMAGE_REGISTRY`, `REGISTRY_PULL_SECRET`'
  options:
  - name: Provider-run
    text: 'Provider-run: Provider-run registry inside the site; in an air-gapped site it is the landing
      point for images copied in from the outside build host'
  - name: None
    text: 'None: NVIDIA-internal only; the site is connected and holds a key entitled to the NICo org,
      and every image pulls from NGC'
  default: Provider-run
  check: '`nico-pre-stage`, once, on the served certificate: the chain is complete, no certificate in
    it is expired or not yet valid, and the SAN contains the registry name exactly as `NICO_IMAGE_REGISTRY`
    spells it, host name or IP; then a TLS handshake with the staging host trust store and an HTTP answer
    from `/v2/`. `nico-pre-build`: Docker login from the build host. `nico-pre-platform`: handshake from
    every site controller with the trust containerd uses, per-registry certificate directory or OS trust
    store, the served fingerprint equal to the one recorded at stage, and the exact Core, REST, RMS, and
    DPF image references pull with the pull secret (today `preflight.sh` section 9); when it serves BFB
    or BF4 ISO, those URLs answer with the expected sizes; when it serves charts, each repository''s index
    answers with the credential Argo CD will use. `nico-pre-fabric`, only with DPF installed: handshake
    and reachability from a DPU-network vantage point'
- id: registry-authentication
  title: Registry authentication
  section: Utility hosts (per provider, decided before anything else)
  stated: false
  source: 'NICo setup environment: `REGISTRY_PULL_SECRET`, `REGISTRY_PULL_USERNAME` (`$oauthtoken`*)'
  options:
  - name: Credentialed pulls
    text: 'Credentialed pulls: `REGISTRY_PULL_SECRET` set, setup creates `imagepullsecret` and the REST
      and Flow secrets'
  - name: No secret from setup
    text: 'No secret from setup: `REGISTRY_PULL_SECRET` unset; the registry is public, or the nodes already
      authenticate by other means, a pre-existing secret, containerd credentials, or client certificates'
  default: Credentialed pulls
  check: '`nico-pre-install`: when set, log in to `NICO_IMAGE_REGISTRY` as `REGISTRY_PULL_USERNAME` with
    the secret and fetch the Core manifest; when unset, fetch it from a site controller the way kubelet
    will, whatever the mechanism, and confirm any `imagepullsecret` still referenced by the values exists
    in every target namespace. `nico-pre-stage`: with a local registry and `REGISTRY_PULL_USERNAME` unset,
    flag that the login would use NGC''s `$oauthtoken` convention'
- id: dpu-in-the-site-controllers
  title: DPU in the site controllers
  section: Site topology
  stated: true
  source: 'Site Planning Document (ref: `docs/getting-started/prerequisites/hardware.md` "DPUs on Site
    Controller"; quick-start "Site controller node DPU requirements")'
  options:
  - name: BF3 DPU in DPU mode
    text: BF3 DPU in DPU mode (preferred, QA-tested)
  - name: no DPU
    text: no DPU (supported), which includes a BlueField left in NIC mode
  default: BF3 DPU in DPU mode
  check: 'changes which members run. With a DPU: `nico-pre-build` is required; `nico-pre-host`, through
    the host BMC, checks a BlueField-3 in DPU mode with both ports present and `p0` visible at 200 Gb,
    link state where the platform reports it, and through the DPU''s BMC over the OOB network, firmware
    at or above the HCL pins, a BlueField-4 failing by name as unsupported on the control-plane path;
    `nico-pre-config`: the MetalLB file carries BGPPeer and BGPAdvertisement and no `L2Advertisement`,
    which is an error here; `nico-pre-fabric` runs from the DPU and requires `p0` and `p1` up with LLDP
    neighbours on two different ToRs and BGP sessions established on both. Without a DPU: `nico-pre-build`
    and the DPU rows are skipped; `nico-pre-host`, through the host BMC, checks the single NIC port present
    and its link state instead; `nico-pre-config`: exactly one advertisement mode in the MetalLB file;
    BGP, one BGPPeer per node with `nodeSelectors` naming real hostnames and `myASN` and `peerASN` as
    the worksheet says; `L2Advertisement` accepted and reported as dev and test only, with the pools inside
    the controllers'' own subnet; `nico-pre-fabric`, from each site controller and the cluster: each node''s
    BGP session with its ToR established and `peerAddress` reachable from that node, the service VIP /32s
    advertised by the speaker and reachable from the staging host, the single uplink up with the management
    and Kubernetes VLANs present. The ToR''s export of 50100 and its imports are confirmed by the worksheet;
    they are not visible from the site'
- id: smn
  title: SMN
  section: Site topology
  stated: false
  source: 'NICo CP setup files: `scripts/control-plane-dpu/site-sample.yaml` `fnn:`; `build-dpu-install-iso.sh
    --no-fnn`'
  options:
  - name: SMN on the control-plane DPU
    text: 'SMN on the control-plane DPU: the `fnn` block in the CP-DPU site yaml renders startupSMN; the
      DPU imports 900 and exports 50100'
  - name: SMN on the ToR
    text: 'SMN on the ToR: site controllers without a DPU; MetalLB peers with the ToR, and the datacenter
      exports the VIPs and host prefixes with 50100 and performs the imports on the controllers'' behalf'
  - name: No SMN
    text: 'No SMN: `--no-fnn`, test-only, not validated'
  default: SMN on the control-plane DPU
  check: 'SMN on the control-plane DPU. `nico-pre-config`: the CP-DPU site yaml carries the `fnn` block
    with `controlPlaneVni` and the three route targets. `nico-pre-fabric`, from the control-plane DPU
    and the site controller once the DPU is provisioned: the BGP EVPN session with the leaf is established,
    unnumbered as the worksheet says; type-5 routes carrying 900, 901, 50100, and every target in `routeTargetsToImport`
    are received in the control-plane VRF; the managed-host BMC prefixes from the expected-machines manifest
    are present in that VRF''s table and a sample BMC answers on TCP 443 from the site controller through
    the DPU; the site controller''s /31 and the service VIP /32s are advertised with 50100, receipt confirmed
    by the worksheet since the datacenter''s import is not visible from the site. SMN on the ToR: `nico-pre-fabric`,
    from the site controllers and the cluster: the MetalLB rows of the DPU in the site controllers entry,
    reach to a sample managed-host BMC through the ToR on TCP 443, and the worksheet confirming that the
    ToR exports 50100 and imports 900 and 901 on the controllers'' behalf. No SMN: plain L3 reach to the
    OOB prefixes and the DHCP relay path, reported as the test-only path and not validated in release
    1'
- id: managed-host-kinds-in-the-fleet
  title: Managed host kinds in the fleet
  section: Site topology
  stated: true
  source: 'NICo TOML file + Site Planning Document: site-wide `[site_explorer] dpu_policy`; `[networks.<name>]`
    blocks of type `admin` and `hostinband`; per-host `dpu_policy` and `interfaces` on expected-machine
    records (`boot-interfaces-and-dpu-modes.md` §2–3; `flat_vpcs_zero_dpu.md`)'
  options:
  - name: DPU hosts booting through the DPU on the Admin segment
    text: 'DPU hosts booting through the DPU on the Admin segment: the standard host, `dpu_policy` manage
      with no declared primary NIC'
  - name: DPU hosts booting from an onboard NIC
    text: 'DPU hosts booting from an onboard NIC: the DPUs stay managed for the data plane while the host
      OS boots on HostInband'
  - name: Zero-DPU hosts
    text: 'Zero-DPU hosts: no DPU hardware, or a DPU that NICo ignores; the host boots on HostInband and
      joins Flat VPCs only'
  - name: DPU hosts NICo flips to NIC mode
    text: 'DPU hosts NICo flips to NIC mode: site-explorer stages the mode change and power-cycles the
      host, which then boots on HostInband and joins Flat VPCs only'
  multiple: true
  default: DPU hosts booting through the DPU on the Admin segment
  check: 'DPU hosts on the Admin segment: `nico-pre-config`: an Admin segment with IPv4 and a gateway
    exists and the site-wide `dpu_policy` is `manage`; the boot path itself is covered by the SMN, DPF,
    and DHCP relay entries. Any HostInband kind: `nico-pre-config`: a HostInband segment exists on the
    subnet those NICs are cabled to; `nico-pre-fabric`: DHCP relay from that subnet to the `nico-dhcp`
    VIP and the PXE or HTTP boot URL reachable from it; the ToR port configuration for a HostInband NIC
    and tenant isolation for Flat VPCs are worksheet rows; `nico-pre-ingest`: an expected-machine record
    per such host with exactly one `host` interface marked primary on `network_segment_type` 3 and a valid
    MAC unique across records, carrying the `dpu_policy` override when the site-wide policy is `manage`.
    DPU hosts booting from an onboard NIC: the Admin segment still exists; a Vera Rubin host of this kind
    is an error, because host initialisation runs `DisableOnboardNics` on that SKU; as a warning, the
    onboard NIC''s network boot option is enabled in UEFI. Flipped to NIC mode: `nico-pre-ingest`: every
    such host has a DPU whose BMC answers Redfish and a platform that accepts PowerCycle or ACPowercycle,
    since site-explorer will issue them; on a rack-manager site the policy is set site-wide. Shared host
    BMC, detected from the records: `nico-pre-config`: the prefix is declared once as HostInband and not
    also as an underlay segment, allocation is dynamic when either interface is unreserved, the segment
    has a DNS subdomain, and the prefix leaves two addresses per host above `reserve_first`; `nico-pre-ingest`:
    the BMC MAC sits at the top level of the record with a matching `host_bmc` entry, and every host with
    a shared BMC is of a zero-DPU or flipped kind, a DPU-booting host there is an error; relay from the
    segment is the unconditional DHCP relay row; the shared choice is reported as an explicit security
    decision'
- id: dpf
  title: DPF
  section: Site topology
  stated: false
  source: 'NICo setup environment: the flags; with Install, the inputs `NICO_DPF_DPU_CLUSTER_VIP` and
    `NICO_DPF_DPU_INTERFACE` (keepalived VIP on the site controllers, routable on its own, or `NICO_DPF_METALLB_POOL`
    when it must be advertised through a MetalLB pool), and `NICO_DPF_K8S_API_VIP` with `_PORT` only when
    the Kubernetes API address derived from the Endpoints is not reachable from the DPU network'
  options:
  - name: Install
    text: Install
  - name: Skip
    text: 'Skip: `--skip-dpf`, `NICO_SKIP_DPF=true`, `NICO_INSTALL_DPF=false`'
  default: Install
  check: 'Install: `nico-pre-platform` verifies the DPU cluster VIP is free, the keepalived interface
    exists on every site controller, no other VRRP instance uses router id 126 on that segment, and the
    Kubernetes API endpoint the DPUs will use answers from a DPU-network vantage point; and `nico-pre-install`
    verifies the BMC root password is seeded for the two-phase deploy; the DPF image, chart, clone, and
    BFB entries add their own checks. Value-gated, not asked (agreed 2026-11-06): when `[dpu_config] service_vpc_slot_count`
    is above zero, `nico-pre-config` also verifies the generated plus topology-derived HBN interfaces
    total at most 32, the SF commitment (base SFs plus two per slot, the endpoint limit and `additional_managed_sf`)
    fits `pf_total_sf_reserved` or, with intercept bridging, is recorded as a flavor change that reprovisions
    the DPUs, a positive `max_active_service_vpc_interfaces_per_dpu` comes with a positive slot count,
    every `service_vpc_enabled_address_families` entry has at least one slot and that family''s DHCP CNI
    and raw NAD installed, and a `serviceVpcNetworks` overlay on `dhcp_server` names a non-empty chart
    version; at zero none of these rows run. Skip: those checks are off, and what runs instead follows
    the Managed-host DPU policy. With `nic` or `ignore` (zero-DPU hosts): the HostInband segment with
    DHCP relay to the `nico-dhcp` VIP, the expected-machine records with a primary onboard-NIC interface,
    the host boot path (DHCP option 67 or the Redfish-pinned URI), the `nico-pxe` VIP reachable from the
    host subnets and `nico-static-pxe` resolving, and one x86_64 and one aarch64 boot artifact fetched
    from the VIP, as the onboard-NIC, PXE, and image source entries say; tenant isolation is a worksheet
    row, since Flat VPCs leave it to the fabric. With DPU hosts on the iPXE path: `nico-pre-config`: `[dpu_config]
    bootstrap_ca_source` consistent with the non-DPF bootstrap CA entry; the DPU OS install method is
    a value, folded 2026-11-06: with `dpu_enable_secure_boot = true` NICo pushes the BFB over Redfish
    `SimpleUpdate` and every DPU BMC of a host must run 24.10 or later and reach `nico-pxe`, otherwise,
    and by default, the DPU UEFI HTTP-boots `nico.efi` from `nico-pxe` with Secure Boot disabled, so `nico-pre-ingest`
    checks the DPU BMC versions against the chosen value; `nico-pre-install`: the NICo BFB and, where
    the firmware check uses it, the preingestion BFB are served by `nico-pxe` and fetch from the VIP with
    the expected sizes, the bootstrap root CA endpoint answers for `legacy_download`, and the API gRPC
    VIP answers from the Admin segment the DPU agent will use; `nico-pre-fabric`: DHCP relay from the
    Admin segment to the `nico-dhcp` VIP; with Redfish BFB push, `nico-pre-ingest` confirms every DPU
    BMC of a sample host reports 24.10 or later. Either way `nico-pre-ingest` warns when an expected machine''s
    record disagrees with the policy'
- id: managed-host-dpu-generation
  title: Managed host DPU generation
  section: Site topology
  stated: false
  source: 'NICo TOML file + Site Planning Document: `[dpf.deployments.<name>]` with `bfb_url` for BF3
    or `bluefield_software` for BF4; `docs/hcl.md` for the tested DOCA and HBN pins'
  options:
  - name: BF3
    text: 'BF3: provisioned from a BFB, the DPF built-in deployment and the only generation the non-DPF
      iPXE path installs'
  - name: BF4 generic
    text: 'BF4 generic: provisioned from an OS ISO plus PLDM bundles through `[dpf.deployments.bf4_generic]`,
      DPF required'
  - name: BF4 Astra
    text: 'BF4 Astra: as BF4 generic through `[dpf.deployments.bf4_astra]`, plus the `ra2.2-runtime` ConfigMap
      and the Weave and Xplane extra services'
  - name: Not applicable
    text: 'Not applicable: no managed DPUs in the fleet'
  multiple: true
  default: BF3
  check: '`nico-pre-config`: `[dpf.deployments.*]` carries `bfb_url` for BF3 or `bluefield_software` with
    at least one PLDM bundle for BF4, never both, and the three identifiers are distinct across the active
    deployments. BF4 generic or Astra ticked: `nico-pre-config`: `pldm_fw_bundle` holds an entry for every
    BF4 PSID in the expected-machine inventory; `nico-pre-ingest`: every discovered BF4 DPU reports a
    PSID the map covers. Astra ticked: `nico-pre-config`: `deployment_scoped_service_interfaces = true`,
    `[ewethers_config]` present with `astra_enabled = true` and the Astra bit lengths set, and every Astra
    host''s expected machine carries a CX9 interface and exactly one DPU; `nico-pre-platform`: the `ra2.2-runtime`
    ConfigMap exists; `nico-pre-stage`: the BFB or ISO URLs answer; `nico-pre-ingest`: a DPU factory-default
    credential is seeded for every ticked generation (`credential add-dpu-factory-default --model bf3|bf4`;
    the BF4 entry ships commented out in `helm-prereqs/values.yaml`), and discovered DPU models fall within
    the ticked generations'
- id: custom-default-storageclass
  title: Custom default StorageClass
  section: Kubernetes and OS on the site controllers
  stated: false
  source: 'NICo setup environment: `NICO_MANAGE_DEFAULT_STORAGE_CLASS`; Site Planning Document for the
    class name and capacity (`hardware.md` "Storage layout")'
  options:
  - name: 'No'
    text: 'No: setup.sh installs local-path-provisioner on host path `/opt/local-path-provisioner` and
