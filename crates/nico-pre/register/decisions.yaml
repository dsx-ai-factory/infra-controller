    and its `issuer` matches the discovery document'
- id: optional-components
  title: Optional components
  section: Components to deploy
  stated: false
  source: 'NICo setup environment + NICo TOML file: `--skip-rest`; `--skip-rms`, `NICO_SKIP_RMS`; `--with-observability`,
    `WITH_OBSERVABILITY`; `--install-contour`, `NICO_INSTALL_CONTOUR`; `--site-overlay`; `[ib_config]`,
    `[ib_fabrics.default]`, `[nvlink_config]`, `[tracing]` in the site TOML (`helm-prereqs/setup.sh`;
    `docs/playbooks/ib_runbook.md`; `docs/manuals/nvlink_partitioning.md`; `docs/observability/tracing.md`)'
  options:
  - name: REST group
    text: 'REST API, Flow and site-agent on this site: the REST group that `--skip-rest` drops as a whole;
      clear means a central REST elsewhere serves this site'
  - name: RMS
    text: 'RMS, in-cluster or external: the Rack Manager Service; which of the two is the RMS entry'
  - name: Observability stack
    text: 'Observability stack: `--with-observability`, kube-prometheus-stack, Loki and the OTel collector
      installed together'
  - name: Contour ingress
    text: 'Contour ingress: `--install-contour`, the optional Contour and Envoy ingress controller'
  - name: UFM
    text: 'InfiniBand fabric management through UFM: `[ib_config] enabled = true`, one fabric `default`,
      UFM 6.23.1-6 or later in HA mode, token or client-certificate auth'
  - name: NVLink partitioning
    text: 'NVLink partitioning through NMX-C: `[nvlink_config]`, tenant NVLink partitions on GB200 compute
      nodes, NMX-C only, needs the rack-manager box'
  - name: Tracing
    text: 'Tracing: `[tracing] enabled = true` with an OTLP endpoint'
  - name: Site overlay
    text: 'Site overlay: `--site-overlay <kustomize dir>` applied after Core'
  multiple: true
  default: REST group ; RMS
  check: 'REST ticked: `nico-pre-install`: the co-located REST, Temporal and Keycloak are up and the site
    agent has registered with the local REST under this site''s UUID; clear: reported as unsupported,
    since a central REST and the agent values are hand-built. Rack manager ticked: the RMS entry''s rows;
    clear: `rms.enabled=false` is set in the helm-prereqs values and `nico-pre-ingest` fails when an expected
    rack is GB200 or GB300 NVL72. Observability stack ticked: `nico-pre-stage`: the `helm-prereqs/observability/values-*.yaml`
    files are present and their chart images resolve from the registry; `nico-pre-install`: kube-prometheus-stack,
    Loki and the collector pods are ready, since setup.sh treats their failure as non-fatal; clear: the
    Observability entry decides between no pipeline and the provider''s stack. Contour ticked: `nico-pre-platform`:
    no Contour deployment in `projectcontour` that setup.sh does not own, since it refuses to adopt one.
    InfiniBand ticked: `nico-pre-config`: `[ib_config] enabled = true`, `[ib_fabrics.default]` with exactly
    one endpoint and a pkey range inside 0x0 to 0x7FFF, `allow_insecure` reported when true, and a UFM
    credential resolving from the configured source, the UFM credential ownership row; `nico-pre-fabric`,
    from the staging host: the endpoint answers with the configured token or client certificate, `/app/ufm_version`
    is 6.23.1-6 or later, the pkey range overlaps no partition UFM already reports, and for mTLS the server
    certificate carries the `default.ufm.nico` and `default.ufm.<site domain>` SANs; worksheet: UFM runs
    in HA mode and the gv.cfg and opensm.conf security settings from the runbook are applied; clear: the
    UFM credential and `use_cert_manager_ufm` rows are not applicable. NVLink ticked: `nico-pre-config`:
    `[nvlink_config]` present with NMX-C endpoints, chassis mapping rack-derived or explicit, TLS mode
    uniform across endpoints, `allow_insecure` unset; `nico-pre-platform`: the `nvSwitchTls` client certificate
    Secret or issuer exists; `nico-pre-install`: each NMX-C endpoint answers over mTLS; and the NMX-C
    certificate rotation rows folded here 2026-11-06: `[nvlink_config.nmx_c_certificate_rotation]` follows
    `nvlink_config.enabled`, the CA at `nmx_c_tls_ca_cert_path` is the only trust root and `allow_insecure`
    does not bypass it, each endpoint is HTTPS with a SAN matching `nmx_c_tls_authority`; with the rack-manager
    box ticked rotation is automatic and needs `nvSwitchBackend` `rms`, RMS answering, the rack `Ready`
    and the server certificate Secret in the RMS namespace rather than `nvSwitchTls.switchServer`; without
    it rotation is monitoring only and the report says each renewal is installed by hand; clear: none
    of this applies. Tracing ticked: `nico-pre-config`: `[tracing] enabled = true` with `otlp_endpoint`
    set, or `OTEL_EXPORTER_OTLP_TRACES_ENDPOINT` in the environment; `nico-pre-platform`: the collector
    answers OTLP gRPC from the cluster. Site overlay ticked: `nico-pre-stage`: the directory exists and
    `kubectl kustomize` renders it without error'
- id: rms
  title: RMS
  section: Components to deploy
  stated: false
  source: 'NICo setup environment + NICo Helm values: `--skip-rms`, `NICO_SKIP_RMS`; `rms.enabled` in
    `helm-prereqs/values.yaml` (the RMS database prerequisites); for an external RMS the nico-api chart
    values `rms.apiUrl`, `rms.enforceTls`, `rms.rootCaPath`, `rms.clientCert`, `rms.clientKey`, which
    render the `[rms]` block'
  options:
  - name: In-cluster nv-rms
    text: In-cluster nv-rms
  - name: External RMS
    text: 'External RMS: external RMS (`[rms] api_url` plus `--skip-rms`)'
  - name: Not applicable
    text: 'Not applicable: the rack-manager box in Optional components is clear'
  default: In-cluster nv-rms
  check: 'In-cluster: `nico-pre-install` verifies `NICO_RMS_IMAGE_TAG` is set, the image resolves, and
    the RMS database prerequisites are present. External: `nico-pre-platform` verifies `[rms] api_url`
    answers over TLS from the cluster. Not applicable: the rack-manager rows of Optional components Component
    manager rows: with RMS, `nico-pre-config`: `componentManager.enabled` true, the three backends `rms`,
    `rms.enforceTls` true, and `rms.apiUrl` answers over TLS in `nico-pre-install`; without RMS: `componentManager.enabled`
    and `rms.enabled` both false in the nico-api values and no backend set to `rms`.'
- id: rms-chart-source
  title: RMS chart source
  section: Components to deploy
  stated: false
  source: 'NICo setup environment: `NICO_RMS_CHART`'
  options:
  - name: Pinned submodule
    text: 'Pinned submodule: The pinned `helm-prereqs/nv-rms` submodule, synced by setup.sh; works offline
      when the checkout on the staging host already carries the submodule at the pinned commit'
  - name: Local chart path
    text: 'Local chart path: `NICO_RMS_CHART` pointing at a chart directory or `.tgz`, such as `<clone>/helm`
      from an out-of-band nv-rms clone or a modified chart; setup.sh then skips the submodule sync'
  - name: Not applicable
    text: 'Not applicable: no in-cluster RMS'
  default: Pinned submodule
  check: '`nico-pre-stage`: default, the submodule directory is populated, clean, and at the commit the
    checkout records; override, the path exists, `helm show chart` parses it, and its chart version equals
    the pinned submodule''s, else a warning'
- id: core-postgres
  title: Core Postgres
  section: Components to deploy
  stated: false
  source: 'NICo Helm values: `helm-prereqs/values.yaml` `postgresql.{enabled,instances,synchronousMode,volumeSize,storageClass,host,resources}`,
    `rest.enabled`, `rms.enabled`; nico-api `envFrom.databaseCredentials.secretName`, `envFrom.databaseConfig.configMapName`,
    `migrationJob.sslMode` (`helm-prereqs/README.md` "Using an external or out-of-band PostgreSQL"; `docs/getting-started/prerequisites/software.md`)'
  options:
  - name: Zalando HA in-cluster
    text: 'Zalando HA in-cluster: `postgresql.enabled: true`, three instances, synchronous replication,
      `local-path-persistent`, one `nico-pg-cluster` for Core, REST, Flow, the site agent, RMS, Temporal
      and Keycloak'
  - name: External Postgres
    text: 'External Postgres: `postgresql.enabled: false`, the provider''s TLS-enabled Postgres behind
      an ExternalName Service `nico-pg-cluster` in namespace `postgres`, with every database, user and
      credentials Secret pre-created'
  - name: Single instance for development
    text: 'Single instance for development: `postgresql.instances: 1` with `synchronousMode: false`'
  default: Zalando HA in-cluster
  check: 'Zalando HA: `nico-pre-platform`: three schedulable nodes, `postgresql.resources.limits.memory`
    at or above the band for the planned host count, the storage class exists (Storage classes item),
    `synchronousMode` true with three instances; `nico-pre-install`: `nico-pg-cluster` Running with three
    members and the credentials Secrets synced by External Secrets. External: `nico-pre-config`: `postgresql.enabled`
    false, `rest.enabled` false when REST shares it; `nico-pre-platform`: the ExternalName Service `nico-pg-cluster`
    resolves, TLS handshake, the Core, REST, Flow, RMS, Temporal and Keycloak databases and users exist,
    `btree_gin` and `pg_trgm` installed, and the credentials Secrets and the database ConfigMap are present
    in their namespaces. Single instance: `nico-pre-config`: `synchronousMode` false, reported as development
    only'
- id: rack-profiles
  title: Rack profiles
  section: Components to deploy
  stated: false
  source: 'NICo TOML file: `[rack_profiles.<name>]` with `product_family`, `rack_hardware_topology`, `rack_capabilities.{compute,switch,power_shelf}`
    vendor and count, optional `firmware_object`; the two built-ins ship in the chart''s global TOML'
  options:
  - name: Built-in profiles
    text: 'Built-in profiles: one of the thirteen profiles shipped in the chart''s global TOML matches
      the racks: `NVL72` and `NVL72_GB300`, the `GB200_NVL72R1_C2G4_{NVIDIA,WIWYNN}`, `GB300_NVL72R1_C2G4_{NVIDIA,LENOVO,SMC}`
      and `VR_NVL72R1_C2G4_NVIDIA` families, each with a `_NO_POWERSHELF` variant'
  - name: Site-specific profile
    text: 'Site-specific profile: at least one site-specific profile must be written, because a rack''s
      vendors, counts, topology, or firmware source differ'
  - name: Not applicable
    text: 'Not applicable: no RMS'
  default: Built-in profiles
  check: 'Built-in profiles: `nico-pre-config`: every expected rack''s `rack_profile_id` names one of
    the thirteen built-ins, and the rack''s trays, switches and shelves match that profile''s vendors
    and counts; `nico-pre-ingest`: the discovered rack inventory matches the profile. Site-specific profile:
    `nico-pre-config`: the `[rack_profiles.<name>]` block has `product_family`, a vendor for every role
    whose backend is `rms`, counts for all three roles, and a reachable `firmware_object` URL when set;
    the same inventory match at ingest. Not applicable: no check'
- id: observability
  title: Observability
  section: Components to deploy
  stated: false
  source: 'NICo setup environment + NICo Helm values: `--with-observability`, `WITH_OBSERVABILITY`, `PROMETHEUS_OPERATOR`,
    `NICO_SERVICEMONITORS`, `WITH_TEMPO`, `WITH_DPU`; per-chart `serviceMonitor.enabled`; `helm-prereqs/observability/values-*.yaml`;
    `grafanaDashboards` in the umbrella values'
  options:
  - name: No pipeline
    text: No pipeline
  - name: Full local stack
    text: 'Full local stack: `--with-observability`, set by the observability box in Optional components'
  - name: External stack
    text: 'External stack: the provider''s external stack, fed by NICo'
  default: No pipeline
  check: 'No pipeline: `nico-pre-config`: every chart''s `serviceMonitor.enabled` false and `NICO_SERVICEMONITORS`
    not true, since the Core install fails on an unknown kind without the operator CRDs. Full local stack:
    the Optional components rows, plus value rows folded 2026-11-06 from ServiceMonitors, Alerting hooks
    and Log shipping: `PROMETHEUS_OPERATOR` false only when operator CRDs already exist in the cluster,
    else true; `WITH_DPU` true requires `OTEL_RECEIVER_VIP` inside a MetalLB pool, the `site-issuer` ClusterIssuer
    Ready and the `otel-receiver.forge` name resolving to that VIP; `perObjectStateMetricsServiceMonitor`
    on only with `perObjectStateMetrics.enabled`; `[observability] per_object_metrics_for_classifications`
    non-empty only with that listener on; Alertmanager enabled implies a receiver configured, and the
    report notes that the shipped `nico-alerts.yaml` is applied by hand; the ssh-console Loki sidecar
    on requires its image repository and tag. External stack: `nico-pre-platform`: a Prometheus or VictoriaMetrics
    operator''s CRDs present before Core when ServiceMonitors are on; `nico-pre-config`: the collector''s
    Loki endpoint and `[tracing] otlp_endpoint` well-formed when set; `nico-pre-fabric`: the OTLP receiver
    name on the site network resolves and answers over mTLS with a site-CA certificate when DPU logs are
    shipped'
- id: measured-boot-attestation
  title: Measured boot attestation
  section: Firmware and hardware policy
  stated: false
  source: 'NICo TOML file: `attestation_enabled`; `nico-admin-cli tpm-ca {add,add-bulk,show,show-unmatched-ek,delete}`;
    `nico-admin-cli measured-boot site trusted-machine|trusted-profile approve ... oneshot|persist [--pcr-registers]`
    (`docs/provisioning/attestation_and_security.md`; quick-start Step 7)'
  options:
  - name: 'Off'
    text: 'Off: `attestation_enabled = false`, as the helm-prereqs values ship'
  - name: 'On'
    text: 'On: `attestation_enabled = true`, with TPM EK CA certificates loaded by hand and an approval
      rule: one-shot per machine, one-shot per profile, or site-wide `persist`'
  default: 'Off'
  check: 'On: `nico-pre-config`: `attestation_enabled = true`; `nico-pre-platform`: the TPM item passes,
    at least one `tpm-ca show` entry exists, `tpm-ca show-unmatched-ek` is empty for the ingested BMCs,
    and an approval rule exists for the machine, profile or site, with the site-wide `persist` form reported
    as permissive; `nico-pre-ingest`: the first host of each model reaches `Ready` through `Measuring`.
    Off: no check beyond the TPM item'
