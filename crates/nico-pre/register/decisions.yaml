- id: key-wrapping-for-the-postgres-store
  title: Key wrapping for the Postgres store
  section: Secrets, keys, and trust
  stated: false
  source: 'NICo TOML file: `[secrets.kms] active`, `[secrets.kms.providers.<name>] type` with the per-type
    fields, `[secrets.routing]` (`docs/configuration/secrets-storage.md`, `crates/api-core/src/cfg/README.md`
    "ProviderConfig"); NICo setup environment: `NICO_KMIP_CLIENT_DIR` for the KMIP client Secret'
  options:
  - name: Integrated
    text: 'Integrated: the KEK is loaded by nico-api from an environment variable or a mounted file'
  - name: Transit
    text: 'Transit: Vault or OpenBao Transit wraps server-side with a static token'
  - name: KMIP
    text: 'KMIP: an external KMIP 1.4 server over mTLS'
  - name: Not applicable
    text: 'Not applicable: the credential store is Vault KV'
  multiple: true
  check: 'Any provider ticked: `nico-pre-config`: `[secrets.kms] active` names a configured provider whose
    `type` is ticked, every configured provider''s type is ticked and every ticked type has at least one
    provider, `[secrets.routing]` has the `"/"` catch-all and every `kek_id` it names belongs to a configured
    provider; `nico-pre-platform`: every `kek_id` recorded in the journal still has an unwrapping provider.
    Credential store Postgres with no box ticked is an error. Integrated: `nico-pre-config`: each key
    source is `env` or `file`, never `value`; `nico-pre-platform`: the variable is set or the file is
    mounted in the nico-api pod and decodes to 32 bytes, and the report reminds that the key is backed
    up apart from the database. Transit: `nico-pre-config`: `transit_mount` and `keys` set; `nico-pre-platform`:
    the engine is enabled at the mount, each key exists, `VAULT_TOKEN` is a static token whose policy
    grants `update` on the encrypt, decrypt and datakey paths of each key. KMIP: `nico-pre-config`: `endpoint`,
    `ca_bundle`, `client_cert`, `client_key` and `keys` set, the three paths under an `extraVolumeMounts`
    mount backed by a Secret; `nico-pre-platform`: the Secret `nico-kmip-client` exists in nico-system
    with the three keys, the endpoint answers over mTLS with that material, lists KMIP 1.4, and each Unique
    Identifier is an Active AES-256 key with Encrypt and Decrypt usage. Not applicable: no check


    Background: Applies only with the Postgres credential store. Every credential there is encrypted with
    a data key (DEK), and the DEK is wrapped by a key-encryption key (KEK). This entry decides where the
    KEK lives.


    **How the tables fit together.** Providers are named under `[secrets.kms.providers.<name>]` and tagged
    by `type`. `[secrets.kms] active` names the provider that wraps new writes; every configured provider
    still unwraps the `kek_id`s it holds, which is how a key is rotated or moved without re-encrypting
    the journal first. `[secrets.routing]` chooses which `kek_id` wraps new writes under each credential
    path prefix, longest prefix winning, with `"/"` as the required catch-all; reads ignore it, since
    every entry records the `kek_id` that wrapped it, so one site normally has the single `"/"` line and
    a second line only when, say, BMC credentials should move to a different key. A bad `[secrets]` section
    fails the boot before any write or import.


    **Integrated.** The KEK is a base64 256-bit key that the nico-api process loads itself. `keys` maps
    each `kek_id` to a locator: `{ env = "NAME" }` reads an environment variable on the pod, `{ file =
    "/path" }` reads a mounted file, `{ value = "<base64>" }` puts the key in the TOML. Simplest and dependency-free,
    but the key material sits in the NICo process and its custody and backup are the operator''s. `value`
    is development only, and the docs call even this `env` example "not a production custody recommendation".
    The variable or file is delivered by the Core chart from a Kubernetes Secret (`envFrom` or `extraVolumes`).


    ```toml

    [secrets]

    backends = ["postgres"]

    writer = "postgres"


    [secrets.kms]

    active = "site"


    [secrets.kms.providers.site]

    type = "integrated"

    keys = { "site-kek-1" = { env = "NICO_SECRETS_KEK" } }


    [secrets.routing]

    "/" = "site-kek-1"

    ```


    **Transit.** Vault or OpenBao Transit wraps and unwraps server-side, so the KEK never leaves Vault.
    `keys` lists the Transit key names this provider answers for; `transit_mount` defaults to `transit`.
    It reuses the Vault that setup.sh installs, but needs work helm-prereqs does not do: enable the engine
    at the mount, create each key, and grant the token `update` on `transit/encrypt/<key>`, `transit/decrypt/<key>`
    and `transit/datakey/plaintext/<key>`. The token must be static in `VAULT_TOKEN` (the chart sets it
    from the Secret named by `envFrom.vaultToken.secretName`); the Kubernetes service-account login is
    not supported for Transit. Shape from the field table; the docs ship no complete example:


    ```toml

    [secrets]

    backends = ["postgres"]

    writer = "postgres"


    [secrets.kms]

    active = "vault-transit"


    [secrets.kms.providers.vault-transit]

    type = "transit"

    keys = ["site-kek-1"]

    transit_mount = "transit"      # default


    [secrets.routing]

    "/" = "site-kek-1"

    ```


    ```bash

    vault secrets enable -path=transit transit

    vault write -f transit/keys/site-kek-1

    ```


    **KMIP.** An external KMIP 1.4 server, typically an enterprise HSM or KMS, holds non-exportable AES-256
    keys and performs Encrypt and Decrypt for NICo over mTLS. `endpoint` is `host:port` (port 5696 when
    omitted), `server_name` defaults to the host part, `ca_bundle`, `client_cert` and `client_key` are
    PEM paths inside the pod, and `keys` maps each `kek_id` to the server''s Unique Identifier of an existing,
    Active key. Startup verifies the server lists KMIP 1.4 and each key''s usage. setup.sh turns `NICO_KMIP_CLIENT_DIR`
    (`ca.pem`, `client.pem`, `client.key`) into the Secret `nico-system/nico-kmip-client`, which nico-api
    mounts through `extraVolumes`; preflight checks that the three paths lie under that mount. Merged,
    but no KMIP server is qualified yet (dsx-ai-factory/infra-controller#3253).


    ```toml

    [secrets]

    backends = ["postgres"]

    writer = "postgres"


    [secrets.kms]

    active = "hsm"


    [secrets.kms.providers.hsm]

    type = "kmip"

    endpoint = "kms.example.com:5696"

    ca_bundle = "/etc/nico/kmip/ca.pem"

    client_cert = "/etc/nico/kmip/client.pem"

    client_key = "/etc/nico/kmip/client.key"

    keys = { "site-kek-1" = "f0a1c2d3-5e6f-4a7b-8c9d-0e1f2a3b4c5d" }


    [secrets.routing]

    "/" = "site-kek-1"

    ```


    **Custody.** Back up the KEK apart from the database: a dump without every KEK its rows reference
    is unreadable, and losing an Integrated KEK loses every credential it wrapped. With Transit or KMIP
    the backup problem moves to the KMS.'
