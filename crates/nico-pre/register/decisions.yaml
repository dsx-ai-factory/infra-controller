- id: firmware-automation
  title: Firmware automation
  section: Firmware and hardware policy
  stated: false
  source: 'NICo TOML file: `[firmware_global]` `autoupdate`, `requires_manual_upgrade`, `instance_updates_manual_tagging`,
    `no_reset_retries`, `firmware_directory`; `[machine_updater]` `max_concurrent_machine_updates_absolute`,
    `_percent`; `host_models`; `explicit_start_needed` per catalog entry (`docs/operations/firmware-updates/configuration.md`,
    `host-firmware.md`)'
  options:
  - name: 'Off'
    text: 'Off: `[firmware_global] autoupdate = false`, as helm-prereqs ships; updates run only per machine
      or by explicit start'
  - name: 'On'
    text: 'On: `autoupdate = true`, every host converges on the catalog''s default version, within the
      concurrency cap'
  default: 'Off'
  check: 'On: `nico-pre-config`: `autoupdate = true`, a positive concurrency cap, `requires_manual_upgrade`
