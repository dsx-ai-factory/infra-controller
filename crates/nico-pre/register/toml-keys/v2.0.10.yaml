# The top-level keys of the NICo Core site TOML at release v2.0.10: the fields of
# `CarbideConfig` in `crates/api-core/src/cfg/file.rs` at tag v2.0.10, less the one serde
# skips, with each field's TOML type and the deprecations its doc comment or the config
# reference (`crates/api-core/src/cfg/README.md`) states. `config.toml.keys` holds a site's
# TOML to the catalogue of the release in `versions.infraController`: a key not listed
# fails, a value of another TOML type fails, a deprecated key warns. Keys the chart layers
# in (`database_url`, `listen`) are listed like any other and never required of the site.
# One file per release; `any` leaves the type unjudged.
release: v2.0.10
source: crates/api-core/src/cfg/file.rs at v2.0.10, struct CarbideConfig
keys:
  - { name: listen, type: string }   # SocketAddr
  - { name: listen_only, type: boolean }   # bool
  - { name: metrics_endpoint, type: string }   # Option<SocketAddr>
  - { name: alt_metric_prefix, type: string }   # Option<String>
  - { name: database_url, type: string }   # String
  - { name: max_database_connections, type: integer }   # u32
  - { name: ib_config, type: table }   # Option<IBFabricConfig>
