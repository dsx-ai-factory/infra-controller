[package]
name = "carbide-nvlink-domain-controller"
version = "0.0.0"
edition.workspace = true
description = "Shared lifecycle controller infrastructure for NVLink domains"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
carbide-api-db = { path = "../api-db", default-features = false }
carbide-api-model = { path = "../api-model", default-features = false }
config-version = { path = "../config-version", default-features = false }
state-controller = { path = "../state-controller", default-features = false }
async-trait = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
carbide-macros = { path = "../macros" }
carbide-sqlx-testing = { path = "../sqlx-testing" }
state-controller = { path = "../state-controller", features = ["test-support"] }
tokio = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
