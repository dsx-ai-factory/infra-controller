listen = "[::]:1081"
metrics_endpoint = "[::]:1080"
database_url = "postgres://a:b@postgresql"
max_database_connections = 1222
database_pool_acquire_timeout = "15s"
database_pool_idle_timeout = "20m"
database_pool_max_lifetime = "45m"
database_startup_retry_timeout = "2m"
asn = 123
