[vpc_prefix_state_controller.controller]
iteration_time = "6m"
max_object_handling_time = "66s"
max_concurrency = 666

[ib_partition_state_controller.controller]
iteration_time = "7m"
max_object_handling_time = "77s"
max_concurrency = 777

