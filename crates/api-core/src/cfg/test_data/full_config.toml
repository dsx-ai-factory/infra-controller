pxe_public_base_url = "http://pxe.example.com:8080"

[tls]
identity_pemfile_path = "/path/to/cert"
identity_keyfile_path = "/path/to/key"
root_cafile_path = "/path/to/ca"

[auth]
permissive_mode = false
casbin_policy_file = "/path/to/policy"

[auth.cli_certs]
required_equals = { "IssuerO" = "NVIDIA Corporation", "IssuerCN" = "NVIDIA Forge Root Certificate Authority 2022" }
group_from = "SubjectOU"
username_from = "SubjectCN"

[pools.fnn-asn]
type = "integer"
ranges = [{ start = "4268000000", end = "4268999999" }]

[pools.lo-ip]
type = "ipv4"
prefix = "10.180.62.1/26"

[pools.vlan-id]
type = "integer"
ranges = [{ start = "100", end = "501" }]

[pools.vni]
type = "integer"
ranges = [{ start = "1024500", end = "1024550" }]

[pools.vpc-vni]
type = "integer"
ranges = [{ start = "2024500", end = "2024550" }]

[networks.admin]
type = "admin"
prefix = "172.20.0.0/24"
gateway = "172.20.0.1"
mtu = 9000
reserve_first = 5

[networks.DEV1-C09-IPMI-01]
type = "underlay"
prefix = "172.99.0.0/26"
gateway = "172.99.0.1"
mtu = 1500
reserve_first = 5

[ib_fabrics.default]
endpoints = ["https://1.2.3.4"]
pkeys = [{ start = "1", end = "10" }]

[ib_config]
fabric_monitor_run_interval = "101s"

[credentials]
ufm_source = "backend"

[credentials.file]
path = "/var/run/secrets/nico/ufm/credentials.yaml"
poll_interval = "17s"

[site_explorer]
enabled = true
run_interval = "100s"
explorations_per_run = 11
create_machines = true
machines_created_per_run = 2
override_target_ip = "1.2.3.4"
override_target_port = 10443
reset_rate_limit = "2h"

# Unit is mandatory
[machine_state_controller]
dpu_wait_time = "3m"
power_down_wait = "13s"
failure_retry_time = "31m"
dpu_up_threshold = "33m"
scout_reporting_timeout = "20m"
boot_interface_observation_interval = "10m"

[host_health]
prevent_allocations_on_stale_dpu_agent_version = true
prevent_allocations_on_scout_heartbeat_timeout = true
suppress_external_alerting_on_scout_heartbeat_timeout = false

[observability]
per_object_metrics_for_classifications = ["Hardware", "PreventAllocations"]

[observability.per_object_state_metrics]
enabled = true
listen_address = "127.0.0.1:9191"
object_types = ["machine", "switch"]

[machine_state_controller.controller]
iteration_time = "9m"
max_object_handling_time = "99s"
max_concurrency = 999

[network_segment_state_controller]
network_segment_drain_time = "44s"
[network_segment_state_controller.controller]
iteration_time = "8m"
max_object_handling_time = "88s"
max_concurrency = 888

[vpc_prefix_state_controller]
