{% extends "base.html" %}

{% block title %}Console Logs — {{ machine_id }}{% endblock %}

{% block body_class %}page-fill-height{% endblock %}

{% block content %}
<h1>Console Logs</h1>
<section class="entity-summary log-viewer">
  <div class="log-toolbar">
    <span class="log-field">Machine</span>
    {{ machine_id|machine_id_link|safe }}
    <span id="console-status" class="bubble log-status">Connecting…</span>
    <button id="follow" type="button" class="btn-secondary">Pause following</button>
    <button id="clear" type="button" class="btn-secondary">Clear</button>
  </div>
  <div id="console-output" class="log-console"></div>
</section>
<script>
(() => {
  const output = document.getElementById("console-output");
  const status = document.getElementById("console-status");
  const followButton = document.getElementById("follow");
  const lines = [];
  let follow = true;
  const source = new EventSource("/admin/machine/{{ machine_id }}/console-logs/stream");

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = "bubble log-status" + (kind ? " " + kind : "");
  }

  source.onopen = () => {
    lines.length = 0;
    output.textContent = "";
    setStatus("Connected", "success");
  };
  source.onmessage = event => {
    lines.push(JSON.parse(event.data));
    if (lines.length > 5000) lines.splice(0, lines.length - 5000);
    output.textContent = lines.join("");
    if (follow) output.scrollTop = output.scrollHeight;
  };
  source.addEventListener("console-error", event => {
    const error = JSON.parse(event.data);
    setStatus(`${error.code}: ${error.message}`, "error");
  });
  source.onerror = () => { setStatus("Disconnected; retrying…", "warning"); };
  followButton.onclick = () => {
    follow = !follow;
    followButton.textContent = follow ? "Pause following" : "Follow";
    followButton.classList.toggle("active", !follow);
    if (follow) output.scrollTop = output.scrollHeight;
  };
  document.getElementById("clear").onclick = () => {
    lines.length = 0;
    output.textContent = "";
  };
})();
</script>
{% endblock %}
