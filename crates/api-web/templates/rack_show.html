{% extends "base.html" %}

{% block title %}Racks{% endblock %}

{% block content %}
<div id="json"><a id="json-link" href="">JSON</a></div>
<h1>Racks</h1>

<table class="sortable overview">
	<thead>
		<tr>
			<th>Rack</th>
			<th>State</th>
		</tr>
	</thead>
	<tbody>
		{% for rack in racks %}
		<tr>
			<td>{{ rack.id|rack_id_link|safe }}</td>
			<td class="state-cell">{{ rack.state_display|safe }}</td>
		</tr>
		{% else %}
		<tr><td colspan="2">No racks found.</td></tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
