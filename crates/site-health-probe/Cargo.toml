[package]
name = "carbide-site-health-probe"
description = "Synthetic monitoring probes against a NICo site's APIs (issue #5360)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "site-health-probe"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { features = ["derive", "env"], workspace = true }
duration-str = { workspace = true }
eyre = { workspace = true }
opentelemetry = { workspace = true }
reqwest = { default-features = false, features = [
  "json",
  "rustls",
], workspace = true }
rustls-pemfile = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { features = ["env-filter"], workspace = true }
url = { workspace = true }

# [local-dependencies]
carbide-rpc = { path = "../rpc" }
carbide-tls = { path = "../tls" }
logfmt = { path = "../logfmt" }
metrics-endpoint = { path = "../metrics-endpoint" }

[dev-dependencies]
axum = { workspace = true }
carbide-test-support = { path = "../test-support" }
prometheus = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
