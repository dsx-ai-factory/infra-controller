# BMC Mock should be running on localhost:1266 for this config to work. You can run it with `cargo run -p bmc-mock`.

[[endpoint_sources.static_bmc_endpoints]]
ip = "127.0.0.1"
port = 1266
mac = "aa:bb:cc:dd:ee:ff"
username = "admin"
password = "secret"
rack_id = "RACK_1"
machine = { id = "fm100htjtiaehv1n5vh67tbmqq4eabcjdng40f7jupsadbedhruh6rag1l0", serial = "MN-001", slot_number = 15, tray_index = 5, nvlink_domain_uuid = "00000000-0000-0000-0000-000000000000" }
# switch = { id = "fsw100htjtiaehv1n5vh67tbmqq4eabcjdng40f7jupsadbedhruh6rag1l0", serial = "SN-SWITCH-001", slot_number = 7, tray_index = 3 }
# power_shelf = { id = "fps100htjtiaehv1n5vh67tbmqq4eabcjdng40f7jupsadbedhruh6rag1l0", serial = "SN-POWER-SHELF-001" }

[endpoint_sources.nico_api]
enabled = false

[processors.leak_detection]
enabled = true
minimum_alerts_per_report = 2

[collectors.metrics]
enabled = true

[processors.rack_leak]
leaking_tray_threshold = 1

[sinks.tracing]
enabled = true

[sinks.prometheus]
enabled = true

[sinks.health_report]
enabled = false

[sinks.rack_health_report]
enabled = false

[sinks.switch_health_report]
enabled = false

[sinks.power_shelf_health_report]
enabled = false
