[package]
name = "bmc-explorer"
version = "0.1.0"
description = "Explorer of BMC of different vendors"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
# [local-dependencies]
# DO NOT PUT DEPENDENCIES OTHER THAN LOCAL DEPS HERE, THEY SHOULD ALL HAVE 'path =' IN THEM.
bmc-vendor = { path = "../bmc-vendor" }
bmc-mock = { path = "../bmc-mock", optional = true }
carbide-network = { path = "../network", default-features = false }
carbide-api-model = { path = "../api-model", default-features = false }
# DO NOT PUT DEPENDENCIES OTHER THAN LOCAL DEPS HERE, THEY SHOULD ALL HAVE 'path =' IN THEM.

itertools = { workspace = true }
mac_address = { workspace = true }
nv-redfish = { workspace = true, features = [
  "assembly",
  "bios",
  "boot-options",
  "chassis",
  "computer-systems",
  "ethernet-interfaces",
  "host-interfaces",
  "manager-network-protocol",
  "managers",
  "network-adapters",
  "network-device-functions",
  "pcie-devices",
  "ports",
  "power-supplies",
  "update-service",
  "secure-boot",
  "oem-nvidia",
  "oem-dell-attributes",
  "oem-lenovo",
  "oem-supermicro",
  "oem-hpe",
  "oem-ami",
  "oem-liteon",
  "oem-delta",
  "bmc-http",
] }
regex = { workspace = true }
lazy_static = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Exposes src/test_support.rs (test-only helpers) without shipping them in a
# production build.
test-support = ["dep:bmc-mock"]

[dev-dependencies]
axum = { workspace = true }
bmc-mock = { path = "../bmc-mock" }
# Self dev-dependency so the crate's own integration tests get the test-support
# helpers; applies only to test/bench targets, never the production library.
bmc-explorer = { path = ".", features = ["test-support"] }
carbide-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
