# Example configuration for carbide-dns (TOML).
#
# Settings are commented out with their built-in defaults, except for the
# optional OTLP endpoint example. Uncomment a line to configure it.
# Key names must match the fields on `Config` in
# src/config.rs; an unrecognized key is silently ignored.

# Address (host:port) the DNS server listens on for UDP and TCP.
# listen_address = "[::]:53"

# URI of the nico-api server queried for DNS records.
# api_uri = "https://nico-api.nico-system.svc.cluster.local:1079"

# Path to the root CA certificate used to verify the nico-api server.
# root_ca_path = "/var/run/secrets/spiffe.io/ca.crt"

# Path to the client certificate presented to nico-api for mTLS.
# client_cert_path = "/var/run/secrets/spiffe.io/tls.crt"

# Path to the client private key presented to nico-api for mTLS.
# client_key_path = "/var/run/secrets/spiffe.io/tls.key"

# OTLP gRPC endpoint that traces are exported to. Unset by default, which
# disables trace export. The following address is an example, not a default.
# otlp_endpoint = "http://opentelemetry-collector.otel.svc.cluster.local:4317"

# Maximum lifetime for non-transient negative answers, in seconds.
# negative_cache_ttl_secs = 120

# How long to cache ServFail responses (transient nico-api failures), in
# seconds. Kept short so a failure is not pinned across the upstream's recovery;
# clamped to [1, 300]. Default: 5.
# negative_cache_servfail_ttl_secs = 5

# Maximum number of entries the negative cache may hold. At capacity, inserting
# a new key evicts the least-recently-used entry. Zero selects a capacity of one.
# negative_cache_entries_max_count = 50000

# Maximum time to wait for a single upstream lookup_record call before giving up
# and returning ServFail, in seconds. Default: 5.
# upstream_lookup_timeout_secs = 5

# Address (host:port) the Prometheus metrics server listens on.
# metrics_listen_address = "[::]:8053"
