[package]
name = "carbide-scale-test"
description = "Scale test runner: shared framework and test commands, shipped in the machine-a-tron image"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "scale_test"

[features]
# Fakes for this crate's tests and for test commands built on it.
test-support = ["dep:axum", "dep:regex", "dep:serde_urlencoded"]

[dependencies]
async-trait = { workspace = true }
axum = { optional = true, workspace = true }
chrono = { features = ["serde"], workspace = true }
regex = { optional = true, workspace = true }
reqwest = { default-features = false, features = [
  "json",
  "rustls",
], workspace = true }
schemars = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { optional = true, workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

# [local-dependencies]
carbide-site-health-probe-api = { path = "../site-health-probe-api", features = [
  "schema",
] }

[dev-dependencies]
axum = { workspace = true }
carbide-test-support = { path = "../test-support" }
futures = { features = ["std"], workspace = true }
regex = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { features = ["test-util"], workspace = true }

[lints]
workspace = true
