                {{- end}}
            route-import:
              from-evpn:
                route-target:
                  {{ $.DatacenterASN }}:{{ $vpc.L3VNI }}: {}
                {{- range $vpc.VpcPeerVnis }}
                  {{ $.DatacenterASN }}:{{ .Vni }}: {}
                {{- end}}
                {{- range $vpc.RoutingProfile.RouteTargetImports }}
                  {{ .ASN }}:{{ .VNI }}: {}
                {{- end}}
                {{- range $.AdditionalRouteTargetImports }}
                  {{ .ASN }}:{{ .VNI }}: {}
                {{- end}}
                  auto: {}
{{- end }}
