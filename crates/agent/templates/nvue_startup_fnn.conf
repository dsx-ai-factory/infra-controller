{{- $nvueConfig := . -}}
- header:
    model: VX
    nvue-api-version: nvue_v1
    rev-id: 1.0
    version: Cumulus Linux 5.6.0
{{- $tenant := .Tenant }}
- set:
{{- if .IncludeBridge }} {{/* Only if an L2 segment exists should bridges be configured */}}
    bridge:
      domain:
        br_default:
          vlan:
  {{- range $portConfig := $tenant.PortConfigs }}
    {{- if $portConfig.IsL2Segment }}
            '{{ $portConfig.VlanID }}':
              vni:
                '{{ $portConfig.L2VNI }}': {} {{/* Always configuring an L2VNI, even if not necessary. Less conditions in the template */}}
    {{- end }}
  {{- end }}
{{- end }}
    evpn:
      enable: on
    interface:
      lo:
        ip:
          address:
            {{ .LoopbackIP }}/32: {}
{{- if .HasLoopbackIpv6 }}
            {{ .LoopbackIpv6 }}/128: {}
{{- end }}
        type: loopback
{{- if $nvueConfig.IsDpuOs }}
{{- range $portConfig := $tenant.PortConfigs }}
  {{- if $portConfig.IsPhy }}
      pf0dpu1_if:
        ip:
          address:
            169.254.169.253/30: {}
          vrf: {{ $portConfig.VrfName }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .IsStorageClient }} {{/* New variable to be created to define if a node is a storage client and the interface should be created */}}
      pf0dpu3_if:
        ip:
          address:
            {{ $.StorageDpuIP }}: {}
        vrf: storage
{{- end }}
{{- range .Uplinks}}
      {{ . }}:
        type: swp
{{- end }}
{{- range $portConfig := $tenant.PortConfigs }}
      {{ $portConfig.InterfaceName }}:
        type: swp
        acl: {{/* Removing condition of use-case. ACL should always be configured. The condition should be for the ACL content and not the existance */}}
        {{- if $nvueConfig.HasDenyPrefixes }}
          p0000_deny_prefixes_ipv4:
            inbound: {}
        {{- end }}
        {{- if $nvueConfig.HasDenyPrefixesIpv6 }}
          p0000_deny_prefixes_ipv6:
            inbound: {}
        {{- end }}
        {{- if $nvueConfig.HasIpv4EgressSecurityPolicyOverrideRules }}
          p0004_security_policy_override_ipv4_host_egress:          
            inbound: {}
        {{- end }}
        {{- if $nvueConfig.HasIpv6EgressSecurityPolicyOverrideRules }}
          p0004_security_policy_override_ipv6_host_egress:
            inbound: {}
        {{- end }}
        {{- if $nvueConfig.HasIpv4IngressSecurityPolicyOverrideRules }}
          p0004_security_policy_override_ipv4_host_ingress:
            outbound: {}
        {{- end }}
        {{- if $nvueConfig.HasIpv6IngressSecurityPolicyOverrideRules }}
          p0004_security_policy_override_ipv6_host_ingress:
            outbound: {}
        {{- end }}
        {{- if $portConfig.HasNetworkSecurityGroup }}
          p0005_{{ $portConfig.NetworkSecurityGroupIndex }}_security_group_ipv4_host_egress: 
            inbound: {}
          p0005_{{ $portConfig.NetworkSecurityGroupIndex }}_security_group_ipv6_host_egress:
            inbound: {}
          p0005_{{ $portConfig.NetworkSecurityGroupIndex }}_security_group_ipv4_host_ingress: 
            outbound: {}
          p0005_{{ $portConfig.NetworkSecurityGroupIndex }}_security_group_ipv6_host_ingress: 
            outbound: {}
        {{- end }}
        {{- if $portConfig.HasVpcPeerPrefixes }}
          p0009_{{ $portConfig.VrfName }}_peer_egress_from_host:
            inbound: {}
          p0009_{{ $portConfig.VrfName }}_peer_ingress_to_host:
            outbound: {}
        {{- end }}
        {{- if $portConfig.HasVpcPeerPrefixesIpv6 }}
          p0009_{{ $portConfig.VrfName }}_peer_egress_from_host_ipv6:
            inbound: {}
          p0009_{{ $portConfig.VrfName }}_peer_ingress_to_host_ipv6:
            outbound: {}
        {{- end }}
        {{- if and ($nvueConfig.UseVpcIsolation) ($nvueConfig.HasSiteFabricPrefixes) }}
          p0010_{{ $portConfig.VrfName }}_isolation_ipv4:
            inbound: {}
        {{- end }}
        {{- if and ($nvueConfig.UseVpcIsolation) ($nvueConfig.HasSiteFabricPrefixesIpv6) }}
          p0010_{{ $portConfig.VrfName }}_isolation_ipv6:
            inbound: {}
        {{- end }}
   {{- if $portConfig.IsL2Segment }}
          dhcp_flood_prevention:
            inbound: {}
   {{- end }}
   {{- if not $portConfig.IsL2Segment }} {{/* If not L2, IP will be directly configured on the interface */}}
        ip:
          address:
          {{- range $portConfig.IPs }}
            {{ . }}: {} {{/* In case of FNN L3, this is the first IP in the /31 in the prefix */}}
          {{- end }}
          {{- range $portConfig.IPsIpv6 }}
            {{ . }}: {} {{/* FNN L3 uses the /127 address on the DPU, or the selected /64 for SLAAC */}}
          {{- end }}
          {{- if $portConfig.HasFmdsGateway }}
            169.254.169.253/30: {}
          {{- end }}
          vrf: {{ $portConfig.VrfName }} {{/* The name of the VRF (VPC) this interface should be in */}}
     {{- else }} {{/* If the segment is L2, the interface should be configured in the bridge */}}
        bridge:
          domain:
            br_default:
              access: {{ $portConfig.VlanID }}
   {{- end }}
  {{- if $portConfig.IsL2Segment }} {{/* If the segment is L2, an SVI is needed */}}
      vlan{{ $portConfig.VlanID }}:
        type: svi
        vlan: {{ $portConfig.VlanID }}
        ip:
          address:
          {{- range $portConfig.SviIPs }}
            {{ . }}: {} {{/* The SviIP is a _different_ ip from the same subnet than the gateway. Typically the second IP in the subnet */}}
          {{- end }}
          {{- range $portConfig.SviIPsIpv6 }}
            {{ . }}: {} {{/* The SviIP is a _different_ ip from the same subnet than the gateway. Typically the second IP in the subnet */}}
          {{- end }}
          {{- if $portConfig.HasFmdsGateway }}
            169.254.169.253/30: {}
          {{- end }}
          vrf: {{ $portConfig.VrfName }} {{/* The name of the VRF (VPC) this interface should be in */}}
          vrr:
            address:
            {{- range $portConfig.IPs }}
              {{ . }}: {} {{/* In case of FNN l2, the first IP from the subnet */}}
            {{- end }}
            {{- range $portConfig.IPsIpv6 }}
              {{ . }}: {} {{/* In case of FNN l2, the first IP from the subnet */}}
            {{- end }}
            enable: on
            mac-address: {{ $portConfig.SviMAC }} {{/* A shared MAC address for all vlan interfaces in the same VNI (VPC) */}}
            state:
              up: {}
  {{- end }}
{{- end }}
    nve:
      vxlan:
        arp-nd-suppress: on
        enable: on
        source:
          address: {{ $nvueConfig.LoopbackIP }} {{/* Unique DPU Loopback used as VTEP */}}
    router:
      bgp:
        autonomous-system: {{ $nvueConfig.ASN }} {{/* Unique DPU ASN */}}
        enable: on
        router-id: {{ $nvueConfig.LoopbackIP }}
      vrr:
        enable: on
      policy:
        community-list:
          BYOIP_LEAK_AND_DROP_EVPN_COMMUNITY_LIST:
            rule:
              '10':
                action: permit
                community:
                  65100:02: {}
          BYOIP_LEAK_COMMUNITY_LIST:
            rule:
              '10':
                action: permit
                community:
                  65100:01: {}
        as-path-list:
          DPU_TO_EVPN_AS_PATH_DROP_LIST:
            rule:
              '10':
                action: permit{{/* This means 'match', not 'allow' */}}
                aspath-exp: "^.+$"{{/* Match on anything that we did not originate */}}
        prefix-list:
          ALLOW_TO_UNDERLAY_PREFIX_LIST:
            rule:
              '65000':
                action: permit
                match:
                  {{ $nvueConfig.LoopbackIP }}/32: {}
              {{- if $nvueConfig.HasAnyVpcTenantHostLeakToUnderlay }}
              '65002':
                action: permit
                match:
                  {{- range $nvueConfig.TenantHostRoutesToUnderlay }}
                  {{ . }}: {}
                  {{- end }}
              {{- end}}
{{/* `LoopbackIpv6` is the DPU's IPv6 next hop, so permit it as a /128 when set. */}}
          ALLOW_TO_UNDERLAY_PREFIX_LIST_IPV6:
            type: ipv6
            rule:
{{- if $nvueConfig.HasLoopbackIpv6 }}
              '65000':
                action: permit
                match:
                  '{{ $nvueConfig.LoopbackIpv6 }}/128': {}
{{- end }}
              {{- if $nvueConfig.HasAnyVpcTenantHostLeakToUnderlayIpv6 }}
              '65002':
                action: permit
                match:
                  {{- range $nvueConfig.TenantHostRoutesToUnderlayIpv6 }}
                  '{{ . }}': {}
                  {{- end }}
              {{- end }}
              '65535':
                action: deny
                match:
                  any: {}
        {{- range $vpc := $tenant.Vpcs }}
          {{- range $port := $vpc.PortConfigs }}
          DPU_FROM_INSTANCE_PREFIX_LIST_{{ $vpc.VrfName }}_if_{{ $port.Index }}:
            rule:
            {{- if not $vpc.RoutingProfile.HasAllowedAnycastPrefixesIpv4 }}{{/* This can be removed after a version or two to allow a grace/deprecation period. */}}
              {{- range $nvueConfig.AnycastSitePrefixes }}
              '{{ .Index }}':
                action: permit
                match:
                  {{ .Prefix }}:
                    max-prefix-len: 32
              {{- end }}
            {{- else }}
              {{- if $port.HasRoutingProfile }}
                {{- range $port.RoutingProfile.AllowedAnycastPrefixesIpv4 }}
              '{{ .Index }}':
                action: permit
                match:
                  {{ .Prefix }}:
                    max-prefix-len: 32
                {{- end }}
              {{- else }}
                {{- range $vpc.RoutingProfile.AllowedAnycastPrefixesIpv4 }}
              '{{ .Index }}':
                action: permit
                match:
                  {{ .Prefix }}:
                    max-prefix-len: 32
                {{- end }}
              {{- end }}
            {{- end }}
              '65535':
                action: deny
                match:
                  any: {}
          DPU_FROM_INSTANCE_PREFIX_LIST_IPV6_{{ $vpc.VrfName }}_if_{{ $port.Index }}:
            type: ipv6
            rule:
            {{- if $port.HasRoutingProfile }}
              {{- range $port.RoutingProfile.AllowedAnycastPrefixesIpv6 }}
              '{{ .Index }}':
                action: permit
                match:
                  {{ .Prefix }}:
                    max-prefix-len: 128
              {{- end }}
            {{- else }}
              {{- range $vpc.RoutingProfile.AllowedAnycastPrefixesIpv6 }}
              '{{ .Index }}':
                action: permit
                match:
                  {{ .Prefix }}:
                    max-prefix-len: 128
              {{- end }}            
            {{- end }}
              '65535':
                action: deny
                match:
                  any: {}
          {{- end }}
        {{- end }}
          DPU_TO_EVPN_DROP_PREFIX_LIST:
            rule:
              '65535':
                action: deny
                match:
                  any: {}
          {{- range $vpc := $tenant.Vpcs }}
              {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv4 }}
          FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_PREFIX_LIST:
            rule:
                {{- range $leak := $vpc.RoutingProfile.AcceptedLeaksFromUnderlayIpv4 }}
              '{{ $leak.Index }}':
                action: permit
                match:
                  '{{ $leak.Prefix }}':
                    max-prefix-len: 32{{/* Any */}}
                {{- end }}
                {{- if $vpc.RoutingProfile.LeakDefaultRouteFromUnderlay }}
              '65534':
                action: permit
                match:
                  0.0.0.0/0: {}{{/* Exact match */}}
                {{- end }}
              {{- end }}
          {{- end }}
          {{- range $vpc := $tenant.Vpcs }}
              {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv6 }}
          FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_PREFIX_LIST_IPV6:
            type: ipv6
            rule:
                {{- range $leak := $vpc.RoutingProfile.AcceptedLeaksFromUnderlayIpv6 }}
              '{{ $leak.Index }}':
                action: permit
                match:
                  '{{ $leak.Prefix }}':
                    max-prefix-len: 128{{/* Any */}}
                {{- end }}
                {{- if $vpc.RoutingProfile.LeakDefaultRouteFromUnderlay }}
              '65534':
                action: permit
                match:
                  '::/0': {}{{/* Exact match */}}
                {{- end }}
              {{- end }}
          {{- end }}
        route-map:
          dpu_to_evpn:
            rule:
              '9':
                action:
                  deny: {}
                match:
                  tag: 65102{{/* Drop prefixes requested for drop by the host */}}
              '10':
                action:
                  deny: {}
                match:
                  type: ipv4
                  evpn-route-type: ip-prefix
                  ip-prefix-list: DPU_TO_EVPN_DROP_PREFIX_LIST
              '11':
                action:
                  permit: {}
                match:
                  tag: 65100{{/* Allow prefixes learned from the host */}}
              '12':
                action:
                  permit: {}
                match:
                  tag: 65101{{/* Allow prefixes learned from the host */}}
              '13':
                action:
                  deny: {}
                match:
                  as-path-list: DPU_TO_EVPN_AS_PATH_DROP_LIST
              '65535':
                action:
                  permit: {}{{/* We originally did no filtering here.  An attempt to use an "allow" prefix-list and default deny route-map stripped more than expected.  It seems like a bug that we need to look into. For now, we just drop the prefixes that we wanted dropped. */}}
          leak_to_underlay:
            rule:
              '65532':
                action:
                  permit: {}
                match:
                  tag: 65102
                set:
                  community:
                    none: {}
                  large-community:
                    none: {}
              '65533':
                action:
                  permit: {}
                match:
                  type: ipv4
                  ip-prefix-list: ALLOW_TO_UNDERLAY_PREFIX_LIST
                set:
                  community:
                    none: {}{{/* We strip here just in case something accidentally slipped through */}}
                  large-community:
                    none: {}
              '65534':
                action:
                  permit: {}
                match:
                  tag: 65100
                set:
                  community:
                    none: {}
                  large-community:
                    none: {}
              '65535':
                action:
                  deny: {}
          leak_to_underlay_ipv6:
            rule:
              '65533':
                action:
                  permit: {}
                match:
                  type: ipv6
                  ip-prefix-list: ALLOW_TO_UNDERLAY_PREFIX_LIST_IPV6
                set:
                  community:
                    none: {}{{/* We strip here just in case something accidentally slipped through */}}
                  large-community:
                    none: {}
              '65534':
                action:
                  permit: {}
                match:
                  tag: 65100
                set:
                  community:
                    none: {}
                  large-community:
                    none: {}
              '65535':
                action:
                  deny: {}
          {{- range $vpc := $tenant.Vpcs }}
            {{- range $port := $vpc.PortConfigs }}
          dpu_from_instance_{{ $vpc.VrfName }}_if_{{ $port.Index }}:
            rule:
              {{- if $vpc.RoutingProfile.TenantLeakCommunitiesAccepted }}
              '9':
                action:
                  permit: {}{{/* We allow it in because we might need to leak to some targets and drop to others, so we tag it for later.  */}}
                match:
                  type: ipv4
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                  community-list: BYOIP_LEAK_AND_DROP_EVPN_COMMUNITY_LIST
                set:
                  tag: 65102{{/* tag it so we can match on the tag and use it for leaking and dropping later */}}
                  community:
                      none: {}{{/* Strip any communities the peer might have attached. */}}
                  large-community:
                    none: {}
              '10':
                action:
                  permit: {}
                match:
                  type: ipv4
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                  community-list: BYOIP_LEAK_COMMUNITY_LIST
                set:
                  tag: 65100{{/* tag it so we can match on the tag and use it for leaking later */}}
                  community:
                      none: {}{{/* Strip any communities the peer might have attached. */}}
                  large-community:
                    none: {}
              {{- end }}
              '11':
                action:
                  permit: {}
                match:
                  type: ipv4
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                set:
                  tag: 65101{{/* tag it so we can match on the tag and use it for leaking later */}}
                  community:
                      none: {}{{/* Strip any communities the peer might have attached. */}}
                  large-community:
                    none: {}
              '65535':
                action:
                  deny: {}
          dpu_from_instance_ipv6_{{ $vpc.VrfName }}_if_{{ $port.Index }}:
            rule:
              {{- if $vpc.RoutingProfile.TenantLeakCommunitiesAccepted }}
              '9':
                action:
                  permit: {}{{/* We allow it in because we might need to leak to some targets and drop to others, so we tag it for later.  */}}
                match:
                  type: ipv6
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_IPV6_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                  community-list: BYOIP_LEAK_AND_DROP_EVPN_COMMUNITY_LIST
                set:
                  tag: 65102{{/* tag it so we can match on the tag and use it for leaking and dropping later */}}
                  community:
                      none: {}{{/* Strip any communities the peer might have attached. */}}
                  large-community:
                    none: {}
              '10':
                action:
                  permit: {}
                match:
                  type: ipv6
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_IPV6_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                  community-list: BYOIP_LEAK_COMMUNITY_LIST
                set:
                  tag: 65100
                  community:
                      none: {}
                  large-community:
                    none: {}
              {{- end }}
              '11':
                action:
                  permit: {}
                match:
                  type: ipv6
                  ip-prefix-list: DPU_FROM_INSTANCE_PREFIX_LIST_IPV6_{{ $vpc.VrfName }}_if_{{ $port.Index }}
                set:
                  tag: 65101
                  community:
                      none: {}
                  large-community:
                    none: {}
              '65535':
                action:
                  deny: {}
            {{- end }}
          {{- end }}
          dpu_to_instance:
            rule:
              '10':
                action:
                  deny: {}
          {{- range $vpc := $tenant.Vpcs }}
            {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv4 }}
          FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_MAP:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_PREFIX_LIST
                  type: ipv4
            {{- end }}
          {{- end }}
          {{- range $vpc := $tenant.Vpcs }}
            {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv6 }}
          FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_MAP_V6:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_PREFIX_LIST_IPV6
                  type: ipv6
            {{- end }}
          {{- end }}
    system:
      api:
        listening-address:
          0.0.0.0: {}
{{- if $nvueConfig.StatefulAclsEnabled }}
      reflexive-acl:
        enable: on                  
{{- end }}
    vrf:
      default:
        router:
          nexthop-tracking:
            ipv4:
              resolved-via-default: on
          bgp:
            address-family:
              ipv4-unicast:
                enable: on
                multipaths:
                  ebgp: 128
                redistribute:
                  connected:
                    enable: on
{{/*
                    For now, we import from all VRFs and rely on the prefix lists to control what gets out, which    
                    includes a broad filter for permitted tenant-announcemed prefixes.                               
                    When we implement per-tenant announcement controls, we could gate the VRF imports to only happen 
                    if there is at least one VPC leaking host routes or accepting tenant announcements.              
                    If there are no VPCs, then skip this block entirely.
*/}}
                {{- if $tenant.Vpcs }}
                route-import:
                  from-vrf:
                    route-map: leak_to_underlay
                    enable: on
                    list:
                    {{- range $vpc := $tenant.Vpcs }}
                      {{ $vpc.VrfName }}: {}
                    {{- end}}
                {{- end}}
              ipv6-unicast:
                enable: on
                multipaths:
                  ebgp: 128
                redistribute:
                  connected:
                    enable: on
{{/*
                    For now, we import from all VRFs and rely on the prefix lists to control what gets out, which    
                    includes a broad filter for permitted tenant-announcemed prefixes.                               
                    When we implement per-tenant announcement controls, we could gate the VRF imports to only happen 
                    if there is at least one VPC leaking host routes or accepting tenant announcements.              
                    If there are no VPCs, then skip this block entirely.
*/}}
                {{- if $tenant.Vpcs }}
                route-import:
                  from-vrf:
                    route-map: leak_to_underlay_ipv6
                    enable: on
                    list:
                    {{- range $vpc := $tenant.Vpcs }}
                      {{ $vpc.VrfName }}: {}
                    {{- end}}
                {{- end}}
              l2vpn-evpn:
                enable: on
            enable: on
            neighbor:
{{- range $nvueConfig.RouteServers }}
              {{ . }}:
                peer-group: routeserver
                type: numbered
{{- end }}
{{- range $nvueConfig.Uplinks}}
              {{ . }}:
                peer-group: underlay
                type: unnumbered
{{- end }}
            path-selection:
              multipath:
                aspath-ignore: on
                bandwidth: ignore
            peer-group:
              routeserver:
                address-family:
                  ipv4-unicast:
                    enable: off
                  ipv6-unicast:
                    enable: off
                  l2vpn-evpn:
                    enable: on
                    policy:
                      outbound:
                        route-map: dpu_to_evpn
                multihop-ttl: 255
                remote-as: external
                update-source: lo
              underlay:
                remote-as: external
                {{- if $nvueConfig.HasBgpLeafSessionPassword }}
                password: '{{ $nvueConfig.BgpLeafSessionPassword }}'
                {{- end }}
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: leak_to_underlay
                  ipv6-unicast:
                    enable: on
                    policy:
                      outbound:
                        route-map: leak_to_underlay_ipv6
{{- if eq (len $nvueConfig.RouteServers) 0 }}
                  l2vpn-evpn:
                    enable: on
                    policy:
                      outbound:
                        route-map: dpu_to_evpn
{{- end }}
{{/* Tenant VRF LOOP START */}}
{{ range $vpc := $tenant.Vpcs }}
      {{ $vpc.VrfName }}: {{/* A VRF (VPC) needs to be defined on each DPU. This also creates an interface which introduces a max of 15 chars */}}
        evpn:
          enable: on
          vni:
            {{ if $nvueConfig.HasSiteGlobalVpcVni }}'{{$nvueConfig.SiteGlobalVpcVni}}'{{ else }}'{{ $vpc.L3VNI }}'{{ end }}: {} {{/* A VRF (VPC) needs a unique VNI to create the tenant separation */}}
        {{- if $vpc.VrfLoopback }}
        loopback:
          ip:
            address:
              {{ $vpc.VrfLoopback }}/32: {}
        {{- end }}
        router:
        {{- if $nvueConfig.UseAdminNetwork }}
          static:
            {{- range $vpc.PortConfigs }}
            {{ .HostRoute }}:
              address-family: ipv4-unicast
              via:
                vlan{{ .VlanID }}:
                  type: interface
            {{- end }}
        {{- end }}
          bgp:
            path-selection:
              multipath:
                aspath-ignore: on
            address-family:
              ipv4-unicast:
              {{- if $nvueConfig.UseAdminNetwork }}
                network:
                  {{- range $vpc.PortConfigs }}
                  {{ .HostRoute }}: {}
                  {{- end }}              
              {{- end }}
                enable: on
                redistribute:
                  connected:
                    enable: on
                route-export:
                  to-evpn:
                    enable: on
                {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv4 }}
                route-import:
                  from-vrf:
                    route-map: FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_MAP
                    enable: on
                    list:
                      default: {}
                {{- end}}
              ipv6-unicast:
                enable: on
                redistribute:
                  connected:
                    enable: on
                route-export:
                  to-evpn:
                    enable: on
                {{- if $vpc.RoutingProfile.HasLeaksFromUnderlayIpv6 }}
                route-import:
                  from-vrf:
                    route-map: FROM_DEFAULT_VRF_TO_{{ $vpc.VrfName }}_MAP_V6
