  {{- range $vpc.PortConfigs}}
    {{- if .HostIP }}
              {{ .HostIP }}:
                passive-mode: on
                peer-group: tenant
                type: numbered
                address-family:
                  ipv4-unicast:
                    policy:
                      inbound:
                        route-map: dpu_from_instance_{{ $vpc.VrfName }}_if_{{ .Index }}
                      outbound:
                        route-map: dpu_to_instance
                  ipv6-unicast:
                    enable: on
                    policy:
                      inbound:
                        route-map: dpu_from_instance_ipv6_{{ $vpc.VrfName }}_if_{{ .Index }}
                      outbound:
                        route-map: dpu_to_instance
    {{- end }}
    {{- if .HostIPv6 }}
              {{ .HostIPv6 }}:
                passive-mode: on
                peer-group: tenant
                type: numbered
                address-family:
                  ipv4-unicast:
                    policy:
                      inbound:
                        route-map: dpu_from_instance_{{ $vpc.VrfName }}_if_{{ .Index }}
                      outbound:
                        route-map: dpu_to_instance
