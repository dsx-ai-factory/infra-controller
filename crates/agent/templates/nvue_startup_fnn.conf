                        route-map: dpu_from_instance_ipv6_{{ $vpc.VrfName }}_if_{{ .Index }}
                      outbound:
                        route-map: dpu_to_instance
    {{- end }}
  {{- end }}
            {{- end }}
            peer-group:
              tenant:
                nexthop-connected-check: off
                {{- if $nvueConfig.Tenant.HasHostASN }}
