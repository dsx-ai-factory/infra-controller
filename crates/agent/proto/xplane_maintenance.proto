syntax = "proto3";

package xplane.maintenance.v1;

import "google/protobuf/empty.proto";

service XplaneMaintenance {
  rpc SetLinkMaintenance(SetLinkMaintenanceRequest) returns (google.protobuf.Empty);
  rpc GetLinkMaintenance(GetLinkMaintenanceRequest) returns (GetLinkMaintenanceResponse);
}

message SetLinkMaintenanceRequest {
  string pf_name = 1;
  optional bool enabled = 2;
}

message GetLinkMaintenanceRequest {
  string pf_name = 1;
}

message GetLinkMaintenanceResponse {
  bool enabled = 1;
}
