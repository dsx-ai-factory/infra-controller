                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      tokenExchangeEndpoint:
                        description: |-
                          tokenExchangeEndpoint exchanges the SPIRE JWT-SVID before the DSX SPIFFE Helper writes it.
                          When omitted, the DSX SPIFFE Helper writes the SPIRE JWT-SVID directly.
                          The returned token's audience must match kubeAPIAudience, or the kube-apiserver rejects the
                          DPU Agent. Only https: the JWT-SVID is sent here as a bearer credential.
                        maxLength: 2048
                        pattern: ^https://[^[:space:]"\\]+$
                        type: string
                      trustBundle:
                        description: trustBundle references a ConfigMap holding the
                          initial SPIRE trust bundle.
                        properties:
                          format:
                            default: pem
                            description: Format selects data["bundle.pem"] or data["bundle.spiffe"]
                              and the matching SPIRE Agent parser.
                            enum:
                            - pem
                            - spiffe
                            type: string
                          name:
                            description: Name is the name of the ConfigMap holding
                              the SPIRE trust bundle.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace is the namespace of the ConfigMap
                              holding the SPIRE trust bundle.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - kubeAPIAudience
                    - spireControllerManagerClassName
                    - spireOIDCURL
                    - spireServerAddress
                    - spireTrustDomain
                    - trustBundle
                    type: object
                    x-kubernetes-validations:
