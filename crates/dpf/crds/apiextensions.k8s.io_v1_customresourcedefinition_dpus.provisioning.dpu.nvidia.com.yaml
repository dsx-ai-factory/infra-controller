apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/component: dpf-operator-controller-manager
  name: dpus.provisioning.dpu.nvidia.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: webhook-service
          namespace: dpf-operator-system
          path: /convert
      conversionReviewVersions:
      - v1
  group: provisioning.dpu.nvidia.com
  names:
    kind: DPU
    listKind: DPUList
    plural: dpus
    singular: dpu
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.operationalConditions[?(@.type=='OperationalReady')].status
      name: Operational
      type: string
    - description: phase of the dpu
      jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DPU is the Schema for the dpus API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DPUSpec defines the desired state of DPU
            properties:
              astraEnabled:
                description: AstraEnabled indicates whether E/W NIC configuration
                  (Astra) is enabled
                type: boolean
              bfb:
                description: Specifies name of the bfb CR to use for this DPU
                maxLength: 253
                minLength: 1
                type: string
              blueFieldSoftware:
                description: Specifies the name of the BlueFieldSoftware CR to use
                  for this DPU
                maxLength: 253
                minLength: 1
                type: string
              bmcIP:
                description: |-
                  BMCIP is the ip address of the DPU BMC

                  Deprecated: Use BMCIP from DPUDevice instead.
                type: string
              cluster:
                description: Specifies details on the K8S cluster to join
                properties:
                  name:
                    description: Name is the name of the DPUs Kubernetes cluster
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self==oldSelf
                  namespace:
                    description: Namespace is the tenants namespace name where the
                      Kubernetes cluster will be deployed
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self==oldSelf
                  nodeAnnotations:
                    additionalProperties:
                      type: string
                    description: NodeAnnotations specifies the annotations to be added
                      to the node.
                    type: object
                  nodeLabels:
                    additionalProperties:
                      type: string
                    description: NodeLabels specifies the labels to be added to the
                      node.
                    type: object
                  selector:
                    description: Selector defines the selector of the DPUClusters
                      the produced DPUs should join
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              dpuDeviceName:
                description: Specifies the name of the DPUDevice this DPU is associated
                  with
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self == oldSelf
              dpuFlavor:
                description: DPUFlavor is the name of the DPUFlavor that will be used
                  to deploy the DPU.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self==oldSelf
              dpuNodeName:
                description: Specifies the DPUNode this DPU belongs to
                type: string
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self == oldSelf
              nodeEffect:
                description: Specifies how changes to the DPU should affect the Node
                properties:
                  applyOnLabelChange:
                    default: false
                    description: |-
                      Apply node effect when labels change on the DPU object
                      When set to true, label changes in Ready state will trigger node effect logic
                    type: boolean
                  customAction:
                    description: |-
                      Name of a config map which contains a pod yaml definition to run which will apply the nodeEffect.
                      The pod is expected to exit when node effect is done, if pod terminates with error then DPU would move to an error phase.
                      The DPUNode's name will be exported as an environment variable, named as DPUNODE_NAME, to each container and init container in the pod.
                      The labels and annotations of DPUNode will be exported in `/etc/dpu/dpf-pod-info/labels` and `/etc/dpu/dpf-pod-info/annotations` accordingly; the volume name `dpf-pod-info` is used to mount the labels and annotations.
                      If any name confliction for env or volume, the controller will not export the name or labels/annotations of DPUNode accordingly.
                    type: string
                  customLabel:
                    additionalProperties:
                      type: string
                    description: Add specify labels on the DPU node
                    type: object
                  drain:
                    description: Drain the K8s host node by NodeMaintenance operator
                    type: boolean
                  force:
                    default: false
                    description: |-
                      Force is the flag to indicate if the node effect should be applied immediately.
                      If true, dpfOperatorConfig.multiDPUOperationsSyncWaitTime and dpfOperatorConfig.maxUnavailableDPUNodes will be ignored when applying node effect for DPUNodeMaintenance CR
                    type: boolean
                  hold:
                    description: |-
                      Places annotation `wait-for-external-nodeeffect` and waits for it to be removed
                      this is the default behavior in a non K8S environment
                    type: boolean
                  noEffect:
                    description: Do not do any action on the DPU node
                    type: boolean
                  nodeMaintenanceAdditionalRequestors:
                    description: Additional requestors to be added to the NvidiaNodeMaintenance
                      CR when Drain is selected
                    items:
                      type: string
                    type: array
                  taint:
                    description: Add specify taint on the DPU node
                    properties:
                      effect:
                        description: |-
                          Required. The effect of the taint on pods
                          that do not tolerate the taint.
                          Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                        type: string
                      key:
                        description: Required. The taint key to be applied to a node.
                        type: string
                      timeAdded:
                        description: TimeAdded represents the time at which the taint
                          was added.
                        format: date-time
                        type: string
                      value:
                        description: The taint value corresponding to the taint key.
                        type: string
                    required:
                    - effect
                    - key
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of taint, noEffect=true, drain=true, non-empty
                    customLabel, non-empty customAction, hold=true must be set
                  rule: '(has(self.taint) ? 1 : 0) + ((has(self.noEffect) && self.noEffect)
                    ? 1 : 0) + ((has(self.customLabel) && size(self.customLabel) >
                    0) ? 1 : 0) + ((has(self.drain) && self.drain) ? 1 : 0) + ((has(self.customAction)
                    && size(self.customAction) > 0) ? 1 : 0) + ((has(self.hold) &&
                    self.hold) ? 1 : 0) == 1'
              pciAddress:
                description: |-
                  The PCI device related DPU
                  Example: "0000-03-00", "03-00"
                pattern: ^([0-9a-fA-F]{4}[-])?[0-9a-fA-F]{2}[-][0-9a-fA-F]{2}$
                type: string
              secureBoot:
                description: SecureBoot specifies whether UEFI Secure Boot should
                  be enabled.
                type: boolean
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self == oldSelf
              serialNumber:
                description: The serial number of the DPU
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self == oldSelf
            required:
            - dpuDeviceName
            - dpuFlavor
            - dpuNodeName
            - nodeEffect
            - serialNumber
            type: object
            x-kubernetes-validations:
            - message: exactly one of bfb or blueFieldSoftware must be set
              rule: has(self.bfb) != has(self.blueFieldSoftware)
          status:
            default:
              phase: Initializing
            description: DPUStatus defines the observed state of DPU
            properties:
              addresses:
                description: The DPU node's IP addresses
                items:
                  description: NodeAddress contains information for the node's address.
                  properties:
                    address:
                      description: The node address.
                      type: string
                    type:
                      description: Node address type, one of Hostname, ExternalIP
                        or InternalIP.
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              agentLastStartupTime:
                description: AgentLastStartupTime is the time when the DPU agent was
                  last started. This is copied from agentStatus.lastStartupTime.
                format: date-time
                type: string
              agentStatus:
                description: AgentStatus contains the information reported from inside
                  the DPU
                properties:
                  clock:
                    description: |-
                      Clock is the DPU clock compared against the host clock, recorded while the DPU agent was
                      acquiring its identity. A DPU whose clock is skewed cannot verify the API server certificate,
                      so it never obtains the identity it would need to report this itself. Set by the host agent,
                      in trusted-host mode only.
                    properties:
                      dpuTime:
                        description: dpuTime is the DPU clock as reported by the DPU
                          agent.
                        format: date-time
                        type: string
                      hostTime:
                        description: |-
                          hostTime is the host clock when that report arrived. The host is the trusted side of the
                          comparison, so a difference is attributed to the DPU.
                        format: date-time
                        type: string
                    required:
                    - dpuTime
                    - hostTime
                    type: object
                  conditions:
                    description: Conditions contains the conditions reported from
                      inside the DPU
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                  hostOSInit:
                    description: |-
                      hostOSInit reports terminal host OS init release status from the DPU agent.
                      Unset while the agent is polling or has not reached ReleaseHostOSInit.
                    properties:
                      skipped:
                        description: skipped indicates release was not required for
                          this DPU.
                        properties:
                          message:
                            description: message is a human-readable explanation.
                            type: string
                          reason:
                            description: reason is a stable machine-readable outcome
                              code.
                            type: string
                        type: object
                      succeeded:
                        description: succeeded indicates host OS init was released
                          or was already cleared.
                        properties:
                          gate:
                            description: gate echoes the effective gate used for release.
                            enum:
                            - DPUServiceCriticalPodsReady
                            - OperationalReady
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of skipped or succeeded must be set
                      rule: '(has(self.skipped) ? 1 : 0) + (has(self.succeeded) ?
                        1 : 0) == 1'
                  initialBootID:
                    description: InitialBootID is the boot ID of the DPU OS during
                      the first boot
                    type: string
                  kubeletVersion:
                    description: KubeletVersion represents the kubelet version running
                      on the DPU.
                    type: string
                  lastObservedPendingNvconfig:
                    description: |-
                      LastObservedPendingNVConfig stores the last pending NVConfig parameters seen
                      during reboot-method discovery on this boot. It is used on the next boot to
                      ignore repeated parameters that remained unchanged across boots.
                    properties:
                      bootID:
                        type: string
                      devices:
                        items:
                          properties:
                            device:
                              type: string
                            entries:
                              items:
                                properties:
                                  current:
                                    type: string
                                  default:
                                    type: string
                                  name:
                                    type: string
                                  next_boot:
                                    description: NextBoot uses the "next_boot" so
                                      this type can be reused for parsing mlxfwrest
                                      output
                                    type: string
                                type: object
                              type: array
                          required:
                          - entries
                          type: object
                        type: array
                    type: object
                  lastStartupTime:
                    description: LastStartupTime is the time when the DPU was last
                      started
                    format: date-time
                    type: string
                  preInstall:
                    description: PreInstall holds agent-reported status for work done
                      before OS install in the reprovisioning process.
                    properties:
                      agentReported:
                        description: AgentReported is set with a timestamp when dpu-agent
                          detects a new DPU CR is created for reprovisioning.
                        format: date-time
                        type: string
                      conditions:
                        description: Conditions contains pre-install conditions (e.g.
                          NVConfigApplied for reprovisioning).
                        items:
                          description: Condition contains details for one aspect of
                            the current state of this API Resource.
                          properties:
                            lastTransitionTime:
                              description: |-
                                lastTransitionTime is the last time the condition transitioned from one status to another.
                                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                              format: date-time
                              type: string
                            message:
                              description: |-
                                message is a human readable message indicating details about the transition.
                                This may be an empty string.
                              maxLength: 32768
                              type: string
                            observedGeneration:
                              description: |-
                                observedGeneration represents the .metadata.generation that the condition was set based upon.
                                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                                with respect to the current state of the instance.
                              format: int64
                              minimum: 0
                              type: integer
                            reason:
                              description: |-
                                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                                Producers of specific condition types may define expected values and meanings for this field,
                                and whether the values are considered a guaranteed API.
                                The value should be a CamelCase string.
                                This field may not be empty.
                              maxLength: 1024
                              minLength: 1
                              pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                              type: string
                            status:
                              description: status of the condition, one of True, False,
                                Unknown.
                              enum:
                              - "True"
                              - "False"
                              - Unknown
                              type: string
                            type:
                              description: type of condition in CamelCase or in foo.example.com/CamelCase.
                              maxLength: 316
                              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                              type: string
                          required:
                          - lastTransitionTime
                          - message
                          - reason
                          - status
                          - type
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - type
                        x-kubernetes-list-type: map
                    type: object
                  rebootMethod:
                    description: |-
                      RebootMethod is the type of reset/reboot set by the DPU agent
                      See enum values in RebootMethodType.
                      No default is set intentionally: nil means "check not run or not applicable"
                      (e.g. legacy flow, or agent has not run the check yet);
                      a non-nil value means the check ran and this is the result.
                    enum:
                    - Unknown
                    - NoAction
                    - PowerCycle
                    - SystemReboot
                    - SystemLevelReset
                    - FirmwareReset
                    - DPUWarmReboot
                    type: string
                  rebootSequenceCount:
                    description: |-
                      RebootSequenceCount is the length of the current non-NoAction RebootMethod sequence:
                      it increments on each agent run that reports a RebootMethod other than NoAction and
                      resets to 0 when the agent reports NoAction. Used with RebootMethod to bound host reboot loops.
                    format: int32
                    minimum: 0
                    type: integer
                  spiffe:
                    description: |-
                      Spiffe contains the SPIFFE heartbeat status reported by the DPU Agent when running in
                      SPIFFE identity mode.
                    properties:
                      lastProbeMessage:
                        description: |-
                          LastProbeMessage is a structured one-line diagnostic for the most recent self-probe. Unset in
                          the steady-state happy path. Bounded to 256 chars (truncated agent-side).
                        maxLength: 256
                        type: string
                      lastProbeTime:
                        description: |-
                          LastProbeTime is the wall-clock timestamp the DPU Agent recorded on its most recent successful
                          status report. It is informational and subject to DPU clock skew, so it is not a precise
                          liveness signal on its own.
                        format: date-time
                        type: string
                    type: object
                  trustBundleHash:
                    description: TrustBundleHash is the bundle-hash value last applied
                      by the DPU agent.
                    type: string
                  trustBundleLastUpdateTime:
                    description: TrustBundleLastUpdateTime is when the trust bundle
                      was last updated by the DPU agent.
                    format: date-time
                    type: string
                type: object
              bfCFGFile:
                description: BFCFGFile is the path to the bf.cfg
                type: string
              bfbFile:
                description: BFBFile is the path to the BFB file
                type: string
              bfbVersion:
                description: bfb version of this DPU
                type: string
              conditions:
                description: Conditions represents the provisioning lifecycle conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deploymentMode:
                allOf:
                - enum:
                  - zero-trust
                  - host-trusted
                - enum:
                  - zero-trust
                  - host-trusted
                description: |-
                  DeploymentMode is copied from DPFOperatorConfig.spec.deploymentMode by the controller.
                  This field is read-only for users.
                type: string
              dpfVersion:
                description: DPF version used to install this DPU
                type: string
                x-kubernetes-validations:
                - message: Value is immutable
                  rule: self==oldSelf
              dpuInstallInterface:
                description: |-
                  the name of the interface which will be used to install the bfb image,
                  and communicate with DPU, can be one of hostAgent,redfish
                enum:
                - gNOI
                - hostAgent
                - redfish
                type: string
              dpuMode:
                allOf:
                - enum:
                  - dpu
                  - zero-trust
                  - nic
                - enum:
                  - dpu
                  - nic
                default: dpu
                description: The mode of the DPU
                type: string
              dpuType:
                default: Unknown
                description: The type of the DPU
                enum:
                - Unknown
                - BlueField2
                - BlueField3
                - BlueField4
                type: string
              firmware:
                description: the firmware information of DPU
                properties:
                  bmc:
                    description: BMC is the used BMC firmware version
                    type: string
                  nic:
                    description: NIC is the used NIC firmware version
                    type: string
                  uefi:
                    description: UEFI is the used UEFI firmware version
                    type: string
                type: object
              hostless:
                description: |-
                  Hostless indicates that the DPU is attached to a system-managed synthetic
                  DPUNode rather than a physical host.
                type: boolean
              identityMode:
                description: |-
                  IdentityMode records which authentication mechanism the DPU Agent uses to reach the
                  management-cluster kube-apiserver. Stamped exactly once by the DPU controller during phase
                  Initializing (nil guard); immutable thereafter. Pre-SPIFFE legacy DPUs have IdentityMode
                  unset (nil) which consumers MUST treat semantically as bootstrap-token.
                enum:
                - spiffe
                - bootstrap-token
                type: string
              observedGeneration:
                description: ObservedGeneration records the Generation observed on
                  the object the last time it was patched.
                format: int64
                type: integer
              operationalConditions:
                description: |-
                  OperationalConditions represents aggregated operational readiness conditions.
                  These conditions reflect the runtime health and readiness of DPU services and node health,
                  separate from the provisioning lifecycle represented by Conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
