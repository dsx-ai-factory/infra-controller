apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: dpf-operator-controller-manager
    dpu.nvidia.com/component: dpf-operator-controller-manager
  name: dpudevices.provisioning.dpu.nvidia.com
spec:
  group: provisioning.dpu.nvidia.com
  names:
    kind: DPUDevice
    listKind: DPUDeviceList
    plural: dpudevices
    singular: dpudevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='ConditionDpuDeviceReady')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DPUDevice is the Schema for the dpudevices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DPUDeviceSpec defines the content of DPUDevice
            properties:
              bmcCredentialSecretName:
                description: |-
                  BMCCredentialSecretName is the name of a Secret in the same namespace containing
                  per-device BMC credentials. The secret must contain a "password" key with the BMC credential value.
                  If specified, this password takes precedence over the shared bmc-shared-password secret.
                type: string
              bmcFactoryResetPolicy:
                default: OnInitialization
                description: |-
                  BMCFactoryResetPolicy controls whether DPF resets this DPU BMC to factory defaults
                  while initializing the DPUDevice. The reset clears all BMC configuration, including
                  network settings, so the BMC must obtain its address via DHCP.
                  - OnInitialization (default): reset the BMC once, while the DPUDevice is initialized.
                  - Never: never reset.
                  The value is honored only until the factory reset step finishes; changing it
                  after BMCFactoryResetReady is True has no effect.
                enum:
                - OnInitialization
                - Never
                type: string
              bmcIp:
                description: |-
                  BMCIP is the IP address of the BMC (Base Management Controller) on the device.
                  This is used for remote management and monitoring of the device.
                  Example: "10.1.2.3"
                format: ipv4
                type: string
              bmcPort:
                default: 443
                description: |-
                  BMCPort is the port number of the BMC (Base Management Controller) on the device.
                  This is used for remote management and monitoring of the device.
                  This value is immutable and should not be changed once set.
                  Example: 443
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: BMCPort is immutable
                  rule: self == oldSelf
              cluster:
                description: Specifies details on the K8S cluster to join
                properties:
                  nodeAnnotations:
                    additionalProperties:
                      type: string
                    description: NodeAnnotations specifies annotations to be added
                      to the DPU cluster node for this device.
                    type: object
                  nodeLabels:
                    additionalProperties:
                      type: string
                    description: NodeLabels specifies labels to be added to the DPU
                      cluster node for this device.
                    type: object
                type: object
              nicDeviceCount:
                description: |-
                  NICDeviceCount is the expected number of NIC devices used by dpu-agent provisioning.
                  Valid range is 1 to 8. When unspecified, it defaults to 8.
                maximum: 8
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: NICDeviceCount is immutable
                  rule: self == oldSelf
              numberOfPFs:
                default: 1
                description: |-
                  NumberOfPFs is the number of PFs on the device.
                  This value is immutable and should not be changed once set.
                  Example: 1
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: Number of PFs is immutable
                  rule: self == oldSelf
              opn:
                description: |-
                  OPN is the Ordering Part Number of the device.
                  It's used to track the device's compatibility with different software versions.
                  This value is immutable and should not be changed once set.
                  Example: "900-9D3B4-00SV-EA0"

                  Deprecated: This field is deprecated and will be removed in a future version. Use status.opn instead.
                type: string
                x-kubernetes-validations:
                - message: OPN is immutable
                  rule: self == oldSelf
              pf0Name:
                description: |-
                  PF0Name is the name of the PF0 on the device.
                  This value is immutable and should not be changed once set.
                  Example: "eth0"

                  Deprecated: This field is deprecated and will be removed in a future version. Use status.pf0Name instead.
                type: string
                x-kubernetes-validations:
                - message: PF0 Name is immutable
                  rule: self == oldSelf
              psid:
                description: |-
                  PSID is the Product Serial ID of the device.
                  It's used to track the device's lifecycle and for inventory management.
                  This value is immutable and should not be changed once set.
                  Example: "MT_0001234567", "MT25066004C7"

                  Deprecated: This field is deprecated and will be removed in a future version. Use status.psid instead.
                type: string
                x-kubernetes-validations:
                - message: PSID is immutable
                  rule: self == oldSelf
              serialNumber:
                description: |-
                  SerialNumber is the serial number of the device.
                  It's used to track the device's lifecycle and for inventory management.
                  This value is immutable and should not be changed once set.
                  Example: "MT_0001234567", "MT25066004C7"
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Serial Number is immutable
                  rule: self == oldSelf
              values:
                description: |-
                  Values contains free-form per-device values used to render a DPUFlavorTemplate
                  into a concrete generated DPUFlavor for this device.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - serialNumber
            type: object
          status:
            properties:
              bmcCredentialSecretName:
                description: BMCCredentialSecretName is the name of the Secret last
                  used successfully for BMC authentication.
                type: string
              bmcFactoryResetRequestTime:
                description: |-
                  BMCFactoryResetRequestTime is when DPF submitted ResetToDefaults to the BMC.
                  It is nil until the request has been accepted, and once set it is never cleared:
                  it is what keeps the BMC from being reset again for this DPUDevice.
                format: date-time
                type: string
              bmcIp:
                description: |-
                  BMCIP is the IP address of the BMC (Base Management Controller) on the device.
                  This is used for remote management and monitoring of the device.
                  This value is discovered and should not be changed once set.
                  Example: "10.1.2.3"
                format: ipv4
                type: string
              bmcPort:
                default: 443
                description: |-
                  BMCPort is the port number of the BMC (Base Management Controller) on the device.
                  This is used for remote management and monitoring of the device.
                  This value is immutable and should not be changed once set.
                  Example: 443
                format: int32
                minimum: 1
                type: integer
              bmcServerCertificate:
                description: BMCServerCertificate reports the BMC mTLS server certificate
                  rotation state.
                properties:
                  lastRotationTime:
                    description: LastRotationTime is the time DPF last successfully
                      rotated the certificate.
                    format: date-time
                    type: string
                  notAfter:
                    description: |-
                      NotAfter is the expiry time of the certificate currently installed. It is taken
                      from the issued certificate at rotation time.
                    format: date-time
                    type: string
                  observedManualTrigger:
                    description: |-
                      ObservedManualTrigger records the value of the manual rotation annotation that
                      was last honored, so the same trigger is not processed twice.
                    type: string
                type: object
              caTrustBundle:
                description: CATrustBundle stores trust bundle reconciliation progress
                  for the DPUDevice.
                properties:
                  lastUpdateTime:
                    description: LastUpdateTime is when the last successful reconciliation
                      completed.
                    format: date-time
                    type: string
                  observedBundleHash:
                    description: ObservedBundleHash records the last successfully
                      applied bundle hash.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dpuMode:
                allOf:
                - enum:
                  - dpu
                  - zero-trust
                  - nic
                - enum:
                  - dpu
                  - nic
                default: dpu
                description: DPUMode is the mode of the DPU.
                type: string
              dpuType:
                default: Unknown
                description: DPUType is the type of the DPU.
                enum:
                - Unknown
                - BlueField2
                - BlueField3
                - BlueField4
                type: string
              opn:
                description: |-
                  OPN is the Ordering Part Number of the device.
                  It's used to track the device's compatibility with different software versions.
                  This value is discovered and should not be changed once set.
                  Example: "900-9D3B4-00SV-EA0"
                type: string
              pciAddress:
                description: |-
                  PCIAddress is the PCI address of the device in the host system.
                  Example: "0000-03-00", "03-00"
                type: string
              pf0Mac:
                description: |-
                  PF0MAC is the MAC address of the PF0 on the device.
                  Example: "00:00:00:00:00:00"
                pattern: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
                type: string
              pf0Name:
                description: |-
                  PF0Name is the name of the PF0 on the device.
                  Example: "eth0"
                type: string
              psid:
                description: |-
                  PSID is the Product Serial ID of the device.
                  It's used to track the device's lifecycle and for inventory management.
                  This value is discovered and should not be changed once set.
                  Example: "MT_0001234567", "MT25066004C7"
                type: string
              secureBoot:
                description: SecureBoot indicates the current UEFI Secure Boot state.
                properties:
                  enabled:
                    description: Enabled indicates whether UEFI Secure Boot is currently
                      enabled on the DPU.
                    type: boolean
                type: object
              serialNumber:
                description: |-
                  SerialNumber is the serial number of the device.
                  It's used to track the device's lifecycle and for inventory management.
                  This value is discovered and should not be changed once set.
                  Example: "MT_0001234567", "MT25066004C7"
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: name length can't be bigger than 63 chars
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
