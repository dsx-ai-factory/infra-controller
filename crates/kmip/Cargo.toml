[package]
name = "carbide-kmip"
version = "0.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Scoped KMIP 1.4 client that wraps and unwraps data encryption keys with a server-held, non-exportable AES key"

[lib]
name = "carbide_kmip"

[features]
# An in-process mock KMIP server for tests in this crate and in dependents.
test-support = ["dep:aes-gcm", "dep:rand", "dep:rcgen"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
kmip-ttlv = { workspace = true }
rand = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { features = ["derive"], workspace = true }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
aes-gcm = { workspace = true }
carbide-test-support = { path = "../test-support" }
hex = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
