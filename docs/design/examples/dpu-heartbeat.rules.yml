groups:
  - name: dpu-heartbeat
    rules:
      - alert: DpuHeartbeatFailures
        expr: carbide_dpu_health_check_failed_count{probe_id="HeartbeatTimeout",probe_target="forge-dpu-agent"} > 0
        for: 5m
