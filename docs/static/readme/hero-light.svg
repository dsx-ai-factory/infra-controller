<text x="254" y="94" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start" >Provider operators</text>
<text x="254" y="126" font-size="17" font-weight="normal" fill="#656d76" text-anchor="start" >sites, hardware, tenants, firmware</text>
<rect x="680" y="56" width="410" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="704" y="94" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start" >Tenants</text>
<text x="704" y="126" font-size="17" font-weight="normal" fill="#656d76" text-anchor="start" >instances, SSH keys, VPC peering</text>
<rect x="1130" y="56" width="410" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="1154" y="94" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start" >Platform control planes</text>
<text x="1154" y="126" font-size="17" font-weight="normal" fill="#656d76" text-anchor="start" >Kubernetes, BMaaS, VMaaS, ISV stacks</text>
