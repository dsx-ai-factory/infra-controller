<text x="1300" y="495" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start" >BlueField DPU</text>
<text x="1260" y="526" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >The enforcement boundary. NICo provisions</text>
<text x="1260" y="550" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >and controls it directly, so tenant isolation</text>
