<text x="1260" y="568" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >The enforcement boundary.</text>
<text x="1260" y="592" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >NICo provisions and controls it</text>
<text x="1260" y="616" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >directly, so tenant isolation never</text>
<text x="1260" y="640" font-size="16" font-weight="normal" fill="#656d76" text-anchor="start" >depends on what runs on the host.</text>
