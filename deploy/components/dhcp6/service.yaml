apiVersion: v1
kind: Service
metadata:
  name: nico-dhcp6
  namespace: nico-system
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv6]
  selector:
    app.kubernetes.io/name: nico-dhcp6
    app.kubernetes.io/component: dhcp
  ports:
    - name: dhcp6
      port: 547
      targetPort: dhcp6
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: nico-dhcp6-metrics
  namespace: nico-system
  labels:
    app.kubernetes.io/metrics: nico-dhcp
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: nico-dhcp6
    app.kubernetes.io/component: dhcp
  ports:
    - name: http
      port: 1089
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nico-dhcp6-external
  namespace: nico-system
  annotations:
    metallb.universe.tf/loadBalancerIPs: "{{ NICO_DHCPV6_EXTERNAL_IP }}"
spec:
  type: LoadBalancer
  # Preserve relay source addresses and ports for Kea's UDP 547 replies.
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv6]
  selector:
    app.kubernetes.io/name: nico-dhcp6
    app.kubernetes.io/component: dhcp
  ports:
    - name: dhcp6
      port: 547
      targetPort: dhcp6
      protocol: UDP
