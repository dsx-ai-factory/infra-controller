{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [
        "eth0/__NICO_DHCPV6_ADDRESS__"
      ]
    },
    "server-id": {
      "type": "LL",
      "htype": 1,
      "identifier": "{{ NICO_DHCPV6_SERVER_IDENTIFIER }}",
      "persist": false
    },
    "lease-database": {
      "type": "memfile",
      "name": "/var/lib/kea/kea-leases6.csv",
      "lfc-interval": 3600
    },
    "preferred-lifetime": 3600,
    "valid-lifetime": 7200,
    "renew-timer": 1800,
    "rebind-timer": 2880,
    "decline-probation-period": 900,
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp.so",
        "parameters": {
          "carbide-api-url": "https://nico-api.nico-system.svc.cluster.local:1079",
          "carbide-metrics-endpoint": "[::]:1089",
          "hook-dns-servers-ipv6": "",
          "hook-ntp-servers-ipv6": "",
          "hook-provisioning-server-ipv6": "",
          "hook-rapid-commit-v6": false
        }
      }
    ],
    "subnet6": [
      {
        "subnet": "::/0",
        "rapid-commit": true,
        "pools": [
          {
            "pool": "::1-ffff:ffff:ffff:ffff:ffff:ffff:ffff:fffe"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "severity": "INFO",
        "output_options": [
          {
            "output": "stdout"
          }
        ]
      }
    ]
  }
}
