dhcp_servers = ["NICO_DHCP_EXTERNAL_IP"]
# route_servers = [
#   "FRR_ROUTING_0_EXTERNAL_IP",
#   "FRR_ROUTING_1_EXTERNAL_IP",
#   "FRR_ROUTING_2_EXTERNAL_IP"
# ]
enable_route_servers = true
initial_domain_name = "ENVIORNMENT_NAME.example.com"
sitename = "ENVIORNMENT_NAME"
attestation_enabled = false
bypass_rbac = true
max_concurrent_machine_updates = 20

# List all tenant overlays here
site_fabric_prefixes = ["SITE_FABRIC_PREFIX_1"]

# FNN null routes inherit site_fabric_prefixes when this is omitted; removed
# operator roots remain covered while they contain VpcPrefixes or VPC-attached
# direct NetworkPrefixes, and inherited roots are collapsed. Explicit lists
# preserve distinct prefix boundaries; set an explicit empty list to install no
# site-fabric null routes. Do not combine a /0 null route with same-family
# default-route leakage.
# site_fabric_null_routes = []

# Site infrastructure prefixes instances are not allowed to talk to.
# These should include admin pool, site controller nodes IPMI pools and managed hosts IPMI pools
deny_prefixes = [
  "ADMIN_NETWORK_IP_POOL",
  "CONTROL_PLANE_IPMI_POOL_1", # control plane IPMI
  # add CONTROL_PLANE_IPMI_POOL_2 and more as needed, one in each line terminated by ','
  "MANAGED_HOST_IPMI_POOL_1",
  # add MANAGED_HOST_IPMI_POOL_2 and more as needed, one in each line terminated by ','
]

# External tool links shown in the admin web UI's "Tools" sidebar.
# Each entry needs a unique `name` (used as a stable id) plus a
# `display_name` and `url`. Omit the section entirely to hide it.
# [[web_ui_sidebar_tools]]
# name = "grafana"
# display_name = "Grafana"
# url = "https://grafana-ENVIORNMENT_NAME.example.com"
#
# [[web_ui_sidebar_tools]]
# name = "argocd"
# display_name = "Argo CD"
# url = "https://argocd-ENVIORNMENT_NAME.example.com"

# URL template for the "Logs" link on machine and endpoint detail pages.
# The placeholder {search} is replaced with the machine ID or BMC IP.
# Omit or leave empty to hide the Logs link.
#
# Example for Grafana Loki:
# web_ui_logs_link_template = "https://grafana.example.com/explore?panes={\"a\":{\"datasource\":\"loki\",\"queries\":[{\"expr\":\"{k8s_container_name=\\\"nico-api\\\"} |= `{search}`\",\"queryType\":\"range\"}],\"range\":{\"from\":\"now-6h\",\"to\":\"now\"}}}&schemaVersion=1&orgId=1"
#
# Example for VictoriaLogs:
# web_ui_logs_link_template = "https://victorialogs.example.com/select/logsql/query?query={_container_name=\"nico-api\"} AND {search}&time=6h"

[site_explorer]
run_interval = "30s"

[machine_validation_config]
enabled = true

[bom_validation]
enabled = true
ignore_unassigned_machines = true

[pools.lo-ip]
type = "ipv4"
ranges = [{ start = "DPU_LOOPBACK_START_IP", end = "DPU_LOOPBACK_END_IP " }]

[pools.vlan-id]
type = "integer"
ranges = [{ start = "100", end = "501" }]

[pools.vni]
type = "integer"
ranges = [{ start = "1024500", end = "1024800" }]

[pools.vpc-vni]
type = "integer"
ranges = [{ start = "0", end = "100" }]


[networks.admin]
type = "admin"
prefix = "ADMIN_NETWORK_IP_POOL"
gateway = "ADMIN_NETWORK_GATEWAY_IP"
mtu = 9000
reserve_first = 5

# Add one network section for each of the managed host IPMI pools
# No restrictions on network names; but they must be unique
[networks.MANAGED_HOST_IPMI_NETWORK_1]
type = "underlay"
prefix = "MANAGED_HOST_IPMI_POOL_1"
gateway = "MANAGED_HOST_IPMI_POOL_1_GATEWAY_IP"
mtu = 1500
reserve_first = 2

# Add metworks.MANAGED_HOST_IPMI_NETWORK_2 and more as needed. All managed host IPMI networks must be added
