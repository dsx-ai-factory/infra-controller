### DPF contract ###
# Filled by the DPUService controller from the DPUService spec: placement
# (nodeSelector), pod labels and annotations (including the Multus annotation
# that attaches the slot interface), update strategy and resources. The chart
# renders no placement and no resource requests or limits of its own: with
# nodeSelector unset the DaemonSet has no affinity, and with resources empty
# the container has none.
serviceDaemonSet:
  nodeSelector:
  labels: {}
  annotations: {}
  updateStrategy: {}
  resources: {}

### Values nico-api renders once per resolver registration ###
# nico-api owns unboundConfig, dnsDir, zoneName, the resolver addresses and
# the image. It renders them into the registration's chart values, identical
# on every DPU of that registration; only dnsDir, zoneName and the
# unboundConfig derived from them differ between VPCs. The DPU agent owns what lives under dnsDir: it creates
# the directories, writes the zonefile and reloads Unbound over the control
# socket. The pod holds no NICo credential and never talks to nico-api.
# Nothing below is per site or per DPU and an operator does not edit these
# values directly.

# Complete native Unbound configuration, mounted read-only at
# /etc/unbound/unbound.conf. Required and nonblank. It names the zonefile as
# <dnsDir>/zone/zonefile and the control socket as <dnsDir>/run/control.sock,
# the paths this chart mounts. A change alters the pod template, so the pods
# restart and clear their caches when the DaemonSet's update strategy replaces
# them: at once under RollingUpdate, the Kubernetes default, and on the next
# deletion of each pod under OnDelete. The container runs as UID 0 with no
# chroot and a read-only root filesystem, so the configuration sets username
# and chroot to "", names a directory that exists in the image (it need not be
# writable), and names no file Unbound writes: the control socket in
# <dnsDir>/run is its only write.
unboundConfig: ""

# The VPC's directory on the DPU, /opt/forge/dns/<vpc-id>. Required and an
# absolute path. The agent creates <dnsDir>/run, where Unbound creates
# control.sock, and <dnsDir>/zone, where it writes the zonefile (empty until
# the VPC holds a zone), before the pod can start. Both are mounted as
# existing host directories, so the pod stays in ContainerCreating until the
# agent has created them.
dnsDir: ""

# Name of the VPC's private zone, when it holds one. Optional: unset, the
# resolver recurses only and the chart renders neither the zone mount nor the
# wait-for-zone init container. The zone itself is configured in
# unboundConfig; the chart uses the name only as the switch.
zoneName: ""

# Name of the slot interface inside the pod. The extension-service controller
# fixes this name (SERVICE_VPC_INTERFACE_NAME) for every slot attachment, so
# it is a chart default and nico-api never renders it.
interfaceName: svc0

# The fixed resolver addresses the pod holds on the slot interface, with the
# prefix that makes HBN's end of each pair on-link, and that end as the
# gateway of the pod's return route. All four are required and rendered by
# nico-api, in the spelling the kernel prints (lowercase, shortest IPv6 form)
# because nic-init compares them with ip's output. nic-init adds the
# addresses and a source-rule default route per family (table 100) before
# Unbound starts, so replies to tenant prefixes leave through HBN instead of
# the pod's cluster default route.
resolver:
  ipv4:
    address: ""
    gateway: ""
  ipv6:
    address: ""
    gateway: ""

# Unbound image. The repository is required.
image:
  repository: ""
  pullPolicy: IfNotPresent
  # Empty uses the chart appVersion.
  tag: ""

imagePullSecrets: []

# Container security. unbound binds port 53 and needs nothing else; it runs as
# UID 0 like nico-fmds so it can create the control socket in the agent's
# root-owned run directory. The nic-init init container holds NET_ADMIN
# instead, so Unbound never does.
securityContext:
  runAsUser: 0
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
