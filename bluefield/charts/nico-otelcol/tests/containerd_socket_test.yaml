suite: containerd socket mount for punt_stats crictl exec
templates:
  - daemonset.yaml
tests:
  - it: should mount the default containerd socket into otelcol-contrib
    template: daemonset.yaml
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: containerd-socket
            mountPath: /run/containerd/containerd.sock
      - contains:
          path: spec.template.spec.volumes
          content:
            name: containerd-socket
            hostPath:
              path: /run/containerd/containerd.sock
              type: Socket

  - it: should point crictl at the default containerd socket via CONTAINER_RUNTIME_ENDPOINT
    template: daemonset.yaml
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTAINER_RUNTIME_ENDPOINT
            value: unix:///run/containerd/containerd.sock

  - it: should honor a custom containerd socket path
    template: daemonset.yaml
    set:
      image:
        repository: test
        tag: test
      containerdSocket: /var/run/custom-containerd.sock
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: containerd-socket
            mountPath: /var/run/custom-containerd.sock
      - contains:
          path: spec.template.spec.volumes
          content:
            name: containerd-socket
            hostPath:
              path: /var/run/custom-containerd.sock
              type: Socket
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONTAINER_RUNTIME_ENDPOINT
            value: unix:///var/run/custom-containerd.sock
