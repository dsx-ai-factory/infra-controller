suite: cert directory overrides
templates:
  - daemonset.yaml
tests:
  - it: should mount certs at /opt/forge in init container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should mount certs at /opt/forge in main container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should hostPath-mount /opt/forge by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/forge
              type: DirectoryOrCreate

  - it: should fall back to /opt/forge when certsDir is cleared
    set:
      image:
        repository: test
        tag: test
      certsDir: null
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/forge
              type: DirectoryOrCreate

  - it: should accept a custom certsDir value
    set:
      image:
        repository: test
        tag: test
      certsDir: /custom/cert/dir
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /custom/cert/dir
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /custom/cert/dir
              type: DirectoryOrCreate

  - it: should run the LLDP snapshot sidecar with read-only host runtime access
    set:
      image:
        repository: test
        tag: test
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: nico-lldp-sidecar
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
      - equal:
          path: spec.template.spec.containers[1].args[0]
          value: sidecar-mode
      - notExists:
          path: spec.template.spec.containers[1].command
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: hw-cache
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-run
            mountPath: /run
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-usr-sbin
            mountPath: /usr/sbin
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-lib
            mountPath: /lib
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: sys
            mountPath: /host-sys
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-run
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-run
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-usr-sbin
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-usr-sbin
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-lib
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-lib
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sys
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENT_PLATFORM_TYPE
            value: containerized

  - it: should hostPath-mount the host runtime directory read-only in the sidecar
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-run
            hostPath:
              path: /run
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-usr-sbin
            hostPath:
              path: /usr/sbin
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-lib
            hostPath:
              path: /lib
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sys
            hostPath:
              path: /sys
