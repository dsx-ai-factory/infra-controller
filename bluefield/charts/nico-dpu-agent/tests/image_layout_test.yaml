suite: cert directory overrides
templates:
  - daemonset.yaml
tests:
  - it: should mount certs at /opt/forge in init container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should mount certs at /opt/forge in main container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should hostPath-mount /opt/forge by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/forge
              type: DirectoryOrCreate

  - it: should fall back to /opt/forge when certsDir is cleared
    set:
      image:
        repository: test
        tag: test
      certsDir: null
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/forge
              type: DirectoryOrCreate

  # Preserve custom certificate mounts when a shared prefix is outside the reserved sysfs subtree.
  - it: accepts a custom certificate directory with a disjoint sysfs prefix
    set:
      image:
        repository: test
        tag: test
      certsDir: /host-sys-certs # Share the name prefix without entering /host-sys/.
    # Preserve the requested host and container paths after validation accepts the value.
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /host-sys-certs
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /host-sys-certs
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /host-sys-certs
              type: DirectoryOrCreate

  # Preserve a trailing space so an accepted certificate path cannot decode as the reserved sysfs mount.
  - it: preserves a trailing space in certificate mount paths
    # Select legacy mode because mounted mode requires the exact default certificate directory.
    set:
      image:
        repository: test
        tag: test
      certsDir: "/host-sys " # Keep this literal distinct from /host-sys.
      bootstrapCa:
        source: legacy_download
    # Compare decoded YAML values so unquoted interpolation cannot silently discard the space.
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: "/host-sys "
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: "/host-sys "
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: "/host-sys "
              type: DirectoryOrCreate

  # Reject the reserved sysfs path before rendering duplicate mounts in the agent container.
  - it: rejects a certificate directory that overlaps the agent's host sysfs mount
    set:
      certsDir: /host-sys
      bootstrapCa:
        source: legacy_download
    asserts:
      - failedTemplate:
          errorMessage: certsDir=/host-sys conflicts with the agent's host sysfs mount

  # Reject a child certificate directory to keep its mount outside the live sysfs subtree.
  - it: rejects a certificate directory under the host sysfs mount
    # Select legacy download because mounted mode already requires /opt/forge.
    set:
      certsDir: /host-sys/class/net
      bootstrapCa:
        source: legacy_download
    # Report the supplied path before overlapping mount destinations can be emitted.
    asserts:
      - failedTemplate:
          errorMessage: certsDir=/host-sys/class/net conflicts with the agent's host sysfs mount

  # Reject lexical aliases of the reserved root so dot components cannot bypass validation.
  - it: rejects a certificate directory that normalizes to the host sysfs mount
    # Use a leading dot component that does not match the uncleaned /host-sys prefix.
    set:
      certsDir: /./host-sys/
      bootstrapCa:
        source: legacy_download
    # Keep the original spelling in the diagnostic while comparing the cleaned path.
    asserts:
      - failedTemplate:
          errorMessage: certsDir=/./host-sys/ conflicts with the agent's host sysfs mount

  - it: should run the LLDP snapshot sidecar with read-only host runtime access
    set:
      image:
        repository: test
        tag: test
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: nico-lldp-sidecar
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
      - equal:
          path: spec.template.spec.containers[1].args[0]
          value: sidecar-mode
      - notExists:
          path: spec.template.spec.containers[1].command
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: hw-cache
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-run
            mountPath: /run
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-usr-sbin
            mountPath: /usr/sbin
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: host-lib
            mountPath: /lib
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: sys
            mountPath: /host-sys
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-run
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-run
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-usr-sbin
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-usr-sbin
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-lib
          any: true
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-lib
          any: true
      # Live PF acquisition uses host sysfs without replacing the pod's own sysfs.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sys
            mountPath: /host-sys
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /sys
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENT_PLATFORM_TYPE
            value: containerized

  - it: should hostPath-mount the host runtime directory read-only in the sidecar
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-run
            hostPath:
              path: /run
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-usr-sbin
            hostPath:
              path: /usr/sbin
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-lib
            hostPath:
              path: /lib
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sys
            hostPath:
              path: /sys
