{{- $supplementalCmName := default "" (get (default (dict) .Values.supplementalNetworkConfig) "name") -}}
{{- $prometheusDisabled := eq (toString .Values.prometheusEnabled) "false" -}}
{{- $fmdsNetworkingConfigured := ne .Values.fmds.networkingAddresses nil -}}
{{- if or .Values.fmds.sign_proxy_url $supplementalCmName .Values.metricsPort $prometheusDisabled $fmdsNetworkingConfigured }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nico-dpu-agent.fullname" . }}-config
  labels:
    {{- include "nico-dpu-agent.labels" . | nindent 4 }}
data:
  config.toml: |
    {{- if $fmdsNetworkingConfigured }}
    [fmds-armos-networking.config]
    addresses = {{ .Values.fmds.networkingAddresses | toJson }}
    {{- end }}
    {{- with .Values.fmds.sign_proxy_url }}
    [machine-identity]
    sign-proxy-url = {{ . | quote }}
    {{- end }}
    {{- if $supplementalCmName }}
    [network]
    supplemental-config-path = "/etc/forge/supplemental-network-config/supplemental.json"
    {{- end }}
    {{- if or .Values.metricsPort $prometheusDisabled }}
    [telemetry]
    {{- with .Values.metricsPort }}
    metrics-address = "0.0.0.0:{{ . }}"
    {{- end }}
    {{- if $prometheusDisabled }}
    prometheus-enabled = false
    {{- end }}
    {{- end }}
{{- end }}
