### DPF contract ###
serviceDaemonSet:
  enabled: true
  nodeSelector:
  labels: {}
  annotations: {}
  updateStrategy: {}
  resources: {}
exposedPorts:
  labels: {}
  ports: {}

## The shared raw NAD and its node-local DHCP CNI daemon are opt-in.
serviceVpcNetworks:
  ipv4:
    enabled: false
    name: nico-service-vpc-ipv4
    mtu: 9000

### Service specific values ###
## OTLP/gRPC collector endpoint. Empty leaves span export off.
otlpEndpoint: ""

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []
podSecurityContext: {}
securityContext:
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
tolerations: []
