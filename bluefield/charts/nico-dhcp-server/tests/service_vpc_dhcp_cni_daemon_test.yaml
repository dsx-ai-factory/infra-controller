suite: IPv4 service-VPC DHCP CNI daemon
templates:
  - service-vpc-dhcp-cni-daemon.yaml
tests:
  # The enabled network must publish the DPF-installed DHCP binary's standard socket on the host.
  - it: renders the qualified node-local DHCP CNI runtime
    release:
      name: dhcp-owner
      namespace: dpf-operator-system
    set:
      image.repository: registry.example.test/nico-dhcp-server
      image.tag: test
      serviceVpcNetworks.ipv4.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: dhcp-owner-dhcp-cni
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: nico-dhcp-server-dhcp-cni
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: nico-dhcp-server-dhcp-cni
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.test/nico-dhcp-server:test
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /opt/cni/bin/dhcp
            - daemon
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            privileged: true
            runAsUser: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: dhcp-cni-bin-dir
              mountPath: /opt/cni/bin
              readOnly: true
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: Bidirectional
            - name: dhcp-daemon-socket-dir
              mountPath: /run/cni
              mountPropagation: Bidirectional
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: dhcp-cni-bin-dir
              hostPath:
                path: /opt/cni/bin
                type: Directory
            - name: netns
              hostPath:
                path: /var/run/netns
                type: DirectoryOrCreate
            - name: dhcp-daemon-socket-dir
              hostPath:
                path: /run/vpc/cni
                type: DirectoryOrCreate

  # Nondefault operational settings must reach the daemon without replacing its fixed identity.
  - it: preserves daemon customization and protected selector labels
    release:
      name: customized-owner
      namespace: dpf-operator-system
    set:
      image.repository: registry.example.test/nico-dhcp-server
      image.tag: test
      imagePullSecrets:
        - name: registry-key
      tolerations:
        - key: dedicated
          operator: Equal
          value: dpu
          effect: NoSchedule
      serviceVpcNetworks.ipv4.enabled: true
      serviceDaemonSet:
        annotations:
          example.com/trace: enabled
        labels:
          example.com/role: platform
          app.kubernetes.io/name: overridden-name
          app.kubernetes.io/instance: overridden-instance
          app.kubernetes.io/component: overridden-component
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: dpu.nvidia.com/type
                  operator: In
                  values:
                    - bluefield
        resources:
          cpu: 100m
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
    asserts:
      - equal:
          path: metadata.annotations["example.com/trace"]
          value: enabled
      - equal:
          path: spec.template.metadata.annotations["example.com/trace"]
          value: enabled
      - equal:
          path: metadata.labels["example.com/role"]
          value: platform
      - equal:
          path: spec.template.metadata.labels["example.com/role"]
          value: platform
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: nico-dhcp-server
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: customized-owner
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: dhcp-cni-daemon
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: nico-dhcp-server-dhcp-cni
            app.kubernetes.io/instance: customized-owner
            app.kubernetes.io/component: dhcp-cni-daemon
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: nico-dhcp-server-dhcp-cni
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: customized-owner
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: dhcp-cni-daemon
      - equal:
          path: spec.updateStrategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-key
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: dpu
              effect: NoSchedule
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - key: dpu.nvidia.com/type
                  operator: In
                  values:
                    - bluefield
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 100m
            requests:
              cpu: 100m
