# nico-rest-api configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nico-rest-api-config
  labels:
    app: nico-rest-api
data:
  config.yaml: |
    env:
      dev: true
      disconnected: true

    api:
      name: nico
      route:
        version: v2

    log:
      level: debug
      sentry:
        dsn: ""

    db:
      host: postgres.postgres
      port: 5432
      name: nico
      user: nico
      password: nico

    temporal:
      host: temporal-frontend.temporal
      port: 7233
      serverName: server.temporal.local
      namespace: cloud
      queue: cloud
      tls:
        enabled: true
        certPath: /var/secrets/temporal/certs/tls.crt
        keyPath: /var/secrets/temporal/certs/tls.key
        caPath: /var/secrets/temporal/certs/ca.crt
        disableHostVerification: false
      encryptionKeyPath: /var/secrets/temporal/encryption-key

    siteManager:
      enabled: true
      svcEndpoint: "https://nico-rest-site-manager:8100/v1/site"

    metrics:
      enabled: true
      port: 9360

    tracing:
      enabled: false
      serviceName: nico-rest-api

    # Deployment-wide auth policy.
    #
    # issuerReloadInterval is how often every replica rebuilds DB-sourced issuers
    # into the live registry (default 30s). jwksRefreshInterval is how often each
    # replica re-fetches signing keys for those issuers (default 15m).
    # resolveFlightTimeout is the ceiling for one on-demand issuer lookup when a
    # token names an issuer this replica has not reloaded yet (default 30s).
    # All three are Go duration strings.
    # allowInternalIssuerHosts lets API-managed issuers name loopback, private,
    # link-local, or in-cluster hosts; the URL and the resolved address at fetch
    # time are both checked. Keep false outside local development: the JWKS
    # refresh loop fetches those URLs from inside the cluster. ConfigMap issuers
    # are never restricted.
    auth:
      issuerReloadInterval: 30s
      jwksRefreshInterval: 15m
      resolveFlightTimeout: 30s
      allowInternalIssuerHosts: false

    # Keycloak is this base's auth source. The other two modes — static
    # ConfigMap issuers, and DB-backed issuers managed through the
    # /nico/auth-issuer API — are described in deploy/INSTALLATION.md and both
    # require keycloak.enabled=false. Any issuer configured here must use HTTPS
    # JWKS endpoints the API can verify.
    keycloak:
      enabled: true
      baseURL: http://keycloak:8082
      externalBaseURL: http://localhost:8082
      realm: nico-dev
      clientID: nico-api
      clientSecretPath: /var/secrets/keycloak/client-secret
      serviceAccount: true

    rateLimiter:
      enabled: false
      rate: 10.0
      burst: 30
      expiresIn: 180
