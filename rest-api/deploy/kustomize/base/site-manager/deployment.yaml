# carbide-rest-site-manager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbide-rest-site-manager
  labels:
    app: carbide-rest-site-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbide-rest-site-manager
  template:
    metadata:
      labels:
        app: carbide-rest-site-manager
    spec:
      imagePullSecrets:
        - name: image-pull-secret
      serviceAccountName: carbide-rest-site-manager
      # 1000 is the `nvs` user the image declares. The image names it rather
      # than giving a UID, which the kubelet cannot verify, so runAsNonRoot
      # needs the number spelled out here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: site-manager
          image: carbide-rest-site-manager
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --listen-port=8100
            - --creds-manager-url=https://nico-rest-cert-manager.$(POD_NAMESPACE):8000
            - --tls-cert-path=/etc/tls/tls.crt
            - --tls-key-path=/etc/tls/tls.key
            - --namespace=$(POD_NAMESPACE)
            - --debug
          ports:
            - containerPort: 8100
              name: https
          volumeMounts:
            - name: creds-manager-token
              mountPath: /var/run/secrets/nico-rest-cert-manager
              readOnly: true
            - name: creds-manager-ca
              mountPath: /etc/pki/creds-manager
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: creds-manager-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: nico-rest-cert-manager
                  expirationSeconds: 3600
        - name: creds-manager-ca
          secret:
            secretName: ca-signing-secret
            items:
              - key: tls.crt
                path: ca.crt
        - name: tls-certs
          secret:
            secretName: site-manager-tls
        # sitemgr skips its own cert issuance while --tls-cert-path and
        # --tls-key-path are set. Dropping either flag sends it back to writing
        # /tmp/mgr.cert, so keep this writable alongside the read-only root
        # filesystem.
        - name: tmp
          emptyDir: {}
