apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-manager-client-tls
spec:
  secretName: site-manager-client-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
  # Keep this URI aligned with CERT_AUTH_ALLOWED_IDENTITIES when changing namespace.
  uris:
    - spiffe://nico.local/nico-rest/sa/nico-rest-site-manager
  issuerRef:
    name: nico-rest-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
