# Certificate for site-manager TLS, managed by cert-manager.io
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-manager-tls
spec:
  # Secret where cert-manager will store the certificate
  secretName: site-manager-tls

  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - Nvidia
  commonName: nico-rest-site-manager
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  # The API, workflow, and Site Agent configs dial the short name, but any of
  # these forms is a valid way to reach the Service, so all of them need to be
  # SANs here. These assume the nico-rest namespace the overlays deploy into;
  # change them alongside it.
  dnsNames:
    - nico-rest-site-manager
    - nico-rest-site-manager.nico-rest
    - nico-rest-site-manager.nico-rest.svc
    - nico-rest-site-manager.nico-rest.svc.cluster.local
    - localhost
  issuerRef:
    name: nico-rest-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
