syntax = "proto3";

package machine_discovery;

option go_package = "github.com/NVIDIA/infra-controller/rest-api/proto/core";

// Carries information about a host that was discovered by the NICo system
message DiscoveryInfo {
  // Enumerates discovered network interfaces on the host
  repeated NetworkInterface network_interfaces = 1;

  // Replaced with option 16: cpu_info, an aggregation of cpus per model
  reserved 2;

  // Enumerates discovered block devices on the host
  repeated BlockDevice block_devices = 3;

  // Deprecated. Prefer machine_arch.
  string machine_type = 4;

  // Enumerates NVMe devices on the host
  repeated NvmeDevice nvme_devices = 5;

  // Replaced with option 8: A single field with DmiData
  // // Enumerates dmi devices on the host
  // repeated DmiDevice dmi_devices = 6;
  reserved 6;

  // The machines TPM Endorsement Key certificate in base64 format
  // An absent values means the endorsement key could not be read
  optional string tpm_ek_certificate = 7;

  // Values that are provided by DMI (Desktop Management Interface)
  DmiData dmi_data = 8;

  // Enumerates discovered infiniband interfaces on the host
  repeated InfinibandInterface infiniband_interfaces = 9;

  // DPU specific data
  optional DpuData dpu_info = 10;

  // Enumerates GPU devices on the host
  repeated Gpu gpus = 11;

  // Deprecated: legacy flat list, one entry per physical DIMM. Writers must
  // emit only memory_device_groups (field 17) and leave this field empty.
  // Readers must still accept this field: when memory_device_groups has no
  // group with count > 0 (including when it is empty), readers fall back to
  // condensing this field (see memory_device_groups for condensation
  // rules). Otherwise this field is ignored.
  repeated MemoryDevice memory_devices = 12 [deprecated = true];

  // output of dmidecode -t 43 (TPM description)
  optional TpmDescription tpm_description = 13;

  optional CpuArchitecture machine_arch = 14;

  AttestKeyInfo attest_key_info = 15;

  // CPU info on the host per model (even though only one model is expected)
  repeated CpuInfo cpu_info = 16;

  // Condensed memory devices: consecutive runs of identical DIMMs (same
  // size_mb and mem_type) rolled up into a single group with a count. This
  // is the preferred field for new writes; readers use it exclusively
  // whenever it contains at least one group with count > 0 (see
  // memory_devices, field 12, for the legacy fallback). Only adjacent
  // identical devices are merged, so groups preserve the original discovery
  // order and the same (size_mb, mem_type) pair may appear in more than one
  // non-adjacent group. The sum of `count` across all groups is bounded
  // (implementations should reject payloads whose total exceeds a fixed
  // maximum, set far beyond any real DIMM slot count, to avoid unbounded
  // allocation when a group is expanded back into individual devices; see
  // MAX_MEMORY_DEVICE_COUNT in crates/api-model/src/hardware_info.rs for the
  // current value). Groups with count == 0 carry no information and are
  // dropped by readers rather than treated as an error.
  repeated MemoryDeviceGroup memory_device_groups = 17;
}

// protolint:disable FIELD_NAMES_LOWER_SNAKE_CASE
message AttestKeyInfo{
  // Endorsement Public Key
  bytes EKPub = 1;
  // Attestation Public Key
  bytes AKPub = 2;
  // Attestation Key Name
  bytes AKName = 3;
}
// protolint:enable FIELD_NAMES_LOWER_SNAKE_CASE

message TpmDescription {
  string vendor = 1;
  string firmware_version = 2;
  string tpm_spec = 3;
}

message NetworkInterface {
  string mac_address = 1;
  PciDeviceProperties pci_properties = 2;
}

message InfinibandInterface {
  PciDeviceProperties pci_properties = 1;

  string guid = 2;
}

message Cpu {
  string vendor = 1;
  string model = 2;
  string frequency = 3;
  uint32 number = 4;
  uint32 core = 5;
  int32 node = 6;
  uint32 socket = 7;
}

message CpuInfo {
  string model = 1;
  string vendor = 2;
  uint32 sockets = 3;
  uint32 cores = 4;
  uint32 threads = 5;
}

message BlockDevice {
  string model = 1;
  string revision = 2;
  string serial = 3;
  string device_type = 4;
}

message NvmeDevice {
  string model = 1;
  string firmware_rev = 2;
  string serial = 3;
  optional uint32 size_mb = 4;
  optional string pci_path = 5;
}

message DmiData {
  string board_name = 1;
  string board_version = 2;
  string bios_version = 3;
  string product_serial = 4;
  string board_serial = 5;
  string chassis_serial = 6;
  string bios_date = 7;
  string product_name = 8;
  string sys_vendor = 9;
}

message PciDeviceProperties{
  string vendor = 1;
  string device = 2;
  string path = 3;
  sint32 numa_node = 4;
  optional string description = 5;
  optional string slot = 6;
}

message LldpSwitchData {
  string name = 1;
  // Deprecated: chassis id rendered as "<id_type>=<id_value>". Use id_type/id_value.
  string id = 2 [deprecated = true];
  string description = 3;
  string local_port = 4;
  repeated string ip_address = 5;
  // Deprecated: remote port rendered as "<remote_port_type>=<remote_port_value>".
  // Use remote_port_type/remote_port_value.
  string remote_port = 6 [deprecated = true];
  // Chassis id split into its LLDP subtype (e.g. "mac", "local") and value.
  string id_type = 7;
  string id_value = 8;
  // Remote port id split into its LLDP subtype (e.g. "ifname") and value.
  string remote_port_type = 9;
  string remote_port_value = 10;
  // LLDP-MED inventory, present only when the neighbor advertises it.
  optional LldpMedInventory med_inventory = 11;
}

// LLDP-MED inventory advertised by some neighbors (e.g. BlueField DPUs).
// Every field is optional.
message LldpMedInventory {
  optional string serial = 1;
  optional string manufacturer = 2;
  optional string model = 3;
}

message DpuData {
  string part_number = 1;
  string part_description = 2;
  string product_version = 3;
  string factory_mac_address = 4;
  string firmware_version = 5;
  string firmware_date = 6;
  repeated LldpSwitchData switches = 7;
}

message GpuPlatformInfo {
  string chassis_serial = 1;
  uint32 slot_number = 2;
  uint32 tray_index = 3;
  uint32 host_id = 4;
  uint32 module_id = 5;
  string fabric_guid = 6;
}

message Gpu {
  string name = 1;
  string serial = 2;
  string driver_version = 3;
  string vbios_version = 4;
  string inforom_version = 5;
  string total_memory = 6;
  string frequency = 7;
  string pci_bus_id = 8;
  GpuPlatformInfo platform_info = 9;
}

// A single physical memory device (DIMM). Deprecated in favor of
// MemoryDeviceGroup; see DiscoveryInfo.memory_devices (field 12).
message MemoryDevice {
  // Capacity in MiB. Absent when the size could not be determined.
  optional uint32 size_mb  = 1;
  // Memory type, e.g. "DDR4", "DDR5". Absent when the type could not be
  // determined.
  optional string mem_type = 2;
}

// A run of `count` consecutive, identical DIMMs: same size_mb and same
// mem_type (including both being absent). See DiscoveryInfo.memory_device_groups
// (field 17) for condensation, ordering, and bounds semantics.
message MemoryDeviceGroup {
  // Same semantics as MemoryDevice.size_mb; shared by every device in the group.
  optional uint32 size_mb = 1;
  // Same semantics as MemoryDevice.mem_type; shared by every device in the group.
  optional string mem_type = 2;
  // Number of identical devices this group represents. Zero-count groups
  // are dropped by readers rather than rejected. The sum of `count` across
  // all groups in a DiscoveryInfo is bounded; see field 17 above.
  uint32 count = 3;
}

enum CpuArchitecture {
  AARCH64 = 0;
  X86_64 = 1;
  UNKNOWN = 2;
}
