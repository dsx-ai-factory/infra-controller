// --- Component firmware ---

enum FirmwareUpdateState {
  FW_STATE_UNKNOWN = 0;
  FW_STATE_QUEUED = 1;
  FW_STATE_IN_PROGRESS = 2;
  FW_STATE_VERIFYING = 3;
  FW_STATE_COMPLETED = 4;
  FW_STATE_FAILED = 5;
  FW_STATE_CANCELLED = 6;
}

