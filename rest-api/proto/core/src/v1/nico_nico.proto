    optional mlx_device.FirmwareFlasherProfile profile = 1;
  }

  message FirmwareUpgrade {
    scout_firmware_upgrade.ScoutFirmwareUpgradeTask task = 1;
  }


  oneof action {
    Noop noop = 3;
    Reset reset = 4;
    Discovery discovery = 5;
    Rebuild rebuild = 6;
    Retry retry = 7;
    Measure measure = 8;
    LogError log_error = 9;
    MachineValidation machine_validation = 10;
    MlxAction mlx_action = 11;
    FirmwareUpgrade firmware_upgrade = 12;
  }
}

