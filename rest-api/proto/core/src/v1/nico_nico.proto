  // target UEFI credential. A machine has exactly one UEFI credential, so its id
  // uniquely names the target. Unlike a BMC, a UEFI credential only ever belongs
  // to a machine (never a switch or power shelf), so this is a plain optional
  // field rather than a device-kind oneof.
  optional common.MachineId machine_id = 2;
  // MAC of the machine's BMC (which keys the UEFI rotation bookkeeping),
  // resolved server-side to its owning machine. May be given alone, or alongside
  // `machine_id` as a cross-check (they must identify the same machine). At
  // least one of `machine_id` / `bmc_mac` must be set (enforced server-side).
  optional string bmc_mac = 3;
}

