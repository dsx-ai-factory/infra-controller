    LOGERROR = 6; // Log error.
    MACHINE_VALIDATION = 7; // Machine validation.
    MLX_ACTION = 8; // MlxAction for DPA NICs
    FIRMWARE_UPGRADE = 9; // Firmware upgrade through scout
