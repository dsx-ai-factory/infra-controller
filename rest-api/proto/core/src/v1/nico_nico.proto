// Machine Identity - JWT-SVID token signing
message MachineIdentityRequest {
  repeated string audience = 1;
}

message MachineIdentityResponse {
  string access_token = 1;
  string issued_token_type = 2;
  string token_type = 3;
  uint32 expires_in_sec = 4;
}

// Tenant identity configuration (per-org machine identity signing)
message GetTenantIdentityConfigRequest {
  string organization_id = 1;
}

// Published signing key metadata (from `signing_key_public_*` JSON). Exactly one entry per
// response should have `current_signer == true`. The inactive (previous) key during rotation
// includes `expire_at` when it is still published for verification (JWKS overlap end; JSON: expireAt).
message TenantIdentitySigningKey {
  string kid = 1;
  string alg = 2;
  bool current_signer = 3;
  optional google.protobuf.Timestamp expire_at = 4;
}

message TenantIdentityConfig {
  bool enabled = 1;
  // JWT `iss` / OIDC issuer string: `https://` or `http://` URL (trust domain = host),
  // `spiffe://<trust-domain>/...` (scheme ASCII case-insensitive), or bare DNS hostname / IP.
  string issuer = 2;
  string default_audience = 3;
  repeated string allowed_audiences = 4;
  uint32 token_ttl_sec = 5;
  // When unset or empty, defaults to spiffe://<trust-domain-from-issuer>
  optional string subject_prefix = 6;
  bool rotate_key = 7;
  // Seconds to keep the previous verification key in JWKS after `rotate_key`. Required when
  // `rotate_key` is true; must be omitted when `rotate_key` is false. Must be >= `token_ttl_sec`
  // so JWTs signed with the previous key remain verifiable until they expire. Capped by site
  // `machine_identity.signing_key_overlap_max_sec`.
  optional uint32 signing_key_overlap_sec = 8;
}

message SetTenantIdentityConfigRequest {
  string organization_id = 1;
  TenantIdentityConfig config = 2;
}

message TenantIdentityConfigResponse {
  string organization_id = 1;
  TenantIdentityConfig config = 2;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  reserved 10;
  reserved "key_id";
  repeated TenantIdentitySigningKey signing_keys = 11;
}

// Token delegation config (per-org token exchange for machine identity).
// The structure used when CREATING or UPDATING a secret
message ClientSecretBasic {
  string client_id = 1;
  string client_secret = 2;  // Required for input, never returned
}

// The structure used when RETRIEVING a secret configuration
message ClientSecretBasicResponse {
  string client_id = 1;
  string client_secret_hash = 2;  // Returned to client, but never accepted as input
}

// auth_method_config oneof: only set for "client_secret_basic".
// When omitted, auth_method is "none". auth_method is not returned; infer from oneof.
message TokenDelegationResponse {
  string organization_id = 1;
  string token_endpoint = 2;
  string subject_token_audience = 3;
  oneof auth_method_config {
    ClientSecretBasicResponse client_secret_basic = 4;
  }
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetTokenDelegationRequest {
  string organization_id = 1;
}

// auth_method_config oneof: only set when auth_method is "client_secret_basic".
// When auth_method is "none", omit the oneof entirely.
message TokenDelegation {
  string token_endpoint = 1;
  string subject_token_audience = 2;
  oneof auth_method_config {
    ClientSecretBasic client_secret_basic = 4;
  }
}

message TokenDelegationRequest {
  string organization_id = 1;
  TokenDelegation config = 2;
}

message ReencryptTenantIdentitySecretsRequest {
  // If set, only this org; otherwise all rows in tenant_identity_config.
  optional string organization_id = 1;
  // Decrypt and validate only; no DB writes.
  bool dry_run = 2;
}

message ReencryptTenantIdentityFailure {
  string organization_id = 1;
  string field = 2;
  string error = 3;
}

message ReencryptTenantIdentitySecretsResponse {
  uint32 rows_examined = 1;
  uint32 rows_updated = 2;
  uint32 rows_skipped_all_on_target = 3;
  uint32 fields_reencrypted = 4;
  uint32 fields_skipped_on_target = 5;
  uint32 rows_failed = 6;
  repeated ReencryptTenantIdentityFailure failures = 7;
  // Site [machine_identity].current_encryption_key_id used as the re-wrap target.
  string current_encryption_key_id = 8;
}

// Carried JWKS document for GetJWKS. Standard key fields live in `jwks` only (RFC 7517).
message Jwks {
  // UTF-8 JSON text: {"keys":[ ... ]} per RFC 7517.
  string jwks = 1;
}

message OpenIdConfiguration {
  string issuer = 1;
  string jwks_uri = 2;
  // OAuth-style access token (JWT bearer) only; no OIDC `id_token` is issued.
  repeated string response_types_supported = 3;
  repeated string subject_types_supported = 4;
  // Verifiers use `jwks_uri` / `spiffe_jwks_uri` and the GetJWKS `jwks` JSON (`keys[].alg`) for JWT verification.
  repeated string id_token_signing_alg_values_supported = 5;
  // SPIFFE trust-domain style JWKS URL: `{issuer}/.well-known/spiffe/jwks.json` (GetJWKS with Spiffe kind).
  string spiffe_jwks_uri = 7;
}

// Which JWKS document GetJWKS should return.
enum JwksKind {
  Unspecified = 0;  // Same as Oidc: tenant OIDC-style JWT signing JWKS (current default).
  // Keys for verifying JWTs from this org issuer (e.g. machine identity ES256 public key).
  Oidc = 1;
  // SPIFFE trust-domain bundle keys (federation / SVID validation); distinct from OIDC OP JWKS above.
  Spiffe = 2;
}

message JwksRequest {
  string organization_id = 1;
  // When omitted, treated as Unspecified / Oidc behavior.
  optional JwksKind kind = 2;
}

message OpenIdConfigRequest {
  string organization_id = 1;
}

// Determines machine ingestion state in relation to the power on gate
// NotDiscovered - the machine has not been discovered.
// WaitingForIngestion - the machine is stuck at the gate, will not be powered on yet.
// IngestionMachineCreated - the machine is past the gate and has been ingested.
// IngestionMachineNotCreated - the machine is past the gate, but the entry
// in the DB hasn't been created yet.
enum MachineIngestionState {
  NotDiscovered = 0;
  WaitingForIngestion = 1;
  IngestionMachineNotCreated = 2;
  IngestionMachineCreated = 3;
}

message MachineIngestionStateResponse{
  MachineIngestionState machine_ingestion_state = 1;
}

message TpmCaAddedCaStatus{
  TpmCaCertId id = 1;
  int32 matched_ek_certs = 2;
}

message TpmCaCertId{
