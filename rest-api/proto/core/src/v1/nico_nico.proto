// Identifies the lifecycle authority responsible for a site prefix.
enum SitePrefixAuthority {
  option allow_alias = true;

  SITE_PREFIX_AUTHORITY_UNSPECIFIED = 0;
  SITE_PREFIX_AUTHORITY_OPERATOR_MANAGED = 1;
  SITE_PREFIX_AUTHORITY_CONFIGURED = 1 [deprecated = true];
  SITE_PREFIX_AUTHORITY_TENANT_MANAGED = 2;
}

// Describes where a site prefix may be routed.
enum SitePrefixRoutingScope {
  SITE_PREFIX_ROUTING_SCOPE_UNSPECIFIED = 0;
  SITE_PREFIX_ROUTING_SCOPE_DATACENTER_ONLY = 1;
}

// Describes the current lifecycle state of a site prefix.
enum SitePrefixLifecycleState {
  SITE_PREFIX_LIFECYCLE_STATE_UNSPECIFIED = 0;
  SITE_PREFIX_LIFECYCLE_STATE_PROVISIONING = 1;
  SITE_PREFIX_LIFECYCLE_STATE_READY = 2;
  SITE_PREFIX_LIFECYCLE_STATE_DELETING = 3;
  SITE_PREFIX_LIFECYCLE_STATE_ERROR = 4;
}

// A site-level prefix that may contain VPC address space.
message SitePrefix {
  common.SitePrefixId id = 1;
  SitePrefixConfig config = 2;
  SitePrefixStatus status = 3;
  Metadata metadata = 4;
  string version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SitePrefixConfig {
  // IPv4 or IPv6 prefix in canonical CIDR notation.
  string prefix = 1;
  // Present only for tenant-managed site prefixes.
  optional string tenant_organization_id = 2;
  SitePrefixRoutingScope routing_scope = 3;
}

message SitePrefixStatus {
  SitePrefixAuthority authority = 1;
  SitePrefixLifecycleState lifecycle_state = 2;
  // Tenant-wide point-in-time use for the owning tenant. Present only for
  // tenant-managed SitePrefixes and repeated on each returned resource;
  // mutation admission remains authoritative.
  optional SitePrefixQuotaUsage quota = 3;
}

message SitePrefixQuotaUsage {
  uint32 used = 1;
  uint32 limit = 2;
}

// Core derives TenantManaged, DatacenterOnly, and Provisioning. They are
// intentionally absent from this request. The caller ID, tenant, prefix, and
// derived routing scope define an idempotent create. A matching retry returns
// the current stored resource without reapplying metadata; use UpdateSitePrefix
// to change metadata.
message SitePrefixCreationRequest {
  common.SitePrefixId id = 1;
  string tenant_organization_id = 2;
  string prefix = 3;
  Metadata metadata = 4;
}

message SitePrefixUpdateRequest {
  common.SitePrefixId id = 1;
  string tenant_organization_id = 2;
  // Required. This replaces metadata only; immutable prefix configuration is
  // intentionally absent from the update request.
  Metadata metadata = 3;
  optional string if_version_match = 4;
}

// Records retirement intent. DeleteSitePrefix moves the retained row to
// Deleting; it does not release the CIDR or tenant quota slot. Final removal
// occurs only after child and dataplane drain.
message SitePrefixDeletionRequest {
  common.SitePrefixId id = 1;
  string tenant_organization_id = 2;
}

message SitePrefixDeletionResult {
  SitePrefix site_prefix = 1;
}

message SitePrefixStateHistoriesRequest {
  repeated common.SitePrefixId site_prefix_ids = 1;
}

// All fields are optional. An empty filter returns the complete inventory.
message SitePrefixSearchFilter {
  optional string tenant_organization_id = 1;
  optional SitePrefixAuthority authority = 2;
  optional SitePrefixRoutingScope routing_scope = 3;
  optional SitePrefixLifecycleState lifecycle_state = 4;

  // When present, prefix_match_type is required and selects how the stored
  // site prefix is compared with this CIDR.
  optional string prefix_match = 5;
  optional PrefixMatchType prefix_match_type = 6;
}

message SitePrefixesByIdsRequest {
  repeated common.SitePrefixId site_prefix_ids = 1;
}

message SitePrefixIdList {
  repeated common.SitePrefixId site_prefix_ids = 1;
}

message SitePrefixList {
  repeated SitePrefix site_prefixes = 1;
}

// Family-specific address configuration for a managed-host interface.
message InterfaceAddressConfig {

  // Family shared by every address and prefix in this entry. Must be V4 or V6.
  AddressFamily address_family = 1;
  // IPv4 gateway CIDR. IPv6 entries omit this value; their DPU-side link
  // prefix remains in interface_prefix, which the agent renders as gateway_cidr.
  optional string gateway = 2;
  // Host address, without a prefix length. This may be empty for SLAAC or an
  // entry that contains only a loopback.
  string ip = 3;
  // Prefix allocated to this interface, such as an FNN linknet or host route.
  // This may be empty for a prefixless persisted IPv6 interface or an entry
  // that contains only a loopback.
  string interface_prefix = 4;
  // Prefix for the network segment that contains this interface. This may be
  // empty when the entry contains only a loopback.
  string prefix = 5;
  // DPU-hosted SVI address used as the host gateway when configured.
  optional string svi_ip = 6;
  // Administrative FNN tenant VRF loopback used by operators for monitoring
  // and debugging; the tenant is not expected to access this address. Writers
  // must set this value on at most one family entry.
  optional string tenant_vrf_loopback_ip = 7;
}

// Selects a fixed, versioned mlxconfig profile for DPU provisioning.
enum DpuNvConfigProfile {
  // No platform profile is selected.
  DPU_NV_CONFIG_PROFILE_UNSPECIFIED = 0;
  // Version 1 of the validated GB200/B3240 CPU as Root Complex profile.
  DPU_NV_CONFIG_PROFILE_GB200_B3240_V1 = 1;
}
