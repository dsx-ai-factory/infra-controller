message ReWrapSecretsRequest {
  // Rows scanned per batch during the re-wrap walk.
  // Unset: the server picks a sensible default (100).
  // Out of range: the server clamps to [1, 10000]; in
  // particular 0 does not mean "scan nothing". Clients
  // should not rely on sending 0 or very large values.
  optional uint32 batch_size = 1;
}

message ReWrapSecretsResponse {
  // Journal rows whose DEK was re-wrapped to the
  // routed KEK.
  uint64 re_wrapped = 1;
  // Journal rows already wrapped by the routed KEK.
  uint64 already_current = 2;
  // Journal rows still wrapped by a KEK outside the
  // routing config after the walk. Zero means every
  // unrouted KEK can be retired.
  uint64 stale_remaining = 3;
}

// ---------------------------------------------------------------------------
// GetMachineBootInterfaces: one machine's boot-interface view, gathered from
// every store that records it. Each store gets its own purpose-built report
// message that explicitly carries `boot_interface_id` -- the regular
// `MachineInterface` message drops it, so these are separate report types.
// ---------------------------------------------------------------------------

message GetMachineBootInterfacesRequest {
  common.MachineId machine_id = 1;
}

// A boot interface reference: a NIC's MAC together with its vendor-native
// Redfish `EthernetInterface.Id`. Mirrors the api-model `MachineBootInterface`
// pair; `interface_id` is optional here so a pick whose id has not been
// captured yet still reports its MAC (the model type requires both halves,
// which the `TryFrom` conversion enforces).
message MachineBootInterface {
  string mac_address = 1;
  optional string interface_id = 2;
}

// A `machine_interfaces` row's boot interface: the authoritative store for an
// owned machine. `primary_interface` is the designation `pick_boot_interface`
// keys on.
message MachineInterfaceBootInterface {
  string mac_address = 1;
  bool primary_interface = 2;
  // Vendor-named Redfish EthernetInterface.Id, absent until site-explorer has
  // captured it for this MAC.
  optional string boot_interface_id = 3;
  // Segment type of the row, when one is known (denormalized from the segment).
  optional string network_segment_type = 4;
  // The `machine_interfaces` row id, so a candidate reported here can be
  // handed straight to `SetPrimaryInterface`.
  common.MachineInterfaceId interface_id = 5;
}

// A `predicted_machine_interfaces` row's boot interface: the candidate a host
// offers in the window before its first DHCP lease creates an owned row.
message PredictedBootInterface {
  string mac_address = 1;
  bool primary_interface = 2;
  optional string boot_interface_id = 3;
  // The predicted/expected segment type carried on the prediction.
  optional string network_segment_type = 4;
}

// An `explored_endpoints` row's boot interface: site-explorer's per-cycle
// automatic pick for a BMC endpoint, used only for endpoints no machine owns.
message ExploredBootInterface {
  // BMC endpoint address this explored default was recorded against.
  string address = 1;
  optional string boot_interface_mac = 2;
  optional string boot_interface_id = 3;
}

// A `retained_boot_interfaces` row: the last-known boot pair preserved past
// interface deletion, keyed by MAC. `recorded_at` is included so the view can
// show stale records (ones aged past the retention window).
message RetainedBootInterface {
  string mac_address = 1;
  string boot_interface_id = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

// Why the current desired boot interface target was selected. The target
// interface may belong to a DPU in DPU or NIC mode, or it may be an integrated
// or onboard NIC. This records the selection mechanism or authority; it does
// not describe reconciliation state.
enum BootInterfaceSelectionSource {
  // Wire sentinel for an omitted field or a server that does not report this
  // contract. This is not a persisted selection source.
  BOOT_INTERFACE_SELECTION_SOURCE_UNSPECIFIED = 0;
  // An ExpectedMachine primary declaration selected the interface.
  BOOT_INTERFACE_SELECTION_SOURCE_EXPECTED_MACHINE = 1;
  // An operator selected the interface through an administrative write.
  BOOT_INTERFACE_SELECTION_SOURCE_OPERATOR = 2;
  // Redfish UEFI PCI path ordering selected the interface.
  BOOT_INTERFACE_SELECTION_SOURCE_REDFISH_UEFI_PCI = 3;
  // Redfish chassis identifier ordering selected the interface.
  BOOT_INTERFACE_SELECTION_SOURCE_REDFISH_CHASSIS_ID = 4;
  // Redfish DPU serial number ordering selected the interface.
  BOOT_INTERFACE_SELECTION_SOURCE_REDFISH_SERIAL_NUMBER = 5;
  // Host PCI data in a Scout report selected the interface.
  BOOT_INTERFACE_SELECTION_SOURCE_SCOUT_REPORT_PCI = 6;
  // Explicit persisted value for selections that predate source tracking or
  // whose current source cannot be recovered.
  BOOT_INTERFACE_SELECTION_SOURCE_LEGACY_UNKNOWN = 7;
}

message GetMachineBootInterfacesResponse {
  // The desired boot-interface generation, its latest persisted observation,
  // and any machine-controller work currently reconciling it.
  message Reconciliation {
    // Whether the desired generation is waiting for, undergoing, or has
    // completed machine-controller reconciliation.
    enum State {
      // The server did not provide a usable reconciliation state.
      Unspecified = 0;
      // The desired generation has no matching observation and is not currently
      // being reconciled. This includes work deferred while a host is assigned.
      Pending = 1;
      // Machine-controller is actively reconciling the desired generation.
      Converging = 2;
      // The desired generation has a matching verification or compatibility
      // baseline.
      Converged = 3;
      // Reconciliation of the desired generation reached a terminal failure.
      Failed = 4;
    }

    // Boot-interface target for the current desired generation.
    MachineBootInterface desired_boot_interface = 1;
    // Opaque configuration version of the current desired generation.
    string desired_version = 2;
    // Desired generation covered by the latest persisted observation. It may
    // differ from `desired_version` after a new operator request.
    optional string verified_version = 3;
    // Time the latest persisted observation or compatibility baseline was
    // recorded. Absent when no generation has been observed.
    google.protobuf.Timestamp observed_at = 4;
    // True when the latest observation is a rollout compatibility baseline
    // rather than a Redfish verification.
    bool is_compatibility_baseline = 5;
    // Reconciliation state derived for the current desired generation.
    State reconciliation_state = 6;
    // Current managed-host state, including the BootConfiguring phase when
    // reconciliation is active.
    string machine_state = 7;
    // Desired generation captured by an active BootConfiguring pass. This can
    // differ from `desired_version` while older in-flight work finishes safely.
    optional string reconciling_version = 8;
    // Persisted terminal boot-reconciliation failure, when one exists.
    optional string failure = 9;
    // Mechanism or authority that selected the current desired target. When
    // omitted, the proto3 zero value `UNSPECIFIED` means the server reported no
    // source; that wire sentinel is distinct from persisted `LEGACY_UNKNOWN`.
    BootInterfaceSelectionSource selection_source = 10;
    // Time the current target and source decision was established. Adding a
    // Redfish interface ID for the same MAC preserves it. Absent for legacy
    // rows whose selection history predates source tracking.
    google.protobuf.Timestamp selection_updated_at = 11;
  }

  common.MachineId machine_id = 1;

  // Boot interfaces from the four stores.
  repeated MachineInterfaceBootInterface machine_interfaces = 2;
  repeated PredictedBootInterface predicted_interfaces = 3;
  repeated ExploredBootInterface explored_endpoints = 4;
  repeated RetainedBootInterface retained_interfaces = 5;

  // The boot interface MAC the system would select for this machine right now,
  // applying `pick_boot_interface` to the owned `machine_interfaces` rows.
  // Absent when there is no owned candidate yet.
  optional string effective_boot_interface_mac = 6;
  // The fully-populated effective boot interface id (MAC + Redfish id), when
  // the selected row has its interface id captured. Absent otherwise.
  optional string effective_boot_interface_id = 7;

  // True when the stores do not all agree on the boot MAC -- a signal worth a
  // closer look during troubleshooting (e.g. the explored default points at a
  // different NIC than the effective owned pick, or a predicted primary
  // disagrees). See the handler for the exact comparison.
  bool divergent = 8;

  // What the automatic selection would choose if no row were flagged primary
  // -- `pick_boot_interface`'s fallback of the lowest-MAC non-underlay row.
  // Comparing this against the effective pick shows whether a primary
  // designation is overriding the automatic choice. Absent when no managed
  // row qualifies; `interface_id` absent until captured for that NIC.
  MachineBootInterface default_boot_interface = 9;

  // The prediction `pick_boot_prediction` would boot from for a machine still
  // waiting on its first DHCP lease: the declared primary, else the sole
  // non-underlay prediction. Absent when there are no predictions or when the
  // pick refuses to guess among several undeclared NICs.
  MachineBootInterface predicted_boot_interface = 10;

  // Desired-state reconciliation details. Absent before a machine has a
  // persisted desired boot interface.
  Reconciliation reconciliation = 11;
}

message GetContainerRegistryCredentialRequest {
  string registry = 1;
}

message GetContainerRegistryCredentialResponse {
  string username = 1;
  string password = 2;
}

message SetContainerRegistryCredentialRequest {
  string registry = 1;
  string username = 2;
  string password = 3;
