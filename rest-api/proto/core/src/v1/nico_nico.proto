  ComponentResult result = 1;
  FirmwareUpdateState state = 2;
  string target_version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

enum NvSwitchComponent {
  NV_SWITCH_COMPONENT_UNKNOWN = 0;
  NV_SWITCH_COMPONENT_BMC = 1;
  NV_SWITCH_COMPONENT_CPLD = 2;
  NV_SWITCH_COMPONENT_BIOS = 3;
  NV_SWITCH_COMPONENT_NVOS = 4;
}

enum PowerShelfComponent {
  POWER_SHELF_COMPONENT_UNKNOWN = 0;
  POWER_SHELF_COMPONENT_PMC = 1;
  POWER_SHELF_COMPONENT_PSU = 2;
}

enum ComputeTrayComponent {
  COMPUTE_TRAY_COMPONENT_UNKNOWN = 0;
  COMPUTE_TRAY_COMPONENT_BMC = 1;
  COMPUTE_TRAY_COMPONENT_BIOS = 2;
  COMPUTE_TRAY_COMPONENT_CEC = 3;
  COMPUTE_TRAY_COMPONENT_NIC = 4;
  COMPUTE_TRAY_COMPONENT_CPLD_MB = 5;
  COMPUTE_TRAY_COMPONENT_CPLD_PDB = 6;
  COMPUTE_TRAY_COMPONENT_HGX_BMC = 7;
  COMPUTE_TRAY_COMPONENT_COMBINED_BMC_UEFI = 8;
  COMPUTE_TRAY_COMPONENT_GPU = 9;
  COMPUTE_TRAY_COMPONENT_CX7 = 10;
}

message UpdateComputeTrayFirmwareTarget {
  // Exactly one of machine_ids or bmc_macs must be set (the server rejects
  // neither/both). machine_ids targets ingested trays; bmc_macs targets by BMC
  // MAC, including pre-ingestion. These are plain fields rather than a oneof so
  // field 1 stays wire-compatible with earlier releases that predate bmc_macs.
  common.MachineIdList machine_ids = 1;
  repeated ComputeTrayComponent components = 2;
  MacAddressList bmc_macs = 3;
}

message UpdateSwitchFirmwareTarget {
  SwitchIdList switch_ids = 1;
  repeated NvSwitchComponent components = 2;
}

message UpdatePowerShelfFirmwareTarget {
  PowerShelfIdList power_shelf_ids = 1;
  repeated PowerShelfComponent components = 2;
}

// Whole-rack firmware update target. All eligible compute and switch devices
// in each listed rack are updated.
message UpdateFirmwareObjectTarget {
  RackIdList rack_ids = 1;
}

message UpdateComponentFirmwareRequest {
  oneof target {
    UpdateComputeTrayFirmwareTarget compute_trays = 1;
    UpdateSwitchFirmwareTarget switches = 2;
    // powershelf firmware update currently not implemented by state machine and backend
    UpdatePowerShelfFirmwareTarget power_shelves = 3;
    UpdateFirmwareObjectTarget racks = 5;
  }

  // Target firmware version for direct component-manager dispatch.
  // For targets routed through rack maintenance, this carries SOT JSON for
  // the backend firmware apply path.
  string target_version = 4;
  // Optional for firmware targets routed to RMS.
  // Omitted or empty values are passed to RMS as "NOAUTH".
  optional string access_token = 6;
  bool force_update = 7;
  // When true, bypass the state controller and dispatch directly to the
  // configured HAL backend (NSM, PSM, Redfish, etc.).
  // Not supported for rack-level firmware updates.
  bool bypass_state_controller = 8;
}

message UpdateComponentFirmwareResponse {
  repeated ComponentResult results = 1;
}

message GetComponentFirmwareStatusRequest {
  oneof target {
    common.MachineIdList machine_ids = 1;
    SwitchIdList switch_ids = 2;
    PowerShelfIdList power_shelf_ids = 3;
    RackIdList rack_ids = 4;
    MacAddressList compute_bmc_macs = 5;
  }
}

