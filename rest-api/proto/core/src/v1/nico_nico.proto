  common.MachineId machine_id = 2;
  string issuer = 3;
  optional string issuer_ca_url = 4;
}

message TpmEkCertStatusCollection{
  repeated TpmEkCertStatus tpm_ek_cert_statuses = 1;
}

message TpmCaCert{
  // TPM's CA cert in DER encoding
  bytes ca_cert = 1;
}

message TpmCaCertDetail{
  int32 ca_cert_id = 1;
  string not_valid_before = 2;
  string not_valid_after = 3;
  string ca_cert_subject = 4;
}

message TpmCaCertDetailCollection{
  repeated TpmCaCertDetail tpm_ca_cert_details = 1;
}

message AttestKeyBindChallenge{
  // Encrypted Credential (kind of AuthToken)
  bytes cred_blob = 1;
  // Encrypted Seed (used to generate key to decrypt CredBlob)
  bytes encrypted_secret = 2;
}

message AttestQuoteRequest{
  common.MachineId machine_id = 1;
  // Kind of AuthToken
  bytes credential = 2;
  // TPM generated Attestation struct, contains a hash of PcrValues
  bytes attestation = 3;
  // Signature of Attenstation
  bytes signature = 4;
  // Actual PCR Values (from which Attestation is computed)
  repeated bytes pcr_values = 5;
  // Event Log generated by TPM
  optional bytes event_log = 6;
}

message AttestQuoteResponse{
  bool success = 1;
  MachineCertificate machine_certificate = 2;
}

enum CredentialType {
  HostBMC = 0;
  DPUBMC = 1;
  UFM = 2;
  DpuUefi = 3;
  HostUefi = 4;
  HostBMCFactoryDefault = 5;
  DpuBMCFactoryDefault = 6;
  SiteWideBmcRoot = 7;
  RootBmcByMacAddress = 8;
  BmcForgeAdminByMacAddress = 9;
  NmxM = 10;
  BgpSiteWideLeafPassword = 11;
  SiteWideNicLockdownIkm = 12;
}

message CredentialCreationRequest {
  // Credential type
  CredentialType credential_type = 1;
  // The username of credential.
  // No need specify it for HostBMC, DPUBMC, DpuUefi.
  // For UFM, the username is the URL of UFM.
  optional string username = 2;
  // The password of credential for HostBMC, DPUBMC, DpuUefi.
  // For UFM, the password is the token of UFM.
  string password = 3;
  // For the BMC factory default credential: "dell", "lenovo", "hpe", "supermicro", etc
  optional string vendor = 4;
  optional string mac_address = 5;
}

message CredentialDeletionRequest {
  CredentialType credential_type = 1;
  optional string username = 2;
  optional string mac_address = 3;
}

message CredentialCreationResult {

}

message CredentialDeletionResult {

}

// Credential family that a site-wide rotation targets. Distinct from
// CredentialType because rotation is version-addressed and operates per family,
// not per individual vault path.
enum RotationCredentialType {
  // Unset sentinel. The server rejects this with InvalidArgument so a caller
  // that forgets to set the family never falls through to a destructive
  // default (proto3 zero value); rotation is too sensitive to guess a target.
  ROTATION_CREDENTIAL_TYPE_UNSPECIFIED = 0;
  ROTATION_BMC = 1;
  ROTATION_HOST_UEFI = 2;
  ROTATION_DPU_UEFI = 3;
  ROTATION_NVOS = 4;
  ROTATION_LOCKDOWN_IKM = 5;
  // BF4 DPU BMC `service` account password. Only BF4 DPUs expose this account;
  // other devices are never enrolled, so a rotation converges just the BF4 DPU
  // BMCs.
  ROTATION_DPU_BMC_SERVICE = 6;
}

message RotateCredentialRequest {
  RotationCredentialType credential_type = 1;
  // Explicit rotate-TO password. Validated against the strength policy and used
  // verbatim. When omitted, the server auto-generates a strong password.
  optional string password = 2;
  // Free-form operator note recorded with the rotation. Must not contain
  // secrets; it is persisted in the rotation request metadata.
  optional string reason = 3;
}

message RotateCredentialResult {
  RotationCredentialType credential_type = 1;
  // The newly published site-wide target version devices will converge to.
  uint32 target_version = 2;
  // When this rotation was staged.
  google.protobuf.Timestamp started_at = 3;
}

message CredentialRotationStatusRequest {
  RotationCredentialType credential_type = 1;
  // When set, report only this device's convergence (matched by MAC) instead of
  // the site-wide aggregate. The count fields in the result then describe just
  // this one device, and `device` carries the per-device detail. The server
  // returns NotFound if no rotation record exists for the (MAC, family) pair.
  optional string device_mac = 2;
}

// Per-device convergence detail, populated on the result only when the request
// targeted a specific device by MAC.
message DeviceCredentialRotationStatus {
  // The device this status describes.
  string device_mac = 1;
  // Credential version currently live on the hardware (the convergence marker).
  // Unset means "not yet established" (e.g. an unlocked SuperNIC for
  // lockdown_ikm), which counts as pending.
  optional uint32 current_version = 2;
  // Set while a rotation is mid-flight on this device: the version it is being
  // moved to (the crash-safety marker).
  optional uint32 rotating_to_version = 3;
  // True once current_version has reached the site-wide target.
  bool converged = 4;
  // True while the device is in a rotation backoff window.
  bool quarantined = 5;
  // When the current backoff window expires; set only while quarantined.
  google.protobuf.Timestamp quarantined_until = 6;
  // Number of rotation attempts recorded against this device.
  uint32 rotate_attempts = 7;
  // When the last rotation attempt ran; unset if none has been recorded.
  google.protobuf.Timestamp last_attempt_at = 8;
  // Redacted last-error string for observability; never contains secrets.
  optional string last_error = 9;
}

message CredentialRotationStatusResult {
  // Current site-wide target version for this family.
  uint32 target_version = 1;
  // Devices whose recorded version is at or beyond the target. When the request
  // targeted a single device, this is 0 or 1 for that device.
  uint64 converged = 2;
  // Devices not yet converged and eligible for a rotation attempt. When the
  // request targeted a single device, this is 0 or 1 for that device.
  uint64 pending = 3;
  // Devices currently quarantined from rotation attempts. When the request
  // targeted a single device, this is 0 or 1 for that device.
  uint64 quarantined = 4;
  // MAC addresses of the quarantined devices (within the queried set).
  repeated string quarantined_device_macs = 5;
  // When the current target version was staged.
  google.protobuf.Timestamp started_at = 6;
  // True only when every device in the queried set has reached the target: no
  // devices pending and none quarantined. Quarantined devices are behind the
  // target, so a rotation with quarantined devices is not complete.
  bool complete = 7;
  // Present only when the request targeted a specific device by MAC.
  optional DeviceCredentialRotationStatus device = 8;
}

message VersionRequest {
  bool display_config = 1;
}

// Capabilities advertised by a Core build. Callers must treat an absent
// capability as unsupported so requests fail closed against older builds.
enum BuildCapability {
  BUILD_CAPABILITY_UNSPECIFIED = 0;
  BUILD_CAPABILITY_VPC_SLAAC = 1;
}

message BuildInfo {
  string build_version = 1; // v2023.06-rc2-1-gc5c05de3
  string build_date = 2; // 2023-06-05
  string git_sha = 3; // c5c05de3
  string rust_version = 4; // rustc 1.68.0 (2c8cc3432 2023-03-06)
  string build_user = 5; // graham
  string build_hostname = 6; // fedora
  // An empty `capabilities` list advertises no optional capabilities.
  // Callers ignore unknown values and treat an absent recognized capability
  // as unsupported.
  repeated BuildCapability capabilities = 7;

  optional RuntimeConfig runtime_config = 50;
}

message RuntimeConfig {
  string listen = 1;
  string metrics_endpoint = 2;
  reserved 3; // Was: string otlp_endpoint
  string database_url = 4;
  bool enable_ip_fabric = 5;
  reserved 6; // deprecated rapid_iterations
  uint32 asn = 7;
  repeated string dhcp_servers = 8;
  repeated string route_servers = 9;
  bool enable_route_servers = 10;
  repeated string deny_prefixes = 11;
  repeated string site_fabric_prefixes = 12;

  // Only name. Rest config can be read from network-segment command.
  repeated string networks = 13;

  reserved 14;  // deprecated dpu_ipmi_reboot_args

  string dpu_ipmi_tool_impl = 15;
  uint32 dpu_ipmi_reboot_attempt = 16;

  optional string initial_domain_name = 17;
  string initial_dpu_agent_upgrade_policy = 18;

  map<string, string> dpu_nic_firmware_update_version = 19;
  bool dpu_nic_firmware_initial_update_enabled = 20;
  bool dpu_nic_firmware_reprovision_update_enabled = 21;
  int32 max_concurrent_machine_updates = 22;
  uint64 machine_update_runtime_interval = 23;

  reserved 24;
  // Deprecated: NVUE is always enabled. This field is always set to true.
