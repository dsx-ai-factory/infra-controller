  string version = 99;

  // Not sure if we actually still need those
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp updated = 5;
  google.protobuf.Timestamp deleted = 6;

  reserved 7;  // was: string tenantKeysetId, replaced with config.tenant_keyset_id
  reserved "tenantKeysetId";

  reserved 8;  // was: uint32 deprecated_vni, replaced with status.vni
  reserved "deprecated_vni";

  reserved 9;  // was: VpcVirtualizationType network_virtualization_type, replaced with config.network_virtualization_type
  reserved "network_virtualization_type";
  Metadata metadata = 10;

  reserved 11;  // was: string network_security_group_id, replaced with config.network_security_group_id
  reserved "network_security_group_id";

  // dpa_vni
  reserved 12;
  reserved "dpa_vni";

  reserved 13;  // was: common.NVLinkLogicalPartitionId default_nvlink_logical_partition_id, replaced with config.default_nvlink_logical_partition_id
  reserved "default_nvlink_logical_partition_id";

  optional VpcStatus status = 14;

  reserved 15;  // was: uint32 vni, replaced with config.vni
  reserved "vni";

  reserved 16;  // was: string routing_profile_type, replaced with config.routing_profile_type
  reserved "routing_profile_type";

