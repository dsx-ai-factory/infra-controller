  }

  message Reset {
  }

  message Discovery {
  }

  message Rebuild {
  }

  message Retry {
  }

  message Measure {
  }

  message LogError {
  }

  message MachineValidation {
    bool is_enabled = 1;
    string context = 2;
    common.MachineValidationId validation_id = 3;
    MachineValidationFilter filter = 4;
  }

  message MachineValidationFilter {
    repeated string tags = 1;
    repeated string allowed_tests = 2;
    optional bool run_unverfied_tests = 3;
    optional common.StringList contexts = 4;
  }

  message MlxAction {
    repeated MlxDeviceAction device_actions = 1;
  }

  message MlxDeviceAction {
    string pci_name = 1;

    oneof command {
      MlxDeviceNoop noop = 2;
      MlxDeviceLock lock = 3;
      MlxDeviceUnlock unlock = 4;
      MlxDeviceApplyProfile apply_profile = 5;
      MlxDeviceApplyFirmware apply_firmware = 6;
    }
  }

  message MlxDeviceNoop {
  }

  message MlxDeviceLock {
    string key = 1;
  }

  message MlxDeviceUnlock {
    string key = 1;
  }

  message MlxDeviceApplyProfile {
    optional mlx_device.SerializableMlxConfigProfile serialized_profile = 1;
