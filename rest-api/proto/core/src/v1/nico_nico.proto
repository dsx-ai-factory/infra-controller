enum NetworkSegmentType {
  TENANT = 0;
  ADMIN = 1;
  UNDERLAY = 2;
  HOST_INBAND = 3;
}

enum NetworkSegmentFlag {
  // This is the default value with no effect (which could potentially be used
  // to make an "empty" set of flags that can't be confused with the default
  // value for a list of flags).
  NO_OP = 0;

  // This marks a segment as one that can "stretch" between multiple VTEPs
  // (read: DPUs) within the site. This used to be implicitly true, but segments
  // created by FNN will not have this flag, which means such a segment exists
  // at a single VTEP in the fabric, and can't have arbitrary extra instances
  // attached to it.
  CAN_STRETCH = 1;
}

message NetworkSegmentConfig {
  common.VpcId vpc_id = 1;

  optional common.DomainId subdomain_id = 2;
  optional int32 mtu = 3;

  NetworkSegmentType segment_type = 4;

  repeated NetworkPrefix prefixes = 5;

  // Allows NICo to infer modified EUI-64 SLAAC addresses for clients making
  // stateless DHCPv6 requests and add them to interface address state. False by
  // default. Inference also requires dynamic allocation, exactly one IPv6 /64,
  // and an interface without an existing IPv6 address. Set this only when
  // clients derive SLAAC addresses from their MAC addresses using modified EUI-64.
  bool infer_slaac_eui64_addresses = 6;
}

message NetworkSegmentStatus {
  // Derived from can_stretch; not accepted as user input.
  repeated NetworkSegmentFlag flags = 1;

  // Lifecycle related status
  LifecycleStatus lifecycle = 2;

  // Coarse tenant-facing state derived from lifecycle.state at the server side.
  TenantState tenant_state = 3;
}

message NetworkSegment {
  common.NetworkSegmentId id = 1;

  // Deprecated: use config.vpc_id
  common.VpcId vpc_id = 2 [deprecated = true];
  // Deprecated: use metadata.name
  string name = 3 [deprecated = true];
  // Deprecated: use config.subdomain_id
  optional common.DomainId subdomain_id = 4 [deprecated = true];
  // Deprecated: use config.mtu
  optional int32 mtu = 5 [deprecated = true];
  // Deprecated: use config.prefixes
  repeated NetworkPrefix prefixes = 6 [deprecated = true];

  // Not sure if we actually still need those
  google.protobuf.Timestamp created = 11;
  google.protobuf.Timestamp updated = 12;
  google.protobuf.Timestamp deleted = 13;

  // Deprecated: use config.segment_type
  NetworkSegmentType segment_type = 14 [deprecated = true];
  // Deprecated: use status.flags
  repeated NetworkSegmentFlag flags = 15 [deprecated = true];

  NetworkSegmentConfig config = 16;
  NetworkSegmentStatus status = 17;
  Metadata metadata = 18;

  // Deprecated: use status.lifecycle.version
  string version = 99 [deprecated = true];
  // Deprecated: use status.tenant_state (coarse) or status.lifecycle.state (full controller state)
  TenantState state = 100 [deprecated = true];
  // Deprecated: use FindNetworkSegmentStateHistories RPC
  repeated NetworkSegmentStateHistory history = 101 [deprecated = true];
  // Deprecated: use status.lifecycle.state_reason
  optional ControllerStateReason state_reason = 102 [deprecated = true];
  // Deprecated: use status.lifecycle.sla
  StateSla state_sla = 103 [deprecated = true];
}

