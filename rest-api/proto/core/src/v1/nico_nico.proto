// Routing-profile properties set directly on a VPC. Present properties
// override its named routing profile; omitted properties inherit from it.
// `internal` and `access_tier` are intentionally not exposed because allocation
// and access controls must always come from the named base profile.
message VpcRoutingProfileOverrides {
  optional common.RouteTargets route_target_imports = 1;
  optional common.RouteTargets route_targets_on_exports = 2;
  optional bool leak_default_route_from_underlay = 3;
  optional bool leak_tenant_host_routes_to_underlay = 4;
  optional bool tenant_leak_communities_accepted = 5;
  optional PrefixFilterPolicyEntries accepted_leaks_from_underlay = 6;
  optional PrefixFilterPolicyEntries allowed_anycast_prefixes = 7;
}

// The fully resolved routing profile currently applied to an FNN VPC.
// Unlike VpcRoutingProfileOverrides, this includes the protected properties
// inherited from the named base profile and has no presence-aware fields.
message VpcEffectiveRoutingProfile {
  repeated common.RouteTarget route_target_imports = 1;
  repeated common.RouteTarget route_targets_on_exports = 2;
  bool leak_default_route_from_underlay = 3;
  bool leak_tenant_host_routes_to_underlay = 4;
  bool tenant_leak_communities_accepted = 5;
  repeated PrefixFilterPolicyEntry accepted_leaks_from_underlay = 6;
  repeated PrefixFilterPolicyEntry allowed_anycast_prefixes = 7;
  bool internal = 8;
  uint32 access_tier = 9;
}

message VpcConfig {
  string tenant_organization_id = 1;
  optional string tenant_keyset_id = 2;
  optional VpcVirtualizationType network_virtualization_type = 3;
  optional string network_security_group_id = 4;
  optional common.NVLinkLogicalPartitionId default_nvlink_logical_partition_id = 5;
  // Desired VNI for this VPC. Only populated when explicitly requested during creation.
  optional uint32 vni = 6;
  optional string routing_profile_type = 7;
  optional VpcRoutingProfileOverrides routing_profile_overrides = 8;
  // Resource group managed by the external power provisioning service. Unset
  // means that the VPC has no associated resource group; empty values are not
  // persisted.
  optional string power_resource_group = 9;
  // Selects SLAAC allocation mode for instance IPv6 interfaces in this FNN
  // VPC. When true, NICo allocates a /64 to each interface that includes IPv6
  // and retains that prefix without assigning a concrete IPv6 host address.
  // This policy is fixed when the VPC is created and cannot be changed through
  // `VpcUpdateRequest`. NICo does not yet configure router advertisements;
  // that support is tracked by
  // https://github.com/NVIDIA/infra-controller/issues/2398. Core reports this
  // field explicitly; an absent value indicates a response from a Core version
  // that predates SLAAC support.
  optional bool slaac_enabled = 10;
}

message VpcStatus {
  // The actual VNI allocated to the VPC. If a VNI had been
  // explicitly requested, we'd expect this to match config.vni.
  // If not explicitly requested, we'd expect config.vni to be unset.
  optional uint32 vni = 1;
  // Computed from the API server's current named profile and the persisted
  // VPC overrides. This value is not persisted and may change when the API
  // server configuration changes.
  optional VpcEffectiveRoutingProfile effective_routing_profile = 2;
}

