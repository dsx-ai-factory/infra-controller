}

message VpcCreationRequest {
  string name = 2; // Removed in v0.9.x and above, retained here for backwards compatibility
  string tenantOrganizationId = 3; // protolint:disable:this FIELD_NAMES_LOWER_SNAKE_CASE
  // this keyset will enable any key contained within it to access any instance associated with this VPC.
  optional string tenantKeysetId = 4; // protolint:disable:this FIELD_NAMES_LOWER_SNAKE_CASE
  optional VpcVirtualizationType network_virtualization_type = 5;

  // Desired ID for this VPC. If the ID is not provided, NICo will generate
  // a random ID.
  // The VPC ID must be unique within the NICo site.
  optional common.VpcId id = 6;
  Metadata metadata = 12;

  // The desired NSG ID and version for a VPC
  optional string network_security_group_id  = 13;

  // The ID of the default NVLink Logical Partition for a VPC
  // This is the NVLink Logical Partition that will be used by default for all instances in the VPC.
  optional common.NVLinkLogicalPartitionId default_nvlink_logical_partition_id = 14;


  // Desired VNI for this VPC. If the VNI is not provided, NICo will
  // auto-allocate one.
  // The requested VNI must be available in a resource-pool range that is not
  // marked for auto-assignment; otherwise, the request will be rejected.
  optional uint32 vni = 15;

  reserved 16;

  // Desired routing profile type for this VPC.
  // The access tier for the requested type must be as broad or broader than
  // type of the tenant.
  // For example, an internal tenant can request internal or external VPCs,
  // but an external tenant can only request external VPCs.
  optional string routing_profile_type = 17;

  // Properties to overlay on the selected named routing profile. Properties
  // left unset inherit from the base profile.
  optional VpcRoutingProfileOverrides routing_profile_overrides = 18;
  // Resource group managed by the external power provisioning service. During
  // creation, omission or an empty value creates no association.
  optional string power_resource_group = 19;
  // Selects SLAAC allocation mode for instance IPv6 interfaces in this VPC.
  // When true, this is supported only for FNN VPCs and Core allocates a /64 to
  // each interface that includes IPv6 without assigning a concrete IPv6 host
  // address. False or omission disables SLAAC. Core evaluates this value only
  // during VPC creation; `VpcUpdateRequest` cannot change the resulting policy.
  // NICo does not yet configure router advertisements; that support is tracked by
  // https://github.com/NVIDIA/infra-controller/issues/2398.
  optional bool slaac_enabled = 20;
}

enum VpcVirtualizationType {
  ETHERNET_VIRTUALIZER = 0;
  // 1 was previously FORGE_NATIVE_NETWORKING
  // ETHERNET_VIRTUALIZER_WITH_NVUE is deprecated. NVUE is now
  // implied; just use ETHERNET_VIRTUALIZER.
  ETHERNET_VIRTUALIZER_WITH_NVUE = 2 [deprecated = true];
  // Deprecated: FN_CLASSIC and FNN_L3 are deprecated now. Use FNN only.
  FNN_CLASSIC = 3;
  FNN_L3 = 4;
  FNN = 5;
  // FLAT is for VPCs whose tenant instances live directly on the underlay
  // (zero-DPU hosts, or hosts with their DPU in NIC mode). Their interfaces
  // are bound to `HostInband` network segments rather than a NICo-managed
  // overlay. Flat VPCs are still real tenant VPCs with a VNI and NSGs, but
  // NICo doesn't drive their data plane -- routing and ACL enforcement
  // between Flat VPCs and other VPCs is the network operator's
  // responsibility.
  FLAT = 6;
}

message VpcUpdateRequest {
  common.VpcId id = 1;
  // If the field here is set, the update will only be applied if the version
  // is equivalent to the current version on the NICo Site.
  // If a concurrent update changed the site configuration, the API will return
  // a `ConcurrentModificationError`.
  optional string if_version_match = 2;

  // CR question: To avoid the duplication between VpcUpdateRequest and
  // VpcCreationRequest and Vpc - we could move all user configurable fields into
  // a `message VpcConfig/VpcSettings`. However I don't feel like this would add
  // a lot for primitive types like Vpc.

  string name = 3; // Removed in v0.9.x and above, retained here for backwards compatibility
  reserved 4; // was tenantOrganizationId
  reserved 5; // was tenantKeysetId

  // New Metadata to be utilized by the vpc
  Metadata metadata = 6;

  // Sets the desired NSG ID for a VPC
  optional string network_security_group_id  = 17;

  // The ID of the default NVLink Logical Partition for a VPC. This is the
  // NVLink Logical Partition that will be used by default for all instances in the VPC.
  optional common.NVLinkLogicalPartitionId default_nvlink_logical_partition_id = 18;

  // Replaces the current inline routing-profile definition when present.
  // Properties left unset inherit from the named base profile rather than the
  // previous inline definition. Omit this field to preserve the current
  // definition; send an empty message to restore inheritance for every property.
  optional VpcRoutingProfileOverrides routing_profile_overrides = 19;
  // External power provisioning resource group update. Omit this field to
  // preserve the current association, send an empty string to remove it, or
  // send a non-empty value to replace it.
  optional string power_resource_group = 20;
}

message VpcUpdateResult {
  Vpc vpc = 1;
}

message VpcUpdateVirtualizationRequest {
  // id is the VpcId
  common.VpcId id = 1;

  // If the field here is set, the update will only be applied if the version
  // is equivalent to the current version on the NICo Site.
  // If a concurrent update changed the site configuration, the API will return
  // a `ConcurrentModificationError`.
  optional string if_version_match = 2;

  // Development or maintenance operation. The only supported use migrates a
  // legacy ETHERNET_VIRTUALIZER VPC with no instances to FNN. Quiesce instance
  // allocation into that VPC before starting and until completion. Do not
  // transition an existing FNN or FLAT VPC, or transition any VPC to FLAT.
  optional VpcVirtualizationType network_virtualization_type = 3;
}

