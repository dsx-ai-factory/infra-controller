  bool allow_override = 8;
  bool phone_home_enabled = 9;
  optional string user_data = 10;
  string created = 11;
  string updated = 12;

  // Variant: ipxe
  optional string ipxe_script = 20;
  // Variant: ipxe_os_definition
  optional common.IpxeTemplateId ipxe_template_id = 22;
  repeated IpxeTemplateParameter ipxe_template_parameters = 23;
  repeated IpxeTemplateArtifact ipxe_template_artifacts = 24;
  optional string ipxe_template_definition_hash = 25;
}

