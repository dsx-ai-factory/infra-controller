message FirmwareUpgradeActivity {
  // SOT JSON string passed to the backend.
  // Explicit firmware-upgrade maintenance requests must set this.
  // Implicit all-activity maintenance skips firmware update when no JSON is configured.
  string firmware_version = 1;
  // Firmware components to update (e.g. "BMC", "CPLD", "BIOS").
  // When empty, all components are updated.
  repeated string components = 2;
  // Used only by the backend for artifact download when firmware_version contains SOT JSON.
  // Optional. Omitted or empty values are passed to RMS as "NOAUTH".
  // NICo stores it as a maintenance credential, not in rack maintenance state.
  optional string access_token = 3;
  bool force_update = 4;
}

message NvosUpdateActivity {
  reserved 1;
  reserved "firmware_object_id";
  // SOT JSON string passed to RMS ApplySwitchSystemImage.
  // Required for nvos-update activity.
  string config_json = 2;
  // Used only by the backend for artifact download when config_json is set.
  // Optional. Omitted or empty values are passed to RMS as "NOAUTH".
  // NICo stores it as a maintenance credential, not in rack maintenance state.
  optional string access_token = 3;
}

message ConfigureNmxClusterActivity {
  // Per-activity configuration (extend as needed).
}

message PowerSequenceActivity {
  // Per-activity configuration (extend as needed).
}

// A single maintenance activity with its per-activity configuration.
// The oneof discriminant identifies the activity type.
message MaintenanceActivityConfig {
  oneof activity {
    FirmwareUpgradeActivity firmware_upgrade = 1;
    ConfigureNmxClusterActivity configure_nmx_cluster = 2;
    PowerSequenceActivity power_sequence = 3;
    NvosUpdateActivity nvos_update = 4;
  }
}

// Scope of an on-demand rack maintenance request: which devices to include
// and which activities to run. When all three device-id lists are empty the
// full rack is maintained. When the activities list is empty all activities
// are run.
message RackMaintenanceScope {
  repeated string machine_ids = 1;
  repeated string switch_ids = 2;
  repeated string power_shelf_ids = 3;
  // Which maintenance activities to run. Empty means all activities.
  repeated MaintenanceActivityConfig activities = 4;
}

// On-demand rack maintenance – supports full-rack or partial (subset of
// machines, switches, power shelves).  When `scope` is unset, or all of its
// device-id lists are empty, the full rack is maintained.
message RackMaintenanceOnDemandRequest {
  common.RackId rack_id = 1;
  RackMaintenanceScope scope = 2;
}

