  repeated MachineIbInterface ib_interfaces = 1;
  // When the IB status was last observed
  optional google.protobuf.Timestamp observed_at = 2;
}

// Observed state of a single IB interface
// This is the information that NICo collects from UFM
message MachineIbInterface {
  // The GUID of the hardware device that this interface is attached to
  optional string pf_guid = 1;

  // The GUID which has been assigned to this interface
  // In case the interface is a PF interface, the GUID will be equivalent to
  // `pf_guid` - which is the GUID that is stored on the hardware device.
  // For a VF interface, this is a GUID that has been allocated by NICo in order
  // be used for the VF.
  // Tenants have to configure the VF device on their instances to use this GUID.
  optional string guid = 2;

  // The local id of this IB interface; if interface configuration has not been completed, the value is 0.
  // This value is 0xffff for devices in non active state.
  optional uint32 lid = 11;

  // The ID of the fabric on which the GUID has been observed
  // This is empty if the GUID hasn't been observed on any fabric
  optional string fabric_id = 3;

  reserved 4; // used for associated_pkeys in a different format in a previous release

  // Partition keys currently associated with the interface at UFM
  // The value of this field is null in case the associated_pkeys could not be determined
  // The value is an empty list in case there are no pkeys associated with the interface
  optional common.StringList associated_pkeys = 5;

  // Partition IDs currently associated with the interface at UFM
  // None means the associated pkeys could not be determined.
  // The amount of IDs can be different than the amount of `associated_pkeys`
  // in case a pkey that is associated with the port does not map to any
  // partition ID.
  optional common.StringList associated_partition_ids = 6;
}

message DhcpDiscovery {
  string mac_address = 1;
  string relay_address = 2;
  optional string vendor_string = 3;
  optional string link_address = 4;
  optional string circuit_id = 5;
  optional string remote_id = 6;
  optional string desired_address = 7;
  // DHCP protocol family for this request.
  // Omit only for legacy callers; the service infers the family from relay/link
  // addresses. If present, ADDRESS_FAMILY_UNSPECIFIED is invalid.
  // When either address_family or message_kind is present, both must be present,
  // specified, and compatible.
  optional AddressFamily address_family = 8;
  // DHCP message kind for this request.
  // Omit only for legacy callers. If present, MESSAGE_KIND_UNSPECIFIED is invalid.
  // ADDRESS_FAMILY_V4 is valid only with MESSAGE_KIND_V4_DISCOVER.
  // ADDRESS_FAMILY_V6 is valid only with MESSAGE_KIND_V6_SOLICIT,
  // MESSAGE_KIND_V6_REQUEST, or MESSAGE_KIND_V6_INFO_REQUEST.
  // Mismatched pairs, such as ADDRESS_FAMILY_V4 with MESSAGE_KIND_V6_SOLICIT,
  // are validation errors and must not be coerced.
  optional MessageKind message_kind = 9;
  // DHCPv6 client DUID.
  // Must be present and non-empty for DHCPv6 requests, including all V6
  // MessageKind values and any request with ADDRESS_FAMILY_V6.
  // Must be absent for DHCPv4 requests.
  optional bytes duid = 10;
}

// IP address family.
enum AddressFamily {
  // No address family selected. Invalid in fields that require an explicit family.
  ADDRESS_FAMILY_UNSPECIFIED = 0;
  // IPv4.
  ADDRESS_FAMILY_V4 = 1;
  // IPv6.
  ADDRESS_FAMILY_V6 = 2;
}

// DHCP message type used to validate DhcpDiscovery.address_family and duid.
// Field absence means legacy behavior; *_UNSPECIFIED means an explicit invalid
// value and is rejected when supplied.
enum MessageKind {
  // Invalid when explicitly supplied. Omit DhcpDiscovery.message_kind instead
  // when using legacy behavior.
  MESSAGE_KIND_UNSPECIFIED = 0;
  // DHCPv4 DISCOVER. Requires ADDRESS_FAMILY_V4 and forbids duid.
  MESSAGE_KIND_V4_DISCOVER = 1;
  // DHCPv6 SOLICIT. Requires ADDRESS_FAMILY_V6 and a non-empty duid.
  MESSAGE_KIND_V6_SOLICIT = 2;
  // DHCPv6 REQUEST. Requires ADDRESS_FAMILY_V6 and a non-empty duid.
  MESSAGE_KIND_V6_REQUEST = 3;
  // DHCPv6 Information-request. Requires ADDRESS_FAMILY_V6 and a non-empty duid.
  MESSAGE_KIND_V6_INFO_REQUEST = 4;
}

