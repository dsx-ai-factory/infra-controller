  ASSIGN_STATIC_ADDRESS_STATUS_REPLACED_STATIC = 1;
  ASSIGN_STATIC_ADDRESS_STATUS_REPLACED_DHCP = 2;
}

message AssignStaticAddressResponse {
  common.MachineInterfaceId interface_id = 1;
  string ip_address = 2;
  AssignStaticAddressStatus status = 3;
