        machineId:
          type:
            - string
            - 'null'
          description: ID of of specific Machine to use for Instance. Requires Targeted Instance Creation capability enabled for Tenant
        vpcId:
          type: string
          format: uuid
          description: ID of the VPC the Instance should belong to
