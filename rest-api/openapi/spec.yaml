    RackFilter:
      title: RackFilter
      type: object
      description: Filter criteria for selecting racks in batch operations. If omitted or empty, all racks in the site are targeted.
      properties:
        names:
          type: array
          items:
            type: string
          description: Filter racks by name
    TrayFilter:
      title: TrayFilter
      type: object
      description: |-
        Filter criteria for selecting trays in batch operations. If omitted or empty, all trays in the site are targeted.

        Constraints: `rackId` and `rackName` are mutually exclusive. `rackId`/`rackName` cannot be combined with `ids`/`componentIds`. `componentIds` requires `type`. `slotId` requires `rackId` or `rackName`, must be >= 0, and composes with the rest of the filter via AND.
      properties:
        rackId:
          type: string
          format: uuid
          description: Filter by Rack ID
        rackName:
          type: string
          description: Filter by Rack name
        type:
          type: string
          enum:
            - compute
            - switch
            - powershelf
          description: Filter by tray type
        componentIds:
          type: array
          items:
            type: string
          description: Filter by component ID. Requires 'type'.
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: Filter by tray UUID
        slotId:
          type: integer
          format: int32
          minimum: 0
          description: |-
            Restrict to trays at this rack slot (matches `position.slotId`). Requires `rackId` or `rackName`. Composes with the rest of the filter via AND.
    BatchUpdateRackPowerStateRequest:
      title: BatchUpdateRackPowerStateRequest
      type: object
      description: Request body for batch rack power control operations
      required:
        - siteId
        - state
      properties:
        siteId:
          type: string
          format: uuid
          description: ID of the Site
        filter:
          $ref: '#/components/schemas/RackFilter'
          description: 'Filter that selects Racks whose power state should be updated'
        state:
          type: string
          enum:
            - 'on'
            - 'off'
            - cycle
            - forceoff
            - forcecycle
          description: Target power state
        ruleId:
          type: string
          format: uuid
          description: |-
            Optional Operation Rule UUID. When set, pins every task spawned by
            this batch to the named rule and overrides Flow's default rule
            resolution.
        overrideReadinessCheck:
          type: boolean
          default: false
          description: |-
            When true, proceed even if one or more target components (or hosts
            on the owning rack for rack-scoped components) are reported as not
            ready by their persisted status. Intended for operator-supervised
            maintenance.
