        in: path
        required: true
        description: Name of the Org
    get:
      summary: Validate Trays
      operationId: validate-trays
      description: |-
        Validate Tray components by comparing expected vs actual state.

        If no filter is specified, validates all trays in the Site. Use rackId/rackName to scope to a specific rack, and name/manufacturer/type to filter by tray attributes.

        Compares the expected component configuration against the actual state. Returns a detailed diff report showing missing, extra, and mismatched components.

        Org must have an Infrastructure Provider entity. User must have authorization role with `PROVIDER_ADMIN` suffix.
      parameters:
        - schema:
            type: string
            format: uuid
          name: siteId
          in: query
          required: true
          description: ID of the Site
        - schema:
            type: string
            format: uuid
          name: rackId
          in: query
          required: false
          description: Scope to a specific Rack by ID (mutually exclusive with rackName)
        - schema:
            type: string
          name: rackName
          in: query
          required: false
          description: Scope to a specific Rack by name (mutually exclusive with rackId)
        - schema:
            type: string
          name: name
          in: query
          required: false
          description: Filter trays by name
        - schema:
            type: string
          name: manufacturer
          in: query
          required: false
          description: Filter trays by manufacturer
        - schema:
            type: string
            enum:
              - compute
              - switch
              - powershelf
          name: type
          in: query
          required: false
          description: Filter trays by type
        - schema:
            type: string
          name: componentId
          in: query
          required: false
          description: Filter by external component ID (requires type; mutually exclusive with rackId/rackName; use repeated params for multiple values)
        - schema:
            type: integer
            format: int32
            minimum: 0
          name: slotId
          in: query
          required: false
          description: |-
            Restrict validation to trays at this rack slot (matches `position.slotId`). Requires `rackId` or `rackName`. Composes with the rest of the filter via AND.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackValidationResult'
              examples:
                example-no-diffs:
                  value:
                    diffs: []
                    totalDiffs: 0
                    missingCount: 0
                    unexpectedCount: 0
                    mismatchCount: 0
                    matchCount: 10
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      tags:
        - Tray
