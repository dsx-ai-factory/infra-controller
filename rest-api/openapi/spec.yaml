        The `rackId` is an operator-supplied string identifier (not a UUID) that must be unique within the Site. Chassis identity and physical location information are conveyed via well-known label keys in `labels`:
        - `chassis.manufacturer`, `chassis.serial-number`, `chassis.model`
        - `location.region`, `location.datacenter`, `location.room`, `location.position`
      examples:
