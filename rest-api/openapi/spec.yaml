      operationId: get-all-machine
      description: |
        Get all Machines for Infrastructure Provider.

        Org must have an Infrastructure Provider entity. User must have authorization role with `PROVIDER_ADMIN` suffix.
      parameters:
        - schema:
            type: string
          in: query
          name: siteId
          description: Filter Machines by Site ID
        - schema:
            type: string
          in: query
          name: id
          description: Filter Machines by ID.  Can be specified multiple times to filter on more than one ID.
        - schema:
            type: boolean
          in: query
          name: hasInstanceType
          description: Filter Machines that have been assigned an Instance Type.
        - schema:
            type: string
          in: query
          name: instanceTypeId
          description: Filter Machines by Instance Type ID.  Can be specified multiple times to filter on more than one Instance Type ID.
        - schema:
            type: string
          in: query
          name: tenantId
          description: Filter Machines by ID of tenant of assigned instance. Can be specified multiple times to filter on more than one Tenant ID.
        - schema:
            type: boolean
          in: query
          name: hasInstance
          description: Filter Machines that are assigned to an Instance. siteId must be specified when using this param.
        - schema:
            type: boolean
          in: query
          name: isMissingOnSite
          description: Filter Machines that are missing on Site.
        - schema:
            type: boolean
          in: query
          name: includeMetadata
          description: 'Include Machine metadata e.g. BMC, DPU, GPU and Interface data. Can only be requested by Provider.'
        - schema:
            type: string
          in: query
          name: status
          description: Filter Machines by Status.  Can be specified multiple times to filter on more than one Status.
        - schema:
            type: string
          in: query
          name: capabilityType
          description: Filter Machines by Capability Type
        - schema:
            type: string
          in: query
          name: capabilityName
          description: Filter Machines by Capability Name.  Can be specified multiple times to filter on more than one Capability Name.
        - schema:
            type: string
          in: query
          name: hwSkuDeviceType
          description: 'Filter Machines by hardware SKU Device Type. Example values: "gpu", "cpu", "storage", "cache"'
        - schema:
            type: string
          in: query
          name: query
          description: 'Provide query to search for matches. Input will be matched against Machine ID, vendor, product name, hostname and status'
        - schema:
            type: string
            enum:
              - InfrastructureProvider
              - Site
              - InstanceType
          in: query
          name: includeRelation
          description: Related entity to expand
        - schema:
            type: integer
            example: 1
            default: 1
            minimum: 1
          in: query
          name: pageNumber
          description: Page number for pagination query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          in: query
          name: pageSize
          description: Page size for pagination query
        - schema:
            type: string
            enum:
              - STATUS_ASC
              - STATUS_DESC
              - CREATED_ASC
              - CREATED_DESC
              - UPDATED_ASC
              - UPDATED_DESC
              - ID_ASC
              - ID_DESC
          in: query
          name: orderBy
          description: Ordering for pagination query
