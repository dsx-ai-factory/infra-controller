openapi: 3.1.0
info:
  title: NVIDIA Infra Controller REST API
  version: 1.6.0
  summary: NVIDIA Infra Controller REST API is the RESTful gateway for accessing the NVIDIA Infra Controller service
  description: 'NVIDIA Infra Controller REST API allows users to create and manage resources, e.g., VPCs, Subnets, and Instances, across all connected NVIDIA Infra Controller datacenters, also referred to as Sites.'
  license:
    name: Apache-2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
  contact:
    name: NVIDIA Infra Controller Dev Team
servers:
  - url: 'https://nico-rest-api.nico.svc.cluster.local'
    description: Kubernetes Cluster
tags:
  - name: Getting Started
    description:  |-
      This section provides a quick overview of the API and how to get started.

      ### Authentication
      The first step is to authenticate using a JWT bearer token. Organization structures and roles depend on the authentication configuration used. For details on authentication, please consult the
      NICo REST `auth` module [README](https://github.com/NVIDIA/infra-controller/rest-api/tree/main/auth).

      ### API Version
      The next step is to be aware of the API version being used. The API version can be retrieved by calling the [Retrieve Metadata endpoint](#tag/Metadata/operation/get-metadata). In general, the API maintains backward
      compatibility with the previous versions. Any breaking changes are announced using a deprecation notice. Current and past deprecations are listed in the [Deprecations](#tag/Deprecations) section.

      ### Service Account Mode
      Depending on the auth configuration used, the NICo REST API may be configured in Service Account mode. In this mode, API users can act as both Provider and Tenant as part of the same organization.
      If this is the case, the user must first retrieve the Service Account by making a call to the [Retrieve Service Account endpoint](#tag/Service-Account/operation/get-current-service-account).
      For service accounts, the Tenant entity is initialized as a privileged Tenant with `targetedInstanceCreation` capability enabled.

      ### Provider or Tenant Mode
      If NICo REST API is not configured in Service Account mode, the user should retrieve the Infrastructure Provider by making a call to the [Retrieve Infrastructure Provider endpoint](#tag/Infrastructure-Provider/operation/get-current-infrastructure-provider)
      or the Tenant by making a call to the [Retrieve Tenant endpoint](#tag/Tenant/operation/get-current-tenant).

      In both cases, these calls initialize Provider and Tenant entities for the organization. All resources created are anchored to either the Provider or Tenant entity.

      Once the Provider and the Tenant are initialized, the user can create resources by making calls to the appropriate endpoints.

      ### Creating Site-Level IP Blocks
      To use a NICo Site, the Provider or Service Account holder must create IP Blocks for each network overlay defined in the Site configuration TOML file.

      To create an IP Block, the user must make a call to the [Create IP Block endpoint](#tag/IP-Block/operation/create-ipblock).

      > **Note:** From this point onwards, a brief outline is provided for the typical API call flows for various use cases.

      ### Typical API Call Flow for Service Account

      - Retrieve available Sites using the [Retrieve All Sites endpoint](#tag/Site/operation/get-all-site) and choose a Site to create resources in. For _Disconnected_ NICo installations where NICo
      REST is deployed alongside NICo Core, typically there will be a single Site available.
      - For each Site IP Block, create a Network Allocation for the Tenant entity with the full prefix length using the [Create Allocation endpoint](#tag/Allocation/operation/create-allocation).
      This will create a Tenant IP Block for each Site IP Block.
        - Creating an Allocation will create the Tenant in NICo Core.
      - Create a VPC using the [Create VPC endpoint](#tag/VPC/operation/create-vpc).
      - Create a VPC Prefix or Subnet referencing the VPC and a Tenant IP Block.
        - If the Site supports Native Networking (FNN), create a VPC Prefix using the [Create VPC Prefix endpoint](#tag/VPC-Prefix/operation/create-vpc-prefix).
        - Otherwise the user should create a Subnet using the [Create Subnet endpoint](#tag/Subnet/operation/create-subnet).
      - Create an Operating System using the [Create Operating System endpoint](#tag/Operating-System/operation/create-operating-system) specifying iPXE script and user data.
      - Retrieve available Machines on the Site using the [Retrieve All Machines endpoint](#tag/Machine/operation/get-all-machine).
      - Create an Instance specifying the VPC, VPC Prefix or Subnet, Operating System, and Machine.

      ### Typical API Call Flow for Provider

      - Create a Tenant Account using the [Create Tenant Account endpoint](#tag/Tenant-Account/operation/create-tenant-account). Provider must know the Tenant org name.
      - Once the Tenant has accepted the Tenant Account, the Provider can allocate resources to the Tenant.
      - Retrieve available Sites using the [Retrieve All Sites endpoint](#tag/Site/operation/get-all-site) and choose a Site to create resources in.
      - Create an Instance Type using the [Create Instance Type endpoint](#tag/Instance-Type/operation/create-instance-type).
      - Retrieve available Machines on the Site using the [Retrieve All Machines endpoint](#tag/Machine/operation/get-all-machine).
      - Update a Machine's Instance Type using the [Update Machine endpoint](#tag/Machine/operation/update-machine) or assign multiple Machines to an Instance Type using the
      [Create Instance Type/Machine Association endpoint](#tag/Instance-Type/operation/create-instance-type-machine-association)
      - Create a Compute Allocation for Tenant using the [Create Compute Allocation endpoint](#tag/Allocation/operation/create-allocation) referencing the Instance Type.
        - Creating any type of Allocation for a Tenant will create the Tenant in NICo Core.
      - Create a Network Allocation for Tenant using the [Create Allocation endpoint](#tag/Allocation/operation/create-allocation) referencing a Site IP Block.
        - Creating a Network Allocation will create a Tenant IP Block.

      ### Typical API Call Flow for Tenant

      - Accept the Tenant Account using the [Update Tenant Account endpoint](#tag/Tenant-Account/operation/update-tenant-account).
      - Retrieve available Sites using the [Retrieve All Sites endpoint](#tag/Site/operation/get-all-site) and choose a Site to create resources in. Any Site where the Tenant
      has an Allocation will be returned.
      - Create a VPC using the [Create VPC endpoint](#tag/VPC/operation/create-vpc).
      - Retrieve available Site IP Blocks using the [Retrieve All IP Blocks endpoint](#tag/IP-Block/operation/get-all-ipblock). Any IP Block for which the Tenant has received
      a Network Allocation from the Provider will be returned.
      - Create a VPC Prefix or Subnet referencing the VPC and a Tenant IP Block.
        - If the Site supports Native Networking (FNN), create a VPC Prefix using the [Create VPC Prefix endpoint](#tag/VPC-Prefix/operation/create-vpc-prefix).
        - Otherwise the user should create a Subnet using the [Create Subnet endpoint](#tag/Subnet/operation/create-subnet).
      - Create an Operating System using the [Create Operating System endpoint](#tag/Operating-System/operation/create-operating-system) specifying iPXE script and user data.
      - Retrieve available Instance Types using the [Retrieve All Instance Types endpoint](#tag/Instance-Type/operation/get-all-instance-type). Any Instance Type for which
      the Tenant has received a Compute Allocation from the Provider will be returned.
      - Create an Instance specifying the VPC, VPC Prefix or Subnet, Operating System, and Instance Type.

  - name: Service Account
    description: |-
      When the API service is configured in Service Account mode, API users can act as both Provider and Tenant. For service accounts, the Tenant entity is initialized as a
      privileged Tenant with `targetedInstanceCreation` capability enabled.
  - name: Infrastructure Provider
    description: |-
      Infrastructure Provider is the anchor entity for an organization that owns and manages Site resources.
  - name: Tenant
    description: |-
      Tenant is the anchor entity for an organization that consumes Network and Compute resources on a Site.
  - name: Tenant Account
    description: |-
      Tenant Account connects a Tenant with an Infrastructure Provider. It represents/contains any information pertaining to their relationship.

      Deprecation history:

      - `accountNumber`, `subscriptionId`, and `subscriptionTier` attributes were deprecated and will be removed on July 9th, 2026 0:00 UTC. Please update your usage accordingly.
  - name: Site
    description: |-
      Site is a datacenter that contains physical hardware and networking resources. All resources created by Provider or Tenant are directly or indirectly anchored to the Site object.

      Recent deprecations:

      - `rackLevelAdministration` capability attribute was deprecated in favor of `flow` and was removed on May 13th, 2026 0:00 UTC. Please use `flow` instead.
      - `isRackLevelAdministrationEnabled` query parameter was deprecated in favor of `isFlowEnabled` and was removed on May 13th, 2026 0:00 UTC. Please use `isFlowEnabled` instead.
  - name: Allocation
    description: |-
      Allocations are the mechanism by which Provider can delegate Network and Compute resources to Tenant.

      Deprecation history:

      - `ResourceTypeID` attribute on Allocation Constraint was deprecated in favor of `resourceTypeId` and will be removed on July 9th, 2026 0:00 UTC. Please use `resourceTypeId` instead.
  - name: VPC
    description: |-
      VPC defines the networking isolation boundary for Tenant's Instances.
  - name: VPC Peering
    description: |-
      VPC Peering allows Instances in one VPC to communicate with Instances in another VPC on the same Site.
  - name: VPC Prefix
    description: |-
      VPC Prefix is a network prefix belonging to an IP Block allocated to a Tenant. Tenant can use VPC Prefixes to enable network connectivity between their Instances.

      Only Sites that support Native Networking (FNN) offer VPC Prefix management.
  - name: Subnet
    description: |-
      Subnet is a network prefix belonging to an IP Block allocated to a Tenant. Tenant can use Subnets to enable network connectivity between their Instances.

      Subnets are used on Sites that do not support Native Networking (FNN).
  - name: Expected Machine
    description: |-
      Expected Machine identifies a Machine that is expected to be discovered at a Site. Infrastructure Providers can pre-register Expected Machines using BMC credentials
      and serial numbers to help with Machine discovery and ingestion.
  - name: Expected Power Shelf
    description: |-
      Expected Power Shelf identifies a Power Shelf that is expected to be discovered at a Site. Infrastructure Providers can pre-register Expected Power Shelves using BMC
      credentials and serial numbers to help with Power Shelf discovery and ingestion.
  - name: Expected Rack
    description: |-
      Expected Rack identifies a Rack that is expected to be discovered at a Site. Infrastructure Providers can pre-register Expected Racks with an operator-supplied
      rack identifier and a Rack Profile reference to help with Rack discovery and ingestion. Chassis identity and physical location information are conveyed via
      well-known label keys (`chassis.manufacturer`, `chassis.serial-number`, `chassis.model`, `location.region`, `location.datacenter`, `location.room`, `location.position`).
  - name: Expected Switch
    description: |-
      Expected Switch identifies an NVLink Switch that is expected to be discovered at a Site. Infrastructure Providers can pre-register Expected Switches using BMC, NVOS credentials
      and serial numbers to help with NVLink Switch discovery and ingestion.
  - name: SKU
    description: |-
      SKU (Stock Keeping Unit) defines one or more hardware configurations or Machine Bill of Materials (BOM).

      SKUs are automatically derived from machine hardware characteristics and used to group similar machines. SKUs are read-only and managed by the system.
  - name: InfiniBand Partition
    description: |-
      InfiniBand (IB) is a high-performance, low-latency networking standard designed for interconnecting servers and storage in HPC (High-Performance Computing) and AI systems,
      utilizing RDMA (Remote Direct Memory Access) to reduce CPU overhead. InfiniBand Partitions are used to group Machines into logical partitions for network isolation and load distribution.
  - name: NVLink Logical Partition
    description: |-
      NVLink Logical Partitions are used to group GPUs into logical partitions for shared memory and low-latency direct communication between GPUs.

      Deprecation history:

      - `nvLinklogicalPartitionId` attribute on NVLink Interface was deprecated in favor of `nvLinkLogicalPartitionId` and will be removed on July 9th, 2026 0:00 UTC. Please use `nvLinkLogicalPartitionId` instead.
  - name: Operating System
    description: |-
      Operating Systems in NICo are typically iPXE scripts that are used to boot Machines.
  - name: Instance Type
    description: |-
      Instance Types allow grouping Machines into a pool defined by their capabilities. Providers can then allocate a portion of the Instance Type pool to a Tenant.
  - name: Instance
    description: |-
      Instance is a Machine provisioned with an Operating System by a Tenant and attached to one or more VPC Prefixes or Subnets.
  - name: Machine
    description: |-
      Machine is a physical server that contains CPUs, GPUs, memory, storage, and networking hardware. Machines are the physical building blocks of a Site.
  - name: Machine Capability
    description: |-
      Machine Capability defines the hardware capabilities of a Machine. Machine Capabilities can be used to group Machines into Instance Types.
  - name: Rack
    description: |-
      Rack is a physical enclosure that contains a number of Machines. Racks are the physical building blocks of a Site.
  - name: Tray
    description: |-
      Tray represents a component within a Rack.
  - name: Task
    description: |-
      Task represents an asynchronous, site-scoped operation (for example firmware update, power state change, or rack bring-up). Tasks are created when operations run against Racks, Trays, or other components. Endpoints in this tag retrieve or cancel a Task by ID; list Tasks for a Rack or Tray under the Rack and Tray tags.
  - name: Rule
    description: |-
      Operation Rule defines, per Site, how a particular operation (for example `PowerControl` / `power_on` or `FirmwareControl` / `upgrade`) should be executed against a set of components: ordered execution stages, per-component-type concurrency, pre / main / post actions, timeouts, and retry policy. Rules are reusable templates owned by Flow; this tag exposes CRUD (`POST`, `GET`, `PATCH`, `DELETE`) over them.
  - name: Network Security Group
    description: |-
      Network Security Group is a security policy that controls the traffic flowing between Instances.

      Deprecation history:

      - `object_id` attribute on Network Security Group propagation details was deprecated in favor of `objectId` and will be removed on July 9th, 2026 0:00 UTC. Please use `objectId` instead.
  - name: IP Block
    description: |-
      IP Block is a contiguous block of IP addresses defined by a prefix and prefix length.

      It can be used by the Provider to describe the overlay network of a particular Site. Providers can also use Allocations to delegate portions of these IP Blocks to Tenants.
  - name: DPU Extension Service
    description: |-
      DPU Extension Service allows users to run custom services in the DPUs of their Instances. Currently K8s pods are the only supported service type.
  - name: SSH Key Group
    description: |-
      SSH Key Groups allow grouping several SSH Keys together so they can be synced to Sites and used to access the Serial Console of Instances.
  - name: SSH Key
    description: |-
      SSH Key is a public key that can be used to access the Serial Console of an Instance.
  - name: User
    description: |-
      User is a logical entity that identifies individuals operating on behalf of an organization.
  - name: Audit
    description: |-
      Audit is a record of actions taken by users on the API.
  - name: Metadata
    description: |-
      Metadata describes various system-level attributes of the API service.
  - name: Tenant Identity
    description: |-
      Tenant identity (JWT-SVID issuance) and RFC 8693 token delegation.

      Tenant Admins use these endpoints to enable JWT-SVID issuance for an
      org on a specific site, rotate the signing key, configure a token
      exchange callback, and serve the public JWKS / OIDC discovery
      documents that verifiers (OpenBao, tenant APIs, etc.) consume.

      The six management endpoints (PUT / GET / DELETE on `tenant-identity/config`
      and `tenant-identity/token-delegation`) require an authorization role with
      `TENANT_ADMIN` suffix in the URL `{org}`. The three `.well-known/*`
      endpoints are public; external verifiers can fetch public keys
      without credentials.

      PUT is a full-replace upsert: every call must include all required
      fields, and omitted optional fields are cleared. To pause issuance
      without destroying signing keys, PUT with `enabled: false`; to
      destroy the signing keypair, use DELETE. Signing keys survive
      `enabled: false` and survive non-rotation upserts, so JWKS consumers
      and in-flight JWTs continue to verify across pauses and attribute
      changes.

      JWKS verifiers should treat every key in the returned set as valid
      and match candidates by `kid` — during a key-rotation overlap
      window two keys are present until the previous key expires. The
      OIDC discovery endpoint's `id_token_signing_alg_values_supported`
      is intentionally empty because NICo issues bearer access JWTs,
      not OIDC `id_token`s. The three public endpoints return
      `404 Not Found` when identity material cannot be served for this
      org/site (unknown site, org is not a tenant, no tenant allocation
      on the site, or no identity configuration); the two JWKS routes
      additionally return `502 Bad Gateway` when the Core gRPC API
      responds with a body that is not a parseable JWK Set.
  - name: Deprecations
    description: |-
      NICo REST API maintains backward compatibility with the previous versions. Any breaking changes are announced using deprecation notices.

      Active Deprecations:

      - Currently there are no active deprecations

      Recent Deprecations:

      Site:
      - `rackLevelAdministration` capability attribute was deprecated in favor of `flow` and was removed on May 13th, 2026 0:00 UTC. Please use `flow` instead.
      - `isRackLevelAdministrationEnabled` query parameter was deprecated in favor of `isFlowEnabled` and was removed on May 13th, 2026 0:00 UTC. Please use `isFlowEnabled` instead.
paths:
  '/v2/org/{org}/nico/service-account/current':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve Service Account status for current org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-current-service-account
      description: |-
        Retrieve Service Account status for current org

        API service must be configured for Service Account access at the time of deployment. It cannot be enabled or disabled via API.
      parameters: []
      tags:
        - Service Account
  '/v2/org/{org}/nico/infrastructure-provider/current':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve Infrastructure Provider for current Org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureProvider'
              examples:
                example-1:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    org: rf43bbtnb9c5
                    orgDisplayName: Dell Corporation
                    created: '2019-08-24T14:15:22Z'
                    updated: '2019-08-24T14:15:22Z'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-current-infrastructure-provider
      description: |-
        Retrieve Infrastructure Provider entity for current Org.

        User must have authorization role with `PROVIDER_ADMIN` suffix.
      parameters: []
      tags:
        - Infrastructure Provider
  '/v2/org/{org}/nico/infrastructure-provider/current/stats':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve Stats for current Infrastructure Provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureProviderStats'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-current-infrastructure-provider-stats
      description: |-
        Retrieve stats for current Infrastructure Provider.

        User must have authorization role with `PROVIDER_ADMIN` suffix.
      parameters: []
      tags:
        - Infrastructure Provider
  '/v2/org/{org}/nico/tenant/current':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve Tenant for current Org
      tags:
        - Tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              examples:
                example-1:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    org: qygdmg8oqik8
                    orgDisplayName: Echo Corporation
                    created: '2019-08-24T14:15:22Z'
                    updated: '2019-08-24T14:15:22Z'
                    capabilities:
                      targetedInstanceCreation: false
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-current-tenant
      description: |-
        Retrieve Tenant entity for current Org.

        User must have authorization role with `TENANT_ADMIN` suffix.
      parameters: []
  '/v2/org/{org}/nico/tenant/current/stats':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve Stats for current Tenant
      tags:
        - Tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStats'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-current-tenant-stats
      description: |-
        Retrieve stats for current Tenant.

        User must have authorization role with `TENANT_ADMIN` suffix.
      parameters: []
  '/v2/org/{org}/nico/tenant/account':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
    get:
      summary: Retrieve all Tenant Accounts
      tags:
        - Tenant Account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantAccount'
              examples:
                example-1:
                  value:
                    - id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                      infrastructureProviderId: e94bcfda-f6cb-42e4-80ec-516811e5abbf
                      infrastructureProviderOrg: xskkpgqpeakn
                      tenantId: f97df110-f4de-492e-8849-4a6af68026b0
                      tenantOrg: rf43bbtnb9c5
                      tenantContact:
                        id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                        email: janed@nvidia.com
                        firstName: Jane
                        lastName: Doe
                        created: '2019-08-24T14:15:22Z'
                        updated: '2019-08-24T14:15:22Z'
                      allocationCount: 0
                      status: Pending
                      statusHistory:
                        - status: Pending
                          message: 'Request received, pending processing'
                          created: '2019-08-24T14:15:22Z'
                          updated: '2019-08-24T14:15:22Z'
                      created: '2019-08-24T14:15:22Z'
                      updated: '2019-08-24T14:15:22Z'
          headers:
            X-Pagination:
              schema:
                type: string
                example: '{"pageNumber":1,"pageSize":20,"total":30,"orderBy": "CREATED_DESC"}'
              description: Pagination result in JSON format
        '403':
          $ref: '#/components/responses/ForbiddenError'
      operationId: get-all-tenant-account
      description: |-
        Retrieve all Tenant Accounts for the org.

        The Infrastructure Provider and Tenant are inferred from the org's membership. User must have authorization role with `PROVIDER_ADMIN`, `PROVIDER_VIEWER`, or `TENANT_ADMIN` suffix.
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: infrastructureProviderId
          deprecated: true
          description: "Filter Tenant Accounts by Infrastructure Provider ID. Deprecated: Infrastructure Provider is now inferred from the org's membership."
        - schema:
            type: string
            format: uuid
          in: query
          name: tenantId
          description: Filter Tenant Accounts by Tenant ID
        - schema:
            type: string
          in: query
          name: query
          description: 'Search string to filter Tenant Accounts by account number, tenant org, or tenant org display name'
        - schema:
            type: string
            enum:
              - InfrastructureProvider
              - Tenant
          in: query
          name: includeRelation
          description: Related entity to expand
        - schema:
            type: integer
            example: 1
            default: 1
            minimum: 1
          in: query
          name: pageNumber
          description: Page number for pagination query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          in: query
          name: pageSize
          description: Page size for pagination query
        - schema:
            type: string
            enum:
              - STATUS_ASC
              - STATUS_DESC
              - CREATED_ASC
              - CREATED_DESC
              - UPDATED_ASC
              - UPDATED_DESC
              - ACCOUNT_NUMBER_ASC
              - ACCOUNT_NUMBER_DESC
              - TENANT_ORG_NAME_ASC
              - TENANT_ORG_NAME_DESC
              - TENANT_ORG_DISPLAY_NAME_ASC
              - TENANT_ORG_DISPLAY_NAME_DESC
              - TENANT_CONTACT_EMAIL_ASC
              - TENANT_CONTACT_EMAIL_DESC
              - TENANT_CONTACT_FULL_NAME_ASC
              - TENANT_CONTACT_FULL_NAME_DESC
          in: query
          name: orderBy
          description: Ordering for pagination query
    post:
      summary: Create Tenant Account
      operationId: create-tenant-account
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAccount'
              examples:
                example-1:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    infrastructureProviderId: e94bcfda-f6cb-42e4-80ec-516811e5abbf
                    infrastructureProviderOrg: xskkpgqpeakn
                    tenantId: null
                    tenantOrg: rf43bbtnb9c5
                    tenantContact:
                      id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                      email: janed@nvidia.com
                      firstName: Jane
                      lastName: Doe
                      created: '2019-08-24T14:15:22Z'
                      updated: '2019-08-24T14:15:22Z'
                    allocationCount: 0
                    status: Pending
                    statusHistory:
                      - status: Pending
                        message: 'Request received, pending processing'
                        created: '2019-08-24T14:15:22Z'
                        updated: '2019-08-24T14:15:22Z'
                    created: '2019-08-24T14:15:22Z'
                    updated: '2019-08-24T14:15:22Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      description: |-
        Create a Tenant Account.

        Org must have an Infrastructure Provider entity. User must have authorization role with `PROVIDER_ADMIN` suffix. The Infrastructure Provider is inferred from the caller's org; the deprecated `infrastructureProviderId` request body field is optional and, when provided, must match the org's Infrastructure Provider.

