        labels:
          $ref: '#/components/schemas/Labels'
          description: 'User-defined key-value labels'
        interfaces:
          type: array
          description: 'At least one interface must be specified unless `autoNetwork` is true. Either Subnet or VPC Prefix interfaces allowed. Only one of the Subnets or VPC Prefixes can be attached over Physical interface. If only one Subnet is specified, then it will be attached over physical interface regardless of the value of isPhysical. In case of VPC Prefix, isPhysical will always be true. Mutually exclusive with `autoNetwork`: when `autoNetwork` is true this list MUST be empty.'
          items:
            $ref: '#/components/schemas/InterfaceCreateRequest'
        autoNetwork:
          type: boolean
          description: 'When true, asks NICo to auto-resolve the Instance''s network interfaces from the host''s underlay (HostInband) network segments. Intended for instances on zero-DPU hosts (or hosts with their DPU in NIC mode). When true: (1) the target VPC''s `networkVirtualizationType` MUST be `FLAT`, (2) `interfaces` MUST be empty or omitted, and (3) `secondaryVpcIds` MUST be empty or omitted. Resolved interfaces surface on the Instance''s read response.'
        infinibandInterfaces:
          type: array
          description: Associate one or more Partitions with this Instance
          items:
            $ref: '#/components/schemas/InfiniBandInterfaceCreateRequest'
        dpuExtensionServiceDeployments:
          type: array
          description: DPU Extension Services to deploy to the DPUs of this Instance
          items:
