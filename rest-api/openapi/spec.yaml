    MachineOnlineRepairPolicy:
      title: MachineOnlineRepairPolicy
      type: object
      required:
        - allowAutoInstanceDeletionOnFailure
      properties:
        allowAutoInstanceDeletionOnFailure:
          type: boolean
          description: When true, escalation to offline breakfix (permanent delete / deallocate) is allowed if online repair cannot be completed.
    MachineOnlineRepairAcknowledgments:
      title: MachineOnlineRepairAcknowledgments
      type: object
      required:
        - acceptDataCorruptionRisk
        - acceptRepairTeamAccess
        - acceptInstanceDeletionRisk
      properties:
        acceptDataCorruptionRisk:
          type: boolean
          enum: [true]
          description: Tenant confirms data may be corrupted during repair.
        acceptRepairTeamAccess:
          type: boolean
          enum: [true]
          description: Tenant confirms the dedicated repair team will have access to the instance.
        acceptInstanceDeletionRisk:
          type: boolean
          enum: [true]
          description: Tenant confirms risk of instance deletion if escalation to offline breakfix occurs.
    MachineOnlineRepair:
      title: MachineOnlineRepair
      type: object
      required:
        - enabled
      description: |-
        Enable or disable online repair of a Machine. Online repair facilitates repairing a Machine without the Tenant having to release the Machine by deleting the Instance. When `enabled` is true, `policy` and `acknowledgments` are required inside this object,
        and `healthIssue` is required at the top level of the MachineUpdateRequest. When `enabled` is false, none of those fields may be set.
      properties:
        enabled:
          type: boolean
          description: |-
            When true, initiates the online repair process by sending a merge-mode health override with source: `request-online-repair` and sets the associated Instance status to Repairing.
            When false, exits online repair by clearing the merge-mode health override and returns the Instance to Ready status. Cannot be combined with instance type, maintenance, or label updates in the same request.
        policy:
          $ref: '#/components/schemas/MachineOnlineRepairPolicy'
          description: 'Online repair policy to apply to the Machine'
        acknowledgments:
          $ref: '#/components/schemas/MachineOnlineRepairAcknowledgments'
          description: 'Acknowledgments required before online repair can proceed'
    MachineUpdateRequest:
      title: MachineUpdateRequest
      type: object
      examples:
        - instanceTypeId: 2e016c02-2c67-48aa-b289-5d3ca6320c52
        - clearInstanceType: true
        - setMaintenanceMode: true
          maintenanceMessage: Machine requires re-cabling to connect with revised underlay network. Estimated maintenance time is 2 days
        - setMaintenanceMode: false
        - labels:
            RackIdentifier: GVX11F01C02
            ServerName: SITE1-C03-Server-02
            RepairStatus: InProgress
        - onlineRepair:
            enabled: true
            policy:
              allowAutoInstanceDeletionOnFailure: false
            acknowledgments:
              acceptDataCorruptionRisk: true
              acceptRepairTeamAccess: true
              acceptInstanceDeletionRisk: true
        - healthIssue:
            category: Storage
            summary: Disk errors on OSD
            details: 'Ticket FORGE-12345; smartctl logs attached'
      description: 'Request data to update Machine. Instance Type attribute updates, maintenance attribute updates, labels updates, and in-pool online repair (enter or exit) must be specified in separate requests. They cannot be processed at the same time.'
      properties:
        instanceTypeId:
          type:
            - string
            - 'null'
          minLength: 2
          maxLength: 256
          format: uuid
          description: Update the Instance Type of the Machine. Cannot be specified when clearing Instance Type. Can only be updated by Provider.
        clearInstanceType:
          type:
            - boolean
            - 'null'
          description: Set to true to clear the existing Instance Type. Cannot be specified if Instance Type ID is specified. Can only be set by Provider.
        setMaintenanceMode:
          type:
            - boolean
            - 'null'
          description: Set to `true` to enable maintenance mode and to `false` to disable maintenance mode. Can be set by Provider or Privileged Tenant.
        maintenanceMessage:
          type:
            - string
            - 'null'
          description: Optional message describing the reason for moving Machine into maintenance mode. Can be updated by Provider or Privileged Tenant.
          minLength: 5
          maxLength: 256
        labels:
          description: 'Machine labels will be overwritten, include existing labels to preserve them. Can be updated by Provider or Privileged Tenant.'
          $ref: '#/components/schemas/Labels'
        onlineRepair:
          $ref: '#/components/schemas/MachineOnlineRepair'
          description: 'Request to enter/exit online repair'
        healthIssue:
          description: Required when `onlineRepair.enabled` is true. Must not be set when exiting online repair (`onlineRepair.enabled` false).
          $ref: '#/components/schemas/MachineHealthIssue'
