    get:
      summary: Retrieve all Trays
      operationId: get-all-tray
      description: |-
        Get all Trays (components) for the specified Site.

        Org must have an Infrastructure Provider entity. User must have authorization role with `PROVIDER_ADMIN` suffix.

        **Filter constraints:**
        - `rackId` and `rackName` are mutually exclusive
        - `rackId`/`rackName` cannot be combined with `id`/`componentId` (rack-level vs component-level targeting)
        - `componentId` requires `type` to be specified
        - `slotId` restricts to trays at that rack slot, requires `rackId` or `rackName`, and composes with the rest of the query via AND
      parameters:
        - schema:
            type: string
            format: uuid
          name: siteId
          in: query
          required: true
          description: ID of the Site to retrieve Trays from
        - schema:
            type: string
            format: uuid
          name: rackId
          in: query
          description: Filter by Rack ID
        - schema:
            type: string
          name: rackName
          in: query
          description: Filter by Rack name
        - schema:
            type: string
            enum:
              - compute
              - switch
              - powershelf
          name: type
          in: query
          description: Filter by tray type
        - schema:
            type: string
          name: componentId
          in: query
          description: Filter by component ID. Can be specified multiple times to filter on more than one component ID. Requires 'type' parameter.
        - schema:
            type: string
            format: uuid
          name: id
          in: query
          description: Filter by tray UUID. Can be specified multiple times to filter on more than one tray ID.
        - schema:
            type: integer
            format: int32
            minimum: 0
          name: slotId
          in: query
          description: |-
            Restrict to trays at this rack slot (matches `position.slotId`). Requires `rackId` or `rackName`. Composes with the rest of the filter via AND.
        - schema:
            type: integer
            example: 1
            default: 1
            minimum: 1
          in: query
          name: pageNumber
          description: Page number for pagination query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          in: query
          name: pageSize
          description: Page size for pagination query
        - schema:
            type: string
            enum:
