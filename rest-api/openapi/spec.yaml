    ExpectedRackList:
      title: ExpectedRackList
      type: object
      description: |-
        Replace-all request body for Expected Racks. The `expectedRacks` array contains the full desired set of Expected Racks for the Site identified by `siteId`. All entries must reference the same `siteId` as the top-level field, and `rackId` values must be unique within the request. The array may be empty to clear all Expected Racks for the Site.
      examples:
        - siteId: f97df110-f4de-492e-8849-4a6af68026b0
          expectedRacks:
            - siteId: f97df110-f4de-492e-8849-4a6af68026b0
              rackId: rack-01
              rackProfileId: rp-standard-42u
              name: Rack 01
              description: Production rack in row A
              labels:
                chassis.manufacturer: NVIDIA
                chassis.serial-number: NVRK0001001
                chassis.model: GB200-NVL72
                location.datacenter: phx-dc01
                location.position: A1
            - siteId: f97df110-f4de-492e-8849-4a6af68026b0
              rackId: rack-02
              rackProfileId: rp-standard-42u
              name: Rack 02
              description: Production rack in row A
              labels:
                chassis.manufacturer: NVIDIA
                chassis.serial-number: NVRK0001002
                chassis.model: GB200-NVL72
                location.datacenter: phx-dc01
                location.position: A2
      properties:
        siteId:
          type: string
          format: uuid
          description: ID of the Site whose Expected Racks should be replaced
        expectedRacks:
          type: array
          description: |-
            The full desired set of Expected Racks for the Site. Every entry must reference the same `siteId` as the top-level field, and `rackId` values must be unique within the request. May be empty to clear all Expected Racks for the Site.
          items:
            $ref: '#/components/schemas/ExpectedRackCreateRequest'
      required:
        - siteId
        - expectedRacks
    ExpectedRackUpdateRequest:
      title: ExpectedRackUpdateRequest
      type: object
      description: |-
        Request data to update an existing Expected Rack.

        For single updates (PATCH /expected-rack/{id}), the `id` field is optional in the body and will be ignored if provided (the `id` from the URL path is used).

        Chassis identity and physical location information are conveyed via well-known label keys in `labels`:
        - `chassis.manufacturer`, `chassis.serial-number`, `chassis.model`
        - `location.region`, `location.datacenter`, `location.room`, `location.position`
      examples:
        - rackProfileId: rp-standard-48u
          name: Rack 01 (updated)
          description: Production rack in row A, upgraded chassis
          labels:
            chassis.manufacturer: NVIDIA
            chassis.serial-number: NVRK0001001
            chassis.model: GB200-NVL72
            location.datacenter: phx-dc01
            location.position: A1
      properties:
        id:
          type:
            - string
            - 'null'
          format: uuid
          description: |-
            Unique identifier (UUID) of the Expected Rack to update. Optional for single Expected Rack update (must be empty or match the id from the URL path).
        rackId:
          type:
            - string
            - 'null'
          minLength: 1
          description: Optional new operator-supplied rack identifier. If provided, must be non-empty and unique within the Site.
        rackProfileId:
          type:
            - string
            - 'null'
          minLength: 1
          description: Optional new Rack Profile identifier. If provided, must be non-empty.
        name:
          type:
            - string
            - 'null'
          minLength: 1
          description: Human-readable name of the Expected Rack
        description:
          type:
            - string
            - 'null'
          minLength: 1
          description: Human-readable description of the Expected Rack
        labels:
          $ref: '#/components/schemas/Labels'
          description: |-
            User-defined key-value pairs for organizing and categorizing Expected Racks. Well-known keys (`chassis.*`, `location.*`) are used to convey chassis identity and physical location.
