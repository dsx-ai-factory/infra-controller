    TenantIdentityConfigCreateOrUpdateRequest:
      title: TenantIdentityConfigCreateOrUpdateRequest
      description: |-
        Tenant identity configuration payload. `issuer`,
        `defaultAudience`, and `tokenTtlSeconds` are required. `enabled` is
        optional and defaults to `true` when omitted. The `org` identifier
        is taken from the URL path segment `{org}`.

        Two request shapes are supported, distinguished by whether the
        PUT also forces a signing-key rotation:

          1. **Without key rotation** -- `rotateKey` is omitted or `false`;
             `signingKeyOverlapSeconds` must be omitted.
          2. **With key rotation** -- `rotateKey: true` and
             `signingKeyOverlapSeconds` are both required; the Core gRPC
             API generates a fresh ES256 keypair into the other key slot,
             swaps the active signer, and arms a JWKS overlap window for
             the previous key.
      oneOf:
        - $ref: '#/components/schemas/TenantIdentityConfigCreateOrUpdateRequestWithoutKeyRotation'
        - $ref: '#/components/schemas/TenantIdentityConfigCreateOrUpdateRequestWithKeyRotation'
    TenantIdentityConfigCreateOrUpdateRequestWithoutKeyRotation:
      title: Without key rotation
      description: |-
        Standard create-or-update of the tenant identity config. Use
        this shape when **not** rotating the signing key.
        `signingKeyOverlapSeconds` is not used here -- it is only
        meaningful together with `rotateKey: true` and is rejected by
        the REST API in that combination. Switch to the "With key
        rotation" variant when you need to set it.
      type: object
      required:
        - issuer
        - defaultAudience
        - tokenTtlSeconds
      properties:
        enabled:
          type: boolean
          default: true
          description: |-
            Optional. Set to `true` to enable JWT-SVID issuance for
            this org or `false` to keep the config but pause issuance.
            Defaults to `true` when omitted.
        issuer:
          type: string
          description: |-
            JWT `iss` claim / OIDC issuer. Required in the REST
            request body. The Core gRPC API (`Issuer::parse`) is
            authoritative for scheme and host rules and accepts
            `https://`, `http://`, or `spiffe://` URLs with a DNS
            host; malformed values are rejected with
            `400 Bad Request`.
        defaultAudience:
          type: string
          description: Default audience applied when a workload does not specify one. Required.
        allowedAudiences:
          type: array
          default: []
          description: |-
            Allowlist of audience strings that may appear in issued
            JWT-SVIDs. When **empty or omitted**, the Core gRPC API
            persists `[defaultAudience]` as the stored allowlist, so
            only the default audience can be issued -- empty is
            **not** "allow any". To accept additional audiences,
            provide a non-empty list; non-empty lists must include
            `defaultAudience`. A subsequent GET returns the
            persisted allowlist, which may differ from an empty list
            that was sent on PUT.
          items:
            type: string
        tokenTtlSeconds:
          type: integer
          minimum: 1
          description: |-
            Issued-token TTL in seconds. Required in the REST request
            body and must be > 0. The Core gRPC API enforces its
            configured `[machine_identity].token_ttl_min_sec` /
            `token_ttl_max_sec` window and rejects values outside the
            window with `400 Bad Request`. The window is per-site, so
            REST does not advertise a fixed maximum here.
        subjectPrefix:
          type: string
          description: |-
            Optional SPIFFE ID URI prefix for JWT `sub` (RFC-shaped
            `spiffe://…`). When omitted, the Core gRPC API derives a
            prefix from the issuer's trust domain.
        rotateKey:
          type: boolean
          enum:
            - false
          default: false
          description: |-
            Must be omitted or `false` for this variant. Switch to the
            "With key rotation" variant to force a fresh ES256 signing
            keypair and arm a JWKS overlap window.
    TenantIdentityConfigCreateOrUpdateRequestWithKeyRotation:
      title: With key rotation
      description: |-
        Create-or-update of the tenant identity config that also
        forces a signing-key rotation. Both `rotateKey: true` and
        `signingKeyOverlapSeconds` are required.
      type: object
      required:
        - issuer
        - defaultAudience
        - tokenTtlSeconds
        - rotateKey
        - signingKeyOverlapSeconds
      properties:
        enabled:
          type: boolean
          default: true
          description: |-
            Optional. Set to `true` to enable JWT-SVID issuance for
            this org or `false` to keep the config but pause issuance.
            Defaults to `true` when omitted.
        issuer:
          type: string
          description: |-
            JWT `iss` claim / OIDC issuer. Required in the REST
            request body. The Core gRPC API (`Issuer::parse`) is
            authoritative for scheme and host rules and accepts
            `https://`, `http://`, or `spiffe://` URLs with a DNS
            host; malformed values are rejected with
            `400 Bad Request`.
        defaultAudience:
          type: string
          description: Default audience applied when a workload does not specify one. Required.
        allowedAudiences:
          type: array
          default: []
          description: |-
            Allowlist of audience strings that may appear in issued
            JWT-SVIDs. When **empty or omitted**, the Core gRPC API
            persists `[defaultAudience]` as the stored allowlist, so
            only the default audience can be issued -- empty is
            **not** "allow any". To accept additional audiences,
            provide a non-empty list; non-empty lists must include
            `defaultAudience`. A subsequent GET returns the
            persisted allowlist, which may differ from an empty list
            that was sent on PUT.
          items:
            type: string
        tokenTtlSeconds:
          type: integer
          minimum: 1
          description: |-
            Issued-token TTL in seconds. Required in the REST request
            body and must be > 0. The Core gRPC API enforces its
            configured `[machine_identity].token_ttl_min_sec` /
            `token_ttl_max_sec` window and rejects values outside the
            window with `400 Bad Request`. The window is per-site, so
            REST does not advertise a fixed maximum here.
        subjectPrefix:
          type: string
          description: |-
            Optional SPIFFE ID URI prefix for JWT `sub` (RFC-shaped
            `spiffe://…`). When omitted, the Core gRPC API derives a
            prefix from the issuer's trust domain.
        rotateKey:
          type: boolean
          enum:
            - true
          description: |-
            Must be `true` for this variant. Generates a fresh ES256
            signing keypair into the other key slot, swaps the
            current signer, and arms a JWKS overlap window for the
            previous key.
        signingKeyOverlapSeconds:
          type: integer
          minimum: 1
          description: |-
            Required when `rotateKey` is `true`. Number of seconds
            the previous verification key remains in JWKS so that
            JWTs already signed with it stay verifiable until they
            expire. Must be `>= tokenTtlSeconds`. The Core gRPC API
            enforces an upper bound via its
            `[machine_identity].signing_key_overlap_max_sec` config;
            values above that bound are rejected with
            `400 Bad Request`.
    TenantIdentityConfig:
      title: TenantIdentityConfig
      description: |-
        Current tenant identity configuration plus the per-org signing key
        metadata (`signingKeys`). During a JWKS overlap window two
        entries appear; under steady state only the active signer is
        listed. Use `signingKeys[].kid` (filtering by `currentSigner`)
        instead of the legacy single `keyId` field, which was removed
        with the key-rotation change in NICo-core.
      type: object
      properties:
        org:
          type: string
          description: 'Organization that owns the Tenant identity configuration'
        enabled:
          type: boolean
          description: 'Whether Tenant identity token delegation is enabled'
        issuer:
          type: string
          description: 'Issuer URL for Tenant identity tokens'
        defaultAudience:
          type: string
          description: 'Default audience used for Tenant identity tokens'
        allowedAudiences:
          type: array
          description: |-
            Stored allowlist of audience strings. Always non-empty: when a
            PUT supplied an empty list, the Core gRPC API substituted
            `[defaultAudience]` before persisting. Issuance rejects audiences
            outside this list.
          items:
            type: string
        tokenTtlSeconds:
          type: integer
          description: 'Lifetime of issued Tenant identity tokens, in seconds'
        subjectPrefix:
          type: string
          description: |-
            SPIFFE ID prefix used in the JWT `sub` claim. When the PUT body
            omitted `subjectPrefix`, Core stored
            `spiffe://<trust-domain-from-issuer>` here, so the value
            returned by GET may differ from what was submitted.
        signingKeys:
          type: array
          items:
            $ref: '#/components/schemas/TenantIdentitySigningKey'
          description: |-
            Per-org signing keys currently published in JWKS. Exactly
            one entry has `currentSigner: true`. During a rotation
            overlap window a second entry is present with
            `currentSigner: false` and a populated `expireAt`; once
            the overlap window elapses the Core gRPC API deletes the
            expired entry and only the current signer remains.
        created:
          type: string
          description: 'Date/time when the Tenant identity configuration was created'
          format: date-time
        updated:
          type: string
          description: 'Date/time when the Tenant identity configuration was last updated'
          format: date-time
    TenantIdentitySigningKey:
      title: TenantIdentitySigningKey
      description: |-
        A single JWT-SVID signing key entry returned in
        `TenantIdentityConfig.signingKeys`. Multiple entries appear
        during a key-rotation overlap window; in steady state only the
        active signer is listed.
      type: object
      required:
        - kid
        - alg
        - currentSigner
      properties:
        kid:
          type: string
          description: Key identifier; matches the `kid` published in JWKS for this key.
        alg:
          type: string
          description: Signing algorithm, e.g. `ES256`.
        currentSigner:
          type: boolean
          description: |-
            True when this key is the active signer for new JWT-SVIDs.
            Exactly one entry per response is `true`.
        expireAt:
          type:
            - string
            - "null"
          format: date-time
          description: |-
            Set on the inactive (previous) key during the JWKS overlap
            window; the Core gRPC API deletes the inactive slot once
            `now >= expireAt`. Null on the current signer.
    TenantIdentityBasicClientSecretRequest:
      title: TenantIdentityBasicClientSecretRequest
      description: Raw OAuth2 `client_secret_basic` credentials. `clientSecret` is accepted on input but never returned in responses.
      type: object
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          description: 'Client identifier used for basic client-secret authentication'
        clientSecret:
          type: string
          description: |-
            Raw OAuth2 client secret. Transmitted over TLS to the Core gRPC API,
            which encrypts it at rest in its database using a per-site key. Never
            echoed in responses; subsequent reads return only a `sha256:` hash
            prefix in `clientSecretHash`.
    TenantIdentityBasicClientSecretResponse:
      title: TenantIdentityBasicClientSecretResponse
      description: Public half of `client_secret_basic` credentials. Only the SHA-256 hash of the secret is returned.
      type: object
      properties:
        clientId:
          type: string
          description: 'Client identifier used for basic client-secret authentication'
        clientSecretHash:
          type: string
          description: SHA-256 hash of the raw secret.
    TenantIdentityTokenDelegationCreateOrUpdateRequest:
      title: TenantIdentityTokenDelegationCreateOrUpdateRequest
      description: |-
        RFC 8693 token exchange callback configuration. Omit
        `clientSecretBasic` entirely for auth method `none`; include it
        for `client_secret_basic`.

        Because PUT is full-replace, omitting `clientSecretBasic` on a
        subsequent update **clears** any previously-stored credentials
        and switches the org back to no-auth. To keep basic-auth across
        updates, re-supply `clientId` and `clientSecret` on every PUT —
        Core never returns the raw secret (only its hash), so the secret
        must be available to the caller.
      type: object
      required:
        - tokenEndpoint
        - subjectTokenAudience
      properties:
        tokenEndpoint:
          type: string
          format: uri
          description: |-
            URL of the tenant's RFC 8693 token exchange endpoint.
            The Core gRPC API validates scheme and host against its
            configured `[machine_identity].token_endpoint_domain_allowlist`
            and rejects mismatches with `400 Bad Request`. Operators that
            need to enforce HTTPS-only must populate that allowlist.
        clientSecretBasic:
          $ref: '#/components/schemas/TenantIdentityBasicClientSecretRequest'
          description: 'Client-secret basic authentication settings for token delegation'
        subjectTokenAudience:
          type: string
          description: Audience value placed on the intermediate JWT-SVID posted to the exchange endpoint.
    TenantIdentityTokenDelegation:
      title: TenantIdentityTokenDelegation
      description: Current token delegation configuration for the org.
      type: object
      properties:
        tokenEndpoint:
          type: string
          description: 'Token endpoint used to exchange delegated Tenant identity tokens'
          format: uri
        clientSecretBasic:
          $ref: '#/components/schemas/TenantIdentityBasicClientSecretResponse'
          description: 'Client-secret basic authentication settings for token delegation'
        subjectTokenAudience:
          type: string
          description: 'Audience value expected on the subject token'
        created:
          type: string
          description: 'Date/time when the token delegation configuration was created'
          format: date-time
        updated:
          type: string
          description: 'Date/time when the token delegation configuration was last updated'
          format: date-time
    TenantIdentityJWKS:
      title: TenantIdentityJWKS
      description: |-
        RFC 7517 JSON Web Key Set. NICo-rest returns this schema only
        on `200 OK`; in that case the `keys` member is present. The Core
        gRPC API normally returns one key, or two during a rotation overlap
        window. When no identity configuration exists for the org/site, the
        JWKS endpoints return `404 Not Found`.
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          description: |-
            RFC 7517 JWK members. NICo currently emits only EC keys
            (`kty: EC`, `crv: P-256`, `alg: ES256`); the schema is
            intentionally open-ended so that future algorithms can be
            added without a spec change.
          items:
            type: object
            properties:
              kty:
                type: string
                example: EC
              use:
                type: string
                description: "`sig` for OIDC JWKS, `jwt-svid` for SPIFFE JWKS"
              crv:
                type: string
                example: P-256
              kid:
                type: string
              x:
                type: string
                description: Base64url-encoded EC x coordinate
              'y':
                type: string
                description: Base64url-encoded EC y coordinate
              alg:
                type: string
                example: ES256
    OpenIDConfiguration:
      title: OpenIDConfiguration
      description: |-
        OIDC discovery document. Note: `id_token_signing_alg_values_supported`
        is always empty because NICo issues JWT bearer access tokens, not
        OIDC `id_token`s.
      type: object
      properties:
        issuer:
          type: string
          description: 'Issuer URL for OpenID Connect discovery'
        jwks_uri:
          type: string
          description: 'URL of the JSON Web Key Set used to verify tokens'
          format: uri
        response_types_supported:
          type: array
          description: 'OAuth response types supported by this issuer'
          items:
            type: string
        subject_types_supported:
          type: array
          description: 'Subject identifier types supported by this issuer'
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          description: 'ID token signing algorithms supported by this issuer'
          items:
            type: string
        spiffe_jwks_uri:
          type: string
          description: 'URL of the SPIFFE JSON Web Key Set used to verify SPIFFE JWT-SVIDs'
          format: uri
  securitySchemes:
    JWTBearerToken:
      type: http
      scheme: Bearer
      description: |-
        ```
        export JWT_BEARER_TOKEN="<jwt-bearer-token>"

        # Example org name: "acme-inc
        export ORG_NAME=<org-name>

        # Use the JWT bearer token in your API request auth header:
        curl -v -X GET -H "Content-Type: application/json" -H "Authorization: Bearer $JWT_BEARER_TOKEN" https://nico-rest-api.nico.svc.cluster.local/v2/org/$ORG_NAME/nico/user/current
        ```
  responses:
    GenericHttpError:
      description: Response when the API handler encounters an unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
          examples:
            Example 1:
              value:
                source: nico
                message: Error handling API request
                data: null
    NotFoundError:
      description: Error response when requested object is not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
          examples:
            example-1:
              value:
                source: nico
                message: Could not find resource with specified ID
                data: null
    UnauthorizedError:
      description: Error response when user is not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
          examples:
            example-1:
              value:
                source: nico
                message: User is not authenticated
                data: null
    ForbiddenError:
      description: Error response when user is not authorized to call an endpoint or retrieve/modify objects
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
          examples:
            example-1:
              value:
                source: nico
                message: User is not allowed to perform this action
                data: null
    ValidationError:
      description: Error response when request data cannot be validated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
          examples:
            example-1:
              value:
                source: nico
                message: Error validating request data
                data:
                  name: A value is required
    TenantIdentityCoreUnavailable:
      description: |-
        Core gRPC API is unavailable, or site-level machine identity is
        disabled (`enabled=false` in site config), so the request cannot
        be served.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NICoAPIError'
  parameters: {}
  requestBodies: {}
security:
  - JWTBearerToken: []
