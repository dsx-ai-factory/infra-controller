    ExpectedRack:
      title: ExpectedRack
      type: object
      description: |-
        An Expected Rack represents a rack that is expected to be discovered at a Site. The `rackId` is an operator-supplied string identifier (not a UUID) that uniquely identifies the rack within the Site. Each Expected Rack references a Rack Profile that describes the rack's expected layout and capabilities.

        Chassis identity and physical location information are conveyed via well-known label keys in `labels`:
        - `chassis.manufacturer`, `chassis.serial-number`, `chassis.model`
        - `location.region`, `location.datacenter`, `location.room`, `location.position`
      examples:
        - id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
          rackId: rack-01
          siteId: f97df110-f4de-492e-8849-4a6af68026b0
          rackProfileId: rp-standard-42u
          name: Rack 01
          description: Production rack in row A
          labels:
            chassis.manufacturer: NVIDIA
            chassis.serial-number: NVRK0001001
            chassis.model: GB200-NVL72
            location.region: us-west-2
            location.datacenter: phx-dc01
            location.room: room-1
            location.position: A1
          created: '2019-08-24T14:15:22Z'
          updated: '2019-08-24T14:15:22Z'
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID) for the Expected Rack
          readOnly: true
        rackId:
          type: string
          description: Operator-supplied identifier for the rack (string, not UUID). Unique within a Site.
          readOnly: true
        siteId:
          type: string
          format: uuid
          description: ID of the Site the Expected Rack belongs to
          readOnly: true
        rackProfileId:
          type: string
          description: Identifier of the Rack Profile this rack conforms to
        name:
          type: string
          description: Human-readable name of the Expected Rack
        description:
          type: string
          description: Human-readable description of the Expected Rack
        labels:
          $ref: '#/components/schemas/Labels'
          description: |-
            User-defined key-value pairs for organizing and categorizing Expected Racks. Well-known keys (`chassis.*`, `location.*`) are used to convey chassis identity and physical location.
        created:
          type: string
          format: date-time
          description: ISO 8601 datetime when the Expected Rack was created
          readOnly: true
        updated:
          type: string
          format: date-time
          description: ISO 8601 datetime when the Expected Rack was last updated
          readOnly: true
    ExpectedRackCreateRequest:
      title: ExpectedRackCreateRequest
      type: object
      description: |-
