  '/v2/org/{org}/nico/site/{siteID}/tenant-identity/config':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
      - schema:
          type: string
          format: uuid
        name: siteID
        in: path
        required: true
        description: ID of the Site
    put:
      summary: Create or Update Tenant Identity Configuration
      tags:
        - Tenant Identity
      operationId: create-or-update-tenant-identity-config
      description: |-
        Create or update tenant identity (JWT-SVID) configuration for the org/site.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        On first call the Core gRPC API generates a new ES256 signing
        keypair; on subsequent calls the existing keypair is reused unless
        `rotateKey: true` is supplied. Returns `201 Created` on first
        call, `200 OK` on subsequent updates. See the Tenant Identity tag
        description for upsert semantics and the `enabled` vs DELETE
        distinction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantIdentityConfigCreateOrUpdateRequest'
      responses:
        '200':
          description: Tenant identity configuration replaced/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityConfig'
        '201':
          description: Tenant identity configuration created on first call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the configuration workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
    get:
      summary: Retrieve Tenant Identity Configuration for current Org
      tags:
        - Tenant Identity
      operationId: get-tenant-identity-config
      description: |-
        Retrieve the tenant identity configuration and signing key metadata.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        The response reflects the stored configuration. Fields you
        omitted on PUT may be filled in by Core: `allowedAudiences`
        defaults to `[defaultAudience]`, and `subjectPrefix` defaults
        to the issuer's trust domain. `signingKeys` lists one entry
        normally, or two during a key-rotation overlap.
      responses:
        '200':
          description: Tenant identity configuration retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the get workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
    delete:
      summary: Delete Tenant Identity Configuration
      tags:
        - Tenant Identity
      operationId: delete-tenant-identity-config
      description: |-
        Delete the tenant identity configuration and destroy the per-org signing keypair.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        After DELETE, JWKS and OIDC discovery for this org begin returning
        `404`; previously-issued JWT-SVIDs become unverifiable once
        consumers refresh their JWKS cache. To pause issuance without
        destroying signing keys, PUT with `enabled: false` instead.
      responses:
        '204':
          description: Tenant identity configuration deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the delete workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
  '/v2/org/{org}/nico/site/{siteID}/tenant-identity/token-delegation':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
      - schema:
          type: string
          format: uuid
        name: siteID
        in: path
        required: true
        description: ID of the Site
    put:
      summary: Create or Update Token Delegation
      tags:
        - Tenant Identity
      operationId: create-or-update-tenant-identity-token-delegation
      description: |-
        Register an RFC 8693 token exchange callback for the tenant. When
        configured, the Core gRPC API issues a short-lived intermediate
        JWT-SVID to the tenant's exchange server instead of signing
        workload tokens directly.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        Requires a pre-existing `/tenant-identity/config` on this org/site
        (returns `404` otherwise). Because PUT is full-replace, omitting
        `clientSecretBasic` on an update clears any stored credentials
        and switches the org back to no-auth; re-supply `clientId` /
        `clientSecret` on every PUT to keep basic auth (the raw secret
        is never returned by GET). Returns `201 Created` on first call,
        `200 OK` on subsequent updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantIdentityTokenDelegationCreateOrUpdateRequest'
      responses:
        '200':
          description: Token delegation replaced/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityTokenDelegation'
        '201':
          description: Token delegation created on first call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityTokenDelegation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |-
            Returned when the org has no tenant identity configuration on
            this site yet; create it via PUT `/tenant-identity/config` before
            registering a token-delegation callback.
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the token-delegation update workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
    get:
      summary: Retrieve Token Delegation for current Org
      tags:
        - Tenant Identity
      operationId: get-tenant-identity-token-delegation
      description: |-
        Retrieve the registered token exchange callback for the tenant.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        The raw `clientSecret` is never returned; only its SHA-256 hash.
      responses:
        '200':
          description: Token delegation retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityTokenDelegation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the token-delegation get workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
    delete:
      summary: Delete Token Delegation
      tags:
        - Tenant Identity
      operationId: delete-tenant-identity-token-delegation
      description: |-
        Delete the RFC 8693 token exchange callback for the tenant.

        User must have authorization role with `TENANT_ADMIN` suffix in the URL `{org}`.

        Subsequent Instance Metadata Service requests for the tenant revert to direct (non-delegated) signing by the Core gRPC API.
      responses:
        '204':
          description: Token delegation deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while loading the Tenant or Site, contacting the Core gRPC API, starting the token-delegation delete workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          $ref: '#/components/responses/TenantIdentityCoreUnavailable'
  '/v2/org/{org}/nico/site/{siteID}/.well-known/jwks.json':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
      - schema:
          type: string
          format: uuid
        name: siteID
        in: path
        required: true
        description: ID of the Site
    get:
      summary: Retrieve OIDC JWKS for current Org
      tags:
        - Tenant Identity
      operationId: get-jwks
      description: |-
        Public RFC 7517 JSON Web Key Set for JWT-SVID signature verification (`use: sig`). No authentication required.

        NICo currently issues `ES256` signatures over `P-256` keys.
        Returns `404 Not Found` when no identity configuration exists
        for this org/site, and `502 Bad Gateway` when the Core gRPC API
        returns a malformed body. See the Tenant Identity tag
        description for consumer guidance during key rotation.
      security: []
      responses:
        '200':
          description: JWKS document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityJWKS'
        '404':
          description: No identity configuration exists for this org/site.
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while resolving the Site or Tenant, retrieving the Temporal client, starting the JWKS workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '502':
          description: Core gRPC API returned a malformed JWKS body that could not be parsed as a keyset.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          description: Core gRPC API is unavailable.
          $ref: '#/components/responses/GenericHttpError'
  '/v2/org/{org}/nico/site/{siteID}/.well-known/openid-configuration':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
      - schema:
          type: string
          format: uuid
        name: siteID
        in: path
        required: true
        description: ID of the Site
    get:
      summary: Retrieve OpenID Configuration for current Org
      tags:
        - Tenant Identity
      operationId: get-openid-configuration
      description: |-
        Public OIDC discovery document pointing at the JWKS URIs. No authentication required.

        `id_token_signing_alg_values_supported` is intentionally empty
        because NICo issues bearer access JWTs, not OIDC `id_token`s;
        strict OIDC client libraries that require a non-empty algorithm
        list will reject this document. Use the JWKS endpoint directly
        for signature verification. Returns `404` when no identity
        material exists for this org/site.
      security: []
      responses:
        '200':
          description: OpenID discovery document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while resolving the Site or Tenant, retrieving the Temporal client, starting the OpenID Configuration workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          description: Core gRPC API is unavailable.
          $ref: '#/components/responses/GenericHttpError'
  '/v2/org/{org}/nico/site/{siteID}/.well-known/spiffe/jwks.json':
    parameters:
      - schema:
          type: string
        name: org
        in: path
        required: true
        description: Name of the Org
      - schema:
          type: string
          format: uuid
        name: siteID
        in: path
        required: true
        description: ID of the Site
    get:
      summary: Retrieve SPIFFE JWKS for current Org
      tags:
        - Tenant Identity
      operationId: get-spiffe-jwks
      description: |-
        SPIFFE trust-domain JWKS — same key material as the OIDC JWKS but with `use: jwt-svid` for SPIFFE-native verifiers. No authentication required.

        Not-configured and malformed-body behavior matches the OIDC JWKS endpoint.
      security: []
      responses:
        '200':
          description: SPIFFE JWKS document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdentityJWKS'
        '404':
          description: No identity configuration exists for this org/site.
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Internal server error while resolving the Site or Tenant, retrieving the Temporal client, starting the SPIFFE JWKS workflow, or after the workflow timed out and was terminated.
          $ref: '#/components/responses/GenericHttpError'
        '502':
          description: Core gRPC API returned a malformed SPIFFE JWKS body that could not be parsed as a keyset.
          $ref: '#/components/responses/GenericHttpError'
        '503':
          description: Core gRPC API is unavailable.
          $ref: '#/components/responses/GenericHttpError'
