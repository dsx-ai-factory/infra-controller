disable_root: true
ssh_pwauth: __MLT_ALLOW_PW__
chpasswd:
    expire: false
users:
    # The qcow image already contains this account. Keep it locked rather than
    # inheriting any password state baked into the image.
    - name: nvidia
      lock_passwd: true
    - name: machine-lifecycle-test-user
      sudo: ALL=(ALL) NOPASSWD:ALL
      groups: sudo
      shell: /bin/bash
      lock_passwd: __MLT_LOCK_PASSWD__
      passwd: __MLT_USER_PASSWORD__
      ssh_authorized_keys:
        - __MLT_SSH_PUBLIC_KEY__
