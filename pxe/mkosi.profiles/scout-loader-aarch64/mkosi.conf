[Output]
Output=loader
CompressOutput=zstd
CompressLevel=19

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,restricted,universe,multiverse
Architecture=arm64

[Build]
ToolsTree=default
Environment=MKOSI_CHROOT_SUPPRESS_CHOWN=1

[Content]
WithDocs=no
Bootable=yes
RootPassword=password
Packages=
         apt
         cpio
         curl
         dbus
         file
         isc-dhcp-client
         iproute2
         kmod
         # Keep the boot kernel in sync with scout-oss-aarch64's driver modules.
         linux-image-6.17.0-1032-nvidia-64k=6.17.0-1032.32
         linux-headers-6.17.0-1032-nvidia-64k=6.17.0-1032.32
         linux-modules-nvidia-fs-6.17.0-1032-nvidia-64k=6.17.0-1032.32
         linux-firmware
         net-tools
         netbase
         procps
         systemd
         systemd-boot
         systemd-boot-efi
         systemd-resolved
         systemd-sysv
         systemd-timesyncd
         tpm2-tools
         udev
         util-linux
         zstd
