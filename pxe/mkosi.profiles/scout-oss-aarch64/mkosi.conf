[Output]
Output=scout
CompressOutput=zstd
CompressLevel=6
Format=cpio

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,restricted,universe,multiverse
Architecture=arm64

[Build]
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=noble
Environment=MKOSI_CHROOT_SUPPRESS_CHOWN=1

[Content]
WithDocs=no
Bootable=no
Packages=
     apt-utils
     bind9-dnsutils
     bind9-host
     bind9-libs
     build-essential
     ca-certificates
     cloud-init
     curl
     dbus
     debconf-i18n
     debian-archive-keyring
     dmidecode
     efibootmgr
     erofs-utils
     file
     freeipmi-tools
     ibverbs-providers
     ibverbs-utils
     iperf3
     ipmitool
     iproute2
     iputils-ping
     keyboard-configuration
     isc-dhcp-client
     lldpd
     libargtable2-0
     libsystemd0
     libudev-dev
     libuser
     libuser1
     # Keep in sync with scout-loader-aarch64: NVIDIA 580.126.16 builds against
     # this ABI, but fails against the 7.0 kernel selected by the HWE metapackage.
     linux-image-6.17.0-1032-nvidia-64k=6.17.0-1032.32
     linux-headers-6.17.0-1032-nvidia-64k=6.17.0-1032.32
     linux-modules-nvidia-fs-6.17.0-1032-nvidia-64k=6.17.0-1032.32
     linux-firmware
     locales
     lshw
     memtester
     mstflint
     nasm
     netcat-openbsd
     net-tools
     hdparm
     nvme-cli
     openssh-server
     sg3-utils
     pciutils
     rdma-core
     smartmontools
     mtr-tiny
     gdb
     systemd
     systemd-boot
     systemd-boot-efi
     systemd-resolved
     systemd-sysv
     systemd-timesyncd
     systemd-ukify
     tcpdump
     telnet
     tmux
     tpm2-tools
     udev
     util-linux
     containerd
     runc
     stress-ng
     wget
     sysbench
     zstd
     git
     python3.12-venv
     python3-pip
     sudo

RootPassword=password
