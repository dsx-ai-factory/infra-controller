apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpf-sim-controller
  namespace: dpf-operator-system
  labels:
    app.kubernetes.io/name: dpf-sim-controller
    app.kubernetes.io/component: dev-simulator
spec:
  replicas: 1 # single-instance dev tooling; no leader election
  # Recreate, not RollingUpdate: without leader election two pods must never run
  # together, or a new pod can fail an install the old pod is still submitting.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dpf-sim-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpf-sim-controller
    spec:
      serviceAccountName: dpf-sim-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: dpf-sim-controller:dev # override via kustomize/`make deploy IMG=...`
          # Always: dev deploys reuse mutable tags (e.g. :dev); combined with
          # the rollout restart in `make deploy` this guarantees a repush of
          # the same tag actually lands on the cluster.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --dpf-namespace=dpf-operator-system
            - --phase-dwell=3s
            - --redfish-os-install=false
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
