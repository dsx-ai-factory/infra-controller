global:
  image:
    pullPolicy: IfNotPresent
  certificate:
    issuerRef:
      kind: Issuer
      name: local-ca-issuer
      group: cert-manager.io

nico-api:
  legacyAlias:
    enabled: false
  # Under test: route core's ordinary BMC Redfish traffic via nico-bmc-proxy
  # (which chains to bmc-mock through its own bmc_proxy override).
  bmcProxy:
    enabled: true
  automountServiceAccountToken: false
  migrationJob:
    sslMode: disable
  resources:
    limits:
      cpu: "16"
      memory: 16Gi
    requests:
      cpu: "1"
      memory: 1Gi
  envFrom:
    databaseCredentials:
      secretName: nico-pg-cluster-app
  vaultClusterInfo: {}
  databaseConfig: {}
  extraEnv:
    - name: DISABLE_TLS_ENFORCEMENT
      value: "1"
  webAuth:
    mode: none
  componentManager:
    enabled: false
  rms:
    enabled: false
  siteConfig:
    enabled: true
    nicoApiSiteConfig: |
      bypass_rbac = true
      attestation_enabled = false
      dpu_ipmi_tool_impl = "test"
      initial_domain_name = "local.nico"
      initial_dpu_agent_upgrade_policy = "off"
      allow_insecure_discovery = true
      max_database_connections = 64

      [pools.lo-ip]
      type = "ipv4"
      ranges = [{ start = "10.180.64.1", end = "10.180.127.254" }]

      [pools.vlan-id]
      type = "integer"
      ranges = [{ start = "100", end = "501" }]

      [pools.vni]
      type = "integer"
      ranges = [{ start = "1024500", end = "1024550" }]

      [pools.vpc-vni]
      type = "integer"
      ranges = [{ start = "2024500", end = "2024550" }]

      [pools.fnn-asn]
      type = "integer"
      ranges = [{ start = "1000", end = "10000" }]

      [networks.admin]
      type = "admin"
      prefix = "192.168.64.0/18"
      gateway = "192.168.64.1"
      mtu = 9000
      reserve_first = 2

      [networks.DEV-K3S-DPU-ACORN-0]
      type = "underlay"
      prefix = "192.168.128.0/18"
      gateway = "192.168.128.1"
      mtu = 1500
      reserve_first = 2

      [networks.DEV-K3S-X86-BMC-UNDERLAY-ACORN-X86-0]
      type = "underlay"
      prefix = "10.96.64.0/18"
      gateway = "10.96.64.1"
      mtu = 1500
      reserve_first = 2

      [auth]
      permissive_mode = true

      [auth.trust]
      spiffe_trust_domain = "nico.local"
      spiffe_service_base_paths = ["/nico-system/sa/", "/default/sa/"]
      spiffe_machine_base_path = "/nico-system/machine/"
      additional_issuer_cns = []

      [host_health]
      hardware_health_reports = "MonitorOnly"

      [machine_state_controller]
      dpu_wait_time = "1s"
      skip_polling_checks = true

      [machine_state_controller.controller]
      iteration_time = "30s"
      max_concurrency = 100

      [vpc_prefix_state_controller]
      vpc_prefix_drain_time = "5m"

      [machine_validation_config]
      enabled = false

      [site_explorer]
      enabled = true
      create_machines = true
      run_interval = "10s"
      machines_created_per_run = 1000
      explorations_per_run = 1000
      concurrent_explorations = 100
      explore_mode = "nv-redfish"

      [firmware_global]
      autoupdate = true
      run_interval = "10s"
      concurrency_limit = 100

nico-bmc-proxy:
  enabled: true
  replicas: 1
  automountServiceAccountToken: false
  envFrom:
    databaseCredentials:
      secretName: nico-pg-cluster-app
  vaultClusterInfo: {}
  databaseConfig: {}
  extraEnv:
    - name: DISABLE_TLS_ENFORCEMENT
      value: "1"
  configFiles:
    enabled: true
    nicoBmcProxyConfig: |
      listen = "[::]:1079"
      metrics_endpoint = "[::]:1080"
      database_url = "postgres://replaced-by-env-var"
      allowed_principals = ["trusted-certificate"]

      [tls]
      identity_pemfile_path = "/var/run/secrets/spiffe.io/tls.crt"
      identity_keyfile_path = "/var/run/secrets/spiffe.io/tls.key"
      root_cafile_path = "/var/run/secrets/spiffe.io/ca.crt"
      admin_root_cafile_path = "/etc/forge/carbide-bmc-proxy/site/admin_root_cert_pem"

      [auth.trust]
      spiffe_trust_domain = "nico.local"
      spiffe_service_base_paths = [
        "/nico-system/sa/",
        "/default/sa/",
      ]
      spiffe_machine_base_path = "/nico-system/machine/"
      additional_issuer_cns = []

      [auth.acls]
      "trusted-certificate" = ["/**"]

      [carbide_api]
      api_url = "https://nico-api.nico-system.svc.cluster.local:1079"
      root_ca = "/var/run/secrets/spiffe.io/ca.crt"
      client_cert = "/var/run/secrets/spiffe.io/tls.crt"
      client_key = "/var/run/secrets/spiffe.io/tls.key"

nico-dhcp:
  enabled: true
  config:
    kea:
      hookParameters:
        nameservers: 127.0.0.1
        ntpServer: 127.0.0.1
        provisioningServer: 127.0.0.1

nico-ssh-console-rs:
  enabled: true
  configFiles:
    config: |
      listen_address = "[::]:22"
      metrics_address = "[::]:9009"
      carbide_url = "https://nico-api.nico-system.svc.cluster.local:1079"
      forge_root_ca_path = "/var/run/secrets/spiffe.io/ca.crt"
      client_cert_path = "/var/run/secrets/spiffe.io/tls.crt"
      client_key_path = "/var/run/secrets/spiffe.io/tls.key"
      host_key = "/etc/ssh/ssh_host_ed25519_key"
      hosts = true
      dpus = true
      insecure = true
      override_bmc_ssh_host = "nico-machine-a-tron-mat-0-ssh.nico-system.svc.cluster.local"
      api_poll_interval = "1s"
      reconnect_interval_base = "1s"
      reconnect_interval_max = "10s"
      console_logging_enabled = true
      console_logs_path = "/var/log/consoles"

nico-machine-a-tron:
  enabled: true
  machineATron:
    nicoApiUrl: https://nico-api.nico-system.svc.cluster.local:1079
  mat-k8s-controller:
    enabled: true
    config:
      insecureSkipVerify: true
  machineDefaults:
    discoveryRetryInterval: "5s"
  persistence:
    enabled: true
  certificate:
    uris:
      - spiffe://nico.local/nico-system/sa/machine-a-tron
  configFiles:
    matConfigs:
      mat-0: |
        carbide_api_url = "https://nico-api.nico-system.svc.cluster.local:1079"
        dhcp = { type = "udp_relay", server_address = "__NICO_DHCP_SERVER_ADDRESS__", listen_address = "0.0.0.0:__MAT_DHCP_LISTEN_PORT__", advertise_address = "__MAT_DHCP_SERVICE_IP__" }
        log_format = "logfmt"
        bmc_mock_port = 1266
        mock_bmc_ssh_server = true
        enable_ipmi_simulation = true
        persist_dir = "/tmp/machine-a-tron-data"
        cleanup_on_quit = false
        register_expected_machines = true
        api_refresh_interval = "2s"

        [ufm_mock]
        enabled = true
        include_local_inventory = true
        metrics_address = "[::]:9090"

        [racks.gb200]
        type = "wiwynn_gb200_nvl72"
        rack_profile_id = "NVL72"
        ids = ["rack-001"]
        dpu_reboot_delay = 20
        host_reboot_delay = 10
        acceleration_factor = 0.01
        discovery_retry_interval = "5s"
        oob_dhcp_relay_address = "10.96.64.1"
        admin_dhcp_relay_address = "192.168.176.1"

        [machines.rack-machines]
        hw_type = "wiwynn_gb200_nvl"
        host_count = 2
        dpu_per_host_count = 2
        dpu_reboot_delay = 1
        host_reboot_delay = 1
        acceleration_factor = 0.01
        scout_run_interval = "60s"
        discovery_retry_interval = "5s"
        run_interval_working = "1s"
        run_interval_idle = "10s"
        network_status_run_interval = "20s"
        oob_dhcp_relay_address = "10.96.64.1"
        admin_dhcp_relay_address = "192.168.176.1"
        dpus_in_nic_mode = false
  pods:
    mat-0:
      racks:
        gb200:
          type: wiwynn_gb200_nvl72
          rack_profile_id: NVL72
          ids:
            - rack-001
          dpu_reboot_delay: 20
          host_reboot_delay: 10
          oob_dhcp_relay_address: 10.96.64.1
          admin_dhcp_relay_address: 192.168.176.1
      machines:
        rack-machines:
          hwType: wiwynn_gb200_nvl
          hostCount: 2
          dpuPerHostCount: 2
          oobDhcpRelayAddress: 10.96.64.1
          adminDhcpRelayAddress: 192.168.176.1

tilt:
  machineATronDhcp:
    serverIP: 10.96.0.20
    serverPort: 67
    podName: mat-0
    serviceIP: 10.96.0.21
    listenPort: 67

  profiles: # Toggle optional stacks; required dependencies follow automatically.
    rest: false
    mcp: false
    dsxExchange: false
    observability: false

  certManager:
    crds:
      enabled: true
      keep: false
    global:
      leaderElection:
        namespace: cert-manager
    featureGates: AdditionalCertificateOutputFormats=true
    webhook:
      extraArgs:
        - --feature-gates=AdditionalCertificateOutputFormats=true
    prometheus:
      enabled: false

  cnpgOperator:
    replicaCount: 1
    crds:
      create: true
    monitoring:
      podMonitorEnabled: false
      grafanaDashboard:
        create: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  postgres:
    fullnameOverride: nico-pg-cluster
    type: postgresql
    version:
      postgresql: "16"
    cluster:
      instances: 1
      storage:
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
      enablePDB: false
      roles:
        - name: nico_rest
          ensure: present
          login: true
          passwordSecret:
            name: nico-rest-db-user
        - name: keycloak
          ensure: present
          login: true
          passwordSecret:
            name: keycloak-db-user
        - name: temporal
          ensure: present
          login: true
          createdb: true
          passwordSecret:
            name: temporal-db-user
      initdb:
        database: nico_system_nico
        owner: nico
      monitoring:
        enabled: false
    backups:
      enabled: false

  vault:
    global:
      enabled: true
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    server:
      dataStorage:
        enabled: false
      auditStorage:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      dev:
        enabled: true
        devRootToken: root
      postStart:
        - /bin/sh
        - -ec
        - |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=root
          until vault status >/dev/null 2>&1; do sleep 1; done
          vault secrets enable -path=secrets -version=2 kv || true
          vault secrets enable -path=certs pki || true
          vault read certs/cert/ca >/dev/null 2>&1 || \
            vault write certs/root/generate/internal \
              common_name=local-vault-ca ttl=87600h >/dev/null
          vault write certs/roles/nico-cluster \
            allow_any_name=true allow_bare_domains=true allow_subdomains=true \
            allow_localhost=true require_cn=false max_ttl=72h \
            allowed_uri_sans='spiffe://nico.local/*' >/dev/null
          printf '%s' '{"UsernamePassword":{"username":"root","password":"vault-password"}}' | \
            vault kv put secrets/machines/bmc/site/root - >/dev/null
          printf '%s' '{"UsernamePassword":{"username":"root","password":"vault-password"}}' | \
            vault kv put secrets/machines/all_dpus/site_default/uefi-metadata-items/auth - >/dev/null
          printf '%s' '{"UsernamePassword":{"username":"root","password":"vault-password"}}' | \
            vault kv put secrets/machines/all_hosts/site_default/uefi-metadata-items/auth - >/dev/null

  observability:
    prometheus:
      fullnameOverride: prometheus-stack
      crds:
        enabled: true
      defaultRules:
        create: false
      alertmanager:
        enabled: false
      grafana:
        enabled: false
        forceDeployDashboards: true
      kubeControllerManager:
        enabled: false
      kubeEtcd:
        enabled: false
      kubeScheduler:
        enabled: false
      prometheus:
        prometheusSpec:
          retention: 24h
          scrapeInterval: 30s
          evaluationInterval: 30s
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          additionalScrapeConfigs:
            - job_name: nico-services
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - action: keep
                  source_labels:
                    - __meta_kubernetes_service_label_app_kubernetes_io_metrics
                  regex: .+
                - action: keep
                  source_labels:
                    - __meta_kubernetes_service_name
                    - __meta_kubernetes_endpoint_port_name
                  separator: ";"
                  regex: (.+-metrics;.+)|(.+;metrics)
                - source_labels:
                    - __meta_kubernetes_service_label_app_kubernetes_io_metrics
                  target_label: job
                - source_labels:
                    - __meta_kubernetes_namespace
                  target_label: namespace
                - source_labels:
                    - __meta_kubernetes_service_name
                  target_label: service
                - source_labels:
                    - __meta_kubernetes_pod_name
                  target_label: pod
                - source_labels:
                    - __meta_kubernetes_pod_container_name
                  target_label: container
                - replacement: local-carbide
                  target_label: cluster
          walCompression: true
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      prometheusOperator:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    loki:
      deploymentMode: Monolithic
      loki:
        auth_enabled: false
        commonConfig:
          path_prefix: /var/loki
          replication_factor: 1
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        storage:
          type: filesystem
        limits_config:
          retention_period: 24h
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
      singleBinary:
        replicas: 1
        podDisruptionBudget:
          enabled: false
        persistence:
          enabled: true
          size: 2Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      podDisruptionBudget:
        enabled: false
      gateway:
        enabled: true
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false

    alloy:
      crds:
        create: false
      alloy:
        enableReporting: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        configMap:
          content: |
            logging {
              level  = "info"
              format = "logfmt"
            }

            discovery.kubernetes "pods" {
              role = "pod"
            }

            discovery.relabel "pod_logs" {
              targets = discovery.kubernetes.pods.targets

              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_controller_name"]
                target_label  = "workload"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                target_label  = "app"
              }
              rule {
                replacement  = "local-carbide"
                target_label = "cluster"
              }
            }

            loki.source.kubernetes "pods" {
              targets    = discovery.relabel.pod_logs.output
              forward_to = [loki.write.local.receiver]
            }

            loki.write "local" {
              endpoint {
                url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
              }
            }
      controller:
        type: deployment
        replicas: 1

    grafana:
      testFramework:
        enabled: false
      persistence:
        enabled: false
      grafana.ini:
        analytics:
          check_for_updates: false
          reporting_enabled: false
        auth:
          disable_login_form: true
        auth.anonymous:
          enabled: true
          org_role: Admin
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus-stack-prometheus.observability.svc.cluster.local:9090
              isDefault: false
              editable: false
              jsonData:
                httpMethod: POST
                timeInterval: 30s
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              isDefault: true
              editable: false
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: observability
          folderAnnotation: grafana_folder
          skipReload: true
          provider:
            foldersFromFilesStructure: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

  temporal:
    server:
      config:
        persistence:
          default:
            sql:
              host: nico-pg-cluster-rw.nico-system.svc.cluster.local
          visibility:
            sql:
              host: nico-pg-cluster-rw.nico-system.svc.cluster.local

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    databaseUrl: jdbc:postgresql://nico-pg-cluster-rw.nico-system.svc.cluster.local:5432/keycloak

  rest:
    global:
      image:
        repository: localhost
        tag: dev
        pullPolicy: IfNotPresent
      imagePullSecrets: []
      certificate:
        issuerRef:
          kind: ClusterIssuer
          name: nico-rest-ca-issuer
          group: cert-manager.io

    database:
      db:
        host: nico-pg-cluster-rw.nico-system.svc.cluster.local
        port: "5432"
        name: nico_rest
        user: nico_rest
      secrets:
        dbCreds: db-creds

    certManager:
      config:
        debug: true

    siteManager: {}

    api:
      config:
        db:
          host: nico-pg-cluster-rw.nico-system.svc.cluster.local
          port: 5432
          name: nico_rest
          user: nico_rest
        temporal:
          host: temporal-frontend.temporal
          port: 7233
          namespace: cloud
          queue: cloud
        keycloak:
          enabled: true
          baseURL: http://keycloak:8082
          externalBaseURL: http://localhost:18082
          realm: nico-dev
          clientID: nico-api
          serviceAccount: true

    workflow:
      secrets:
        dbCreds: db-creds
      config:
        db:
          host: nico-pg-cluster-rw.nico-system.svc.cluster.local
          port: 5432
          name: nico_rest
          user: nico_rest
        temporal:
          host: temporal-frontend.temporal
          port: 7233
          namespace: cloud
          queue: cloud

    siteAgent:
      certificate:
        uris:
          - spiffe://nico.local/nico-system/sa/elektra-site-agent
      envConfig:
        NICO_ADDRESS: nico-api.nico-system.svc.cluster.local:1079
        NICO_SEC_OPT: "2"
        CORE_GRPC_ADDRESS: nico-api.nico-system.svc.cluster.local:1079
        CORE_GRPC_SEC_OPT: "2"
        FLOW_GRPC_ENABLED: "false"
        CLUSTER_ID: 00000000-0000-4000-8000-000000000001
        TEMPORAL_SERVER: site.server.temporal.local
        TEMPORAL_SUBSCRIBE_NAMESPACE: 00000000-0000-4000-8000-000000000001
        TEMPORAL_SUBSCRIBE_QUEUE: site

    mcp:
      config:
        baseURL: http://nico-rest-api:8388
        apiName: nico

  dsxExchange:
    nicoApiConfig: '{enabled=true,mqtt_endpoint="dsx-exchange",mqtt_broker_port=1883,auth={auth_mode="none"},periodic_state_republish={interval="10s"}}'
    chart:
      fullnameOverride: dsx-exchange
      config:
        cluster:
          enabled: false
        jetstream:
          enabled: true
          fileStore:
            enabled: true
            maxSize: 256Mi
            pvc:
              enabled: false
          memoryStore:
            enabled: true
            maxSize: 64Mi
        mqtt:
          enabled: true
          port: 1883
          merge:
            stream_replicas: 1
            consumer_memory_storage: true
      container:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
      natsBox:
        enabled: false
      podDisruptionBudget:
        enabled: false

  localConfig:
    coreNamespace: nico-system
    restNamespace: nico-rest
    temporalNamespace: temporal
    observabilityNamespace: observability
    vault:
      service: http://nico-vault.nico-system.svc.cluster.local:8200
      mount: secrets
      pkiMount: certs
      token: root
    database:
      host: nico-pg-cluster-rw.nico-system.svc.cluster.local
      port: 5432
      name: nico_system_nico
      rest:
        resourceName: nico-rest
        name: nico_rest
        user: nico_rest
        password: nico_rest_password
      keycloak:
        resourceName: keycloak
        name: keycloak
        user: keycloak
        password: keycloak_password
      temporal:
        resourceName: temporal
        visibilityResourceName: temporal-visibility
        name: temporal
        visibilityName: temporal_visibility
        user: temporal
        password: temporal_password
    keycloak:
      clientSecret: nico-local-secret
    temporal:
      encryptionKey: local-dev
    site:
      id: 00000000-0000-4000-8000-000000000001
