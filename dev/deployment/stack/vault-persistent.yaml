# HashiCorp Vault — single-node standalone, production mode, TLS disabled.
# Adapted from PR #7555 for the optional persistent Tilt Vault.
#
# TLS is disabled on the listener because all traffic is in-cluster and
# cert-manager/Vault TLS bootstrapping is not needed for Kind e2e.

global:
  tlsDisable: true

injector:
  enabled: false

csi:
  enabled: false

server:
  dev:
    enabled: false

  ha:
    enabled: false

  standalone:
    enabled: true
    config: |
      storage "file" {
        path = "/vault/data"
      }
      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = true
      }

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  dataStorage:
    enabled: true
    size: 1Gi
    ## Kind's default storage class (local-path).
    storageClass: standard

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204"
    initialDelaySeconds: 10

  # Bootstrap owns initialization; never run the ephemeral fixture writer.
  postStart: []
